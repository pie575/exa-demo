                      указанного источника.
                    type: string
                  limit:
                    minimum: 1
                    maximum: 10
                    type: number
                required:
                  - definition
                  - limit
                type: object
            required:
              - source
              - id
            type: object
          description: >-
            Область поиска. По умолчанию область не задана, поэтому поиск
            выполняется в интернете.


            Если область указана при создании, поиск будет выполняться только по
            указанным источникам.
          type: array
        progress:
          properties:
            found:
              description: Количество найденных на данный момент результатов
              type: number
            analyzed:
              description: Количество проанализированных на данный момент результатов
              type: number
            completion:
              minimum: 0
              maximum: 100
              description: Процент выполнения поиска
              type: number
            timeLeft:
              type: number
              description: Расчётное оставшееся время в секундах, null, если неизвестно
              nullable: true
          required:
            - found
            - analyzed
            - completion
            - timeLeft
          description: Ход выполнения поиска
          type: object
        recall:
