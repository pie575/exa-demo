openapi: 3.1.0
info:
  title: Exa Public API
  version: 2.0.0
servers:
  - url: https://api.exa.ai
security:
  - apiKey: []
  - bearer: []
paths:
  /search:
    post:
      operationId: search
      summary: Search
      description: Выполняет поиск по оптимизированному Exa запросу и возвращает
        список релевантных результатов. При необходимости также возвращает
        contents.
      x-payment-info:
        price:
          mode: dynamic
          currency: USD
          min: "0.007"
          max: "0.015"
        protocols:
          - x402: {}
          - mpp:
              method: tempo
              intent: charge
              currency: USDC.e
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: ОК
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
            x-exa-queued:
              $ref: "#/components/headers/XExaQueued"
            x-exa-queue-ms:
              $ref: "#/components/headers/XExaQueueMs"
          content:
            application/json:
              example:
                requestId: b5947044c4b78efa9552a7c89b306d95
                results:
                  - title: A Comprehensive Overview of Large Language Models
                    url: https://arxiv.org/pdf/2307.06435.pdf
                    publishedDate: 2023-11-16T01:36:32.547Z
                    author: Humza  Naveed, University of Engineering and Technology (UET), Lahore,
                      Pakistan
                    id: https://arxiv.org/abs/2307.06435
                    image: https://arxiv.org/pdf/2307.06435.pdf/page_1.png
                    favicon: https://arxiv.org/favicon.ico
                    text: Abstract Large Language Models (LLMs) have recently demonstrated
                      remarkable capabilities...
                    highlights:
                      - Such requirements have limited their adoption...
                    summary: В этом обзорном материале о больших языковых моделях (LLM)
                      рассматриваются ключевые разработки...
                resolvedSearchType: neural
                costDollars:
                  total: 0.007
                  search:
                    neural: 0.007
              schema:
                $ref: "#/components/schemas/SearchResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SearchStreamChunk"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "402":
          description: "Требуется оплата. Для запросов с API-ключом это стандартная
            структура ошибки (закончились кредиты или превышен бюджет). На
            конечных точках с ценами x402 запросы без API-ключа вместо этого
            получают платёжный запрос x402 с тегом `X402_PAYMENT_REQUIRED`:
            структуру, дополненную платёжными метаданными x402 (`x402Version`,
            `resource`, `accepts` и необязательными `extensions`), которые
            описывают способ оплаты запроса."
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/X402PaymentChallenge"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailableResponse"
  /contents:
    post:
      operationId: getContents
      summary: Contents
      x-payment-info:
        price:
          mode: dynamic
          currency: USD
          min: "0.001"
          max: "0.010"
        protocols:
          - x402: {}
          - mpp:
              method: tempo
              intent: charge
              currency: USDC.e
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentsRequest"
      responses:
        "200":
          description: ОК
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
            x-exa-queued:
              $ref: "#/components/headers/XExaQueued"
            x-exa-queue-ms:
              $ref: "#/components/headers/XExaQueueMs"
          content:
            application/json:
              example:
                requestId: e492118ccdedcba5088bfc4357a8a125
                results:
                  - id: https://arxiv.org/abs/2307.06435
                    title: A Comprehensive Overview of Large Language Models
                    url: https://arxiv.org/pdf/2307.06435.pdf
                    publishedDate: 2023-11-16T01:36:32.547Z
                    author: Humza  Naveed, University of Engineering and Technology (UET), Lahore,
                      Pakistan
                    text: Abstract Large Language Models (LLMs) have recently demonstrated
                      remarkable capabilities...
                    highlights:
                      - Such requirements have limited their adoption...
                    summary: В этом обзорном материале о больших языковых моделях (LLM)
                      рассматриваются ключевые разработки...
                statuses:
                  - id: https://arxiv.org/abs/2307.06435
                    status: success
                    source: cached
                costDollars:
                  total: 0.003
              schema:
                $ref: "#/components/schemas/ContentsResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "402":
          description: "Требуется оплата. Для запросов с API-ключом это стандартная
            структура ошибки (закончились кредиты или превышен бюджет). На
            конечных точках с ценами x402 запросы без API-ключа вместо этого
            получают платёжный запрос x402 с тегом `X402_PAYMENT_REQUIRED`:
            структуру, дополненную платёжными метаданными x402 (`x402Version`,
            `resource`, `accepts` и необязательными `extensions`), которые
            описывают способ оплаты запроса."
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/X402PaymentChallenge"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailableResponse"
  /answer:
    post:
      operationId: answer
      summary: Ответ
      description: Выполняет поиск по запросу и в зависимости от его типа формирует
        либо прямой ответ, либо подробную сводку с цитатами.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: ОК
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
            x-exa-queued:
              $ref: "#/components/headers/XExaQueued"
            x-exa-queue-ms:
              $ref: "#/components/headers/XExaQueueMs"
          content:
            application/json:
              example:
                requestId: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                answer: $350 billion.
                citations:
                  - id: https://www.theguardian.com/science/2024/dec/11/spacex-valued-at-350bn-as-company-agrees-to-buy-shares-from-employees
                    url: https://www.theguardian.com/science/2024/dec/11/spacex-valued-at-350bn-as-company-agrees-to-buy-shares-from-employees
                    title: SpaceX valued at $350bn as company agrees to buy shares from ...
                    author: Dan Milmo
                    publishedDate: 2024-12-11T00:00:00.000Z
                    text: SpaceX valued at $350bn as company agrees to buy shares from ...
                costDollars:
                  total: 0.005
              schema:
                $ref: "#/components/schemas/AnswerResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/AnswerStreamChunk"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "402":
          $ref: "#/components/responses/PaymentRequiredResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailableResponse"
  /findSimilar:
    post:
      operationId: findSimilar
      summary: Найти похожие ссылки
      description: "Находит ссылки, похожие на указанный URL, и при необходимости
        получает их содержимое. Устарело: используйте `/search` с запросом,
        описывающим источник."
      x-exa-lifecycle: deprecated
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindSimilarRequest"
      responses:
        "200":
          description: ОК
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
            Deprecation:
              description: Указывает, что эта операция устарела.
              schema:
                type: string
              example: "true"
            x-exa-queued:
              $ref: "#/components/headers/XExaQueued"
            x-exa-queue-ms:
              $ref: "#/components/headers/XExaQueueMs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindSimilarResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "402":
          $ref: "#/components/responses/PaymentRequiredResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailableResponse"
  /monitors:
    post:
      operationId: createMonitor
      summary: Создать монитор
      description: >-
        Создаёт новый монитор для регулярного выполнения поисков Exa по
        расписанию.


        Мониторы автоматически выполняют ваш поисковый запрос по расписанию и
        отправляют результаты на конечную точку вебхука с автоматическим
        устранением дубликатов:


        - **Фильтрация по дате** получает контент только с момента последнего
        запуска


        - **Семантическое устранение дубликатов** отслеживает предыдущие
        результаты и показывает только новые изменения


        Ответ включает `webhookSecret`, который возвращается только один раз при
        создании. Надёжно сохраните его для проверки подписи вебхука.
      tags:
        - Monitors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSearchMonitorParameters"
      responses:
        "201":
          description: Созданный монитор с секретом вебхука
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSearchMonitorResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    get:
      operationId: listMonitors
      summary: Список мониторов
      description: Возвращает список всех мониторов аутентифицированной команды.
        Поддерживает фильтрацию по статусу и пагинацию на основе курсора.
      tags:
        - Monitors
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - paused
              - disabled
            description: Фильтровать мониторы по статусу
        - in: query
          name: cursor
          schema:
            type: string
            description: Курсор пагинации из предыдущего ответа
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            description: Количество результатов на странице
            default: 50
        - in: query
          name: name
          schema:
            type: string
            maxLength: 250
            description: Фильтровать мониторы по имени (регистронезависимое совпадение по
              подстроке)
        - in: query
          name: metadata
          schema:
            description: "Фильтровать мониторы по парам «ключ — значение» метаданных (точное
              совпадение, логическое И). Используйте скобочную нотацию:
              `metadata[key]=value`."
            type: object
            propertyNames:
              type: string
            additionalProperties:
              type: string
          style: deepObject
          explode: true
          description: "Фильтровать мониторы по парам «ключ — значение» метаданных (точное
            совпадение, логическое И). Используйте скобочную нотацию:
            `metadata[key]=value`."
      responses:
        "200":
          description: Список мониторов с разбивкой на страницы
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSearchMonitorsResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /monitors/batch:
    post:
      operationId: batchMonitors
      summary: Пакетное действие с мониторами
      description: >-
        Выполняет пакетное действие с мониторами, соответствующими указанным
        фильтрам.


        Поддерживаемые действия:

        - **delete**: Безвозвратно удаляет соответствующие мониторы

        - **pause**: Приостанавливает соответствующие мониторы

        - **unpause**: Возобновляет соответствующие мониторы


        Используйте `dry_run: true` (значение по умолчанию), чтобы перед
        выполнением действия предварительно просмотреть, какие мониторы будут
        затронуты. Результаты разбиваются на страницы с помощью параметра
        `limit`; выполняйте цикл, пока `has_more` не станет `false`, чтобы
        обработать все соответствующие мониторы.
      tags:
        - Monitors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchMonitorsRequest"
      responses:
        "200":
          description: Результат пакетного действия
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchMonitorsResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /monitors/{id}:
    get:
      operationId: getMonitor
      summary: Получить монитор
      description: Возвращает один монитор по его ID.
      tags:
        - Monitors
      parameters:
        - in: path
          name: id
          schema:
            type: string
            description: ID монитора
          required: true
          description: ID монитора
      responses:
        "200":
          description: Монитор
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchMonitor"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    patch:
      operationId: updateMonitor
      summary: Обновить монитор
      description: Обновляет существующий монитор. Все поля необязательны. Для
        `search` можно отправить частичный объект, содержащий только поля,
        которые нужно изменить. Установите для `trigger` значение `null`, чтобы
        удалить расписание.
      tags:
        - Monitors
      parameters:
        - in: path
          name: id
          schema:
            type: string
            description: ID монитора
          required: true
          description: ID монитора
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSearchMonitorParameters"
      responses:
        "200":
          description: Обновлённый монитор
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchMonitor"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    delete:
      operationId: deleteMonitor
      summary: Удалить монитор
      description: Удаляет монитор. Это действие нельзя отменить.
      tags:
        - Monitors
      parameters:
        - in: path
          name: id
          schema:
            type: string
            description: ID монитора
          required: true
          description: ID монитора
      responses:
        "200":
          description: Удалённый монитор
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchMonitor"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /monitors/{id}/trigger:
    post:
      operationId: triggerMonitor
      summary: Запустить монитор
      description: Немедленно запускает выполнение независимо от расписания. Работает
        для мониторов со статусом `active` или `paused`.
      tags:
        - Monitors
      parameters:
        - in: path
          name: id
          schema:
            type: string
            description: ID монитора
          required: true
          description: ID монитора
      responses:
        "200":
          description: Был ли монитор запущен
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerSearchMonitorResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /monitors/{id}/runs:
    get:
      operationId: listRuns
      summary: Список запусков
      description: Возвращает список всех запусков монитора с пагинацией на основе
        курсора. Запуски возвращаются в обратном хронологическом порядке.
      tags:
        - Runs
      parameters:
        - in: path
          name: id
          schema:
            type: string
            description: ID монитора
          required: true
          description: ID монитора
        - in: query
          name: cursor
          schema:
            type: string
            description: Курсор пагинации из предыдущего ответа
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            description: Количество результатов на странице
            default: 50
      responses:
        "200":
          description: Список запусков с разбивкой на страницы
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSearchMonitorRunsResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /monitors/{id}/runs/{runId}:
    get:
      operationId: getRun
      summary: Получить запуск
      description: Возвращает один запуск по его ID, включая полный вывод, если запуск
        завершён.
      tags:
        - Runs
      parameters:
        - in: path
          name: id
          schema:
            type: string
            description: ID монитора
          required: true
          description: ID монитора
        - in: path
          name: runId
          schema:
            type: string
            description: ID запуска
          required: true
          description: ID запуска
      responses:
        "200":
          description: Запуск
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchMonitorRun"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /agent/runs:
    post:
      operationId: createAgentRun
      summary: Создать запуск
      description: "Создаёт асинхронный запуск Agent. По умолчанию API немедленно
        возвращает объект запуска. Установите `Accept: text/event-stream`, чтобы
        получать события жизненного цикла запуска в потоке, пока он не достигнет
        конечного статуса."
      tags:
        - Agent
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/ExaBetaHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRunRequest"
            examples:
              simple:
                summary: Простой исследовательский запуск
                value:
                  query: What are the most important AI infrastructure funding rounds announced
                    this week?
              structuredOutput:
                summary: Структурированный вывод
                value:
                  query: Find recent Series A or Series B AI infrastructure funding rounds.
                  outputSchema:
                    type: object
                    required:
                      - companies
                    properties:
                      companies:
                        type: array
                        maxItems: 10
                        items:
                          type: object
                          required:
                            - name
                            - round
                            - amount
                            - sourceUrl
                          properties:
                            name:
                              type: string
                            round:
                              type: string
                            amount:
                              type: string
                            sourceUrl:
                              type: string
                              format: uri
              inputRows:
                summary: Обработать входные строки
                value:
