            Если при создании сущность не указана, мы автоматически выберем
            наиболее подходящую сущность на основе запроса.
          nullable: true
        criteria:
          items:
            properties:
              description:
                minLength: 1
                maxLength: 1000
                description: Описание критерия
                type: string
              successRate:
                minimum: 0
                maximum: 100
                description: Значение от 0 до 100, представляющее процент результатов,
                  соответствующих критерию.
                type: number
            required:
              - description
              - successRate
            type: object
          description: Criteria, по которым поиск будет оценивать результаты. Если они не
            указаны, мы автоматически сгенерируем их для вас.
          type: array
        count:
          minimum: 1
          description: Количество результатов, которое поиск попытается найти. Фактическое
            количество результатов может быть меньше в зависимости от сложности
            поиска.
          type: number
        maxPeoplePerCompany:
          minimum: 1
