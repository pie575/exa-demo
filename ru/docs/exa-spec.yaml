                        контекста страницы, а full запрашивает наиболее полный
                        отображаемый текст. На некоторых страницах вывод
                        standard и full может совпадать. Используйте
                        maxAgeHours: 0, если это требуется применить к только
                        что полученному содержимому."
                      example: standard
                      default: compact
                    - type: "null"
                includeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "По возможности включает только содержимое, классифицированное как
                        указанные семантические разделы страницы. Классификация
                        разделов может быть недоступна или неполной для
                        некоторых страниц; проверяйте вывод, если требуется
                        строгая фильтрация. Используйте maxAgeHours: 0, если это
                        требуется применить к только что полученному
                        содержимому."
                      example:
                        - body
                        - header
                    - type: "null"
                excludeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "Исключает содержимое, классифицированное как указанные
                        семантические разделы страницы. Классификация разделов
                        выполняется по возможности. Используйте maxAgeHours: 0,
                        если это требуется применить к только что полученному
                        содержимому."
                      example:
                        - navigation
                        - footer
                        - sidebar
                    - type: "null"
              title: Advanced text options
              description: Расширенные параметры управления извлечением текста. Используйте
                их, если нужно ограничить длину текста или включить
