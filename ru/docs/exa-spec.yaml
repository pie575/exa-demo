    CostDollarsOutput:
      type: object
      properties:
        total:
          description: Расчётная общая стоимость выполненного запроса в долларах. Это
            значение в ответе не является записью счёта.
          example: 0.007
          format: float
          type: number
        search:
          description: Разбивка расчётной стоимости поиска по режимам поиска, зависящая от
            эндпоинта. Ответы для поиска instant, fast и auto могут включать
            стоимость нейронного поиска. Стоимость режимов глубокого поиска
            может отражаться только в общей сумме.
          type: object
          properties:
            neural:
              description: Стоимость операций нейронного поиска.
              example: 0.007
              format: float
              type: number
            keyword:
              description: Стоимость операций поиска по ключевым словам.
              example: 0.0025
              format: float
              type: number
          additionalProperties: false
        summary:
          description: Стоимость создания синтезированной summary для поисковых запросов.
          example: 0.005
          format: float
          type: number
        contents:
          description: Разбивка расчётной стоимости отдельного получения содержимого
            (текст, highlights и summaries оплачиваются отдельно от пакетной
            цены поиска).
