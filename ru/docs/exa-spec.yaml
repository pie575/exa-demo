                    type: string
                    description: URL ссылки.
                  anchor:
                    description: Анкорный текст ссылки, если он указан на странице.
                    type: string
                required:
                  - url
                additionalProperties: false
            codeBlocks:
              description: Массив блоков кода из результата поиска.
              example:
