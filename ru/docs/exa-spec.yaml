        summary:
          description: Возвращает сводку, сгенерированную LLM. Передайте `true` для
            настроек по умолчанию или объект с `query` и `maxTokens`.
          oneOf:
            - type: boolean
            - $ref: "#/components/schemas/SummaryWithMaxTokensOptionsOutput"
        extras:
          type: object
          properties:
            links:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Число URL, возвращаемых с каждой веб-страницы.
                  example: 1
                  default: 0
                - type: "null"
            imageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Число изображений, возвращаемых для каждого результата.
                  example: 1
                  default: 0
                - type: "null"
            richImageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Число расширенных ссылок на изображения, возвращаемых для каждого
                    результата.
                  default: 0
                - type: "null"
            richLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Число расширенных ссылок, возвращаемых для каждого результата.
                  default: 0
                - type: "null"
            codeBlocks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Число блоков кода, возвращаемых для каждого результата.
                  default: 0
                - type: "null"
          additionalProperties: false
          description: Дополнительные параметры для передачи.
        context:
          description: "Устарело: используйте вместо этого выделенные фрагменты или текст.
            Возвращает содержимое страницы в виде единой строки контекста."
          deprecated: true
          oneOf:
            - type: boolean
              description: "Устарело: используйте вместо этого выделенные фрагменты или текст.
                Возвращает содержимое страницы в виде единой строки контекста."
              example: true
              deprecated: true
            - type: object
              properties:
                maxCharacters:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: Устарело. Максимальное число символов для строки контекста.
                    Максимально поддерживаемое значение — 10000.
                  example: 10000
              additionalProperties: false
              description: "Устарело: используйте вместо этого выделенные фрагменты или текст.
                Возвращает содержимое страницы в виде единой строки контекста."
              deprecated: true
        livecrawl:
          description: Стратегия сканирования для получения содержимого страницы
          oneOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
            - type: string
              const: auto
        livecrawlTimeout:
          type: integer
          exclusiveMinimum: 0
          maximum: 90000
          description: Тайм-аут livecrawling в миллисекундах.
          example: 1000
          default: 10000
        maxAgeHours:
          type: integer
          minimum: -1
          maximum: 720
          description: Максимальный возраст кэшированного содержимого в часах.
            Положительные значения используют кэшированное содержимое, если оно
            не старше указанного числа часов; 0 получает свежее содержимое и
            является поддерживаемым способом применить параметры отображения
            текста к недавно загруженным страницам; -1 всегда использует кэш;
            если значение не указано, при недоступности кэшированного
            содержимого используется резервное получение. Максимально
            поддерживаемое значение — 720 часов.
          example: 24
        filterEmptyResults:
          type: boolean
          description: Отфильтровать результаты без содержимого
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: Число подстраниц для сканирования. Фактическое число
            просканированных страниц может быть ограничено системными
            ограничениями.
          example: 1
          default: 0
        subpageTarget:
          description: Термин для поиска определённых подстраниц в результатах поиска.
            Может быть строкой или массивом строк.
          example: sources
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
      additionalProperties: false
      description: Параметры извлечения содержимого для каждого результата поиска. Все
        поля необязательны.
    SummaryWithMaxTokensOptionsOutput:
      type: object
      properties:
        query:
          anyOf:
            - type: string
              description: Пользовательский запрос для сводки, сгенерированной LLM.
              example: Main developments
            - type: "null"
        maxTokens:
          type: integer
          minimum: 1
          description: Максимальное число токенов для сгенерированной сводки.
      additionalProperties: false
    SearchMonitorTriggerOutput:
      type: object
      properties:
        type:
          type: string
          const: interval
          description: Тип триггера. Сейчас поддерживается только `interval`.
          default: interval
        period:
          type: string
          description: Строка длительности, определяющая частоту запуска монитора
            (например, "1h", "6h", "1d", "7d"). Допускается только одна единица
            времени. Минимальный интервал — 1 час. Расписание привязано ко
            времени создания монитора (например, ежедневный монитор, созданный в
            14:30, запускается ежедневно примерно в 14:30).
          example: 6h
      required:
        - type
        - period
      additionalProperties: false
    SearchMonitorOutputSchemaOutput:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaTextOutput"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: 'Схема JSON для синтезированного вывода. Поддерживаемые корневые
            типы: "text" и "object". При её указании ответ содержит объект
            вывода, содержимое которого соответствует этой схеме. Работает с
            любым типом поиска и добавляет около 2 секунд задержки синтеза к
            задержке выбранного типа поиска.'
          type: object
          discriminator:
            propertyName: type
            mapping:
              text: "#/components/schemas/OutputSchemaTextOutput"
              object: "#/components/schemas/OutputSchemaObject"
        - type: "null"
      description: 'Управляет форматом вывода выполнения. Если не указано, по
        умолчанию используется `{ "type": "text" }`. Если `type` имеет значение
        `"text"`, вывод представляет собой текстовое резюме. Если `type` имеет
        значение `"object"`, вывод представляет собой структурированный JSON.
        Если для типа `"object"` не указаны `properties`, схема определяется
        автоматически; в противном случае вывод соответствует указанной схеме.'
    OutputSchemaTextOutput:
      type: object
      properties:
        type:
          type: string
          const: text
        description:
          type: string
      required:
        - type
      additionalProperties: false
    SearchMonitorWebhookOutput:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: HTTPS URL для получения событий вебхука. Не должен указывать на
            localhost или диапазоны частных IP-адресов.
        events:
          type: array
          items:
            type: string
            enum:
              - monitor.created
              - monitor.updated
              - monitor.deleted
              - monitor.run.created
              - monitor.run.completed
          description: События, на которые нужно подписаться. Если не указано, по
            умолчанию используются все события.
      required:
        - url
      additionalProperties: false
    AgentDataSourceOutput:
      type: object
      properties:
        provider:
          description: Поставщик данных Exa Connect, который нужно включить для
            выполнения. По умолчанию доступны все инструменты поставщика.
          example: fiber
          $ref: "#/components/schemas/AgentDataSourceProvider"
      required:
        - provider
      additionalProperties: false
    AgentBudgetOutput:
      type: object
      properties:
        maxCostDollars:
          type: number
          description: Максимальная сумма в долларах США, которую можно потратить на это
            выполнение. Допустимы значения от $1 до $100; применяется только к
            `auto` и `max`. Если не указано, лимит по умолчанию составляет $5
            для `auto` и $20 для `max`.
          example: 10
      additionalProperties: false
      description: Необязательный лимит расходов на выполнение для тарифицируемых
        уровней усилий `auto` и `max`. Выполнения, завершающиеся раньше, могут
        стоить меньше лимита.
    CreateWebsetParameters:
      properties:
        title:
          minLength: 1
          type: string
          description: Необязательное имя, отображаемое везде, где отображается Webset.
            Оставьте пустым, чтобы Exa сгенерировала его автоматически.
          examples:
            - Leading climate tech startups
          nullable: true
        search:
          properties:
            query:
              minLength: 1
              maxLength: 5000
              description: >-
                Поисковый запрос на естественном языке, описывающий то, что вы
                ищете.


                Подробно укажите требования, характеристики и ограничения,
                которые помогут сузить результаты.


                Все указанные URL будут просканированы и использованы как
                дополнительный контекст для поиска.
              examples:
                - Marketing agencies based in the US, that focus on consumer
                  products.
                - AI startups in Europe that raised Series A funding in 2024
                - SaaS companies with 50-200 employees in the fintech space
              type: string
            count:
              default: 10
              description: >-
                Количество Items, которое Webset попытается найти.


                Фактическое количество найденных Items может быть меньше в
                зависимости от сложности поиска.
              minimum: 1
              type: number
            entity:
              description: >-
                Сущность, для которой Webset вернёт результаты.


                Указывать её необязательно: мы автоматически определяем сущность
                по всей информации в запросе. Используйте этот параметр, только
                если вам нужен более точный контроль.
              $ref: "#/components/schemas/Entity"
            criteria:
              description: >-
                Критерии, по которым оценивается каждый Item.


                Указывать собственные критерии необязательно: мы автоматически
                определяем их по всей информации в запросе. Используйте этот
                параметр, только если вам нужен более точный контроль.
              minItems: 1
              maxItems: 5
              items:
                title: CreateCriterionParameters
                $ref: "#/components/schemas/CreateCriterionParameters"
              type: array
            maxPeoplePerCompany:
              description: Необязательное мягкое ограничение для поиска людей. Если задано,
                поиск постарается включить не более указанного числа подходящих
                людей, работающих в одной и той же компании.
              minimum: 1
              type: integer
            recall:
              description: >-
                Нужно ли предоставлять оценку общего количества релевантных
                результатов для этого поиска.

                Результат анализа будет доступен в поле `recall` запроса Search.
              type: boolean
            exclude:
              description: Источники (существующие import или webset), которые нужно исключить
                из результатов поиска. Результаты из этих источников будут
                пропущены, чтобы не находить их при поиске.
              items:
                properties:
                  source:
                    enum:
                      - import
                      - webset
                    type: string
                  id:
                    minLength: 1
                    description: Идентификатор исключаемого источника.
                    type: string
                required:
                  - source
                  - id
                type: object
              type: array
            scope:
              description: Ограничить поиск конкретными источниками (существующими import или
                webset). Результаты из этих источников, соответствующие
                критериям поиска, будут включены в Webset.
              items:
                properties:
                  source:
                    enum:
                      - import
                      - webset
                    type: string
                  id:
                    minLength: 1
                    description: Идентификатор источника для поиска.
                    type: string
                  relationship:
                    properties:
                      definition:
                        description: Связь между сущностями, которые вы хотите найти, и сущностями,
                          содержащимися в указанном источнике.
                        type: string
                      limit:
                        minimum: 1
                        maximum: 10
                        type: number
                    required:
                      - definition
                      - limit
                    type: object
                required:
                  - source
                  - id
                type: object
              type: array
          required:
            - query
          description: Создать первоначальный поиск для Webset.
          type: object
        import:
          description: Импортировать данные из существующих Websets и Imports в этот Webset.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: Идентификатор источника для импорта.
                type: string
              evaluate:
                description: Если true, Items из этого import будут оцениваться по критериям
                  поиска. Необходимо указать Search.
                type: boolean
            required:
              - source
              - id
            type: object
          type: array
        enrichments:
          description: >-
            Добавьте Enrichment, чтобы извлекать дополнительные данные из
            найденных Items.


            Enrichment автоматически ищет и извлекает конкретную информацию
            (например, контактные данные, данные о финансировании, количество
            сотрудников и т. д.) из каждого Item, добавленного в ваш Webset.
          items:
            title: CreateEnrichmentParameters
            $ref: "#/components/schemas/CreateEnrichmentParameters"
          type: array
        exclude:
          description: Глобальные источники исключения (существующие import или webset),
            применяемые ко всем операциям в этом Webset. Результаты из этих
            источников будут исключены из всех операций поиска и импорта.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: Идентификатор исключаемого источника.
                type: string
            required:
              - source
              - id
            type: object
          type: array
        externalId:
          description: >-
            Внешний идентификатор webset.


            Его можно использовать для ссылки на Webset с помощью собственных
            внутренних идентификаторов.
          maxLength: 300
          type: string
        metadata:
          description: Набор пар «ключ — значение», которые вы хотите связать с этим
            объектом.
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
      examples:
        - search:
            query: Marketing agencies based in the US, that focus on consumer products.
            count: 10
      type: object
    Entity:
      oneOf:
        - $ref: "#/components/schemas/CompanyEntity"
        - $ref: "#/components/schemas/PersonEntity"
        - $ref: "#/components/schemas/ArticleEntity"
        - $ref: "#/components/schemas/ResearchPaperEntity"
        - $ref: "#/components/schemas/CustomEntity"
    CompanyEntity:
      properties:
        type:
          type: string
          const: company
          default: company
      required:
        - type
      title: Company
      type: object
    PersonEntity:
      properties:
        type:
          type: string
          const: person
          default: person
      required:
        - type
      title: Person
      type: object
    ArticleEntity:
      properties:
        type:
          type: string
          const: article
          default: article
      required:
        - type
      title: Article
      type: object
    ResearchPaperEntity:
      properties:
        type:
          type: string
          const: research_paper
          default: research_paper
      required:
        - type
      title: Research Paper
      type: object
    CustomEntity:
      properties:
        description:
          minLength: 2
          maxLength: 200
          type: string
        type:
          type: string
          const: custom
          default: custom
      required:
        - type
        - description
      title: Custom
      type: object
    CreateCriterionParameters:
      properties:
        description:
          minLength: 1
          maxLength: 1000
          description: Описание критерия
          type: string
      required:
        - description
      type: object
    CreateEnrichmentParameters:
      properties:
        description:
          minLength: 1
          maxLength: 5000
          description: Укажите описание задачи Enrichment, которую нужно выполнить для
            каждого Item в Webset.
          type: string
        format:
          description: >-
            Формат ответа Enrichment.


            Мы автоматически выбираем оптимальный формат на основе описания. При
            необходимости вы можете явно указать формат здесь.
          enum:
            - text
            - date
            - number
            - options
            - email
            - phone
            - url
          type: string
        options:
          description: Если формат имеет значение options, варианты, из которых должен
            выбрать агент Enrichment.
          minItems: 1
          maxItems: 150
          items:
            properties:
              label:
                description: Метка варианта
                type: string
            required:
              - label
            type: object
          type: array
        metadata:
          description: Набор пар «ключ — значение», которые вы хотите связать с этим
            объектом.
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
      required:
        - description
      type: object
    UpdateWebsetRequest:
      properties:
        metadata:
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
          description: Набор пар «ключ — значение», которые вы хотите связать с этим
            объектом.
          nullable: true
        title:
          description: Необязательное имя, отображаемое везде, где отображается Webset.
          examples:
            - Leading climate tech startups
          minLength: 1
          type: string
      type: object
    CreateWebsetSearchParameters:
      properties:
        count:
          minimum: 1
          description: >-
            Количество Items, которое Search попытается найти.


            Фактическое количество найденных Items может быть меньше в
            зависимости от сложности запроса.
          type: number
        query:
          minLength: 1
          maxLength: 5000
          description: >-
            Поисковый запрос на естественном языке, описывающий то, что вы
            ищете.


            Подробно укажите требования, характеристики и ограничения, которые
            помогут сузить результаты.


            Все указанные URL будут просканированы и использованы как
            дополнительный контекст для поиска.
          examples:
            - Marketing agencies based in the US, that focus on consumer
              products. Get brands worked with and city
            - AI startups in Europe that raised Series A funding in 2024
            - SaaS companies with 50-200 employees in the fintech space
          type: string
        entity:
          description: >-
            Сущность, для которой поиск вернёт результаты.


            Указывать её необязательно: мы автоматически определяем сущность по
            всей информации в запросе. Используйте этот параметр, только если
            вам нужен более точный контроль.
          $ref: "#/components/schemas/Entity"
        criteria:
          description: >-
            Критерии, по которым оценивается каждый элемент.


            Указывать собственные критерии необязательно: мы автоматически
            определяем их на основе всей информации, указанной в запросе.
            Используйте этот параметр только если требуется более точная
            настройка.
          minItems: 1
          maxItems: 5
          items:
            title: CreateCriterionParameters
            $ref: "#/components/schemas/CreateCriterionParameters"
          type: array
        maxPeoplePerCompany:
          description: Необязательное рекомендуемое ограничение для поиска людей. Если
            задано, поиск будет стараться включать не более указанного числа
            подходящих людей из одной компании, в которой они сейчас работают.
          minimum: 1
          type: integer
        exclude:
          description: Источники (существующие импорты или Webset), которые следует
            исключить из результатов поиска. Результаты из этих источников будут
            исключены, чтобы они не попадали в результаты поиска.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: Идентификатор исключаемого источника.
                type: string
            required:
              - source
              - id
            type: object
          type: array
        scope:
          description: Ограничить поиск указанными источниками (существующими импортами).
            Результаты из этих источников, соответствующие критериям поиска,
            будут включены в Webset.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: Идентификатор источника, в котором выполняется поиск.
                type: string
              relationship:
                properties:
                  definition:
                    description: Характер связи между сущностями, которые вы хотите найти, и
                      сущностями из указанного источника.
                    type: string
                  limit:
                    minimum: 1
                    maximum: 10
                    type: number
                required:
                  - definition
                  - limit
                type: object
            required:
