              deprecated: true
        livecrawl:
          description: Стратегия обхода для получения содержимого страницы
          oneOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
            - type: string
              const: auto
        livecrawlTimeout:
          type: integer
          exclusiveMinimum: 0
          maximum: 90000
          description: Тайм-аут livecrawling в миллисекундах.
          example: 1000
          default: 10000
        maxAgeHours:
          type: integer
          minimum: -1
          maximum: 720
          description: "Максимальный возраст кэшированного содержимого в часах. При
            положительных значениях используется кэшированное содержимое, если
            его возраст не превышает указанное количество часов; 0 получает
            свежее содержимое и является поддерживаемым способом применить
            параметры отображения текста к вновь полученным страницам; -1 всегда
            использует кэш; если параметр не указан, используется резервное
            получение при отсутствии кэшированного содержимого. Максимальное
            поддерживаемое значение: 720 часов."
          example: 24
        filterEmptyResults:
          type: boolean
          description: Отфильтровать результаты без содержимого
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: Количество подстраниц для обхода. Фактическое количество
            обработанных страниц может быть ограничено системными ограничениями.
          example: 1
          default: 0
        subpageTarget:
          description: Термин для поиска определённых подстраниц среди результатов поиска.
            Может быть строкой или массивом строк.
          example: sources
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
      additionalProperties: false
      description: Параметры извлечения содержимого для каждого результата поиска. Все
        поля необязательны.
    SummaryWithMaxTokensOptionsOutput:
      type: object
      properties:
        query:
          anyOf:
            - type: string
              description: Пользовательский запрос для summary, сгенерированного LLM.
              example: Main developments
            - type: "null"
        maxTokens:
          type: integer
          minimum: 1
          description: Максимальное количество токенов для сгенерированного summary.
      additionalProperties: false
    SearchMonitorTriggerOutput:
      type: object
      properties:
        type:
          type: string
          const: interval
          description: Тип триггера. Сейчас поддерживается только `interval`.
          default: interval
        period:
          type: string
          description: 'Строка длительности, указывающая частоту выполнения monitor
            (например, "1h", "6h", "1d", "7d"). Допускается только одна единица
            времени. Минимальный интервал: 1 час. Расписание привязано ко
            времени создания monitor (например, ежедневный monitor, созданный в
            14:30, запускается ежедневно примерно в 14:30).'
          example: 6h
      required:
        - type
        - period
      additionalProperties: false
    SearchMonitorOutputSchemaOutput:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaTextOutput"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: 'Схема JSON для синтезированного вывода. Поддерживаемые корневые
            типы: "text" и "object". Если этот параметр указан, ответ содержит
            объект вывода, содержимое которого соответствует этой схеме.
            Работает с любым типом поиска и добавляет около 2 секунд задержки
            синтеза к задержке выбранного типа поиска.'
          type: object
          discriminator:
            propertyName: type
            mapping:
              text: "#/components/schemas/OutputSchemaTextOutput"
              object: "#/components/schemas/OutputSchemaObject"
        - type: "null"
      description: 'Задаёт формат вывода выполнения. Если не указан, по умолчанию
        используется `{ "type": "text" }`. Если `type` имеет значение `"text"`,
        вывод представляет собой текстовую сводку. Если `type` имеет значение
        `"object"`, вывод представляет собой структурированный JSON. Если для
        типа `"object"` не указаны `properties`, схема определяется
        автоматически; в противном случае вывод соответствует указанной схеме.'
    OutputSchemaTextOutput:
      type: object
      properties:
        type:
          type: string
          const: text
        description:
          type: string
      required:
        - type
      additionalProperties: false
    SearchMonitorWebhookOutput:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: HTTPS URL для получения событий вебхука. Не должен указывать на
            localhost или диапазоны частных IP-адресов.
        events:
          type: array
          items:
            type: string
            enum:
              - monitor.created
              - monitor.updated
              - monitor.deleted
              - monitor.run.created
              - monitor.run.completed
          description: События, на которые нужно подписаться. Если не указано, по
            умолчанию используются все события.
      required:
        - url
      additionalProperties: false
    AgentDataSourceOutput:
      type: object
      properties:
        provider:
          description: Провайдер данных Exa Connect, который нужно включить для
            выполнения. Все инструменты провайдера доступны по умолчанию.
          example: fiber
          $ref: "#/components/schemas/AgentDataSourceProvider"
      required:
        - provider
      additionalProperties: false
    AgentBudgetOutput:
      type: object
      properties:
        maxCostDollars:
          type: number
          description: Максимальная сумма в долларах США, которую может потратить это
            выполнение. Принимает значения от $1 до $100 и применяется только к
            `auto` и `max`; если параметр не указан, лимит по умолчанию
            составляет $5 для `auto` и $20 для `max`.
          example: 10
      additionalProperties: false
      description: Необязательный лимит расходов на одно выполнение для тарифицируемых
        effort `auto` и `max`. Выполнения, завершившиеся раньше, могут стоить
        меньше лимита.
    CreateWebsetParameters:
      properties:
        title:
          minLength: 1
          type: string
          description: Необязательное имя, отображаемое везде, где показывается Webset.
            Оставьте поле пустым, чтобы Exa автоматически сгенерировала имя.
          examples:
            - Leading climate tech startups
          nullable: true
        search:
          properties:
            query:
              minLength: 1
              maxLength: 5000
              description: >-
                Поисковый запрос на естественном языке, описывающий то, что вы
                ищете.


                Подробно укажите требования, характеристики и любые ограничения,
                которые помогут сузить результаты.


                Все указанные URL будут просканированы и использованы в качестве
                дополнительного контекста для поиска.
              examples:
                - Marketing agencies based in the US, that focus on consumer
                  products.
                - AI startups in Europe that raised Series A funding in 2024
                - SaaS companies with 50-200 employees in the fintech space
              type: string
            count:
              default: 10
              description: >-
                Количество item, которые Webset попытается найти.


                Фактическое количество найденных item может быть меньше в
                зависимости от сложности поиска.
              minimum: 1
              type: number
            entity:
              description: >-
                Сущность, для которой Webset вернёт результаты.


                Её указывать необязательно: мы автоматически определяем сущность
                на основе всей информации в запросе. Используйте этот параметр,
                только если нужен более точный контроль.
              $ref: "#/components/schemas/Entity"
            criteria:
              description: >-
                Criteria, по которым оценивается каждый item.


                Указывать собственные criteria необязательно: мы автоматически
                определяем их на основе всей информации в запросе. Используйте
                этот параметр, только если нужен более точный контроль.
              minItems: 1
              maxItems: 5
              items:
                title: CreateCriterionParameters
                $ref: "#/components/schemas/CreateCriterionParameters"
              type: array
            maxPeoplePerCompany:
              description: Необязательное мягкое ограничение для поиска людей. Если задано,
                поиск постарается включить не более указанного количества
                подходящих людей, работающих в одной компании.
              minimum: 1
              type: integer
            recall:
              description: >-
                Следует ли предоставлять оценку общего числа релевантных
                результатов для этого поиска.

                Результат анализа будет доступен в поле `recall` поискового
                запроса.
              type: boolean
            exclude:
              description: Источники (существующие import или Webset), которые нужно исключить
                из результатов поиска. Результаты из этих источников будут
                исключены, чтобы не находить их при поиске.
              items:
                properties:
                  source:
                    enum:
                      - import
                      - webset
                    type: string
                  id:
                    minLength: 1
                    description: ID источника, который нужно исключить.
                    type: string
                required:
                  - source
                  - id
                type: object
              type: array
            scope:
              description: Ограничить поиск определёнными источниками (существующими import
                или Webset). Все результаты из этих источников, соответствующие
                критериям поиска, будут включены в Webset.
              items:
                properties:
                  source:
                    enum:
                      - import
                      - webset
                    type: string
                  id:
                    minLength: 1
                    description: ID источника, в котором нужно выполнить поиск.
                    type: string
                  relationship:
                    properties:
                      definition:
                        description: Отношение искомых сущностей к сущностям, содержащимся в указанном
                          источнике.
                        type: string
                      limit:
                        minimum: 1
                        maximum: 10
                        type: number
                    required:
                      - definition
                      - limit
                    type: object
                required:
                  - source
                  - id
                type: object
              type: array
          required:
            - query
          description: Создать исходный Search для Webset.
          type: object
        import:
          description: Импортировать данные из существующих Websets и Imports в этот Webset.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: ID источника для импорта.
                type: string
              evaluate:
                description: Если значение равно true, item из этого import будут оцениваться по
                  критериям поиска. Необходимо указать Search.
                type: boolean
            required:
              - source
              - id
            type: object
          type: array
        enrichments:
          description: >-
            Добавьте enrichment для извлечения дополнительных данных из
            найденных item.


            Enrichment автоматически ищут и извлекают определённую информацию,
            например контактные данные, сведения о финансировании и количество
            сотрудников, из каждого item, добавленного в ваш Webset.
          items:
            title: CreateEnrichmentParameters
            $ref: "#/components/schemas/CreateEnrichmentParameters"
          type: array
        exclude:
          description: Глобальные источники исключения (существующие import или Webset),
            применяемые ко всем операциям в этом Webset. Результаты из этих
            источников будут исключены во всех операциях поиска и импорта.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: ID источника, который нужно исключить.
                type: string
            required:
              - source
              - id
            type: object
          type: array
        externalId:
          description: >-
            Внешний идентификатор Webset.


            Его можно использовать для ссылки на Webset по собственным
            внутренним идентификаторам.
          maxLength: 300
          type: string
        metadata:
          description: Набор пар ключ-значение, которые вы хотите связать с этим объектом.
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
      examples:
        - search:
            query: Marketing agencies based in the US, that focus on consumer products.
            count: 10
      type: object
    Entity:
      oneOf:
        - $ref: "#/components/schemas/CompanyEntity"
        - $ref: "#/components/schemas/PersonEntity"
        - $ref: "#/components/schemas/ArticleEntity"
        - $ref: "#/components/schemas/ResearchPaperEntity"
        - $ref: "#/components/schemas/CustomEntity"
    CompanyEntity:
      properties:
        type:
          type: string
          const: company
          default: company
      required:
        - type
      title: Company
      type: object
    PersonEntity:
      properties:
        type:
          type: string
          const: person
          default: person
      required:
        - type
      title: Person
      type: object
    ArticleEntity:
      properties:
        type:
          type: string
          const: article
          default: article
      required:
        - type
      title: Article
      type: object
    ResearchPaperEntity:
      properties:
        type:
          type: string
          const: research_paper
          default: research_paper
      required:
        - type
      title: Research Paper
      type: object
    CustomEntity:
      properties:
        description:
          minLength: 2
          maxLength: 200
          type: string
        type:
          type: string
          const: custom
          default: custom
      required:
        - type
        - description
      title: Custom
      type: object
    CreateCriterionParameters:
      properties:
        description:
          minLength: 1
          maxLength: 1000
          description: Описание критерия
          type: string
      required:
        - description
      type: object
    CreateEnrichmentParameters:
      properties:
        description:
          minLength: 1
          maxLength: 5000
          description: Укажите описание задачи enrichment, которую нужно выполнить для
            каждого item в Webset.
          type: string
        format:
          description: >-
            Формат ответа enrichment.


            Мы автоматически выбираем оптимальный формат на основе описания.
            Если вы хотите явно указать формат, это можно сделать здесь.
          enum:
            - text
            - date
            - number
            - options
            - email
            - phone
            - url
          type: string
        options:
          description: Если формат имеет значение options, варианты, из которых агент
            enrichment может выбрать.
          minItems: 1
          maxItems: 150
          items:
            properties:
              label:
                description: Метка варианта
                type: string
            required:
              - label
            type: object
          type: array
        metadata:
          description: Набор пар ключ-значение, которые вы хотите связать с этим объектом.
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
      required:
        - description
      type: object
    UpdateWebsetRequest:
      properties:
        metadata:
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
          description: Набор пар ключ-значение, которые вы хотите связать с этим объектом.
          nullable: true
        title:
          description: Необязательное имя, отображаемое везде, где показывается Webset.
          examples:
            - Leading climate tech startups
          minLength: 1
          type: string
      type: object
    CreateWebsetSearchParameters:
      properties:
        count:
          minimum: 1
          description: >-
            Количество item, которые Search попытается найти.


            Фактическое количество найденных item может быть меньше в
            зависимости от сложности запроса.
          type: number
        query:
          minLength: 1
          maxLength: 5000
          description: >-
            Поисковый запрос на естественном языке, описывающий то, что вы
            ищете.


            Подробно укажите требования, характеристики и любые ограничения,
            которые помогут сузить результаты.


            Все указанные URL будут просканированы и использованы в качестве
            дополнительного контекста для поиска.
          examples:
            - Marketing agencies based in the US, that focus on consumer
              products. Get brands worked with and city
            - AI startups in Europe that raised Series A funding in 2024
            - SaaS companies with 50-200 employees in the fintech space
          type: string
        entity:
          description: >-
            Сущность, для которой поиск вернёт результаты.


            Её указывать необязательно: мы автоматически определяем сущность на
            основе всей информации в запросе. Используйте этот параметр, только
            если нужен более точный контроль.
          $ref: "#/components/schemas/Entity"
        criteria:
          description: >-
            Criteria, по которым оценивается каждый item.


            Необязательно указывать собственные criteria: мы автоматически
            определяем criteria на основе всей информации в запросе. Используйте
            это только если требуется более точная настройка.
          minItems: 1
          maxItems: 5
          items:
            title: CreateCriterionParameters
            $ref: "#/components/schemas/CreateCriterionParameters"
          type: array
        maxPeoplePerCompany:
          description: Необязательный мягкий лимит для поиска людей. Если задан, search
            будет включать не более указанного числа подходящих людей из одной
            компании, являющейся их текущим работодателем.
          minimum: 1
          type: integer
        exclude:
          description: Sources (существующие импорты или Webset), которые следует
            исключить из результатов поиска. Результаты из этих sources будут
            пропущены, чтобы не находить их при поиске.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: ID source, которую следует исключить.
                type: string
            required:
              - source
              - id
            type: object
          type: array
        scope:
          description: Ограничить поиск определёнными sources (существующими импортами).
            Все результаты из этих sources, соответствующие criteria поиска,
            будут включены в Webset.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: ID source, в которой следует выполнить поиск.
                type: string
              relationship:
                properties:
                  definition:
                    description: Связь между сущностями, которые вы хотите найти, и сущностями из
                      указанной source.
                    type: string
                  limit:
                    minimum: 1
                    maximum: 10
                    type: number
                required:
                  - definition
                  - limit
                type: object
            required:
              - source
              - id
            type: object
          type: array
        recall:
          description: >-
            Следует ли предоставить оценку общего числа релевантных результатов
            для этого поиска.

            Результат анализа будет доступен в поле `recall` поискового запроса.
          type: boolean
        behavior:
          default: override
          description: >-
            Как этот search взаимодействует с существующими item в Webset:


            - **override**: Заменить существующие item и оценить все item по
            новым criteria

            - **append**: Добавить новые item к существующим, сохранив item,
            соответствующие новым criteria
          $ref: "#/components/schemas/WebsetSearchBehavior"
        metadata:
          description: Набор пар «ключ — значение», которые вы хотите связать с этим
            объектом.
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
      required:
        - count
        - query
      type: object
    WebsetSearchBehavior:
      enum:
        - override
        - append
      type: string
    UpdateEnrichmentParameters:
      properties:
        description:
          description: Укажите описание задачи enrichment, которую нужно выполнить для
            каждого Item в Webset.
          minLength: 1
          maxLength: 5000
          type: string
        format:
          description: >-
            Формат ответа enrichment.


            Мы автоматически выбираем оптимальный формат на основе описания. При
            необходимости здесь можно явно указать формат.
          enum:
            - text
            - date
            - number
            - options
            - email
            - phone
            - url
          type: string
        options:
          description: Если формат задан как options, это варианты, из которых может
            выбрать agent enrichment.
          minItems: 1
          maxItems: 150
          items:
            properties:
              label:
                description: Метка варианта
                type: string
            required:
              - label
            type: object
          type: array
        metadata:
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
          description: Набор пар «ключ — значение», которые вы хотите связать с этим
            объектом.
          nullable: true
      type: object
    PreviewWebsetParameters:
      properties:
        search:
          properties:
            query:
              minLength: 1
              maxLength: 5000
              description: >-
                Поисковый запрос на естественном языке, описывающий то, что вы
                ищете.


                Конкретно и подробно укажите требования, характеристики и
                ограничения, которые помогут сузить результаты.
              examples:
                - Marketing agencies based in the US, that focus on consumer
                  products. Get brands worked with and city
                - AI startups in Europe that raised Series A funding in 2024
                - SaaS companies with 50-200 employees in the fintech space
              type: string
            entity:
              description: >-
