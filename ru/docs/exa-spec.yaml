      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentRunEvent"
        hasMore:
          type: boolean
          description: Есть ли ещё результаты
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    Batch:
      type: object
      properties:
        id:
          type: string
          description: ID пакета. Новые ID пакетов возвращаются с префиксом `batch_`.
          example: batch_01j7x9v0m2n4p6q8r0s2t4v6w8
        object:
          type: string
          const: batch
          description: Тип объекта, всегда `batch`.
        status:
          $ref: "#/components/schemas/BatchStatus"
        requestCounts:
          $ref: "#/components/schemas/BatchRequestCounts"
        createdAt:
          type: string
          format: date-time
          description: Время создания пакета.
        expiresAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Время истечения срока действия пакета или `null`, если срок
            действия не ограничен.
          format: date-time
        endedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Время, когда пакет достиг конечного статуса, или `null`, пока он
            ещё выполняется.
          format: date-time
        resultsUrl:
          anyOf:
            - type: string
            - type: "null"
          description: Кратковременно действующий предварительно подписанный URL для
            скачивания файла результатов пакета (JSONL) или `null` до завершения
            пакета. Это прямая ссылка для скачивания из объектного хранилища, а
            не маршрут API; используйте её как есть и повторно запросите пакет,
            чтобы получить новый URL после истечения срока действия текущего.
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Метаданные «ключ — значение», предоставленные вызывающей стороной
            для собственного отслеживания.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
      required:
        - id
        - object
        - status
        - requestCounts
        - createdAt
        - expiresAt
        - endedAt
        - resultsUrl
        - metadata
      additionalProperties: false
    BatchStatus:
      type: string
      enum:
        - in_progress
        - completed
        - cancelling
        - cancelled
        - expired
      description: Статус жизненного цикла пакета.
    BatchRequestCounts:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
          description: Общее количество запросов в пакете.
        completed:
          type: integer
          minimum: 0
          description: Успешно завершённые запросы.
        failed:
          type: integer
          minimum: 0
          description: Запросы, завершившиеся ошибкой.
      required:
        - total
        - completed
        - failed
      additionalProperties: false
    BatchList:
      type: object
      properties:
        object:
          type: string
          const: list
          description: Тип объекта, всегда `list`.
        data:
          type: array
          items:
            $ref: "#/components/schemas/Batch"
          description: Страница пакетов, сначала новые.
        hasMore:
          type: boolean
          description: Есть ли ещё результаты
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
          description: Курсор для следующей страницы
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    DeletedBatch:
      type: object
      properties:
        id:
          type: string
          description: ID удалённого пакета.
        object:
          type: string
          const: batch.deleted
          description: Тип объекта, всегда `batch.deleted`.
        deleted:
          type: boolean
          const: true
          description: Всегда `true` при успешном удалении.
      required:
        - id
        - object
        - deleted
      additionalProperties: false
    WebsetsTeamInfo:
      type: object
      properties:
        object:
          type: string
          const: team
          description: Тип объекта, всегда `"team"`.
        id:
          type: string
          description: Уникальный идентификатор команды.
        name:
          type: string
          description: Название команды.
        concurrency:
          type: object
          properties:
            active:
              type: integer
              description: Количество запросов, обрабатываемых в данный момент.
            queued:
              type: integer
              description: Количество запросов, находящихся в очереди.
          required:
            - active
            - queued
          additionalProperties: false
          description: Текущее использование параллелизма.
        limits:
          type: object
          properties:
            maxConcurrent:
              anyOf:
                - type: integer
                - type: "null"
              description: Максимально допустимое количество параллельных запросов. `null`
                означает отсутствие лимита.
            maxQueued:
              anyOf:
                - type: integer
                - type: "null"
              description: Максимально допустимое количество запросов в очереди. `null`
                означает отсутствие лимита.
          required:
            - maxConcurrent
            - maxQueued
          additionalProperties: false
          description: Лимиты параллелизма для команды.
      required:
        - object
        - id
        - name
        - concurrency
        - limits
      additionalProperties: false
    AnswerStreamChunk:
      description: "Схема для каждой полезной нагрузки JSON, отправляемой в потоке
        server-sent events `/answer`. Каждое событие отправляется как `data:
        <json>`."
      oneOf:
        - $ref: "#/components/schemas/AnswerStreamTextDeltaChunk"
        - $ref: "#/components/schemas/AnswerStreamCitationsChunkOutput"
        - $ref: "#/components/schemas/AnswerStreamCostChunkOutput"
        - $ref: "#/components/schemas/AnswerStreamErrorChunkOutput"
    SearchStreamChunk:
      oneOf:
        - $ref: "#/components/schemas/SearchStreamTextDeltaChunkOutput"
        - $ref: "#/components/schemas/SearchStreamGroundingChunkOutput"
        - $ref: "#/components/schemas/SearchStreamResultsChunkOutput"
        - $ref: "#/components/schemas/SearchStreamResetChunkOutput"
        - $ref: "#/components/schemas/SearchStreamDoneChunkOutput"
        - $ref: "#/components/schemas/SearchStreamErrorChunkOutput"
      description: "Схема для каждой полезной нагрузки JSON, отправляемой в потоке
        server-sent events `/search`. Каждое событие отправляется как `data:
        <json>`, а поток завершается `data: [DONE]`, что не представлено в этой
        схеме JSON."
      type: object
      discriminator:
        propertyName: type
        mapping:
          text-delta: "#/components/schemas/SearchStreamTextDeltaChunkOutput"
          grounding: "#/components/schemas/SearchStreamGroundingChunkOutput"
          results: "#/components/schemas/SearchStreamResultsChunkOutput"
          stream-reset: "#/components/schemas/SearchStreamResetChunkOutput"
          done: "#/components/schemas/SearchStreamDoneChunkOutput"
          error: "#/components/schemas/SearchStreamErrorChunkOutput"
    AgentRunEvent:
      type: object
      properties:
        id:
          type: string
          description: ID события в рамках выполнения.
        event:
          type: string
          enum:
            - agent_run.created
            - agent_run.started
            - agent_run.completed
            - agent_run.failed
            - agent_run.cancelled
        data:
          $ref: "#/components/schemas/JsonValue"
        createdAt:
          type: string
          format: date-time
          description: Время создания события
      required:
        - id
        - event
        - data
        - createdAt
      additionalProperties: false
    SearchResultOutput:
      type: object
      properties:
        title:
          type: string
          description: Заголовок результата поиска.
          example: A Comprehensive Overview of Large Language Models
        url:
          type: string
          description: URL результата поиска.
          example: https://arxiv.org/pdf/2307.06435.pdf
          format: uri
        publishedDate:
          description: "Предполагаемая дата создания, определённая при анализе
            HTML-содержимого. Формат: ГГГГ-ММ-ДД."
          example: 2023-11-16T01:36:32.547Z
          format: date-time
          type: string
        author:
          description: Автор содержимого, если доступен.
          example: Humza Naveed
          anyOf:
            - type: string
            - type: "null"
        id:
          description: Временный ID документа. Полезен для эндпоинта /contents.
          example: https://arxiv.org/abs/2307.06435
          type: string
        image:
          description: URL изображения, связанного с результатом поиска, если доступен.
          example: https://arxiv.org/pdf/2307.06435.pdf/page_1.png
          format: uri
          type: string
        favicon:
          description: URL фавикона домена результата поиска.
          example: https://arxiv.org/favicon.ico
          format: uri
          type: string
        text:
          description: Полный текст содержимого результата поиска.
          example: Abstract Large Language Models (LLMs) have recently demonstrated
            remarkable capabilities...
          type: string
        highlights:
          description: Массив фрагментов, извлечённых из содержимого результата поиска.
          example:
            - Such requirements have limited their adoption...
          type: array
          items:
            type: string
        highlightScores:
          description: Массив оценок косинусного сходства для каждого выделенного фрагмента.
          example:
            - 0.4600165784358978
          type: array
          items:
            type: number
            format: float
        summary:
          description: Summary веб-страницы.
          example: This overview paper on Large Language Models (LLMs) highlights key
            developments...
          type: string
        subpages:
          description: Массив подстраниц результата поиска.
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                description: Заголовок результата поиска.
                example: A Comprehensive Overview of Large Language Models
              url:
                type: string
                description: URL результата поиска.
                example: https://arxiv.org/pdf/2307.06435.pdf
                format: uri
              publishedDate:
                description: "Предполагаемая дата создания, определённая при анализе
                  HTML-содержимого. Формат: ГГГГ-ММ-ДД."
                example: 2023-11-16T01:36:32.547Z
                format: date-time
                type: string
              author:
                description: Автор содержимого, если доступен.
                example: Humza Naveed
                anyOf:
