            `source_not_available` означает, что search запросил домен, который
            Exa не может вернуть (удалите его из search), а `forbidden`
            означает, что запрос не был разрешён по иной причине.
        startedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Время начала выполнения
          format: date-time
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Время успешного завершения выполнения
          format: date-time
        failedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Время сбоя выполнения
          format: date-time
        cancelledAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Время отмены выполнения
          format: date-time
        durationMs:
          anyOf:
            - type: integer
            - type: "null"
          description: Общее время выполнения в миллисекундах
        createdAt:
          type: string
          format: date-time
          description: Время создания выполнения
        updatedAt:
          type: string
          format: date-time
          description: Время последнего обновления выполнения
      required:
        - id
        - monitorId
        - status
        - output
        - failReason
        - startedAt
        - completedAt
        - failedAt
        - cancelledAt
        - durationMs
        - createdAt
        - updatedAt
      additionalProperties: false
    SearchMonitorRunOutput:
      type: object
      properties:
        results:
          anyOf:
            - type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
            - type: "null"
          description: Результаты поиска
        content:
          description: Синтезированное содержимое на основе результатов поиска. Структура
            зависит от `outputSchema.type`.
          oneOf:
            - $ref: "#/components/schemas/JsonValue"
            - type: "null"
        grounding:
          anyOf:
            - type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: Поле вывода, к которому относится эта цитата
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          format: uri
                          description: URL источника.
                        title:
                          type: string
                          description: Заголовок источника.
                      required:
                        - url
                        - title
                      additionalProperties: false
                  confidence:
                    type: string
                    enum:
                      - low
                      - medium
                      - high
                    description: Оценка надёжности этого поля, указанная моделью.
                required:
                  - field
                  - citations
                  - confidence
                additionalProperties: false
            - type: "null"
          description: Цитаты на уровне полей с указанием уровня уверенности
      additionalProperties: false
    AgentRun:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/AgentRunId"
        object:
          type: string
          const: agent_run
        status:
          $ref: "#/components/schemas/AgentRunStatus"
        stopReason:
          anyOf:
            - $ref: "#/components/schemas/AgentStopReason"
            - type: "null"
          description: Причина остановки выполнения. `null`, пока выполнение находится в
            очереди или выполняется.
        createdAt:
          type: string
          format: date-time
          description: Время создания выполнения
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          format: date-time
        request:
          anyOf:
            - $ref: "#/components/schemas/AgentRunRequest"
            - type: "null"
        output:
          $ref: "#/components/schemas/AgentRunOutput"
        usage:
          $ref: "#/components/schemas/AgentUsage"
        costDollars:
          $ref: "#/components/schemas/AgentCostDollars"
      required:
        - id
        - object
        - status
        - stopReason
        - createdAt
        - completedAt
        - request
        - output
        - usage
        - costDollars
      additionalProperties: false
    AgentRunStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
        - cancelled
    AgentStopReason:
      type: string
      enum:
        - schema_satisfied
        - budget_reached
        - stopped
        - error
        - cancelled
    AgentRunRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Вопрос или инструкции на естественном языке для запроса.
          example: What are the most important AI infrastructure funding rounds announced
            this week?
        systemPrompt:
          type: string
          description: Дополнительные инструкции, определяющие генерируемый вывод или
            поведение agent. Используйте их для задания предпочтений по
            источникам, ограничений на новизну, дублирование или иных указаний
            по поведению.
          example: Prefer official sources and avoid duplicate results.
        effort:
          $ref: "#/components/schemas/AgentEffort"
        input:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Запись в виде объекта JSON.
              description: Записи, которые agent должен обработать или обогатить.
            exclusion:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Запись в виде объекта JSON.
              description: Записи или сущности, которые agent не должен возвращать.
          additionalProperties: false
        outputSchema:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: JSON Schema для проверяемого структурированного вывода в
                `output.structured`. Поля, не подтверждённые данными, могут
                возвращаться как `null`. Поддерживаются draft-07, 2019-09 и
                2020-12 через `$schema`.
            - type: "null"
        previousRunId:
          $ref: "#/components/schemas/AgentRunId"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Метаданные «ключ — значение», предоставленные вызывающей стороной
            для собственного отслеживания.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        dataSources:
          type: array
          items:
            $ref: "#/components/schemas/AgentDataSourceOutput"
          description: Провайдеры данных Exa Connect, настроенные для выполнения.
        budget:
          $ref: "#/components/schemas/AgentBudgetOutput"
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
      description: Канонизированные поля запроса, сохранённые вместе с выполнением.
    AgentRunOutput:
      type: object
      properties:
        text:
          type: string
          description: Ответ или summary на естественном языке.
        structured:
          anyOf:
            - $ref: "#/components/schemas/JsonValue"
            - type: "null"
          description: JSON, сформированный по `outputSchema`; поля, не подтверждённые
            данными, могут иметь значение `null`. `null`, если схема не была
            предоставлена.
        grounding:
          type: array
          items:
            $ref: "#/components/schemas/AgentGrounding"
          description: Цитаты на уровне полей, сформированные в ходе выполнения.
      required:
        - text
        - structured
        - grounding
      additionalProperties: false
    AgentGrounding:
      type: object
      properties:
        field:
          type: string
          description: Поле вывода, которое подтверждают цитаты.
          example: structured.companies[0].sourceUrl
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AgentCitation"
        confidence:
          anyOf:
            - type: string
              enum:
                - low
                - medium
                - high
              description: Указанная моделью надёжность для этого поля.
            - type: "null"
      required:
        - field
        - citations
      additionalProperties: false
    AgentCitation:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL источника.
        title:
          type: string
          description: Заголовок источника.
      required:
        - url
      additionalProperties: false
    AgentUsage:
      type: object
      properties:
        agentComputeUnits:
          type: number
          minimum: 0
        searches:
          type: integer
          minimum: 0
        emails:
          type: integer
          minimum: 0
        phoneNumbers:
          type: integer
          minimum: 0
        dataSources:
          $ref: "#/components/schemas/AgentDataSourceUsage"
      required:
        - agentComputeUnits
        - searches
        - emails
        - phoneNumbers
      additionalProperties: false
    AgentDataSourceUsage:
      type: object
