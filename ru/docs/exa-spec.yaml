          description: Расписание автоматических выполнений с заданным интервалом. Null,
            если расписание не задано.
        outputSchema:
          $ref: "#/components/schemas/SearchMonitorOutputSchemaOutput"
        metadata:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
              description: Метаданные «ключ — значение», предоставленные вызывающей стороной
                для собственного отслеживания.
              example:
                slack_channel_id: C123ABC
                slack_thread_id: "1745444400.123456"
