            можно запускать только вручную. Monitor со статусом `disabled`
            автоматически отключаются после 10 последовательных сбоев
            аутентификации.
        search:
          $ref: "#/components/schemas/SearchMonitorSearchOutput"
        trigger:
          anyOf:
            - $ref: "#/components/schemas/SearchMonitorTriggerOutput"
