            времени. Минимальный интервал: 1 час. Расписание привязано ко
            времени создания monitor (например, ежедневный monitor, созданный в
            14:30, запускается ежедневно примерно в 14:30).'
          example: 6h
      required:
        - type
        - period
    SearchMonitorOutputSchema:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaText"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: 'Схема JSON для синтезированного вывода. Поддерживаемые корневые
            типы: "text" и "object". При указании этого параметра ответ содержит
            объект вывода, содержимое которого соответствует этой схеме.
            Работает с любым типом поиска и добавляет около 2 секунд задержки
            синтеза к задержке выбранного типа поиска.'
          type: object
          discriminator:
            propertyName: type
            mapping:
              text: "#/components/schemas/OutputSchemaText"
              object: "#/components/schemas/OutputSchemaObject"
        - type: "null"
      description: 'Управляет форматом вывода выполнения. Если значение не указано, по
        умолчанию используется `{ "type": "text" }`. Если `type` имеет значение
        `"text"`, вывод представляет собой summary в виде обычного текста. Если
        `type` имеет значение `"object"`, вывод представляет собой
        структурированный JSON. Если для типа `"object"` не указаны
        `properties`, схема выводится автоматически; в противном случае вывод
        соответствует предоставленной схеме.'
    SearchMonitorWebhook:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: HTTPS URL для получения событий вебхука. Не должен указывать на
            localhost или диапазоны частных IP-адресов.
        events:
          type: array
          items:
            type: string
            enum:
              - monitor.created
              - monitor.updated
              - monitor.deleted
              - monitor.run.created
              - monitor.run.completed
          description: События, на которые следует подписаться. Если не указано, по
            умолчанию используются все события.
      required:
        - url
    BatchMonitorsRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - delete
            - pause
            - unpause
          description: Действие для подходящих monitor. `delete` безвозвратно удаляет их,
            `pause` устанавливает статус `paused`, а `unpause` устанавливает
            статус `active`.
        filter:
          type: object
          properties:
            name:
              type: string
              maxLength: 250
              description: Фильтровать по имени (совпадение подстроки без учёта регистра)
            status:
              type: string
              enum:
                - active
                - paused
                - disabled
              description: Фильтровать по статусу monitor
            metadata:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
                maxLength: 1000
              description: Фильтровать по парам ключ-значение метаданных (точное совпадение,
                логическое И)
          description: Необходимо указать хотя бы одно поле фильтра, чтобы предотвратить
            случайные массовые операции.
        dry_run:
          type: boolean
          description: "Если `true`, возвращает monitor, которые были бы затронуты, без
            выполнения действия. По умолчанию: `true`."
          default: true
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: Максимальное количество monitor для обработки в одном запросе. По
            умолчанию 50, максимум 500.
          default: 50
      required:
        - action
        - filter
    UpdateSearchMonitorParameters:
      type: object
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
          description: Обновить имя monitor
        status:
          type: string
          enum:
            - active
            - paused
          description: Обновить статус monitor (можно установить только `active` или
            `paused`)
        search:
          type: object
          properties:
            query:
              type: string
              minLength: 1
              description: Строка запроса для поиска.
              example: Latest developments in LLM capabilities
            numResults:
              type: integer
              minimum: 1
              maximum: 100
              description: "Количество возвращаемых результатов. Лимиты зависят от типа
                поиска. Максимальный публичный лимит: 100 результатов. Свяжитесь
                с отделом продаж (hello@exa.ai), чтобы обсудить более высокие
                лимиты."
              example: 10
              default: 10
            includeDomains:
              description: Ограничить результаты поиска указанными доменами.
              type: array
              items:
                type: string
            excludeDomains:
              description: Исключить указанные домены из результатов поиска.
              type: array
              items:
                type: string
            contents:
              $ref: "#/components/schemas/SearchMonitorContents"
          description: Частичные параметры поиска для объединения. При обновлении все поля
            необязательны.
        trigger:
          anyOf:
            - type: object
              properties:
                type:
                  type: string
                  const: interval
                  description: Тип триггера. Сейчас поддерживается только `interval`.
                  default: interval
                period:
                  type: string
                  description: 'Строка длительности, задающая частоту выполнения monitor
                    (например, "1h", "6h", "1d", "7d"). Допускается только одна
                    единица времени. Минимальный интервал: 1 час.'
            - type: "null"
          description: Обновить расписание. Установите значение null, чтобы удалить
            расписание.
        outputSchema:
          $ref: "#/components/schemas/SearchMonitorOutputSchema"
        metadata:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
              description: Метаданные в формате ключ-значение, предоставляемые вызывающей
                стороной для собственного отслеживания.
              example:
                slack_channel_id: C123ABC
                slack_thread_id: "1745444400.123456"
                user_id: U123ABC
            - type: "null"
          description: Обновить метаданные. Установите значение null, чтобы удалить их.
            Метаданные возвращаются в доставках вебхуков, поэтому обновления
            можно направлять в такие системы, как Slack.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        webhook:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: HTTPS URL для получения событий вебхука. Не должен указывать на
                localhost или диапазоны частных IP-адресов.
            events:
              type: array
              items:
                type: string
                enum:
                  - monitor.created
                  - monitor.updated
                  - monitor.deleted
                  - monitor.run.created
                  - monitor.run.completed
              description: События, на которые следует подписаться. Если не указано, по
                умолчанию используются все события.
          description: Частичные параметры вебхука для объединения. При обновлении все
            поля необязательны.
    CreateAgentRunRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Вопрос или инструкции на естественном языке для запроса.
          example: What are the most important AI infrastructure funding rounds announced
            this week?
        systemPrompt:
          type: string
          description: Дополнительные инструкции, определяющие сгенерированный вывод или
            поведение agent. Используйте их для указания предпочтений по
            источникам, ограничений на новизну, ограничений на дублирование или
            других निर्देशаний по поведению.
          example: Prefer official sources and avoid duplicate results.
        effort:
          $ref: "#/components/schemas/AgentEffort"
        input:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Запись в виде объекта JSON.
              description: Записи, которые agent должен обработать или обогатить.
            exclusion:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Запись в виде объекта JSON.
              description: Записи или сущности, которые agent не должен возвращать.
          description: Записи для обработки, а также записи или сущности, которые следует
            исключить из ответа.
        outputSchema:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: Схема JSON для структурированного вывода в `output.structured`,
                прошедшего валидацию. Поля, не поддерживаемые данными, могут
                возвращаться как `null`. Поддерживаются draft-07, 2019-09 и
                2020-12 через `$schema`.
            - type: "null"
        previousRunId:
          description: Идентификатор завершённого выполнения, с которого следует
            продолжить. Он должен принадлежать той же team.
          $ref: "#/components/schemas/AgentRunId"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Метаданные, предоставляемые вызывающей стороной и хранящиеся вместе
            с выполнением.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        dataSources:
          maxItems: 5
          type: array
          items:
            $ref: "#/components/schemas/AgentDataSource"
          description: Провайдеры данных Exa Connect, включаемые для выполнения. Каждая
            запись включает все инструменты соответствующего провайдера.
        budget:
          $ref: "#/components/schemas/AgentBudget"
      required:
        - query
    AgentEffort:
      type: string
      enum:
        - minimal
        - low
        - medium
        - high
        - xhigh
        - auto
        - max
      description: Предпочтения по стоимости и effort рассуждений для выполнения.
        `auto` позволяет Exa выбрать подходящий effort. `max` — уровень
        публичной беты с максимальным effort для задач, где полнота и
        тщательность важнее задержки или стоимости, включая построение больших
        списков, глубокие многоисточниковые исследования и criteria, которые
        сложно проверить.
      default: auto
    AgentRunId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[A-Za-z0-9_.:-]+$
      description: Идентификатор выполнения Agent. Новые идентификаторы выполнения
        возвращаются с префиксом `agent_run_`.
      example: agent_run_01j7x9v0m2n4p6q8r0s2t4v6w8
    AgentDataSource:
      type: object
      properties:
        provider:
          description: Провайдер данных Exa Connect, включаемый для выполнения. Все
            инструменты провайдера доступны по умолчанию.
          example: fiber
          $ref: "#/components/schemas/AgentDataSourceProvider"
      required:
        - provider
    AgentDataSourceProvider:
      type: string
      enum:
        - fiber
        - financial_datasets
        - similarweb
        - baselayer
        - affiliate
        - particle
        - jinko
        - polymarket
      description: Идентификатор провайдера данных Exa Connect.
    AgentBudget:
      type: object
      properties:
        maxCostDollars:
          type: number
          description: "Максимальная сумма в долларах США, которую может потратить это
            выполнение. Допустимые значения: от $1 до $100; применяется только к
            `auto` и `max`. Если не указано, лимит по умолчанию составляет $5
            для `auto` и $20 для `max`."
          example: 10
      description: Необязательный лимит расходов на одно выполнение для тарифицируемых
        уровней effort `auto` и `max`. Выполнения, завершённые досрочно, могут
        стоить меньше лимита.
    CreateBatchRequest:
      type: object
      properties:
        requests:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/BatchRequestItem"
          description: Запросы для постановки в очередь. Каждый `customId` должен быть
            уникальным в пакете.
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Метаданные, предоставленные вызывающей стороной и сохранённые
            вместе с пакетом.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
      required:
        - requests
    BatchRequestItem:
      type: object
      properties:
        customId:
          type: string
          minLength: 1
          maxLength: 64
          description: Ваш уникальный идентификатор этого запроса; используется как ключ
            результата и должен быть уникальным в пакете.
          example: row-1
        method:
          type: string
          const: POST
          description: HTTP-метод пакетного запроса. В v1 поддерживается только POST.
        url:
          type: string
          enum:
            - /search
            - /agent/runs
          description: "Целевой маршрут API для запроса. В v1: `/search` или `/agent/runs`."
          example: /search
        body:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: "Тело запроса для целевого маршрута. Должно быть объектом JSON;
            `stream: true` не допускается."
      required:
        - customId
        - method
        - url
        - body
    AnswerStreamTextDeltaChunk:
      type: object
      properties:
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                minimum: 0
                description: Индекс этого потокового варианта.
              delta:
                type: object
                properties:
                  role:
                    type: string
                    const: assistant
                  content:
                    type: string
                  refusal:
                    anyOf:
                      - type: string
                      - type: "null"
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Постепенно выводимое моделью содержимое ответа.
              finish_reason:
                description: Причина завершения этого потокового варианта, если указана.
                oneOf:
                  - type: string
                  - type: "null"
            required:
              - index
              - delta
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
          description: Совместимые с OpenAI варианты потокового завершения с удалёнными
            внутренними полями провайдера.
      required:
        - choices
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    SearchResponse:
      oneOf:
        - $ref: "#/components/schemas/SearchSynthesisResponse"
        - $ref: "#/components/schemas/SearchResultsResponse"
    SearchSynthesisResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Уникальный идентификатор запроса.
          example: b5947044c4b78efa9552a7c89b306d95
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultOutput"
          description: Список результатов поиска, содержащих заголовок, URL, дату
            публикации и автора.
        resolvedSearchType:
          description: Устаревшее поле. Текущие ответы в production могут возвращать
            пустую строку; клиенты не должны строить логику на основе этого
            значения.
          example: ""
          deprecated: true
          type: string
        context:
          type: string
          description: Устарело. Объединённая строка контекста из результатов поиска.
            Вместо этого используйте выделенные фрагменты или текст.
          deprecated: true
        costDollars:
          $ref: "#/components/schemas/CostDollarsOutput"
        searchTime:
          type: number
          description: Время обработки на стороне сервера в миллисекундах, измеренное на
            шлюзе. Включает поиск, но может не включать последующие этапы,
            например синтез структурированного вывода, поэтому может быть меньше
            полной задержки запроса.
          example: 312.4
        output:
          $ref: "#/components/schemas/SearchSynthesisOutputOutput"
      required:
        - results
        - output
      additionalProperties: false
    SearchResultsResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Уникальный идентификатор запроса.
          example: b5947044c4b78efa9552a7c89b306d95
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultOutput"
          description: Список результатов поиска, содержащих заголовок, URL, дату
            публикации и автора.
        resolvedSearchType:
          description: Устаревшее поле. Текущие ответы в production могут возвращать
            пустую строку; клиенты не должны строить логику на основе этого
            значения.
          example: ""
          deprecated: true
          type: string
        context:
          type: string
          description: Устарело. Объединённая строка контекста из результатов поиска.
            Вместо этого используйте выделенные фрагменты или текст.
          deprecated: true
        costDollars:
          $ref: "#/components/schemas/CostDollarsOutput"
        searchTime:
          type: number
          description: Время обработки на стороне сервера в миллисекундах, измеренное на
            шлюзе. Включает поиск, но может не включать последующие этапы,
            например синтез структурированного вывода, поэтому может быть меньше
            полной задержки запроса.
          example: 312.4
      required:
        - results
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Уникальный идентификатор запроса.
          example: b5947044c4b78efa9552a7c89b306d95
        error:
          type: string
          description: Понятное человеку сообщение с описанием ошибки.
          example: Invalid API key
        tag:
          type: string
          description: "Машиночитаемый тег ошибки, определяющий сбой. Набор тегов не
            ограничен: новые теги могут добавляться в любое время, поэтому
            неизвестные теги следует обрабатывать как общую ошибку с
            HTTP-статусом ответа. Известные теги приведены в качестве примеров."
          examples:
            - DEFAULT_ERROR
            - INTERNAL_ERROR
            - INVALID_API_KEY
            - INVALID_REQUEST
            - INVALID_REQUEST_BODY
            - INVALID_REQUEST_QUERY
            - INVALID_JSON_SCHEMA
            - INVALID_NUM_RESULTS
            - NUM_RESULTS_EXCEEDED
            - NO_MORE_CREDITS
            - API_KEY_BUDGET_EXCEEDED
            - TEAM_BUDGET_EXCEEDED
            - NO_CONTENT_FOUND
            - PROHIBITED_CONTENT
            - INSUFFICIENT_SCOPE
            - UNABLE_TO_GENERATE_RESPONSE
            - UNSUPPORTED_PUBLICATION_INCLUDE_FILTER
            - SUBPAGES_LIMIT_EXCEEDED
            - FEATURE_DISABLED
            - INVALID_URLS
            - FETCH_DOCUMENT_ERROR
            - TEAM_BLOCKED
            - NOT_FOUND
            - RATE_LIMIT_EXCEEDED
            - SNAPSHOT_RATE_LIMIT_EXCEEDED
            - SNAPSHOT_NOT_ON_PLAN
            - SNAPSHOT_NOT_IN_CONTRACT
            - SNAPSHOT_TRIAL_EXHAUSTED
            - SNAPSHOT_TRIAL_CAP_EXCEEDED
      required:
        - requestId
        - error
        - tag
      additionalProperties: false
      description: Стандартная оболочка ошибки, возвращаемая API Exa для неуспешных
        запросов.
    X402PaymentChallenge:
      type: object
      properties:
        requestId:
          type: string
          description: Уникальный идентификатор запроса.
          example: b5947044c4b78efa9552a7c89b306d95
        error:
          type: string
          description: Понятное человеку сообщение с описанием ошибки.
          example: Payment required to access this resource
        tag:
          type: string
          description: "Машиночитаемый тег ошибки, определяющий сбой. Набор тегов не
