  headers:
    XRequestId:
      description: Уникальный идентификатор запроса. Соответствует полю `requestId`,
        возвращаемому в телах ответов, содержащих это поле.
      schema:
        type: string
      example: 07e29bb1f4f1dd05f0d4b57bbcf6e4b8
    XExaQueued:
      description: Ожидал ли запрос в очереди лимита запросов клиента перед обработкой.
      schema:
        type: string
        enum:
          - "true"
          - "false"
      example: "false"
    XExaQueueMs:
      description: Общее время ожидания запроса в очереди лимита запросов клиента в
        миллисекундах.
      schema:
        type: string
      example: "0"
  responses:
    BadRequestResponse:
      description: Тело запроса или параметры запроса не прошли валидацию.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 0a1b2c3d4e5f60718293a4b5c6d7e8f9
            error: "Invalid request body: query: Invalid input: expected string, received
              undefined"
            tag: INVALID_REQUEST_BODY
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedResponse:
      description: API key отсутствует или недействителен.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: f2a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2
            error: Invalid API key
            tag: INVALID_API_KEY
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequestsResponse:
      description: Превышен лимит запросов для этого API key, team или сети.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 7f9b1d3e5a0c2e4b6d8f0a2c4e6b8d0f
            error: You've exceeded the Exa rate limit for your network. If you believe this
              is in error, please email hello@exa.ai :)
            tag: RATE_LIMIT_EXCEEDED
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerErrorResponse:
      description: При обработке запроса произошла непредвиденная ошибка.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 9b1d3f5e7a0c2e4b6d8f0a2c4e6b8d0f
            error: Sorry, we encountered an error while processing your request. Please try
              again later
            tag: DEFAULT_ERROR
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailableResponse:
      description: Exa временно перегружена или недоступна. Запрос не был обработан;
        повторите попытку с экспоненциальной задержкой.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: b3d5f7a9c1e0a2c4e6b8d0f2a4c6e8b1
            error: Exa is temporarily over capacity. Please retry with exponential backoff.
            tag: SERVICE_OVERLOADED
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaymentRequiredResponse:
      description: У team закончились credits или превышен бюджет расходов.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 1c3e5a7b9d0f2a4c6e8b0d2f4a6c8e0b
            error: You have exceeded your credits limit. Please top up to keep using Exa at
              dashboard.exa.ai
            tag: NO_MORE_CREDITS
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundResponse:
      description: Запрошенный ресурс не существует.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 3b1d5f7a9c0e2b4d6f8a0c2e4b6d8f0a
            error: Not found
            tag: NOT_FOUND
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictResponse:
      description: Запрос конфликтует с текущим состоянием ресурса.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 5d7f9b1c3e0a2c4e6b8d0f2a4c6e8b0d
            error: Batch is not in a cancellable state
            tag: INVALID_REQUEST
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    AcceptHeader:
      in: header
      name: Accept
      schema:
        description: Укажите `text/event-stream` для получения событий, отправляемых
          сервером.
        type: string
        enum:
          - application/json
          - text/event-stream
      description: Укажите `text/event-stream` для получения событий, отправляемых сервером.
    ExaBetaHeader:
      in: header
      name: Exa-Beta
      schema:
        description: Разделённые запятыми бета-токены для включения экспериментальных
