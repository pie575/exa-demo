        minimum: 0
      description: Количество вызовов инструментов для каждого провайдера данных Exa
        Connect, использованного во время выполнения. Ключи — имена провайдеров
        (например, `fiber`, `similarweb`). Включены только провайдеры с
        ненулевым использованием.
    AgentCostDollars:
      type: object
      properties:
        total:
          type: number
          minimum: 0
        agentCompute:
          type: number
          minimum: 0
        search:
          type: number
          minimum: 0
        emails:
          type: number
          minimum: 0
        phoneNumbers:
          type: number
          minimum: 0
        dataSources:
          $ref: "#/components/schemas/AgentDataSourceCost"
      required:
        - total
        - agentCompute
        - search
        - emails
        - phoneNumbers
      additionalProperties: false
    AgentDataSourceCost:
      type: object
      propertyNames:
        type: string
      additionalProperties:
        type: number
        minimum: 0
      description: Стоимость в долларах для каждого провайдера данных Exa Connect,
        использованного во время выполнения. Ключи — имена провайдеров
        (например, `fiber`, `similarweb`). Включены только провайдеры с
        ненулевым использованием.
    AgentErrorResponse:
      type: object
      properties:
        error:
