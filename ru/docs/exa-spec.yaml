            - type: "null"
          description: Время следующего запланированного выполнения. Null, если триггер не
            задан.
          format: date-time
        createdAt:
          type: string
          format: date-time
          description: Время создания monitor
        updatedAt:
          type: string
          format: date-time
          description: Время последнего обновления monitor
        webhookSecret:
          type: string
          description: Секрет для проверки подписей вебхука. Возвращается только один раз
            при создании. Храните его в безопасном месте.
