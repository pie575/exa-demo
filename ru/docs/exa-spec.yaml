                      type: number
                    max:
                      description: Максимальное расчётное общее количество потенциальных совпадений
                      type: number
                  required:
                    - min
                    - max
                  type: object
              required:
                - total
                - confidence
                - bounds
              type: object
            reasoning:
              description: Обоснование оценки
              type: string
          required:
            - expected
            - reasoning
          type: object
          description: Метрики полноты поиска, null, если ещё не вычислены или не
            запрашивались.
          nullable: true
        metadata:
          default: {}
          description: Набор пар «ключ — значение», которые нужно связать с этим объектом.
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
        canceledAt:
