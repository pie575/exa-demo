            default: 25
            minimum: 1
            maximum: 200
            type: integer
          required: false
          description: Количество возвращаемых результатов
        - in: query
          name: types
          schema:
            items:
              enum:
                - webset.created
                - webset.deleted
                - webset.paused
                - webset.idle
                - webset.search.created
                - webset.search.canceled
                - webset.search.completed
                - webset.search.updated
                - import.created
                - import.completed
                - webset.item.created
                - webset.item.enriched
                - monitor.created
                - monitor.updated
                - monitor.deleted
                - monitor.run.created
                - monitor.run.completed
                - webset.export.created
                - webset.export.completed
              type: string
            type: array
          required: false
          description: Типы событий для фильтрации
        - in: query
          name: createdBefore
          schema:
            format: date-time
            type: string
          required: false
          description: Фильтровать события, созданные до или в момент этой временной метки
            включительно. Должна быть указана корректная строка даты и времени в
            формате ISO 8601. Все значения времени указаны в UTC.
        - in: query
          name: createdAfter
          schema:
            format: date-time
            type: string
          required: false
          description: Фильтровать события, созданные после или в момент этой временной
            метки включительно. Должна быть указана корректная строка даты и
            времени в формате ISO 8601. Все значения времени указаны в UTC.
      responses:
        "200":
          description: Список событий
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Уникальный идентификатор запроса.
              example: req_N6SsgoiaOQOPqsYKKiw5
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEventsResponse"
  /v0/events/{id}:
    servers:
      - url: https://api.exa.ai/websets
    get:
      operationId: events-get
      summary: Получить событие
      description: |-
        Получить событие по идентификатору.

        Чтобы подписаться на события, создайте вебхук.
      tags:
        - Events
      security:
        - apiKey: []
        - bearer: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: Идентификатор события
          required: true
      responses:
        "200":
          description: ""
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Уникальный идентификатор запроса.
              example: req_N6SsgoiaOQOPqsYKKiw5
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Событие не найдено
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Уникальный идентификатор запроса.
              example: req_N6SsgoiaOQOPqsYKKiw5
              required: true
components:
  schemas:
    SearchRequest:
      type: object
      properties:
        includeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: Список доменов или путей на доменах, которые следует включить в
                поиск. Каждая запись может быть именем хоста (например,
                `example.com`), именем хоста с префиксом пути (например,
                `example.com/docs`) или поддоменом с подстановочным знаком
                (например, `*.example.com`). Если параметр указан, будут
                возвращаться только результаты с соответствующих доменов или
                путей. Используйте этот параметр для фильтрации по доменам или
                путям вместо добавления оператора `site:` в запрос.
              example:
                - arxiv.org
                - exa.ai/blog
            - type: "null"
        excludeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: Список доменов или путей на доменах, которые следует исключить из
                результатов поиска. Каждая запись может быть именем хоста
                (например, `example.com`), именем хоста с префиксом пути
                (например, `example.com/docs`) или поддоменом с подстановочным
                знаком (например, `*.example.com`). Если параметр указан,
                результаты с соответствующих доменов или путей возвращаться не
                будут. Используйте этот параметр для фильтрации по доменам или
                путям вместо добавления оператора `site:` в запрос.
              example:
                - docs.python.org/3
            - type: "null"
        startCrawlDate:
          anyOf:
            - type: string
              description: Устарел и не влияет на работу, API его игнорирует. Должен быть
                указан в формате ISO 8601.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        endCrawlDate:
          anyOf:
            - type: string
              description: Устарел и не влияет на работу, API его игнорирует. Должен быть
                указан в формате ISO 8601.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        startPublishedDate:
          anyOf:
            - type: string
              description: Будут возвращены только ссылки с датой публикации позже указанной.
                Дата должна быть указана в формате ISO 8601.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
            - type: "null"
        endPublishedDate:
          anyOf:
            - type: string
              description: Будут возвращены только ссылки с датой публикации раньше указанной.
                Дата должна быть указана в формате ISO 8601.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
            - type: "null"
        numResults:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 100
              description: Количество возвращаемых результатов. Лимиты зависят от типа поиска.
                Максимальный общедоступный лимит составляет 100 результатов.
                Чтобы обсудить более высокие лимиты, свяжитесь с отделом продаж
                (hello@exa.ai).
              example: 10
              default: 10
            - type: "null"
        context:
          anyOf:
            - description: "Устарел: используйте вместо него highlights или text. Возвращает
                содержимое страницы в виде объединённой строки контекста."
              deprecated: true
              oneOf:
                - type: boolean
                  description: "Устарел: используйте вместо него highlights или text. Возвращает
                    содержимое страницы в виде объединённой строки контекста."
                  example: true
                  deprecated: true
                - type: object
                  properties:
                    maxCharacters:
                      type: integer
                      minimum: 1
                      maximum: 10000
                      description: "Устарел. Максимальный лимит символов для строки контекста.
                        Максимально поддерживаемое значение: 10000."
                      example: 10000
                  description: "Устарел: используйте вместо него highlights или text. Возвращает
                    содержимое страницы в виде объединённой строки контекста."
                  deprecated: true
            - type: "null"
        moderation:
          anyOf:
            - type: boolean
              description: Включите модерацию содержимого, чтобы отфильтровать небезопасное
                содержимое из результатов поиска.
              example: true
              default: false
            - type: "null"
        contents:
          anyOf:
            - description: Параметры содержимого для text, highlights, summary, extras и
                управления свежестью.
              $ref: "#/components/schemas/ContentsOptions"
            - type: "null"
        query:
          type: string
          minLength: 1
          description: Строка запроса для поиска.
          example: Latest developments in LLM capabilities
        additionalQueries:
          anyOf:
            - minItems: 1
              maxItems: 10
              type: array
              items:
                type: string
              description: Дополнительные варианты запроса для вариантов deep-search. Работает
                только с типом поиска deep-search. Если указаны, эти запросы
                используются вместе с основным запросом для получения более
                широких результатов.
              example:
                - LLM advancements
                - large language model progress
            - type: "null"
        type:
          anyOf:
            - type: string
              enum:
                - instant
                - fast
                - auto
                - deep-lite
                - deep
                - deep-reasoning
              description: Режим поиска. `auto` (по умолчанию) — сбалансированный режим,
                оптимизированный по качеству и скорости, рекомендованный для
                большинства приложений. `fast` возвращает высококачественные
                результаты с меньшей задержкой, поэтому хорошо подходит для
                поиска в пользовательских приложениях и интерактивных рабочих
                процессов. `instant` оптимизирован для минимального времени
                ответа, жертвуя глубиной поиска ради скорости в сценариях
                реального времени, таких как чат, голосовые агенты и
                автодополнение. `deep-lite` выполняет облегчённое исследование с
                синтезированными результатами и стабильной задержкой в 4
                секунды, меньшей, чем при полном глубоком поиске. `deep`
                проводит комплексное многошаговое исследование с синтезом, а
                `deep-reasoning` обеспечивает более глубокие рассуждения для
                задач сложного анализа и принятия решений.
              example: auto
              default: auto
            - type: "null"
        category:
          anyOf:
            - type: string
              enum:
                - company
                - publication
                - news
                - personal site
                - financial report
                - people
              description: "Категория данных, на которой следует сосредоточиться.
                Поддерживаемые категории: `company`, `publication`, `news`,
                `personal site`, `financial report` и `people`. Также
                принимаются другие строки, которые используются в качестве
                подсказок категорий для поиска. Категории `people` и `company`
                обеспечивают более высокое качество поиска профилей людей и
                страниц компаний. Категория `publication` выводит научные
                публикации, такие как научные статьи, препринты и журнальные
                статьи, со структурированными метаданными, включая авторов,
                издание и цитирования. Примечание: категории `company` и
                `people` поддерживают только ограниченный набор фильтров. Для
                этих категорий НЕ поддерживаются следующие параметры:
                `startPublishedDate`, `endPublishedDate`, `excludeDomains`.
                Использование неподдерживаемых параметров приведёт к ошибке
                400."
              example: publication
            - type: "null"
        userLocation:
          anyOf:
            - type: string
              description: Двухбуквенный код страны пользователя по стандарту ISO, например
                US.
              example: US
            - type: "null"
        compliance:
          anyOf:
            - type: string
              enum:
                - hipaa
              description: Режим соответствия требованиям, доступный только в Enterprise.
                Установите `hipaa`, чтобы включить режим HIPAA. Требуется поиск
                только по кэшу с поддерживаемыми параметрами. Подробнее см. в
                документации по HIPAA.
              example: hipaa
            - type: "null"
        outputSchema:
          anyOf:
            - oneOf:
                - $ref: "#/components/schemas/OutputSchemaText"
                - $ref: "#/components/schemas/OutputSchemaObject"
              description: 'JSON-схема для синтезированного вывода. Поддерживаемые корневые
                типы: "text" и "object". Если параметр указан, ответ содержит
                объект output, содержимое которого соответствует этой схеме.
                Работает с любым типом поиска и добавляет около 2 секунд
                задержки на синтез помимо задержки выбранного типа поиска.'
              type: object
              discriminator:
                propertyName: type
                mapping:
                  text: "#/components/schemas/OutputSchemaText"
                  object: "#/components/schemas/OutputSchemaObject"
            - type: "null"
        systemPrompt:
          anyOf:
            - type: string
              description: Дополнительные инструкции, определяющие сгенерированный вывод или
                поведение агента. Используйте их для указания предпочтений по
                источникам, ограничений на новизну или дублирование либо других
                инструкций по поведению.
              example: Prefer official sources and avoid duplicate results.
            - type: "null"
        stream:
          anyOf:
            - type: boolean
              description: Запрашивает server-sent events для потоковой передачи
                синтезированного вывода. Потоковая передача сейчас используется
                только при указании outputSchema; в противном случае эндпоинт
                возвращает обычный JSON-ответ поиска.
              default: false
            - type: "null"
      required:
        - query
    JsonValue:
      description: Любое значение JSON.
      oneOf:
        - type: "null"
        - type: boolean
        - type: number
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/JsonValue"
        - type: object
          propertyNames:
            type: string
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
    ContentsOptions:
      type: object
      properties:
        text:
          anyOf:
            - description: Параметры извлечения текста для каждого результата.
              oneOf:
                - type: boolean
                  title: Simple text retrieval
                  description: Если true, возвращает полный текст страницы с настройками по
                    умолчанию. Если false, отключает возврат текста.
                  default: false
                - type: object
                  properties:
                    maxCharacters:
                      anyOf:
                        - type: integer
                          minimum: 1
                          maximum: 10000
                          description: Максимальное количество символов для полного текста страницы.
                            Полезно для управления размером ответа и затратами
                            на API. Максимально поддерживаемое значение — 10000.
                          example: 1000
                        - type: "null"
                    includeHtmlTags:
                      anyOf:
                        - type: boolean
                          description: "Если true, включает в возвращаемый текст упрощённые HTML-теги
                            вместо обычного текста в стиле Markdown. Используйте
                            maxAgeHours: 0, если нужно применить это к только
                            что полученному контенту."
                          example: false
                          default: false
                        - type: "null"
                    verbosity:
                      anyOf:
                        - type: string
                          enum:
                            - compact
                            - standard
                            - full
                          description: "Управляет подробностью представления текста. compact фокусируется
                            на основном содержимом, standard включает больше
                            контекста страницы, а full запрашивает наиболее
                            полный отрисованный текст. Для некоторых страниц
                            вывод standard и full может быть одинаковым.
                            Используйте maxAgeHours: 0, если нужно применить это
                            к только что полученному контенту."
                          example: standard
                          default: compact
                        - type: "null"
                    includeSections:
                      anyOf:
                        - type: array
                          items:
                            type: string
                            enum:
                              - header
                              - navigation
                              - banner
                              - body
                              - sidebar
                              - footer
                              - metadata
                          description: "По мере возможности включает только контент, классифицированный
                            как принадлежащий к этим семантическим разделам
                            страницы. Для некоторых страниц классификация
                            разделов может быть недоступна или неполной; если
                            требуется строгая фильтрация, проверяйте вывод.
                            Используйте maxAgeHours: 0, если нужно применить это
                            к только что полученному контенту."
                          example:
                            - body
                            - header
                        - type: "null"
                    excludeSections:
                      anyOf:
                        - type: array
                          items:
                            type: string
                            enum:
                              - header
                              - navigation
                              - banner
                              - body
                              - sidebar
                              - footer
                              - metadata
                          description: "Исключает контент, классифицированный как принадлежащий к этим
                            семантическим разделам страницы. Классификация
                            разделов выполняется по мере возможности.
                            Используйте maxAgeHours: 0, если нужно применить это
                            к только что полученному контенту."
                          example:
                            - navigation
                            - footer
                            - sidebar
                        - type: "null"
                  title: Advanced text options
                  description: Расширенные параметры управления извлечением текста. Используйте
                    их, если нужно ограничить длину текста или включить
                    HTML-разметку.
            - type: "null"
        highlights:
          anyOf:
            - description: Текстовые фрагменты, которые LLM определяет как наиболее
                релевантные для каждой страницы.
              oneOf:
                - type: boolean
                  title: Simple highlights retrieval
                  description: Если true, возвращает highlights с настройками по умолчанию. Если
                    false, отключает highlights.
                  default: false
                - type: object
                  properties:
                    query:
                      anyOf:
                        - type: string
                          description: Пользовательский запрос, определяющий, какие highlights выбирает
                            LLM.
                          example: Key advancements
                        - type: "null"
                    verbosity:
                      anyOf:
                        - type: string
                          enum:
                            - low
                            - medium
                            - high
                          description: "Предустановленная длина highlights: `low`, `medium` и `high`
                            выделяют всё больший бюджет токенов для возвращаемых
                            highlights. При использовании highlights.dynamic
                            предустановка задаёт единый общий бюджет для всего
                            набора результатов, а не отдельный бюджет для
                            каждого URL. Точные бюджеты настраиваются Exa и
                            могут изменяться. Несовместимо с maxCharacters и
                            numSentences. Бета-версия: требуется header запроса
                            `Exa-Beta: dynamic-highlights-2026-08-28`; запросы,
                            задающие `verbosity` без него, отклоняются."
                          example: medium
                          x-exa-lifecycle: beta
                          x-exa-beta-flag: dynamic-highlights-2026-08-28
                          x-mint:
                            post:
                              - Beta
                        - type: "null"
                    dynamic:
                      anyOf:
                        - type: boolean
                          description: "Включает Dynamic Highlights (предварительная исследовательская
                            версия): учитывает все результаты вместе и выделяет
                            единый общий бюджет контекста для набора
                            результатов, а не отдельный бюджет для каждого
                            документа. Несовместимо с maxCharacters.
                            Бета-версия: требуется header запроса `Exa-Beta:
                            dynamic-highlights-2026-08-28`; запросы, задающие
                            `dynamic` без него, отклоняются."
                          example: true
                          x-exa-lifecycle: beta
                          x-exa-beta-flag: dynamic-highlights-2026-08-28
                          x-mint:
                            post:
                              - Beta
                        - type: "null"
                    maxCharacters:
                      anyOf:
                        - type: integer
                          minimum: 1
                          maximum: 10000
                          description: Максимальное количество символов, возвращаемых для highlights.
                            Управляет общей длиной текста highlights,
                            возвращаемого для каждого URL. Максимально
                            поддерживаемое значение — 10000. Несовместимо с
                            highlights.dynamic.
                          example: 2000
                        - type: "null"
                    numSentences:
                      anyOf:
                        - type: integer
                          minimum: 1
                          description: "Устарело и будет удалено в одном из будущих выпусков. Сейчас
                            сопоставляется с бюджетом примерно в 1333 символа на
                            предложение. Передайте highlights: true для
                            highlights по умолчанию или { query }, чтобы
                            направить выбор собственным запросом."
                          example: 1
                          deprecated: true
                        - type: "null"
                    highlightsPerUrl:
                      anyOf:
                        - type: integer
                          minimum: 1
                          description: "Устарело и будет удалено в одном из будущих выпусков. Сейчас
                            игнорируется. Передайте highlights: true для
                            выделенных фрагментов по умолчанию или { query },
                            чтобы направлять выбор с помощью собственного
                            запроса."
                          example: 1
                          deprecated: true
                        - type: "null"
                  title: Advanced highlights options
                  description: "Расширенные параметры управления извлечением highlights. Передайте
                    highlights: true, чтобы получить стандартный вариант
                    наивысшего качества; указывайте этот объект, только если
                    нужно направить выбор с помощью собственного запроса."
            - type: "null"
        summary:
          anyOf:
            - type: object
              properties:
                query:
                  anyOf:
                    - type: string
                      description: Пользовательский запрос для summary, созданного LLM.
                      example: Main developments
                    - type: "null"
                schema:
                  anyOf:
                    - type: object
                      propertyNames:
