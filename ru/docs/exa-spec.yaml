        пройти аутентификацию с помощью Authorization: Bearer <key>."
    bearer:
      type: http
      scheme: bearer
      description: "Передайте свой API-ключ Exa в заголовке x-api-key. Также можно
        пройти аутентификацию с помощью Authorization: Bearer <key>."
