          description: Есть ли дополнительные мониторы, соответствующие фильтру. Если
            `true`, повторите запрос для обработки следующего пакета.
      required:
        - action
        - affected
        - ids
        - dry_run
        - has_more
      additionalProperties: false
    TriggerSearchMonitorResponse:
      type: object
      properties:
        triggered:
          type: boolean
          description: Был ли монитор успешно запущен
      required:
        - triggered
      additionalProperties: false
    ListSearchMonitorRunsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SearchMonitorRun"
          description: Список запусков
        hasMore:
          type: boolean
          description: Есть ли дополнительные результаты
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
          description: Курсор для следующей страницы
      required:
        - data
        - hasMore
      additionalProperties: false
    SearchMonitorRun:
      type: object
      properties:
        id:
          type: string
          description: Уникальный идентификатор запуска
        monitorId:
          type: string
          description: Монитор, к которому относится этот запуск
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
            - cancelled
          description: Статус запуска
        output:
          anyOf:
            - $ref: "#/components/schemas/SearchMonitorRunOutput"
            - type: "null"
          description: Результат запуска. Null до завершения запуска.
        failReason:
          anyOf:
            - type: string
              enum:
                - api_key_invalid
                - insufficient_credits
                - invalid_params
                - rate_limited
                - source_not_available
                - forbidden
                - search_unavailable
                - search_failed
                - internal_error
            - type: "null"
          description: Причина сбоя запуска. Null, если статус не `failed`.
            `source_not_available` означает, что поиск запросил домен, который
            Exa не может вернуть (удалите его из поиска), а `forbidden`
            означает, что запрос не был разрешён по иной причине.
        startedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Время начала выполнения запуска
          format: date-time
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Время успешного завершения запуска
          format: date-time
        failedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Время сбоя запуска
          format: date-time
        cancelledAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Время отмены запуска
          format: date-time
        durationMs:
          anyOf:
            - type: integer
            - type: "null"
          description: Общее время выполнения в миллисекундах
        createdAt:
          type: string
          format: date-time
          description: Время создания запуска
        updatedAt:
          type: string
          format: date-time
          description: Время последнего обновления запуска
      required:
        - id
        - monitorId
        - status
        - output
        - failReason
        - startedAt
        - completedAt
        - failedAt
        - cancelledAt
        - durationMs
        - createdAt
        - updatedAt
      additionalProperties: false
    SearchMonitorRunOutput:
      type: object
      properties:
        results:
          anyOf:
            - type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
            - type: "null"
          description: Результаты поиска
        content:
          description: Синтезированное содержимое на основе результатов поиска. Структура
            зависит от `outputSchema.type`.
          oneOf:
            - $ref: "#/components/schemas/JsonValue"
            - type: "null"
        grounding:
          anyOf:
            - type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: Поле вывода, к которому относится эта ссылка на источник
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          format: uri
                          description: URL источника.
                        title:
                          type: string
                          description: Название источника.
                      required:
                        - url
                        - title
                      additionalProperties: false
                  confidence:
                    type: string
                    enum:
                      - low
                      - medium
                      - high
                    description: Оценка моделью достоверности этого поля.
                required:
                  - field
                  - citations
                  - confidence
                additionalProperties: false
            - type: "null"
          description: Ссылки на источники для отдельных полей с уровнем достоверности
      additionalProperties: false
    AgentRun:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/AgentRunId"
        object:
          type: string
          const: agent_run
        status:
          $ref: "#/components/schemas/AgentRunStatus"
        stopReason:
          anyOf:
            - $ref: "#/components/schemas/AgentStopReason"
            - type: "null"
          description: Причина остановки запуска. `null`, пока запуск находится в очереди
            или выполняется.
        createdAt:
          type: string
          format: date-time
          description: Время создания запуска
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          format: date-time
        request:
          anyOf:
            - $ref: "#/components/schemas/AgentRunRequest"
            - type: "null"
        output:
          $ref: "#/components/schemas/AgentRunOutput"
        usage:
          $ref: "#/components/schemas/AgentUsage"
        costDollars:
          $ref: "#/components/schemas/AgentCostDollars"
      required:
        - id
        - object
        - status
        - stopReason
        - createdAt
        - completedAt
        - request
        - output
        - usage
        - costDollars
      additionalProperties: false
    AgentRunStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
        - cancelled
    AgentStopReason:
      type: string
      enum:
        - schema_satisfied
        - budget_reached
        - stopped
        - error
        - cancelled
    AgentRunRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Вопрос или инструкции для запроса на естественном языке.
          example: What are the most important AI infrastructure funding rounds announced
            this week?
        systemPrompt:
          type: string
          description: Дополнительные инструкции, определяющие генерируемый результат или
            поведение агента. Используйте их для указания предпочтений по
            источникам, ограничений на новизну, дублирование или других
            требований к поведению.
          example: Prefer official sources and avoid duplicate results.
        effort:
          $ref: "#/components/schemas/AgentEffort"
        input:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Запись в виде объекта JSON.
              description: Записи, которые агент должен обработать или обогатить.
            exclusion:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Запись в виде объекта JSON.
              description: Записи или сущности, которые агент не должен возвращать.
          additionalProperties: false
        outputSchema:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: JSON Schema для проверяемого структурированного вывода в
                `output.structured`. Поля, не подтверждённые доказательствами,
                могут возвращаться как `null`. Поддерживаются draft-07, 2019-09
                и 2020-12 через `$schema`.
            - type: "null"
        previousRunId:
          $ref: "#/components/schemas/AgentRunId"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Метаданные типа «ключ — значение», предоставленные вызывающей
            стороной для собственного отслеживания.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        dataSources:
          type: array
          items:
            $ref: "#/components/schemas/AgentDataSourceOutput"
          description: Поставщики данных Exa Connect, настроенные для этого запуска.
        budget:
          $ref: "#/components/schemas/AgentBudgetOutput"
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
      description: Канонизированные поля запроса, сохранённые вместе с запуском.
    AgentRunOutput:
      type: object
      properties:
        text:
          type: string
          description: Ответ или сводка на естественном языке.
        structured:
          anyOf:
            - $ref: "#/components/schemas/JsonValue"
            - type: "null"
          description: JSON, сформированный в соответствии с `outputSchema`; поля, не
            подтверждённые данными, могут иметь значение `null`. `null`, если
            схема не задана.
        grounding:
          type: array
          items:
            $ref: "#/components/schemas/AgentGrounding"
          description: Цитаты для отдельных полей, сформированные в ходе запуска.
      required:
        - text
        - structured
        - grounding
      additionalProperties: false
    AgentGrounding:
      type: object
      properties:
        field:
          type: string
          description: Поле вывода, подтверждаемое цитатами.
          example: structured.companies[0].sourceUrl
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AgentCitation"
        confidence:
          anyOf:
            - type: string
              enum:
                - low
                - medium
                - high
              description: Оценка надёжности этого поля, предоставленная моделью.
            - type: "null"
      required:
        - field
        - citations
      additionalProperties: false
    AgentCitation:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL источника.
        title:
          type: string
          description: Заголовок источника.
      required:
        - url
      additionalProperties: false
    AgentUsage:
      type: object
      properties:
        agentComputeUnits:
          type: number
          minimum: 0
        searches:
          type: integer
          minimum: 0
        emails:
          type: integer
          minimum: 0
        phoneNumbers:
          type: integer
          minimum: 0
        dataSources:
          $ref: "#/components/schemas/AgentDataSourceUsage"
      required:
        - agentComputeUnits
        - searches
        - emails
        - phoneNumbers
      additionalProperties: false
    AgentDataSourceUsage:
      type: object
      propertyNames:
        type: string
      additionalProperties:
        type: integer
        minimum: 0
      description: Количество вызовов инструментов для каждого поставщика данных Exa
        Connect, использованного в ходе запуска. Ключи — имена поставщиков
        (например, `fiber`, `similarweb`). Включаются только поставщики с
        ненулевым использованием.
    AgentCostDollars:
      type: object
      properties:
        total:
          type: number
          minimum: 0
        agentCompute:
          type: number
          minimum: 0
        search:
          type: number
          minimum: 0
        emails:
          type: number
          minimum: 0
        phoneNumbers:
          type: number
          minimum: 0
        dataSources:
          $ref: "#/components/schemas/AgentDataSourceCost"
      required:
        - total
        - agentCompute
        - search
        - emails
        - phoneNumbers
      additionalProperties: false
    AgentDataSourceCost:
      type: object
      propertyNames:
        type: string
      additionalProperties:
        type: number
        minimum: 0
      description: Стоимость в долларах для каждого поставщика данных Exa Connect,
        использованного в ходе запуска. Ключи — имена поставщиков (например,
        `fiber`, `similarweb`). Включаются только поставщики с ненулевым
        использованием.
    AgentErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/AgentError"
      required:
        - error
      additionalProperties: false
    AgentError:
      type: object
      properties:
        type:
          type: string
          enum:
            - INVALID_REQUEST
            - AUTHENTICATION_ERROR
            - RATE_LIMIT_ERROR
            - NOT_FOUND
            - SERVER_ERROR
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - TEAM_NOT_FOUND
            - RUN_NOT_FOUND
            - PREVIOUS_RUN_NOT_FOUND
            - PREVIOUS_RUN_NOT_COMPLETED
            - CONCURRENCY_LIMIT_REACHED
            - INVALID_OUTPUT_SCHEMA
            - INVALID_DATA_SOURCE
            - TIMEOUT
            - SERVER_ERROR
        message:
          type: string
      required:
        - type
        - code
        - message
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    AgentRunList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
        hasMore:
          type: boolean
          description: Есть ли ещё результаты
        nextCursor:
          anyOf:
            - $ref: "#/components/schemas/AgentRunId"
            - type: "null"
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    DeleteAgentRunResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/AgentRunId"
        object:
          type: string
          const: agent_run.deleted
        deleted:
          type: boolean
          const: true
      required:
        - id
        - object
        - deleted
      additionalProperties: false
    AgentRunEventList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentRunEvent"
        hasMore:
          type: boolean
          description: Есть ли ещё результаты
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    Batch:
      type: object
      properties:
        id:
          type: string
          description: Идентификатор пакета. Новым идентификаторам пакетов присваивается
            префикс `batch_`.
          example: batch_01j7x9v0m2n4p6q8r0s2t4v6w8
        object:
          type: string
          const: batch
          description: "Тип объекта: всегда `batch`."
        status:
          $ref: "#/components/schemas/BatchStatus"
        requestCounts:
          $ref: "#/components/schemas/BatchRequestCounts"
        createdAt:
          type: string
          format: date-time
          description: Время создания пакета.
        expiresAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Время истечения срока действия пакета или `null`, если срок
            действия не ограничен.
          format: date-time
        endedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Время перехода пакета в конечный статус или `null`, пока он ещё
            выполняется.
          format: date-time
        resultsUrl:
          anyOf:
            - type: string
            - type: "null"
          description: Кратковременно действующий предварительно подписанный URL для
            скачивания файла результатов пакета (JSONL) или `null` до завершения
            пакета. Это прямая ссылка для скачивания из объектного хранилища, а
            не маршрут API; используйте её как есть и повторно запросите пакет,
            чтобы получить новый URL после истечения срока действия текущего.
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Метаданные в формате «ключ — значение», предоставленные вызывающей
            стороной для собственного отслеживания.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
      required:
        - id
        - object
        - status
        - requestCounts
        - createdAt
        - expiresAt
        - endedAt
        - resultsUrl
        - metadata
      additionalProperties: false
    BatchStatus:
      type: string
      enum:
        - in_progress
        - completed
        - cancelling
        - cancelled
        - expired
      description: Статус жизненного цикла пакета.
    BatchRequestCounts:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
          description: Общее количество запросов в пакете.
        completed:
          type: integer
          minimum: 0
          description: Успешно завершённые запросы.
        failed:
          type: integer
          minimum: 0
          description: Запросы, завершившиеся ошибкой.
      required:
        - total
        - completed
        - failed
      additionalProperties: false
    BatchList:
      type: object
      properties:
        object:
          type: string
          const: list
          description: "Тип объекта: всегда `list`."
        data:
          type: array
          items:
            $ref: "#/components/schemas/Batch"
          description: Страница пакетов, от новых к старым.
        hasMore:
          type: boolean
          description: Есть ли ещё результаты
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
          description: Курсор для следующей страницы
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    DeletedBatch:
      type: object
      properties:
        id:
          type: string
          description: Идентификатор удалённого пакета.
        object:
          type: string
          const: batch.deleted
          description: "Тип объекта: всегда `batch.deleted`."
        deleted:
          type: boolean
          const: true
          description: При успешном удалении всегда `true`.
      required:
        - id
        - object
        - deleted
      additionalProperties: false
    WebsetsTeamInfo:
      type: object
      properties:
        object:
          type: string
          const: team
          description: 'Тип объекта: всегда `"team"`.'
        id:
          type: string
          description: Уникальный идентификатор команды.
        name:
          type: string
          description: Название команды.
        concurrency:
          type: object
          properties:
            active:
              type: integer
              description: Количество запросов, обрабатываемых в данный момент.
            queued:
              type: integer
              description: Количество запросов, находящихся в очереди.
          required:
            - active
            - queued
          additionalProperties: false
          description: Текущее использование параллелизма.
        limits:
          type: object
          properties:
            maxConcurrent:
              anyOf:
                - type: integer
                - type: "null"
              description: Максимально допустимое количество одновременных запросов. `null`
                означает отсутствие ограничений.
            maxQueued:
              anyOf:
                - type: integer
                - type: "null"
              description: Максимально допустимое количество запросов в очереди. `null`
                означает отсутствие ограничений.
          required:
            - maxConcurrent
            - maxQueued
          additionalProperties: false
          description: Лимиты параллелизма команды.
      required:
        - object
        - id
        - name
        - concurrency
        - limits
      additionalProperties: false
    AnswerStreamChunk:
      description: "Схема для каждой JSON-нагрузки, отправляемой в потоке SSE
        `/answer`. Каждое событие отправляется как `data: <json>`."
      oneOf:
        - $ref: "#/components/schemas/AnswerStreamTextDeltaChunk"
        - $ref: "#/components/schemas/AnswerStreamCitationsChunkOutput"
        - $ref: "#/components/schemas/AnswerStreamCostChunkOutput"
        - $ref: "#/components/schemas/AnswerStreamErrorChunkOutput"
    SearchStreamChunk:
      oneOf:
        - $ref: "#/components/schemas/SearchStreamTextDeltaChunkOutput"
        - $ref: "#/components/schemas/SearchStreamGroundingChunkOutput"
        - $ref: "#/components/schemas/SearchStreamResultsChunkOutput"
        - $ref: "#/components/schemas/SearchStreamResetChunkOutput"
        - $ref: "#/components/schemas/SearchStreamDoneChunkOutput"
        - $ref: "#/components/schemas/SearchStreamErrorChunkOutput"
      description: "Схема для каждой JSON-нагрузки, отправляемой в потоке SSE
        `/search`. Каждое событие отправляется как `data: <json>`, а поток
        завершается `data: [DONE]`, что не описывается этой JSON-схемой."
      type: object
      discriminator:
        propertyName: type
        mapping:
          text-delta: "#/components/schemas/SearchStreamTextDeltaChunkOutput"
          grounding: "#/components/schemas/SearchStreamGroundingChunkOutput"
          results: "#/components/schemas/SearchStreamResultsChunkOutput"
          stream-reset: "#/components/schemas/SearchStreamResetChunkOutput"
          done: "#/components/schemas/SearchStreamDoneChunkOutput"
          error: "#/components/schemas/SearchStreamErrorChunkOutput"
    AgentRunEvent:
      type: object
      properties:
        id:
          type: string
          description: Идентификатор события в рамках запуска.
        event:
          type: string
          enum:
            - agent_run.created
            - agent_run.started
            - agent_run.completed
            - agent_run.failed
            - agent_run.cancelled
        data:
          $ref: "#/components/schemas/JsonValue"
        createdAt:
          type: string
          format: date-time
          description: Время создания события
      required:
        - id
        - event
        - data
        - createdAt
      additionalProperties: false
    SearchResultOutput:
      type: object
      properties:
        title:
          type: string
          description: Заголовок результата поиска.
          example: A Comprehensive Overview of Large Language Models
        url:
          type: string
          description: URL результата поиска.
          example: https://arxiv.org/pdf/2307.06435.pdf
          format: uri
        publishedDate:
          description: "Оценочная дата создания, определённая при разборе
            HTML-содержимого. Формат: YYYY-MM-DD."
          example: 2023-11-16T01:36:32.547Z
          format: date-time
          type: string
        author:
          description: Автор содержимого, если доступен.
          example: Humza Naveed
          anyOf:
            - type: string
            - type: "null"
        id:
          description: Временный идентификатор документа. Полезен для конечной точки
            /contents.
          example: https://arxiv.org/abs/2307.06435
          type: string
        image:
