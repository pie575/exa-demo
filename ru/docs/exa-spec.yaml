          description: Запрошенный мягкий лимит на количество подходящих людей, работающих
            в одной компании, или null, если лимит не запрашивался.
          nullable: true
        behavior:
          default: override
          description: >-
            Поведение поиска при его добавлении в Webset.


            - `override`: поиск заменит существующие Items в Webset и оценит их
            по новым criteria. Items, не соответствующие новым criteria, будут
            отброшены.

            - `append`: поиск добавит новые найденные Items в существующий
            Webset. Items, не соответствующие новым criteria, будут отброшены.
          $ref: "#/components/schemas/WebsetSearchBehavior"
