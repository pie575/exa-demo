          description: Модель, используемая для генерации ответа.
          default: exa
          type: string
          enum:
            - exa
            - exa-pro
            - exa-research
            - exa-fast
        systemPrompt:
          type: string
          description: Дополнительные инструкции, определяющие генерируемый вывод или
            поведение агента. Используйте их для задания предпочтительных
            источников, ограничений на новизну, дублирование или других указаний
            по поведению.
          example: Prefer official sources and avoid duplicate results.
        userLocation:
          anyOf:
            - type: string
              description: Двухбуквенный код страны пользователя по ISO, например US.
              example: US
            - type: "null"
        outputSchema:
          type: object
          properties:
            type:
              type: string
              description: Корневой тип схемы (обычно "object").
              example: object
            properties:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: Объект, в котором каждый ключ — имя свойства, а каждое значение —
                JSON Schema, описывающая это свойство (с `type`, `description` и
                т. д.).
            required:
              type: array
              items:
                type: string
              description: Список имён обязательных свойств.
            description:
              type: string
              description: Описание схемы.
            additionalProperties:
              type: boolean
              description: Разрешать ли свойства, не перечисленные в `properties`.
              default: false
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: Спецификация [JSON Schema Draft
            7](https://json-schema.org/draft-07) для требуемой структуры ответа.
            Если она указана, ответ возвращается как структурированный объект,
            соответствующий схеме, а не как обычная строка.
      required:
        - query
    FindSimilarRequest:
      type: object
      properties:
        includeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: Список доменов или путей на доменах, которые нужно включить в
                поиск. Каждая запись может быть именем хоста (например,
                `example.com`), именем хоста с префиксом пути (например,
                `example.com/docs`) или поддоменом с подстановочным знаком
                (например, `*.example.com`). Если параметр указан, результаты
                будут получены только из соответствующих доменов или путей.
                Используйте этот параметр для фильтрации по домену или пути
                вместо добавления оператора `site:` в запрос.
              example:
                - arxiv.org
                - exa.ai/blog
            - type: "null"
        excludeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: Список доменов или путей на доменах, которые нужно исключить из
                результатов поиска. Каждая запись может быть именем хоста
                (например, `example.com`), именем хоста с префиксом пути
                (например, `example.com/docs`) или поддоменом с подстановочным
                знаком (например, `*.example.com`). Если параметр указан,
                результаты из соответствующих доменов или путей не будут
                возвращаться. Используйте этот параметр для фильтрации по домену
                или пути вместо добавления оператора `site:` в запрос.
              example:
                - docs.python.org/3
            - type: "null"
        startCrawlDate:
          anyOf:
            - type: string
              description: Устарело и не имеет эффекта; игнорируется API. Должно быть указано
                в формате ISO 8601.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        endCrawlDate:
          anyOf:
            - type: string
              description: Устарело и не имеет эффекта; игнорируется API. Должно быть указано
                в формате ISO 8601.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        startPublishedDate:
          anyOf:
            - type: string
              description: Будут возвращены только ссылки с датой публикации позднее указанной
                даты. Должно быть указано в формате ISO 8601.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
            - type: "null"
        endPublishedDate:
          anyOf:
            - type: string
              description: Будут возвращены только ссылки с датой публикации ранее указанной
                даты. Должно быть указано в формате ISO 8601.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
            - type: "null"
        numResults:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 100
              description: Количество возвращаемых результатов. Лимиты зависят от типа поиска.
                Максимальный публичный лимит — 100 результатов. Чтобы обсудить
                более высокие лимиты, свяжитесь с отделом продаж (hello@exa.ai).
              example: 10
              default: 10
            - type: "null"
        contents:
          anyOf:
            - description: Параметры содержимого для текста, highlights, summary,
                дополнительных данных и управления свежестью.
              $ref: "#/components/schemas/ContentsOptions"
            - type: "null"
        url:
          type: string
          minLength: 3
          description: URL, для которого нужно найти похожие ссылки.
          example: https://arxiv.org/abs/2307.06435
        category:
          anyOf:
            - type: string
              enum:
                - company
                - publication
                - news
                - personal site
                - financial report
                - people
              description: "Категория данных, на которой следует сосредоточиться. Известные
                категории: `company`, `publication`, `news`, `personal site`,
                `financial report` и `people`. Также допускаются другие строки,
                которые используются как подсказки категории для поиска.
                Категории `people` и `company` обеспечивают более высокое
                качество поиска профилей людей и страниц компаний. Категория
                `publication` возвращает научные публикации, например научные
                статьи, препринты и журнальные статьи, со структурированными
                метаданными об авторах, издании и цитированиях. Примечание:
                категории `company` и `people` поддерживают только ограниченный
                набор фильтров. Для этих категорий НЕ поддерживаются следующие
                параметры: `startPublishedDate`, `endPublishedDate`,
                `excludeDomains`. Использование неподдерживаемых параметров
                приведёт к ошибке 400."
              example: publication
            - type: "null"
        excludeSourceDomain:
          anyOf:
            - type: boolean
              description: Если true, исключаются результаты с того же домена, что и исходный
                URL.
              example: true
            - type: "null"
      required:
        - url
    CreateSearchMonitorParameters:
