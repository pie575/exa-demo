                просканированных страниц может быть ограничено системными
                ограничениями.
              example: 1
              default: 0
            - type: "null"
        subpageTarget:
          anyOf:
            - description: Термин для поиска конкретных подстраниц среди результатов поиска.
                Может быть одной строкой или массивом строк.
              example: sources
              oneOf:
                - type: string
                  minLength: 1
                  maxLength: 100
                - minItems: 0
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
            - type: "null"
      description: Укажите либо `ids`, либо `urls`, но не оба параметра.
      oneOf:
        - required:
            - ids
        - required:
            - urls
    AnswerRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Вопрос или инструкции на естественном языке для запроса.
          example: What is the latest valuation of SpaceX?
        stream:
          type: boolean
          description: Если true, ответ возвращается в виде потока серверных событий (SSE).
          default: false
        text:
          type: boolean
          title: Simple text retrieval
          description: Если true, возвращает полный текст страницы с настройками по
            умолчанию. Если false, отключает возврат текста.
          default: false
        model:
          description: Модель, используемая для генерации ответа.
          default: exa
          type: string
          enum:
            - exa
            - exa-pro
            - exa-research
            - exa-fast
        systemPrompt:
          type: string
          description: Дополнительные инструкции, определяющие генерируемый вывод или
            поведение агента. Используйте их для задания предпочтений по
            источникам, ограничений на новизну, ограничений на дублирование или
            других указаний по поведению.
          example: Prefer official sources and avoid duplicate results.
        userLocation:
          anyOf:
            - type: string
              description: Двухбуквенный код страны пользователя по ISO, например US.
              example: US
            - type: "null"
        outputSchema:
          type: object
          properties:
            type:
              type: string
              description: Корневой тип схемы (обычно "object").
              example: object
            properties:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: Объект, где каждый ключ — имя свойства, а каждое значение — JSON
                Schema, описывающая это свойство (с `type`, `description` и т.
                д.).
            required:
              type: array
              items:
                type: string
              description: Список имён обязательных свойств.
            description:
              type: string
              description: Описание схемы.
            additionalProperties:
              type: boolean
              description: Разрешать ли свойства, не перечисленные в `properties`.
              default: false
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: Спецификация [JSON Schema Draft
            7](https://json-schema.org/draft-07) для требуемой структуры ответа.
            Если указана, ответ возвращается как структурированный объект,
            соответствующий схеме, а не как обычная строка.
      required:
        - query
    FindSimilarRequest:
      type: object
      properties:
        includeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: Список доменов или путей доменов, включаемых в поиск. Каждая запись
                может быть именем хоста (например, `example.com`), именем хоста
                с префиксом пути (например, `example.com/docs`) или поддоменом с
                подстановочным знаком (например, `*.example.com`). Если указан,
                результаты будут поступать только из соответствующих доменов или
                путей. Используйте этот параметр для фильтрации по домену или
                пути вместо добавления оператора `site:` в запрос.
              example:
                - arxiv.org
                - exa.ai/blog
            - type: "null"
        excludeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: Список доменов или путей доменов, исключаемых из результатов
                поиска. Каждая запись может быть именем хоста (например,
                `example.com`), именем хоста с префиксом пути (например,
                `example.com/docs`) или поддоменом с подстановочным знаком
                (например, `*.example.com`). Если указан, результаты из
                соответствующих доменов или путей возвращаться не будут.
                Используйте этот параметр для фильтрации по домену или пути
                вместо добавления оператора `site:` в запрос.
              example:
                - docs.python.org/3
            - type: "null"
        startCrawlDate:
          anyOf:
            - type: string
              description: Устарело и не действует; игнорируется API. Должно быть указано в
                формате ISO 8601.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        endCrawlDate:
          anyOf:
            - type: string
              description: Устарело и не действует; игнорируется API. Должно быть указано в
                формате ISO 8601.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        startPublishedDate:
          anyOf:
            - type: string
              description: Будут возвращены только ссылки с датой публикации после указанной
                даты. Должно быть указано в формате ISO 8601.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
            - type: "null"
        endPublishedDate:
          anyOf:
            - type: string
              description: Будут возвращены только ссылки с датой публикации до указанной
                даты. Должно быть указано в формате ISO 8601.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
            - type: "null"
        numResults:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 100
              description: Количество возвращаемых результатов. Лимиты зависят от типа поиска.
                Максимальный публичный лимит — 100 результатов. Свяжитесь с
                отделом продаж (hello@exa.ai), чтобы обсудить более высокие
                лимиты.
              example: 10
              default: 10
            - type: "null"
        contents:
          anyOf:
            - description: Параметры содержимого для text, highlights, summary, extras и
                управления актуальностью.
              $ref: "#/components/schemas/ContentsOptions"
            - type: "null"
        url:
          type: string
          minLength: 3
          description: URL-адрес, для которого требуется найти похожие ссылки.
          example: https://arxiv.org/abs/2307.06435
        category:
          anyOf:
            - type: string
              enum:
                - company
                - publication
                - news
                - personal site
                - financial report
                - people
              description: "Категория данных, на которой следует сосредоточиться.
                Поддерживаемые категории: `company`, `publication`, `news`,
                `personal site`, `financial report` и `people`. Принимаются и
                другие строки, которые используются в качестве подсказок
                категории для поиска. Категории `people` и `company`
                обеспечивают более высокое качество при поиске профилей людей и
                страниц компаний. Категория `publication` позволяет находить
                научные публикации, например исследовательские статьи, препринты
                и статьи в журналах, со структурированными метаданными, включая
                авторов, издание и цитирования. Примечание: категории `company`
                и `people` поддерживают только ограниченный набор фильтров. Для
                этих категорий НЕ поддерживаются следующие параметры:
                `startPublishedDate`, `endPublishedDate`, `excludeDomains`.
                Использование неподдерживаемых параметров приведёт к ошибке
                400."
              example: publication
            - type: "null"
        excludeSourceDomain:
          anyOf:
            - type: boolean
              description: Если true, исключаются результаты с того же домена, что и исходный
                URL.
              example: true
            - type: "null"
      required:
        - url
    CreateSearchMonitorParameters:
      type: object
      properties:
        name:
          type: string
          description: Необязательное имя монитора
        search:
          $ref: "#/components/schemas/SearchMonitorSearch"
        trigger:
          $ref: "#/components/schemas/SearchMonitorTrigger"
        outputSchema:
          $ref: "#/components/schemas/SearchMonitorOutputSchema"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Необязательные метаданные в формате «ключ — значение». Они
            включаются в доставки вебхука, чтобы вы могли направлять обновления
            в такие системы, как Slack.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        webhook:
          $ref: "#/components/schemas/SearchMonitorWebhook"
      required:
        - search
        - webhook
    SearchMonitorSearch:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Строка запроса для поиска.
          example: Latest developments in LLM capabilities
        numResults:
          type: integer
          minimum: 1
          maximum: 100
          description: Количество возвращаемых результатов. Лимиты зависят от типа поиска.
            Максимальный публичный лимит — 100 результатов. Чтобы обсудить более
            высокие лимиты, свяжитесь с отделом продаж (hello@exa.ai).
          example: 10
          default: 10
        includeDomains:
          description: Ограничить результаты поиска указанными доменами.
          type: array
          items:
            type: string
        excludeDomains:
          description: Исключить указанные домены из результатов поиска.
          type: array
          items:
            type: string
        contents:
          $ref: "#/components/schemas/SearchMonitorContents"
      required:
        - query
    SearchMonitorContents:
      type: object
      properties:
        text:
          description: Параметры извлечения текста для каждого результата.
          oneOf:
            - type: boolean
              title: Simple text retrieval
              description: Если true, возвращает полный текст страницы с настройками по
                умолчанию. Если false, отключает возврат текста.
              default: false
            - type: object
              properties:
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: Максимальное количество символов для полного текста страницы.
                        Полезно для управления размером ответа и расходами на
                        API. Максимальное поддерживаемое значение — 10000.
                      example: 1000
                    - type: "null"
                includeHtmlTags:
                  anyOf:
                    - type: boolean
                      description: "Если true, возвращает текст с упрощёнными HTML-тегами вместо
                        обычного текста в стиле Markdown. Используйте
                        maxAgeHours: 0, если нужно применить этот параметр к
                        только что полученному содержимому."
                      example: false
                      default: false
                    - type: "null"
                verbosity:
                  anyOf:
                    - type: string
                      enum:
                        - compact
                        - standard
                        - full
                      description: "Управляет степенью детализации текста. compact фокусируется на
                        основном содержимом, standard включает больше
                        окружающего контекста страницы, а full запрашивает
                        наиболее полный обработанный текст. Для некоторых
                        страниц вывод standard и full может совпадать.
                        Используйте maxAgeHours: 0, если нужно применить этот
                        параметр к только что полученному содержимому."
                      example: standard
                      default: compact
                    - type: "null"
                includeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "По возможности включать только содержимое, отнесённое к указанным
                        семантическим разделам страницы. Классификация разделов
                        может быть недоступна или неполной для некоторых
                        страниц; если требуется строгая фильтрация, проверяйте
                        результат. Используйте maxAgeHours: 0, если нужно
                        применить этот параметр к только что полученному
                        содержимому."
                      example:
                        - body
                        - header
                    - type: "null"
                excludeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "Исключить содержимое, отнесённое к указанным семантическим
                        разделам страницы. Классификация разделов выполняется по
                        возможности. Используйте maxAgeHours: 0, если нужно
                        применить этот параметр к только что полученному
                        содержимому."
                      example:
                        - navigation
                        - footer
                        - sidebar
                    - type: "null"
              title: Advanced text options
              description: Расширенные параметры управления извлечением текста. Используйте
                их, если нужно ограничить длину текста или включить
                HTML-структуру.
        highlights:
          description: Текстовые фрагменты, которые LLM определяет как наиболее
            релевантные на каждой странице.
          oneOf:
            - type: boolean
              title: Simple highlights retrieval
              description: Если true, возвращает выделенные фрагменты с настройками по
                умолчанию. Если false, отключает возврат выделенных фрагментов.
              default: false
            - type: object
              properties:
                query:
                  anyOf:
                    - type: string
                      description: Пользовательский запрос, который определяет, какие выделенные
                        фрагменты выбирает LLM.
                      example: Key advancements
                    - type: "null"
                verbosity:
                  anyOf:
                    - type: string
                      enum:
                        - low
                        - medium
                        - high
                      description: "Предустановленная длина выделенных фрагментов: `low`, `medium` и
                        `high` выделяют всё больший бюджет токенов для
                        возвращаемых фрагментов. При использовании
                        highlights.dynamic предустановка задаёт единый общий
                        бюджет для всего набора результатов, а не бюджет для
                        каждого URL. Точные бюджеты настраиваются Exa и могут
                        изменяться. Несовместимо с maxCharacters и numSentences.
                        Бета: требуется заголовок запроса `Exa-Beta:
                        dynamic-highlights-2026-08-28`; запросы, задающие
                        `verbosity` без него, отклоняются."
                      example: medium
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                dynamic:
                  anyOf:
                    - type: boolean
                      description: "Включить Dynamic Highlights (исследовательская предварительная
                        версия): учитывает все результаты вместе и выделяет
                        единый общий бюджет контекста для всего набора
                        результатов вместо бюджета для каждого документа.
                        Несовместимо с maxCharacters. Бета: требуется заголовок
                        запроса `Exa-Beta: dynamic-highlights-2026-08-28`;
                        запросы, задающие `dynamic` без него, отклоняются."
                      example: true
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: Максимальное количество символов, возвращаемых для выделенных
                        фрагментов. Управляет общей длиной текста выделенных
                        фрагментов, возвращаемых для каждого URL. Максимальное
                        поддерживаемое значение — 10000. Несовместимо с
                        highlights.dynamic.
                      example: 2000
                    - type: "null"
                numSentences:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "Устарело и будет удалено в будущем выпуске. Сейчас сопоставляется
                        с бюджетом примерно 1333 символа на предложение.
                        Передайте highlights: true для выделенных фрагментов по
                        умолчанию или { query }, чтобы направлять отбор с
                        помощью собственного запроса."
                      example: 1
                      deprecated: true
                    - type: "null"
                highlightsPerUrl:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "Устарело и будет удалено в будущем выпуске. Сейчас игнорируется.
                        Передайте highlights: true для выделенных фрагментов по
                        умолчанию или { query }, чтобы направлять отбор с
                        помощью собственного запроса."
                      example: 1
                      deprecated: true
                    - type: "null"
              title: Advanced highlights options
              description: "Расширенные параметры управления извлечением выделенных
                фрагментов. Передайте highlights: true, чтобы использовать
                высококачественные настройки по умолчанию; указывайте этот
                объект, только если хотите направлять отбор с помощью
                собственного запроса."
        summary:
          description: Вернуть сводку, созданную LLM. Передайте `true` для настроек по
            умолчанию или объект с `query` и `maxTokens`.
          oneOf:
            - type: boolean
            - $ref: "#/components/schemas/SummaryWithMaxTokensOptions"
        extras:
          type: object
          properties:
            links:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Количество URL-адресов, возвращаемых с каждой веб-страницы.
                  example: 1
                  default: 0
                - type: "null"
            imageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Количество изображений, возвращаемых для каждого результата.
                  example: 1
                  default: 0
                - type: "null"
            richImageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Количество расширенных ссылок на изображения, возвращаемых для
                    каждого результата.
                  default: 0
                - type: "null"
            richLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Количество расширенных ссылок, возвращаемых для каждого результата.
                  default: 0
                - type: "null"
            codeBlocks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Количество блоков кода, возвращаемых для каждого результата.
                  default: 0
                - type: "null"
          description: Дополнительные параметры для передачи.
        context:
          description: "Устарело: используйте highlights или text. Возвращает содержимое
            страницы в виде единой строки контекста."
          deprecated: true
          oneOf:
            - type: boolean
              description: "Устарело: используйте highlights или text. Возвращает содержимое
                страницы в виде единой строки контекста."
              example: true
              deprecated: true
            - type: object
              properties:
                maxCharacters:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: Устарело. Максимальное количество символов для строки контекста.
                    Максимальное поддерживаемое значение — 10000.
                  example: 10000
              description: "Устарело: используйте highlights или text. Возвращает содержимое
                страницы в виде единой строки контекста."
              deprecated: true
        livecrawl:
          description: Стратегия сканирования для получения содержимого страницы
          oneOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
            - type: string
              const: auto
        livecrawlTimeout:
          type: integer
          exclusiveMinimum: 0
          maximum: 90000
          description: Тайм-аут livecrawling в миллисекундах.
          example: 1000
          default: 10000
        maxAgeHours:
          type: integer
          minimum: -1
          maximum: 720
          description: Максимальный срок хранения кэшированного содержимого в часах. При
            положительных значениях используется кэшированное содержимое, если
            оно моложе указанного числа часов; 0 получает актуальное содержимое
            и является поддерживаемым способом применить параметры рендеринга
            текста к заново полученным страницам; -1 всегда использует кэш; при
            отсутствии значения выполняется резервное получение, если
            кэшированное содержимое недоступно. Максимально поддерживаемое
            значение — 720 часов.
          example: 24
        filterEmptyResults:
          type: boolean
          description: Исключить результаты без содержимого
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: Количество подстраниц для сканирования. Фактическое количество
            просканированных страниц может быть ограничено системными
            ограничениями.
          example: 1
          default: 0
        subpageTarget:
          description: Термин для поиска определённых подстраниц среди результатов поиска.
            Может быть строкой или массивом строк.
          example: sources
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
      description: Параметры извлечения содержимого, применяемые к каждому результату
        поиска. Все поля необязательны.
    SummaryWithMaxTokensOptions:
      type: object
      properties:
        query:
          anyOf:
            - type: string
              description: Пользовательский запрос для сводки, сгенерированной LLM.
              example: Main developments
            - type: "null"
        maxTokens:
          type: integer
          minimum: 1
          description: Максимальное количество токенов для сгенерированной сводки.
    SearchMonitorTrigger:
      type: object
      properties:
        type:
          type: string
          const: interval
          description: Тип триггера. Сейчас поддерживается только `interval`.
          default: interval
        period:
          type: string
          description: Строка длительности, определяющая частоту запуска монитора
            (например, "1h", "6h", "1d", "7d"). Допускается только одна единица
            времени. Минимальный интервал — 1 час. Расписание привязано ко
            времени создания монитора (например, ежедневный монитор, созданный в
            14:30, будет запускаться ежедневно примерно в 14:30).
          example: 6h
      required:
        - type
        - period
    SearchMonitorOutputSchema:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaText"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: JSON-схема для синтезированного вывода. Поддерживаемые корневые
            типы — "text" и "object". Если она указана, ответ включает объект
            вывода, содержимое которого соответствует этой схеме. Работает со
            всеми типами поиска и добавляет около 2 секунд задержки на синтез
            помимо задержки выбранного типа поиска.
          type: object
          discriminator:
            propertyName: type
            mapping:
              text: "#/components/schemas/OutputSchemaText"
              object: "#/components/schemas/OutputSchemaObject"
        - type: "null"
      description: 'Определяет формат вывода запуска. Если значение не указано, по
        умолчанию используется `{ "type": "text" }`. Если `type` имеет значение
        `"text"`, вывод представляет собой текстовую сводку. Если `type` имеет
        значение `"object"`, вывод представляет собой структурированный JSON.
        Если для типа `"object"` не указаны `properties`, схема определяется
        автоматически; в противном случае вывод соответствует предоставленной
        схеме.'
    SearchMonitorWebhook:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: HTTPS URL для получения событий вебхука. Не должен указывать на
            localhost или диапазоны частных IP-адресов.
        events:
          type: array
          items:
            type: string
            enum:
              - monitor.created
              - monitor.updated
              - monitor.deleted
              - monitor.run.created
              - monitor.run.completed
          description: События, на которые следует подписаться. Если не указано, по
            умолчанию используются все события.
      required:
        - url
    BatchMonitorsRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - delete
            - pause
            - unpause
          description: Действие для подходящих мониторов. `delete` безвозвратно удаляет
            их, `pause` устанавливает статус `paused`, а `unpause` — статус
            `active`.
        filter:
          type: object
          properties:
            name:
              type: string
              maxLength: 250
              description: Фильтровать по имени (поиск подстроки без учёта регистра)
            status:
              type: string
              enum:
                - active
                - paused
                - disabled
              description: Фильтровать по статусу монитора
            metadata:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
                maxLength: 1000
              description: Фильтровать по парам «ключ — значение» метаданных (точное
                совпадение, логическое И)
          description: Необходимо указать хотя бы одно поле фильтра, чтобы предотвратить
            случайные массовые операции.
        dry_run:
          type: boolean
          description: Если `true`, возвращает мониторы, которые были бы затронуты, без
            выполнения действия. По умолчанию — `true`.
          default: true
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: Максимальное количество мониторов для обработки в одном запросе. По
            умолчанию — 50, максимум — 500.
          default: 50
      required:
        - action
        - filter
    UpdateSearchMonitorParameters:
      type: object
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
          description: Обновить имя монитора
        status:
          type: string
          enum:
            - active
            - paused
          description: Обновить статус монитора (можно установить только `active` или
            `paused`)
        search:
          type: object
          properties:
            query:
              type: string
              minLength: 1
              description: Строка запроса для поиска.
              example: Latest developments in LLM capabilities
            numResults:
              type: integer
              minimum: 1
              maximum: 100
              description: Количество возвращаемых результатов. Лимиты зависят от типа поиска.
                Максимальный общедоступный лимит — 100 результатов. Чтобы
                обсудить более высокие лимиты, обратитесь в отдел продаж
                (hello@exa.ai).
              example: 10
              default: 10
            includeDomains:
              description: Ограничить результаты поиска указанными доменами.
              type: array
              items:
                type: string
            excludeDomains:
              description: Исключить указанные домены из результатов поиска.
              type: array
              items:
                type: string
            contents:
              $ref: "#/components/schemas/SearchMonitorContents"
          description: Частичные параметры поиска для объединения. При обновлении все поля
            необязательны.
        trigger:
          anyOf:
            - type: object
              properties:
                type:
                  type: string
                  const: interval
                  description: Тип триггера. Сейчас поддерживается только `interval`.
                  default: interval
                period:
                  type: string
                  description: Строка длительности, определяющая частоту запуска монитора
                    (например, "1h", "6h", "1d", "7d"). Допускается только одна
                    единица времени. Минимальный интервал — 1 час.
            - type: "null"
          description: Обновить расписание. Установите значение null, чтобы удалить
            расписание.
        outputSchema:
          $ref: "#/components/schemas/SearchMonitorOutputSchema"
        metadata:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
              description: Метаданные в виде пар «ключ — значение», предоставленные вызывающей
                стороной для собственного отслеживания.
              example:
                slack_channel_id: C123ABC
                slack_thread_id: "1745444400.123456"
                user_id: U123ABC
            - type: "null"
          description: Обновить метаданные. Установите значение null, чтобы удалить их.
            Метаданные включаются в доставки вебхука, поэтому вы можете
            направлять обновления в такие системы, как Slack.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        webhook:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: HTTPS URL для получения событий вебхука. Не должен указывать на
                localhost или диапазоны частных IP-адресов.
            events:
              type: array
              items:
                type: string
                enum:
                  - monitor.created
                  - monitor.updated
                  - monitor.deleted
                  - monitor.run.created
                  - monitor.run.completed
              description: События, на которые следует подписаться. Если не указано, по
                умолчанию используются все события.
          description: Частичные параметры вебхука для объединения. При обновлении все
            поля необязательны.
    CreateAgentRunRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Вопрос или инструкции для запроса на естественном языке.
          example: What are the most important AI infrastructure funding rounds announced
            this week?
        systemPrompt:
          type: string
          description: Дополнительные инструкции, определяющие генерируемый вывод или
            поведение агента. Используйте их, чтобы указать предпочтения по
            источникам, требования к новизне, ограничения на дублирование или
            другие требования к поведению.
          example: Prefer official sources and avoid duplicate results.
        effort:
          $ref: "#/components/schemas/AgentEffort"
        input:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Запись в виде объекта JSON.
              description: Записи, которые агент должен обработать или обогатить.
            exclusion:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Запись в виде объекта JSON.
              description: Записи или сущности, которые агент не должен возвращать.
          description: Записи для обработки, а также записи или сущности, которые следует
            исключить из ответа.
        outputSchema:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: JSON Schema для проверяемого структурированного вывода в
                `output.structured`. Поля, не подтверждённые данными, могут быть
                возвращены как `null`. Поддерживаются draft-07, 2019-09 и
                2020-12 через `$schema`.
            - type: "null"
        previousRunId:
          description: ID завершённого запуска, с которого следует продолжить. Должен
            принадлежать той же команде.
          $ref: "#/components/schemas/AgentRunId"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Метаданные, предоставленные вызывающей стороной и сохранённые
            вместе с запуском.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        dataSources:
          maxItems: 5
          type: array
          items:
            $ref: "#/components/schemas/AgentDataSource"
          description: Провайдеры данных Exa Connect, которые нужно включить для запуска.
            Каждая запись включает все инструменты соответствующего провайдера.
        budget:
          $ref: "#/components/schemas/AgentBudget"
      required:
        - query
    AgentEffort:
      type: string
      enum:
        - minimal
        - low
        - medium
        - high
        - xhigh
        - auto
        - max
      description: Предпочтение по стоимости и интенсивности рассуждений для запуска.
        `auto` позволяет Exa выбрать подходящую интенсивность. `max` — публичный
        бета-уровень с максимальной интенсивностью для задач, где полнота и
        тщательность важнее задержки или стоимости, включая создание больших
        списков, глубокие исследования по множеству источников и критерии,
        которые трудно проверить.
      default: auto
    AgentRunId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[A-Za-z0-9_.:-]+$
      description: ID запуска Agent. Новые ID запусков возвращаются с префиксом
        `agent_run_`.
      example: agent_run_01j7x9v0m2n4p6q8r0s2t4v6w8
    AgentDataSource:
      type: object
      properties:
        provider:
          description: Провайдер данных Exa Connect, который нужно включить для запуска.
            По умолчанию доступны все инструменты провайдера.
          example: fiber
          $ref: "#/components/schemas/AgentDataSourceProvider"
      required:
        - provider
    AgentDataSourceProvider:
      type: string
      enum:
        - fiber
        - financial_datasets
        - similarweb
        - baselayer
        - affiliate
        - particle
        - jinko
        - polymarket
      description: Идентификатор провайдера данных Exa Connect.
    AgentBudget:
      type: object
      properties:
        maxCostDollars:
          type: number
          description: Максимальная сумма в долларах США, которую может потратить этот
            запуск. Допускаются значения от $1 до $100; применяется только к
            `auto` и `max`. Если не указан, лимит по умолчанию составляет $5 для
            `auto` и $20 для `max`.
          example: 10
      description: Необязательный лимит расходов на запуск для тарифицируемых уровней
        усилий `auto` и `max`. Запуски, завершившиеся раньше, могут стоить
        меньше лимита.
    CreateBatchRequest:
      type: object
      properties:
        requests:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/BatchRequestItem"
          description: Запросы для постановки в очередь. Каждый `customId` должен быть
            уникальным в рамках пакета.
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Метаданные, предоставленные вызывающей стороной и сохранённые
            вместе с пакетом.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
      required:
        - requests
    BatchRequestItem:
      type: object
      properties:
        customId:
          type: string
          minLength: 1
          maxLength: 64
          description: Ваш уникальный идентификатор этого запроса; служит ключом
            результата и должен быть уникальным в пакете.
          example: row-1
        method:
          type: string
          const: POST
          description: HTTP-метод пакетного запроса. В v1 поддерживается только POST.
        url:
          type: string
          enum:
            - /search
            - /agent/runs
          description: Целевой маршрут API для запроса. В v1 — `/search` или `/agent/runs`.
          example: /search
        body:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: "Тело запроса для целевого маршрута. Должно быть объектом JSON;
            `stream: true` не допускается."
      required:
        - customId
        - method
        - url
        - body
    AnswerStreamTextDeltaChunk:
      type: object
      properties:
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                minimum: 0
                description: Индекс этого потокового варианта.
              delta:
                type: object
                properties:
                  role:
                    type: string
                    const: assistant
                  content:
                    type: string
                  refusal:
                    anyOf:
                      - type: string
                      - type: "null"
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Фрагмент ответа, добавляемый моделью.
              finish_reason:
                description: Причина завершения этого потокового варианта, если указана.
                oneOf:
                  - type: string
                  - type: "null"
            required:
              - index
              - delta
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
          description: Совместимые с OpenAI варианты потокового завершения без внутренних
            полей провайдера.
      required:
        - choices
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    SearchResponse:
      oneOf:
        - $ref: "#/components/schemas/SearchSynthesisResponse"
        - $ref: "#/components/schemas/SearchResultsResponse"
    SearchSynthesisResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Уникальный идентификатор запроса.
          example: b5947044c4b78efa9552a7c89b306d95
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultOutput"
          description: Список результатов поиска с заголовком, URL, датой публикации и
            автором.
        resolvedSearchType:
          description: Устаревшее поле прежней версии. Текущие рабочие ответы могут
            возвращать пустую строку; клиентам не следует выполнять ветвление на
            основе этого значения.
          example: ""
          deprecated: true
          type: string
        context:
          type: string
          description: Устарело. Объединённая строка контекста из результатов поиска.
            Вместо неё используйте выделенные фрагменты или текст.
          deprecated: true
        costDollars:
          $ref: "#/components/schemas/CostDollarsOutput"
        searchTime:
          type: number
          description: Время обработки на стороне сервера в миллисекундах, измеренное на
            шлюзе. Включает извлечение данных, но может не включать последующие
            этапы, такие как формирование структурированного вывода, поэтому
            может быть меньше сквозной задержки запроса.
          example: 312.4
        output:
          $ref: "#/components/schemas/SearchSynthesisOutputOutput"
      required:
        - results
        - output
      additionalProperties: false
    SearchResultsResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Уникальный идентификатор запроса.
          example: b5947044c4b78efa9552a7c89b306d95
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultOutput"
          description: Список результатов поиска с заголовком, URL, датой публикации и
            автором.
        resolvedSearchType:
          description: Устаревшее поле прежней версии. Текущие рабочие ответы могут
            возвращать пустую строку; клиентам не следует выполнять ветвление на
            основе этого значения.
          example: ""
          deprecated: true
          type: string
        context:
          type: string
          description: Устарело. Объединённая строка контекста из результатов поиска.
            Вместо неё используйте выделенные фрагменты или текст.
          deprecated: true
        costDollars:
          $ref: "#/components/schemas/CostDollarsOutput"
        searchTime:
          type: number
          description: Время обработки на стороне сервера в миллисекундах, измеренное на
            шлюзе. Включает извлечение данных, но может не включать последующие
            этапы, такие как формирование структурированного вывода, поэтому
            может быть меньше сквозной задержки запроса.
          example: 312.4
      required:
        - results
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Уникальный идентификатор запроса.
          example: b5947044c4b78efa9552a7c89b306d95
        error:
          type: string
          description: Понятное человеку сообщение с описанием ошибки.
          example: Invalid API key
        tag:
          type: string
          description: "Машиночитаемая метка ошибки, указывающая на сбой. Набор меток
            открыт: новые метки могут добавляться в любое время, поэтому
            нераспознанные метки следует обрабатывать как общую ошибку с
            HTTP-статусом ответа. Известные метки приведены в качестве
            примеров."
          examples:
            - DEFAULT_ERROR
            - INTERNAL_ERROR
            - INVALID_API_KEY
            - INVALID_REQUEST
            - INVALID_REQUEST_BODY
            - INVALID_REQUEST_QUERY
            - INVALID_JSON_SCHEMA
            - INVALID_NUM_RESULTS
            - NUM_RESULTS_EXCEEDED
            - NO_MORE_CREDITS
            - API_KEY_BUDGET_EXCEEDED
            - TEAM_BUDGET_EXCEEDED
            - NO_CONTENT_FOUND
            - PROHIBITED_CONTENT
            - INSUFFICIENT_SCOPE
            - UNABLE_TO_GENERATE_RESPONSE
            - UNSUPPORTED_PUBLICATION_INCLUDE_FILTER
            - SUBPAGES_LIMIT_EXCEEDED
            - FEATURE_DISABLED
            - INVALID_URLS
            - FETCH_DOCUMENT_ERROR
            - TEAM_BLOCKED
            - NOT_FOUND
            - RATE_LIMIT_EXCEEDED
            - SNAPSHOT_RATE_LIMIT_EXCEEDED
            - SNAPSHOT_NOT_ON_PLAN
            - SNAPSHOT_NOT_IN_CONTRACT
            - SNAPSHOT_TRIAL_EXHAUSTED
            - SNAPSHOT_TRIAL_CAP_EXCEEDED
      required:
        - requestId
        - error
        - tag
      additionalProperties: false
      description: Стандартная структура ошибки, возвращаемая API Exa для неуспешных
        запросов.
    X402PaymentChallenge:
      type: object
      properties:
        requestId:
          type: string
          description: Уникальный идентификатор запроса.
