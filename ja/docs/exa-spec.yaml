                $ref: "#/components/schemas/Event"
        "404":
          description: イベントが見つかりません
          headers:
            X-Request-Id:
              schema:
                type: string
              description: リクエストの一意の識別子。
              example: req_N6SsgoiaOQOPqsYKKiw5
              required: true
components:
  schemas:
    SearchRequest:
      type: object
      properties:
        includeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: "検索対象に含めるドメインまたはドメイン内のパスの一覧。各項目には、ホスト名（例:
                `example.com`）、パスのプレフィックスを含むホスト名（例:
                `example.com/docs`）、またはワイルドカードを使用したサブドメイン（例:
                `*.example.com`）を指定できます。指定すると、一致するドメインまたはパスからの結果のみが返されます。ドメインやパ\
                スで絞り込む場合は、クエリに`site:`演算子を追加する代わりに、このパラメータを使用してください。"
              example:
                - arxiv.org
                - exa.ai/blog
            - type: "null"
        excludeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: "検索結果から除外するドメインまたはドメイン内のパスの一覧。各項目には、ホスト名（例:
                `example.com`）、パスのプレフィックスを含むホスト名（例:
                `example.com/docs`）、またはワイルドカードを使用したサブドメイン（例:
                `*.example.com`）を指定できます。指定すると、一致するドメインまたはパスからの結果は返されません。ドメインやパス\
                で絞り込む場合は、クエリに`site:`演算子を追加する代わりに、このパラメータを使用してください。"
              example:
                - docs.python.org/3
            - type: "null"
        startCrawlDate:
          anyOf:
            - type: string
              description: 非推奨で、効果はありません。APIでは無視されます。ISO 8601形式で指定する必要があります。
              example: 2023-01-01T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        endCrawlDate:
          anyOf:
            - type: string
              description: 非推奨で、効果はありません。APIでは無視されます。ISO 8601形式で指定する必要があります。
              example: 2023-12-31T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        startPublishedDate:
          anyOf:
            - type: string
              description: 指定日時より後に公開されたリンクのみを返します。ISO 8601形式で指定する必要があります。
              example: 2023-01-01T00:00:00.000Z
              format: date-time
            - type: "null"
        endPublishedDate:
          anyOf:
            - type: string
              description: 指定日時より前に公開されたリンクのみを返します。ISO 8601形式で指定する必要があります。
              example: 2023-12-31T00:00:00.000Z
              format: date-time
            - type: "null"
        numResults:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 100
              description: 返す結果の件数。上限は検索タイプによって異なります。公開されている上限は最大100件です。上限の引き上げについては、営業担当（hello@exa.ai）にお問い合わせください。
              example: 10
              default: 10
            - type: "null"
        context:
          anyOf:
            - description: "非推奨: 代わりにハイライトまたはテキストを使用してください。ページの内容を結合したコンテキスト文字列として返します。"
              deprecated: true
              oneOf:
                - type: boolean
                  description: "非推奨: 代わりにハイライトまたはテキストを使用してください。ページの内容を結合したコンテキスト文字列として返します。"
                  example: true
                  deprecated: true
                - type: object
                  properties:
                    maxCharacters:
                      type: integer
                      minimum: 1
                      maximum: 10000
                      description: 非推奨。コンテキスト文字列の最大文字数。指定できる最大値は10000です。
                      example: 10000
                  description: "非推奨: 代わりにハイライトまたはテキストを使用してください。ページの内容を結合したコンテキスト文字列として返します。"
                  deprecated: true
            - type: "null"
        moderation:
          anyOf:
            - type: boolean
              description: コンテンツモデレーションを有効にして、安全でないコンテンツを検索結果から除外します。
              example: true
              default: false
            - type: "null"
        contents:
          anyOf:
            - description: テキスト、ハイライト、要約、追加情報、鮮度を制御するためのコンテンツオプション。
              $ref: "#/components/schemas/ContentsOptions"
            - type: "null"
        query:
          type: string
          minLength: 1
          description: 検索に使用するクエリ文字列。
          example: Latest developments in LLM capabilities
        additionalQueries:
          anyOf:
            - minItems: 1
              maxItems: 10
              type: array
              items:
                type: string
              description: deep検索の各バリエーションで使用する追加のクエリ。deep検索タイプでのみ機能します。指定すると、より幅広い結果を得るために、これらのクエリがメインのクエリと併せて使用されます。
              example:
                - LLM advancements
                - large language model progress
            - type: "null"
        type:
          anyOf:
            - type: string
              enum:
                - instant
                - fast
                - auto
                - deep-lite
                - deep
                - deep-reasoning
              description: 使用する検索モード。`auto`（デフォルト）は品質と速度のバランスを取ったモードで、ほとんどの用途に推奨します。`fast`
                は低レイテンシで高品質な結果を返すため、ユーザー向けの検索や対話型ワークフローに適しています。`instant`
                は応答時間を最小限に抑えるよう最適化されており、検索の深さより速度を優先します。チャット、音声エージェント、入力補完など、リアルタイム性が求められる用途に適しています。`deep-lite`
                は軽量な調査を行って結果を統合し、完全なディープサーチより短い、安定した4秒のレイテンシで返します。`deep`
                は複数段階にわたる包括的な調査と情報の統合を行い、`deep-reasoning`
                は複雑な分析や意思決定のタスクに向けて、さらに高度な推論を加えます。
              example: auto
              default: auto
            - type: "null"
        category:
          anyOf:
            - type: string
              enum:
                - company
                - publication
                - news
                - personal site
                - financial report
                - people
              description: "検索対象とするデータカテゴリ。既知のカテゴリには `company`、`publication`、`news`、`personal
                site`、`financial report`、`people`
                があります。その他の文字列も受け付け、検索時のカテゴリのヒントとして使用します。`people` と `company`
                のカテゴリでは、人物のプロフィールや企業ページを見つける精度が向上します。`publication`
                カテゴリでは、研究論文、プレプリント、学術誌の論文などの学術文献が、著者、掲載誌、引用などの構造化メタデータとともに結果に表示\
                されます。注意: `company` と `people`
                のカテゴリで使用できるフィルターは限られています。これらのカテゴリでは、次のパラメータはサポートされません:
                `startPublishedDate`、`endPublishedDate`、`excludeDomains`。サポートされ\
                ていないパラメータを使用すると、400エラーになります。"
              example: publication
            - type: "null"
        userLocation:
          anyOf:
            - type: string
              description: "ユーザーの2文字のISO国コード（例: US）。"
              example: US
            - type: "null"
        compliance:
          anyOf:
            - type: string
              enum:
                - hipaa
              description: Enterprise限定のコンプライアンスモード。HIPAAモードを使用するには `hipaa`
                に設定します。サポート対象のパラメータを使用し、キャッシュからのみ取得する必要があります。詳細はHIPAAのドキュメントを参照してください。
              example: hipaa
            - type: "null"
        outputSchema:
          anyOf:
            - oneOf:
                - $ref: "#/components/schemas/OutputSchemaText"
                - $ref: "#/components/schemas/OutputSchemaObject"
              description: 情報を統合して生成する出力のJSONスキーマ。サポートされるルート型は "text" と "object"
                です。指定すると、応答に、このスキーマに一致する内容の出力オブジェクトが含まれます。すべての検索タイプで使用でき、選択した検索タイプのレイテンシに加えて、情報の統合に約2秒かかります。
              type: object
              discriminator:
                propertyName: type
                mapping:
                  text: "#/components/schemas/OutputSchemaText"
                  object: "#/components/schemas/OutputSchemaObject"
            - type: "null"
        systemPrompt:
          anyOf:
            - type: string
              description: 生成する出力やエージェントの動作を導く追加指示。情報源の優先順位、新規性や重複に関する制約、その他の動作指針の指定に使用します。
              example: Prefer official sources and avoid duplicate results.
            - type: "null"
        stream:
          anyOf:
            - type: boolean
              description: 統合して生成する出力をストリーミングするために、サーバー送信イベントを要求します。現在、ストリーミングが使用されるのは
                outputSchema が指定された場合のみです。それ以外の場合、エンドポイントは通常のJSON形式の検索応答を返します。
              default: false
            - type: "null"
      required:
        - query
    JsonValue:
      description: 任意のJSON値。
      oneOf:
        - type: "null"
        - type: boolean
        - type: number
        - type: string
