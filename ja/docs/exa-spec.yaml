                          description: ページ全文の最大文字数。応答サイズとAPIコストの制御に役立ちます。サポートされる最大値は10000です。
                          example: 1000
                        - type: "null"
                    includeHtmlTags:
                      anyOf:
                        - type: boolean
                          description: "true
                            の場合、Markdown形式のプレーンテキストではなく、簡易的なHTMLタグを含むテキストを返します。新たに取得したコンテ\
                            ンツにこの設定を適用する場合は、maxAgeHours: 0 を使用してください。"
