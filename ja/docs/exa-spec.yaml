                              - sidebar
                              - footer
                              - metadata
                          description: "可能な範囲で、指定した意味的なページセクションに分類されたコンテンツのみを含めます。ページによってはセクション分類が利用できないか\
                            、不完全な場合があります。厳密なフィルタリングが必要な場合は、出力を検証してください。新たに取得したコ\
