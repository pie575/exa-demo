      type: object
    CustomEntity:
      properties:
        description:
          minLength: 2
          maxLength: 200
          type: string
        type:
          type: string
          const: custom
          default: custom
      required:
        - type
        - description
      title: Custom
      type: object
    CreateCriterionParameters:
      properties:
        description:
          minLength: 1
          maxLength: 1000
          description: 基準の説明
          type: string
      required:
        - description
      type: object
    CreateEnrichmentParameters:
      properties:
        description:
          minLength: 1
          maxLength: 5000
          description: Webset の各 Item に対して実行するエンリッチメントタスクの内容を記述してください。
          type: string
        format:
          description: |-
            エンリッチメントのレスポンス形式。

            説明に基づいて最適な形式が自動的に選択されます。形式を明示的に指定したい場合は、ここで指定できます。
          enum:
            - text
            - date
            - number
            - options
            - email
            - phone
            - url
          type: string
        options:
          description: 形式が options の場合に、エンリッチメントエージェントが選べる選択肢。
          minItems: 1
          maxItems: 150
          items:
            properties:
              label:
                description: 選択肢のラベル
                type: string
            required:
              - label
            type: object
          type: array
        metadata:
          description: このオブジェクトに関連付けるキーと値のペアの集合。
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
      required:
        - description
      type: object
    UpdateWebsetRequest:
      properties:
        metadata:
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
          description: このオブジェクトに関連付けるキーと値のペアの集合。
          nullable: true
        title:
          description: Webset の表示時に使用する任意の名前。
          examples:
            - Leading climate tech startups
          minLength: 1
          type: string
      type: object
    CreateWebsetSearchParameters:
      properties:
        count:
          minimum: 1
          description: |-
            Search が探す Item の数。

            クエリの複雑さによっては、実際に見つかる Item の数がこの値より少なくなる場合があります。
          type: number
        query:
          minLength: 1
          maxLength: 5000
          description: |-
            探しているものを記述する自然言語の検索クエリ。

            結果を絞り込めるよう、要件や特徴、制約を具体的に記述してください。

            指定した URL はクロールされ、検索時の追加コンテキストとして使用されます。
          examples:
            - Marketing agencies based in the US, that focus on consumer
              products. Get brands worked with and city
            - AI startups in Europe that raised Series A funding in 2024
            - SaaS companies with 50-200 employees in the fintech space
          type: string
        entity:
          description: |-
            検索で結果として返すエンティティ。

            指定は必須ではありません。クエリに含まれる情報からエンティティを自動的に判別します。より細かく制御したい場合にのみ指定してください。
          $ref: "#/components/schemas/Entity"
        criteria:
          description: |-
            各アイテムの評価基準。

            基準を指定する必要はありません。クエリに含まれる情報から自動的に判定します。より細かく制御したい場合にのみ指定してください。
          minItems: 1
          maxItems: 5
          items:
            title: CreateCriterionParameters
            $ref: "#/components/schemas/CreateCriterionParameters"
          type: array
        maxPeoplePerCompany:
          description: 人物検索で適用する任意の目安となる上限。設定すると、現在の勤務先が同じ企業である該当人物を、最大で指定した人数まで含めるようにします。
          minimum: 1
          type: integer
        exclude:
          description: 検索結果から除外するソース（既存のインポートまたはWebset）。検索で再び見つからないよう、これらのソースに含まれる結果は除外されます。
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: 除外するソースのID。
                type: string
            required:
              - source
              - id
            type: object
          type: array
        scope:
          description: 検索対象を特定のソース（既存のインポート）に限定します。これらのソースに含まれる結果のうち、検索基準に合うものがWebsetに追加されます。
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: 検索対象となるソースのID。
                type: string
              relationship:
                properties:
                  definition:
                    description: 見つけたいエンティティと、指定したソースに含まれるエンティティとの関係。
                    type: string
                  limit:
                    minimum: 1
                    maximum: 10
                    type: number
                required:
                  - definition
                  - limit
                type: object
            required:
              - source
              - id
            type: object
          type: array
        recall:
          description: |-
            この検索に該当する結果の総数の推定値を算出するかどうか。
            分析結果は検索リクエストの`recall`フィールドで確認できます。
          type: boolean
        behavior:
          default: override
          description: |-
            この検索でWebset内の既存アイテムをどう扱うか：

            - **override**: 既存アイテムを置き換え、すべてのアイテムを新しい基準で評価する
            - **append**: 新しい基準に合う既存アイテムを残し、新しいアイテムを追加する
          $ref: "#/components/schemas/WebsetSearchBehavior"
        metadata:
          description: このオブジェクトに関連付けるキーと値のペア。
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
      required:
        - count
        - query
      type: object
