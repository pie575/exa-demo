          example:
            links: []
          type: object
          properties:
            links:
              description: 検索結果に含まれるリンクの配列。
              example: []
              type: array
              items:
                type: string
            imageLinks:
              description: 検索結果に含まれる画像URLの配列。
              example: []
              type: array
              items:
                type: string
            richImageLinks:
              description: 画像とその代替テキストの配列。ページ内での画像の出現順に並びます。
              example:
