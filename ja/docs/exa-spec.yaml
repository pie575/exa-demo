  headers:
    XRequestId:
      description: リクエストの一意の識別子。レスポンス本文に`requestId`フィールドが含まれる場合、その値と一致します。
      schema:
        type: string
      example: 07e29bb1f4f1dd05f0d4b57bbcf6e4b8
    XExaQueued:
      description: リクエストが受け付けられる前に、顧客向けのレート制限キューで待機したかどうか。
      schema:
        type: string
        enum:
          - "true"
          - "false"
      example: "false"
    XExaQueueMs:
      description: リクエストが顧客向けのレート制限キューで待機した合計時間（ミリ秒）。
      schema:
        type: string
      example: "0"
  responses:
    BadRequestResponse:
      description: リクエスト本文またはクエリパラメータが検証に失敗しました。
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 0a1b2c3d4e5f60718293a4b5c6d7e8f9
            error: "Invalid request body: query: Invalid input: expected string, received
              undefined"
            tag: INVALID_REQUEST_BODY
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedResponse:
      description: APIキーが指定されていないか、無効です。
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: f2a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2
            error: Invalid API key
            tag: INVALID_API_KEY
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequestsResponse:
      description: このAPIキー、チーム、またはネットワークのレート制限を超えました。
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 7f9b1d3e5a0c2e4b6d8f0a2c4e6b8d0f
            error: You've exceeded the Exa rate limit for your network. If you believe this
              is in error, please email hello@exa.ai :)
            tag: RATE_LIMIT_EXCEEDED
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerErrorResponse:
      description: リクエストの処理中に予期しないエラーが発生しました。
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 9b1d3f5e7a0c2e4b6d8f0a2c4e6b8d0f
            error: Sorry, we encountered an error while processing your request. Please try
              again later
            tag: DEFAULT_ERROR
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailableResponse:
      description: Exaは一時的に処理能力の上限に達しているか、利用できません。リクエストは処理されていません。指数バックオフを使用して再試行してください。
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: b3d5f7a9c1e0a2c4e6b8d0f2a4c6e8b1
            error: Exa is temporarily over capacity. Please retry with exponential backoff.
            tag: SERVICE_OVERLOADED
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaymentRequiredResponse:
      description: チームのクレジットが不足しているか、支出予算を超えました。
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 1c3e5a7b9d0f2a4c6e8b0d2f4a6c8e0b
            error: You have exceeded your credits limit. Please top up to keep using Exa at
              dashboard.exa.ai
            tag: NO_MORE_CREDITS
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundResponse:
      description: リクエストされたリソースは存在しません。
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 3b1d5f7a9c0e2b4d6f8a0c2e4b6d8f0a
            error: Not found
            tag: NOT_FOUND
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictResponse:
      description: リクエストがリソースの現在の状態と競合しています。
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 5d7f9b1c3e0a2c4e6b8d0f2a4c6e8b0d
            error: Batch is not in a cancellable state
            tag: INVALID_REQUEST
          schema:
            $ref: "#/components/schemas/ErrorResponse"
