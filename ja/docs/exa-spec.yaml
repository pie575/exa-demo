    post:
      operationId: cancelBatch
      summary: バッチをキャンセル
      description: バッチのキャンセルをリクエストします。バッチは新たなリクエストのスケジュールを停止し、処理中のリクエストが終了してから`cancelled`状態になります。すでに`cancelling`または`cancelled`のバッチに対するキャンセル操作は冪等で、バッチは変更されずに返されます。すでに終了状態（`completed`または`expired`）に達したバッチはキャンセルできず、リクエストは409で失敗します。
      tags:
        - Batches
      x-exa-lifecycle: beta
      x-exa-beta-flag: batches-2026-06-06
      parameters:
        - in: path
          name: id
          schema:
            type: string
            minLength: 1
            description: バッチID。
            example: batch_01j7x9v0m2n4p6q8r0s2t4v6w8
          required: true
          description: バッチID。
        - $ref: "#/components/parameters/BatchesBetaHeader"
      responses:
        "200":
          description: OK
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              example:
                id: batch_01j7x9v0m2n4p6q8r0s2t4v6w8
                object: batch
                status: cancelling
                requestCounts:
                  total: 2
                  completed: 0
                  failed: 0
                createdAt: 2026-06-06T12:00:00.000Z
                expiresAt: 2026-06-13T12:00:00.000Z
                endedAt: null
                resultsUrl: null
                metadata:
                  project: weekly-digest
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
