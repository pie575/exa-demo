                        、不完全な場合があります。厳密な絞り込みが必要な場合は出力を検証してください。新たに取得したコンテンツに適用す\
                        るには、maxAgeHours: 0 を指定します。"
                      example:
                        - body
                        - header
                    - type: "null"
                excludeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "指定した意味上のページセクションに分類されたコンテンツを除外します。セクション分類は可能な範囲で行われます。新たに取得したコンテン\
                        ツに適用するには、maxAgeHours: 0 を指定します。"
                      example:
                        - navigation
                        - footer
                        - sidebar
                    - type: "null"
              additionalProperties: false
              title: Advanced text options
              description: テキスト抽出を制御する詳細オプション。テキストの長さを制限したり、HTML 構造を含めたりする場合に使用します。
        highlights:
          description: LLM が各ページで最も関連性が高いと判断したテキストの抜粋。
          oneOf:
            - type: boolean
              title: Simple highlights retrieval
              description: true の場合、デフォルト設定でハイライトを返します。false の場合、ハイライトを無効にします。
              default: false
            - type: object
              properties:
                query:
                  anyOf:
                    - type: string
                      description: LLM によるハイライトの選択を調整するカスタムクエリ。
                      example: Key advancements
                    - type: "null"
                verbosity:
                  anyOf:
                    - type: string
                      enum:
                        - low
                        - medium
                        - high
                      description: "ハイライトの長さのプリセット。`low`、`medium`、`high`
                        の順に、返すハイライトに割り当てるトークン数が増えます。highlights.dynamic
                        を使用する場合、プリセットで設定するのは URL
                        ごとの割り当て量ではなく、結果セット全体で共有する単一の割り当て量です。具体的な割り当て量は Exa
                        が調整するため、変更される場合があります。maxCharacters または numSentences
                        とは併用できません。ベータ版: `Exa-Beta:
                        dynamic-highlights-2026-08-28` リクエストヘッダーが必要です。このヘッダーなしで
                        `verbosity` を設定したリクエストは拒否されます。"
                      example: medium
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                dynamic:
                  anyOf:
                    - type: boolean
                      description: "Dynamic
                        Highlights（研究プレビュー）を有効にします。すべての結果をまとめて考慮し、文書ごとの割り当て量ではなく、結\
                        果セット全体で共有する単一のコンテキスト割り当て量を使用します。maxCharacters
                        とは併用できません。ベータ版: `Exa-Beta:
                        dynamic-highlights-2026-08-28` リクエストヘッダーが必要です。このヘッダーなしで
                        `dynamic` を設定したリクエストは拒否されます。"
                      example: true
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: ハイライトとして返す最大文字数。URL ごとに返すハイライトテキストの合計文字数を制御します。サポートされる最大値は 10000
                        です。highlights.dynamic とは併用できません。
                      example: 2000
                    - type: "null"
                numSentences:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "非推奨であり、将来のリリースで削除されます。現在は、1 文あたり約 1333
                        文字の文字数上限に換算されます。デフォルトのハイライトを使うには highlights: true
                        を、独自のクエリで選択を調整するには { query } を指定します。"
                      example: 1
                      deprecated: true
                    - type: "null"
                highlightsPerUrl:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "非推奨であり、将来のリリースで削除されます。現在は無視されます。デフォルトのハイライトを使うには highlights: true
                        を、独自のクエリで選択を調整するには { query } を指定します。"
                      example: 1
                      deprecated: true
                    - type: "null"
              additionalProperties: false
              title: Advanced highlights options
              description: "ハイライトの抽出を調整する詳細オプション。最高品質のデフォルト設定を使うには highlights: true
                を指定します。このオブジェクトは、独自のクエリで選択を調整する必要がある場合にのみ指定してください。"
        summary:
          description: LLM が生成した要約を返します。デフォルト設定を使うには `true` を、設定を指定するには `query` と
            `maxTokens` を含むオブジェクトを渡します。
          oneOf:
            - type: boolean
            - $ref: "#/components/schemas/SummaryWithMaxTokensOptionsOutput"
        extras:
          type: object
          properties:
            links:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 各ウェブページから返す URL の数。
                  example: 1
                  default: 0
                - type: "null"
            imageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 各結果について返す画像の数。
                  example: 1
                  default: 0
                - type: "null"
            richImageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 各結果について返す詳細情報付き画像リンクの数。
                  default: 0
                - type: "null"
            richLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 各結果について返す詳細情報付きリンクの数。
                  default: 0
                - type: "null"
            codeBlocks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 各結果について返すコードブロックの数。
                  default: 0
                - type: "null"
          additionalProperties: false
          description: 追加で渡すパラメーター。
        context:
          description: "非推奨: 代わりに highlights または text を使用してください。ページの内容を結合し、1
            つのコンテキスト文字列として返します。"
          deprecated: true
          oneOf:
            - type: boolean
              description: "非推奨: 代わりに highlights または text を使用してください。ページの内容を結合し、1
                つのコンテキスト文字列として返します。"
              example: true
              deprecated: true
            - type: object
              properties:
                maxCharacters:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: 非推奨。コンテキスト文字列の最大文字数。サポートされる最大値は 10000 です。
                  example: 10000
              additionalProperties: false
              description: "非推奨: 代わりに highlights または text を使用してください。ページの内容を結合し、1
                つのコンテキスト文字列として返します。"
              deprecated: true
        livecrawl:
          description: ページのコンテンツを取得するためのクロール戦略
          oneOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
            - type: string
              const: auto
        livecrawlTimeout:
          type: integer
          exclusiveMinimum: 0
          maximum: 90000
          description: ライブクロールのタイムアウト（ミリ秒）。
          example: 1000
          default: 10000
        maxAgeHours:
          type: integer
          minimum: -1
          maximum: 720
          description: キャッシュされたコンテンツの最大経過時間（時間）。正の値を指定すると、経過時間が指定した時間未満のキャッシュを使用します。0
            を指定すると新しいコンテンツを取得します。新たに取得したページにテキストの出力オプションを適用する場合は、この方法を使用してください。-1
            を指定すると常にキャッシュを使用します。省略した場合、キャッシュがなければ代替の取得方法を使用します。サポートされる最大値は 720
            時間です。
          example: 24
        filterEmptyResults:
          type: boolean
          description: コンテンツのない結果を除外する
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: クロールするサブページの数。実際にクロールされる数はシステム上の制約によって制限される場合があります。
          example: 1
          default: 0
        subpageTarget:
          description: 検索結果に含まれる特定のサブページを探すための語句。単一の文字列または文字列の配列を指定できます。
          example: sources
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
      additionalProperties: false
      description: 各検索結果に適用するコンテンツ抽出オプション。すべてのフィールドは省略可能です。
    SummaryWithMaxTokensOptionsOutput:
      type: object
      properties:
        query:
          anyOf:
            - type: string
              description: LLM が生成する要約用のカスタムクエリ。
              example: Main developments
            - type: "null"
        maxTokens:
          type: integer
          minimum: 1
          description: 生成する要約の最大トークン数。
      additionalProperties: false
    SearchMonitorTriggerOutput:
      type: object
      properties:
        type:
          type: string
          const: interval
          description: トリガーの種類。現在サポートされているのは `interval` のみです。
          default: interval
        period:
          type: string
          description: 'モニターの実行間隔を指定する期間文字列（例: "1h", "6h", "1d", "7d"）。指定できる単位は 1
            種類のみです。最短間隔は 1 時間です。スケジュールはモニターの作成時刻を基準とします（例: 午後 2:30
            に作成された日次モニターは、毎日午後 2:30 頃に実行されます）。'
          example: 6h
      required:
        - type
        - period
      additionalProperties: false
    SearchMonitorOutputSchemaOutput:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaTextOutput"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: 統合して生成される出力の JSON スキーマ。サポートされるルート型は "text" と "object"
            です。指定すると、レスポンスには内容がこのスキーマに一致する出力オブジェクトが含まれます。すべての検索タイプで使用でき、選択した検索タイプの処理時間に加えて、統合処理による遅延が約
            2 秒発生します。
          type: object
          discriminator:
            propertyName: type
            mapping:
              text: "#/components/schemas/OutputSchemaTextOutput"
              object: "#/components/schemas/OutputSchemaObject"
        - type: "null"
      description: '実行結果の出力形式を指定します。省略した場合のデフォルトは `{ "type": "text" }` です。`type` が
        `"text"` の場合、出力はプレーンテキストの要約になります。`type` が `"object"` の場合、出力は構造化された JSON
        になります。`"object"` 型で `properties`
        を指定しない場合はスキーマが自動的に推定され、指定した場合は出力がそのスキーマに従います。'
    OutputSchemaTextOutput:
      type: object
      properties:
        type:
          type: string
          const: text
        description:
          type: string
      required:
        - type
      additionalProperties: false
    SearchMonitorWebhookOutput:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: webhook イベントを受信する HTTPS URL。localhost やプライベート IP アドレス範囲を指すことはできません。
        events:
          type: array
          items:
            type: string
            enum:
              - monitor.created
              - monitor.updated
              - monitor.deleted
              - monitor.run.created
              - monitor.run.completed
          description: サブスクライブするイベント。省略した場合は、すべてのイベントが対象になります。
      required:
        - url
      additionalProperties: false
    AgentDataSourceOutput:
      type: object
      properties:
        provider:
          description: この実行で有効にする Exa Connect のデータプロバイダー。デフォルトでは、すべてのプロバイダーのツールを利用できます。
          example: fiber
          $ref: "#/components/schemas/AgentDataSourceProvider"
      required:
        - provider
      additionalProperties: false
    AgentBudgetOutput:
      type: object
      properties:
        maxCostDollars:
          type: number
          description: この実行に費やせる最大金額（米ドル）。$1–$100 を指定でき、`auto` と `max`
            にのみ適用されます。省略した場合、デフォルトの上限は `auto` で $5、`max` で $20 です。
          example: 10
      additionalProperties: false
      description: 従量課金の `auto` および `max` に設定できる、実行ごとの支出上限。早期に終了した実行の費用は、上限を下回る場合があります。
    CreateWebsetParameters:
      properties:
        title:
          minLength: 1
          type: string
          description: Webset の表示時に使用する任意の名前。空欄にすると、Exa が自動生成します。
          examples:
            - Leading climate tech startups
          nullable: true
        search:
          properties:
            query:
              minLength: 1
              maxLength: 5000
              description: |-
                探しているものを記述する自然言語の検索クエリ。

                結果を絞り込めるよう、要件や特徴、制約を具体的に記述してください。

                指定した URL はクロールされ、検索時の追加コンテキストとして使用されます。
              examples:
                - Marketing agencies based in the US, that focus on consumer
                  products.
                - AI startups in Europe that raised Series A funding in 2024
                - SaaS companies with 50-200 employees in the fintech space
              type: string
            count:
              default: 10
              description: |-
                Webset が探す Item の数。

                検索の複雑さによっては、実際に見つかる Item の数がこの値より少なくなる場合があります。
              minimum: 1
              type: number
            entity:
              description: |-
                Webset が結果として返すエンティティ。

                指定は必須ではありません。クエリに含まれる情報からエンティティを自動的に判別します。より細かく制御したい場合にのみ指定してください。
              $ref: "#/components/schemas/Entity"
            criteria:
              description: |-
                各 Item の評価に使用する基準。

                基準の指定は必須ではありません。クエリに含まれる情報から基準を自動的に判別します。より細かく制御したい場合にのみ指定してください。
              minItems: 1
              maxItems: 5
              items:
                title: CreateCriterionParameters
                $ref: "#/components/schemas/CreateCriterionParameters"
              type: array
            maxPeoplePerCompany:
              description: 人物検索に設定できる目安の上限。設定すると、現在の勤務先が同じ企業である該当者を、最大でこの人数まで含めるように検索します。
              minimum: 1
              type: integer
            recall:
              description: |-
                この検索に関連する結果が全部でどれほど存在し得るか、推定値を取得するかどうか。
                分析結果は検索リクエスト内の `recall` フィールドで確認できます。
              type: boolean
            exclude:
              description: 検索結果から除外するソース（既存の import または
                webset）。これらのソースに含まれる結果は、検索結果に表示されないよう除外されます。
              items:
                properties:
                  source:
                    enum:
                      - import
                      - webset
                    type: string
                  id:
                    minLength: 1
                    description: 除外するソースの ID。
                    type: string
                required:
                  - source
                  - id
                type: object
              type: array
            scope:
              description: 検索対象を特定のソース（既存の import または webset）に限定します。これらのソースに含まれ、検索基準に一致する結果が
                Webset に追加されます。
              items:
                properties:
                  source:
                    enum:
                      - import
                      - webset
                    type: string
                  id:
                    minLength: 1
                    description: 検索対象のソースの ID。
                    type: string
                  relationship:
                    properties:
                      definition:
                        description: 探しているエンティティが、指定したソース内のエンティティとどのような関係にあるか。
                        type: string
                      limit:
                        minimum: 1
                        maximum: 10
                        type: number
                    required:
                      - definition
                      - limit
                    type: object
                required:
                  - source
                  - id
                type: object
              type: array
          required:
            - query
          description: Webset の初回の検索を作成します。
          type: object
        import:
          description: 既存の Webset と Import から、この Webset にデータを取り込みます。
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: 取り込むソースの ID。
                type: string
              evaluate:
                description: true の場合、この import の Item が検索基準に照らして評価されます。検索の指定が必要です。
                type: boolean
            required:
              - source
              - id
            type: object
          type: array
        enrichments:
          description: >-
            見つかった Item から追加データを抽出するため、エンリッチメントを追加します。


            エンリッチメントでは、Webset に追加された各 Item
            について、連絡先情報、資金調達データ、従業員数などの特定の情報を自動的に検索・抽出します。
          items:
            title: CreateEnrichmentParameters
            $ref: "#/components/schemas/CreateEnrichmentParameters"
          type: array
        exclude:
          description: この Webset 内のすべての操作に適用される共通の除外ソース（既存の import または
            webset）。これらのソースに含まれる結果は、すべての検索と import 操作から除外されます。
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: 除外するソースの ID。
                type: string
            required:
              - source
              - id
            type: object
          type: array
        externalId:
          description: |-
            webset の外部識別子。

            独自の内部識別子を使って Webset を参照できます。
          maxLength: 300
          type: string
        metadata:
          description: このオブジェクトに関連付けるキーと値のペアの集合。
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
      examples:
        - search:
            query: Marketing agencies based in the US, that focus on consumer products.
            count: 10
      type: object
    Entity:
      oneOf:
        - $ref: "#/components/schemas/CompanyEntity"
        - $ref: "#/components/schemas/PersonEntity"
        - $ref: "#/components/schemas/ArticleEntity"
        - $ref: "#/components/schemas/ResearchPaperEntity"
        - $ref: "#/components/schemas/CustomEntity"
    CompanyEntity:
