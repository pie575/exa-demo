                    type: string
                    description: 画像のURL。
                  alt:
                    description: ページに設定されている場合、画像の代替テキスト。
                    type: string
                required:
                  - url
                additionalProperties: false
            richLinks:
              description: リンクとそのアンカーテキストの配列。ページ内での出現順に並びます。
              example:
                - url: https://dashboard.exa.ai
                  anchor: API Dashboard
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: リンクのURL。
