          anyOf:
            - type: boolean
              description: true の場合、ソース URL と同じドメインの結果を除外します。
              example: true
            - type: "null"
      required:
        - url
    CreateSearchMonitorParameters:
      type: object
      properties:
        name:
          type: string
          description: モニターの名前（省略可能）
        search:
          $ref: "#/components/schemas/SearchMonitorSearch"
        trigger:
          $ref: "#/components/schemas/SearchMonitorTrigger"
        outputSchema:
          $ref: "#/components/schemas/SearchMonitorOutputSchema"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: 省略可能なキーと値のペアで構成されるメタデータ。Webhook の配信時にもそのまま返されるため、更新情報を Slack
            などのシステムに振り分けられます。
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        webhook:
          $ref: "#/components/schemas/SearchMonitorWebhook"
      required:
        - search
        - webhook
    SearchMonitorSearch:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: 検索に使用するクエリ文字列。
          example: Latest developments in LLM capabilities
        numResults:
          type: integer
          minimum: 1
          maximum: 100
          description: 返す結果の数。上限は検索の種類によって異なります。一般向けの最大上限は 100
            件です。上限の引き上げについては、営業チーム（hello@exa.ai）にお問い合わせください。
          example: 10
          default: 10
        includeDomains:
          description: 検索結果をこれらのドメインに限定します。
          type: array
          items:
            type: string
        excludeDomains:
          description: 検索結果からこれらのドメインを除外します。
          type: array
          items:
            type: string
        contents:
          $ref: "#/components/schemas/SearchMonitorContents"
      required:
        - query
    SearchMonitorContents:
      type: object
      properties:
        text:
          description: 各結果のテキスト抽出オプション。
          oneOf:
            - type: boolean
              title: Simple text retrieval
              description: true の場合、デフォルト設定でページの全文を返します。false の場合、テキストを返しません。
              default: false
            - type: object
              properties:
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: ページの全文の最大文字数。レスポンスサイズや API の利用料金を抑えるのに役立ちます。サポートされる最大値は 10000 です。
                      example: 1000
                    - type: "null"
                includeHtmlTags:
                  anyOf:
                    - type: boolean
                      description: "true の場合、プレーンな Markdown 形式のテキストではなく、簡易的な HTML
                        タグを含むテキストを返します。新たに取得したコンテンツに適用する場合は maxAgeHours: 0
                        を使用してください。"
                      example: false
                      default: false
                    - type: "null"
                verbosity:
                  anyOf:
                    - type: string
                      enum:
                        - compact
                        - standard
                        - full
                      description: "テキストの表示内容の詳しさを制御します。compact は主要なコンテンツに絞り、standard
                        はページ内の周辺情報をより多く含め、full は表示されたテキストを最も網羅的に取得します。ページによっては
                        standard と full の出力が同じになる場合があります。新たに取得したコンテンツに適用する場合は
                        maxAgeHours: 0 を使用してください。"
                      example: standard
                      default: compact
                    - type: "null"
                includeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "可能な範囲で、指定した意味上のページセクションに分類されるコンテンツのみを含めます。ページによってはセクション分類を利用できない場\
                        合や、分類が不完全な場合があります。厳密な絞り込みが必要な場合は出力を検証してください。新たに取得したコンテン\
                        ツに適用する場合は maxAgeHours: 0 を使用してください。"
                      example:
                        - body
                        - header
                    - type: "null"
                excludeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "指定した意味上のページセクションに分類されるコンテンツを除外します。セクション分類は可能な範囲で行われます。新たに取得したコンテン\
                        ツに適用する場合は maxAgeHours: 0 を使用してください。"
                      example:
                        - navigation
                        - footer
                        - sidebar
                    - type: "null"
              title: Advanced text options
              description: テキスト抽出を制御する詳細オプション。テキストの長さを制限する場合や HTML 構造を含める場合に使用します。
        highlights:
          description: LLM が各ページから最も関連性が高いと判断したテキストの抜粋。
          oneOf:
            - type: boolean
              title: Simple highlights retrieval
              description: true の場合、デフォルト設定でハイライトを返します。false の場合、ハイライトを無効にします。
              default: false
            - type: object
              properties:
                query:
                  anyOf:
                    - type: string
                      description: LLM が選ぶハイライトを指定するためのカスタムクエリ。
                      example: Key advancements
                    - type: "null"
                verbosity:
                  anyOf:
                    - type: string
                      enum:
                        - low
                        - medium
                        - high
                      description: "ハイライトの長さのプリセット: `low`、`medium`、`high`
                        の順に、返されるハイライトに割り当てるトークン数が増えます。highlights.dynamic
                        を使用する場合、プリセットは URL ごとではなく結果セット全体で共有する予算を設定します。具体的な予算は
                        Exa が調整するため、変更される場合があります。maxCharacters または numSentences
                        とは併用できません。ベータ版: `Exa-Beta:
                        dynamic-highlights-2026-08-28` リクエストヘッダーが必要です。このヘッダーなしで
                        `verbosity` を設定したリクエストは拒否されます。"
                      example: medium
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                dynamic:
                  anyOf:
                    - type: boolean
                      description: "Dynamic
                        Highlights（研究プレビュー）を有効にします。すべての結果をまとめて考慮し、文書ごとではなく結果セット全体で\
                        共有するコンテキスト予算を割り当てます。maxCharacters とは併用できません。ベータ版:
                        `Exa-Beta: dynamic-highlights-2026-08-28`
                        リクエストヘッダーが必要です。このヘッダーなしで `dynamic` を設定したリクエストは拒否されます。"
                      example: true
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: ハイライトとして返す最大文字数。URL ごとに返すハイライトのテキストの合計長を制御します。サポートされる最大値は 10000
                        です。highlights.dynamic とは併用できません。
                      example: 2000
                    - type: "null"
                numSentences:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "非推奨であり、今後のリリースで削除されます。現在は、1 文あたり約 1333
                        文字の文字数上限に換算されます。デフォルトのハイライトには highlights: true
                        を指定し、独自のクエリで選択を調整する場合は { query } を指定してください。"
                      example: 1
                      deprecated: true
                    - type: "null"
                highlightsPerUrl:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "非推奨であり、今後のリリースで削除されます。現在は無視されます。デフォルトのハイライトには highlights: true
                        を指定し、独自のクエリで選択を調整する場合は { query } を指定してください。"
                      example: 1
                      deprecated: true
                    - type: "null"
              title: Advanced highlights options
              description: "ハイライトの抽出を調整する詳細オプション。最高品質のデフォルト設定を使用するには highlights: true
                を指定してください。独自のクエリで選択を調整する必要がある場合にのみ、このオブジェクトを指定します。"
        summary:
          description: LLM が生成した要約を返します。デフォルト設定には `true` を、設定を指定する場合は `query` と
            `maxTokens` を含むオブジェクトを渡します。
          oneOf:
            - type: boolean
            - $ref: "#/components/schemas/SummaryWithMaxTokensOptions"
        extras:
          type: object
          properties:
            links:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 各ウェブページから返す URL の数。
                  example: 1
                  default: 0
                - type: "null"
            imageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 各結果について返す画像の数。
                  example: 1
                  default: 0
                - type: "null"
            richImageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 各結果について返す詳細情報付き画像リンクの数。
                  default: 0
                - type: "null"
            richLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 各結果について返す詳細情報付きリンクの数。
                  default: 0
                - type: "null"
            codeBlocks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 各結果について返すコードブロックの数。
                  default: 0
                - type: "null"
          description: 追加で渡すパラメータ。
        context:
          description: "非推奨: 代わりに highlights または text
            を使用してください。ページの内容を結合し、単一のコンテキスト文字列として返します。"
          deprecated: true
          oneOf:
            - type: boolean
              description: "非推奨: 代わりに highlights または text
                を使用してください。ページの内容を結合し、単一のコンテキスト文字列として返します。"
              example: true
              deprecated: true
            - type: object
              properties:
                maxCharacters:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: 非推奨。コンテキスト文字列の最大文字数。サポートされる最大値は 10000 です。
                  example: 10000
              description: "非推奨: 代わりに highlights または text
                を使用してください。ページの内容を結合し、単一のコンテキスト文字列として返します。"
              deprecated: true
        livecrawl:
          description: ページコンテンツを取得する際のクロール戦略
          oneOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
            - type: string
              const: auto
        livecrawlTimeout:
          type: integer
          exclusiveMinimum: 0
          maximum: 90000
          description: ライブクロールのタイムアウト（ミリ秒）。
          example: 1000
          default: 10000
        maxAgeHours:
          type: integer
          minimum: -1
          maximum: 720
          description: キャッシュされたコンテンツの最大経過時間（時間）。正の値を指定すると、経過時間がその値より短いキャッシュ済みコンテンツを使用します。0
            を指定すると新しいコンテンツを取得します。新たに取得するページにテキストレンダリングオプションを適用するには、0
            を指定してください。-1
            を指定すると常にキャッシュを使用します。省略した場合は、キャッシュ済みコンテンツがなければ取得を試みます。サポートされる最大値は 720
            時間です。
          example: 24
        filterEmptyResults:
          type: boolean
          description: コンテンツのない結果を除外
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: クロールするサブページの数。実際にクロールされる数は、システム上の制約によって制限される場合があります。
          example: 1
          default: 0
        subpageTarget:
          description: 検索結果の中から特定のサブページを見つけるための語句。単一の文字列または文字列の配列を指定できます。
          example: sources
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
      description: 各検索結果に適用するコンテンツ抽出オプション。すべてのフィールドは省略可能です。
    SummaryWithMaxTokensOptions:
      type: object
      properties:
        query:
          anyOf:
            - type: string
              description: LLM が生成する要約用のカスタムクエリ。
              example: Main developments
            - type: "null"
        maxTokens:
          type: integer
          minimum: 1
          description: 生成される要約の最大トークン数。
    SearchMonitorTrigger:
      type: object
      properties:
        type:
          type: string
          const: interval
          description: トリガーの種類。現在は `interval` のみサポートされています。
          default: interval
        period:
          type: string
          description: 'モニターの実行間隔を指定する文字列（例: "1h", "6h", "1d", "7d"）。指定できる単位は 1
            種類のみです。最小間隔は 1 時間です。スケジュールはモニターの作成時刻を基準とします（例: 午後 2 時 30
            分に作成した日次モニターは、毎日午後 2 時 30 分頃に実行されます）。'
          example: 6h
      required:
        - type
        - period
    SearchMonitorOutputSchema:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaText"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: 統合生成される出力の JSON スキーマ。サポートされるルート型は "text" と "object"
            です。指定すると、レスポンスにこのスキーマに従った内容の出力オブジェクトが含まれます。すべての検索タイプで使用でき、選択した検索タイプのレイテンシに加えて、情報の統合に約
            2 秒かかります。
          type: object
          discriminator:
            propertyName: type
            mapping:
              text: "#/components/schemas/OutputSchemaText"
              object: "#/components/schemas/OutputSchemaObject"
        - type: "null"
      description: '実行結果の形式を指定します。指定しない場合のデフォルトは `{ "type": "text" }` です。`type` が
        `"text"` の場合、出力はプレーンテキストの要約になります。`type` が `"object"` の場合、出力は構造化された JSON
        になります。`"object"` 型で `properties`
        を指定しない場合はスキーマが自動的に推定され、指定した場合は出力がそのスキーマに従います。'
    SearchMonitorWebhook:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Webhook イベントを受信する HTTPS URL。localhost またはプライベート IP アドレス範囲を指すことはできません。
        events:
          type: array
          items:
            type: string
            enum:
              - monitor.created
              - monitor.updated
              - monitor.deleted
              - monitor.run.created
              - monitor.run.completed
          description: 購読するイベント。指定しない場合は、すべてのイベントが対象になります。
      required:
        - url
    BatchMonitorsRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - delete
            - pause
            - unpause
          description: 条件に一致するモニターに対して実行する操作。`delete` はモニターを完全に削除し、`pause`
            はステータスを一時停止に、`unpause` は有効に設定します。
        filter:
          type: object
          properties:
            name:
              type: string
              maxLength: 250
              description: 名前で絞り込み（大文字と小文字を区別しない部分一致）
            status:
              type: string
              enum:
                - active
                - paused
                - disabled
              description: モニターのステータスで絞り込み
            metadata:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
                maxLength: 1000
              description: メタデータのキーと値の組で絞り込み（完全一致、AND 条件）
          description: 意図しない一括操作を防ぐため、フィルターのフィールドを少なくとも 1 つ指定する必要があります。
        dry_run:
          type: boolean
          description: "`true` の場合、操作を実行せずに、対象となるモニターを返します。デフォルトは `true` です。"
          default: true
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: 1 回のリクエストで処理するモニターの最大数。デフォルトは 50、上限は 500 です。
          default: 50
      required:
        - action
        - filter
    UpdateSearchMonitorParameters:
      type: object
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
          description: モニター名を更新
        status:
          type: string
          enum:
            - active
            - paused
          description: モニターのステータスを更新（設定できる値は `active` または `paused` のみ）
        search:
          type: object
          properties:
            query:
              type: string
              minLength: 1
              description: 検索に使用するクエリ文字列。
              example: Latest developments in LLM capabilities
            numResults:
              type: integer
              minimum: 1
              maximum: 100
              description: 返す結果の数。上限は検索タイプによって異なります。公開プランでの上限は 100
                件です。上限の引き上げについては営業担当（hello@exa.ai）にお問い合わせください。
              example: 10
              default: 10
            includeDomains:
              description: 検索結果をこれらのドメインに限定します。
              type: array
              items:
                type: string
            excludeDomains:
              description: これらのドメインを検索結果から除外します。
              type: array
              items:
                type: string
            contents:
              $ref: "#/components/schemas/SearchMonitorContents"
          description: 既存の設定にマージする検索パラメータ。更新時はすべてのフィールドを省略できます。
        trigger:
          anyOf:
            - type: object
              properties:
                type:
                  type: string
                  const: interval
                  description: トリガーの種類。現在は `interval` のみサポートされています。
                  default: interval
                period:
                  type: string
                  description: 'モニターの実行間隔を指定する文字列（例: "1h", "6h", "1d", "7d"）。指定できる単位は 1
                    種類のみです。最小間隔は 1 時間です。'
            - type: "null"
          description: スケジュールを更新します。削除するには null を設定します。
        outputSchema:
          $ref: "#/components/schemas/SearchMonitorOutputSchema"
        metadata:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
              description: 呼び出し元が独自の追跡用に指定する、キーと値の組からなるメタデータ。
              example:
                slack_channel_id: C123ABC
                slack_thread_id: "1745444400.123456"
                user_id: U123ABC
            - type: "null"
          description: メタデータを更新します。削除するには null を設定します。Webhook の配信にも含まれるため、更新情報を Slack
            などのシステムに振り分けることができます。
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        webhook:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: Webhook イベントを受信する HTTPS URL。localhost またはプライベート IP
                アドレス範囲を指すことはできません。
            events:
              type: array
              items:
                type: string
                enum:
                  - monitor.created
                  - monitor.updated
                  - monitor.deleted
                  - monitor.run.created
                  - monitor.run.completed
              description: 購読するイベント。指定しない場合は、すべてのイベントが対象になります。
          description: 既存の設定にマージする Webhook パラメータ。更新時はすべてのフィールドを省略できます。
    CreateAgentRunRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: リクエストの内容を示す自然言語の質問または指示。
          example: What are the most important AI infrastructure funding rounds announced
            this week?
        systemPrompt:
          type: string
          description: 生成される出力やエージェントの動作を導く追加の指示。情報源の優先設定、新規性や重複に関する制約、その他の動作指針を指定する際に使用します。
          example: Prefer official sources and avoid duplicate results.
        effort:
          $ref: "#/components/schemas/AgentEffort"
        input:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: JSON オブジェクト形式のレコード。
              description: エージェントが処理または補完するレコード。
            exclusion:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: JSON オブジェクト形式のレコード。
              description: エージェントが返さないようにするレコードまたはエンティティ。
          description: 処理対象のレコードと、回答から除外するレコードまたはエンティティ。
        outputSchema:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: "`output.structured` 内の検証済み構造化出力に使用する JSON Schema。裏付けとなる情報がないフィールドは
                `null` として返される場合があります。`$schema` によって draft-07、2019-09、2020-12
                をサポートします。"
            - type: "null"
