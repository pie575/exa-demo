                を指定すると新たにコンテンツを取得します。新たに取得したページにテキストレンダリングのオプションを適用する場合は、この方法を使用してください。-1
                を指定すると常にキャッシュを使用します。省略した場合、キャッシュがなければページの取得を試みます。サポートされる最大値は 720
