          $ref: "#/components/schemas/AgentRunId"
        object:
          type: string
          const: agent_run
        status:
          $ref: "#/components/schemas/AgentRunStatus"
        stopReason:
          anyOf:
            - $ref: "#/components/schemas/AgentStopReason"
            - type: "null"
          description: 运行停止的原因。运行处于排队或运行中时为 `null`。
        createdAt:
          type: string
          format: date-time
          description: 运行的创建时间
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          format: date-time
        request:
          anyOf:
            - $ref: "#/components/schemas/AgentRunRequest"
            - type: "null"
        output:
          $ref: "#/components/schemas/AgentRunOutput"
        usage:
          $ref: "#/components/schemas/AgentUsage"
        costDollars:
          $ref: "#/components/schemas/AgentCostDollars"
      required:
        - id
        - object
        - status
        - stopReason
        - createdAt
        - completedAt
        - request
        - output
        - usage
        - costDollars
      additionalProperties: false
    AgentRunStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
        - cancelled
    AgentStopReason:
      type: string
      enum:
        - schema_satisfied
        - budget_reached
        - stopped
        - error
        - cancelled
    AgentRunRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: 请求的自然语言问题或指令。
          example: What are the most important AI infrastructure funding rounds announced
            this week?
        systemPrompt:
          type: string
          description: 用于指导生成输出或 agent 行为的附加指令。可用于指定来源偏好、新颖性约束、去重约束或其他行为指导。
          example: Prefer official sources and avoid duplicate results.
        effort:
          $ref: "#/components/schemas/AgentEffort"
        input:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: JSON 对象记录。
              description: agent 应处理或丰富的记录。
            exclusion:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: JSON 对象记录。
              description: agent 应避免返回的记录或实体。
          additionalProperties: false
        outputSchema:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: 用于验证 `output.structured` 中结构化输出的 JSON Schema。缺乏证据支持的 field 可返回为
                `null`。通过 `$schema` 支持 draft-07、2019-09 和 2020-12。
            - type: "null"
        previousRunId:
          $ref: "#/components/schemas/AgentRunId"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: 调用方提供的键值元数据，供自行跟踪使用。
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        dataSources:
          type: array
          items:
            $ref: "#/components/schemas/AgentDataSourceOutput"
          description: 为该运行配置的 Exa Connect 数据提供方。
        budget:
          $ref: "#/components/schemas/AgentBudgetOutput"
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
      description: 与运行一同存储的规范化请求 field。
    AgentRunOutput:
      type: object
      properties:
        text:
          type: string
          description: 自然语言答案或摘要。
        structured:
          anyOf:
            - $ref: "#/components/schemas/JsonValue"
            - type: "null"
          description: 由 `outputSchema` 定义的 JSON；缺乏证据支持的 field 可能为 `null`。未提供 schema 时为
            `null`。
        grounding:
          type: array
          items:
            $ref: "#/components/schemas/AgentGrounding"
          description: 该运行生成的 field 级引用来源。
      required:
        - text
        - structured
        - grounding
      additionalProperties: false
    AgentGrounding:
      type: object
      properties:
        field:
          type: string
          description: 引用来源所支持的输出 field。
          example: structured.companies[0].sourceUrl
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AgentCitation"
        confidence:
          anyOf:
            - type: string
              enum:
                - low
                - medium
                - high
              description: 模型报告的该 field 的可靠性。
            - type: "null"
      required:
        - field
        - citations
      additionalProperties: false
    AgentCitation:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: 来源 URL。
        title:
          type: string
          description: 来源标题。
      required:
        - url
      additionalProperties: false
    AgentUsage:
      type: object
      properties:
        agentComputeUnits:
          type: number
          minimum: 0
        searches:
          type: integer
          minimum: 0
        emails:
          type: integer
          minimum: 0
        phoneNumbers:
          type: integer
          minimum: 0
        dataSources:
          $ref: "#/components/schemas/AgentDataSourceUsage"
      required:
        - agentComputeUnits
        - searches
        - emails
        - phoneNumbers
      additionalProperties: false
    AgentDataSourceUsage:
      type: object
      propertyNames:
        type: string
      additionalProperties:
        type: integer
        minimum: 0
      description: 运行期间使用的 Exa Connect 数据源按提供方统计的工具调用次数。键为提供方名称（例如
        `fiber`、`similarweb`）。仅包含用量非零的提供方。
    AgentCostDollars:
      type: object
      properties:
        total:
          type: number
          minimum: 0
        agentCompute:
          type: number
          minimum: 0
        search:
          type: number
          minimum: 0
        emails:
          type: number
          minimum: 0
        phoneNumbers:
          type: number
          minimum: 0
        dataSources:
          $ref: "#/components/schemas/AgentDataSourceCost"
      required:
        - total
        - agentCompute
        - search
        - emails
        - phoneNumbers
      additionalProperties: false
    AgentDataSourceCost:
      type: object
      propertyNames:
        type: string
      additionalProperties:
        type: number
        minimum: 0
      description: 运行期间使用的 Exa Connect 数据源按提供方统计的美元费用。键为提供方名称（例如
        `fiber`、`similarweb`）。仅包含用量非零的提供方。
    AgentErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/AgentError"
      required:
        - error
      additionalProperties: false
    AgentError:
      type: object
      properties:
        type:
          type: string
          enum:
            - INVALID_REQUEST
            - AUTHENTICATION_ERROR
            - RATE_LIMIT_ERROR
            - NOT_FOUND
            - SERVER_ERROR
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - TEAM_NOT_FOUND
            - RUN_NOT_FOUND
            - PREVIOUS_RUN_NOT_FOUND
            - PREVIOUS_RUN_NOT_COMPLETED
            - CONCURRENCY_LIMIT_REACHED
            - INVALID_OUTPUT_SCHEMA
            - INVALID_DATA_SOURCE
            - TIMEOUT
            - SERVER_ERROR
        message:
          type: string
      required:
        - type
        - code
        - message
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    AgentRunList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
        hasMore:
          type: boolean
          description: 是否还有更多结果
        nextCursor:
          anyOf:
            - $ref: "#/components/schemas/AgentRunId"
            - type: "null"
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    DeleteAgentRunResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/AgentRunId"
        object:
          type: string
          const: agent_run.deleted
        deleted:
          type: boolean
          const: true
      required:
        - id
        - object
        - deleted
      additionalProperties: false
    AgentRunEventList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentRunEvent"
        hasMore:
          type: boolean
          description: 是否还有更多结果
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    Batch:
      type: object
      properties:
        id:
          type: string
          description: 批次 ID。新批次 ID 以 `batch_` 为前缀。
          example: batch_01j7x9v0m2n4p6q8r0s2t4v6w8
        object:
          type: string
          const: batch
          description: 对象类型，始终为 `batch`。
        status:
          $ref: "#/components/schemas/BatchStatus"
        requestCounts:
          $ref: "#/components/schemas/BatchRequestCounts"
        createdAt:
          type: string
          format: date-time
          description: 批次创建时间。
        expiresAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: 批次过期时间；若不会过期，则为 `null`。
          format: date-time
        endedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: 批次达到终止状态的时间；仍在运行时为 `null`。
          format: date-time
        resultsUrl:
          anyOf:
            - type: string
            - type: "null"
          description: 批次结果文件（JSONL）的短期预签名下载 URL；批次完成前为 `null`。这是对象存储的直接下载链接，而非 API
            路由；请按原样获取，过期后重新获取批次以 mint 新 URL。
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: 调用方提供的键值元数据，用于自行跟踪。
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
      required:
        - id
        - object
        - status
        - requestCounts
        - createdAt
        - expiresAt
        - endedAt
        - resultsUrl
        - metadata
      additionalProperties: false
    BatchStatus:
      type: string
      enum:
        - in_progress
        - completed
        - cancelling
        - cancelled
        - expired
      description: 批次的生命周期状态。
    BatchRequestCounts:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
          description: 批次中的请求总数。
        completed:
          type: integer
          minimum: 0
          description: 已成功完成的请求。
        failed:
          type: integer
          minimum: 0
          description: 失败的请求。
      required:
        - total
        - completed
        - failed
      additionalProperties: false
    BatchList:
      type: object
      properties:
        object:
          type: string
          const: list
          description: 对象类型，始终为 `list`。
        data:
          type: array
          items:
            $ref: "#/components/schemas/Batch"
          description: 批次列表页，最新的排在前面。
        hasMore:
          type: boolean
          description: 是否还有更多结果
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
          description: 下一页的 cursor
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    DeletedBatch:
      type: object
      properties:
        id:
          type: string
          description: 已删除批次的 ID。
        object:
          type: string
          const: batch.deleted
          description: 对象类型，始终为 `batch.deleted`。
        deleted:
          type: boolean
          const: true
          description: 删除成功时始终为 `true`。
      required:
        - id
        - object
        - deleted
      additionalProperties: false
    WebsetsTeamInfo:
      type: object
      properties:
        object:
          type: string
          const: team
          description: 对象类型，始终为 `"team"`。
        id:
          type: string
          description: 团队的唯一标识符。
        name:
          type: string
          description: 团队名称。
        concurrency:
          type: object
          properties:
            active:
              type: integer
              description: 当前正在处理的请求数。
            queued:
              type: integer
              description: 当前排队的请求数。
          required:
            - active
            - queued
          additionalProperties: false
          description: 当前并发使用情况。
        limits:
          type: object
          properties:
            maxConcurrent:
              anyOf:
                - type: integer
                - type: "null"
              description: 允许的最大并发请求数。`null` 表示无限制。
            maxQueued:
              anyOf:
                - type: integer
                - type: "null"
              description: 允许的最大排队请求数。`null` 表示无限制。
          required:
            - maxConcurrent
            - maxQueued
          additionalProperties: false
          description: 团队的并发限制。
      required:
        - object
        - id
        - name
        - concurrency
        - limits
      additionalProperties: false
    AnswerStreamChunk:
      description: "`/answer` Server-Sent Events 流中每个 JSON 负载的 schema。每个事件均以 `data:
        <json>` 形式发送。"
      oneOf:
        - $ref: "#/components/schemas/AnswerStreamTextDeltaChunk"
        - $ref: "#/components/schemas/AnswerStreamCitationsChunkOutput"
        - $ref: "#/components/schemas/AnswerStreamCostChunkOutput"
        - $ref: "#/components/schemas/AnswerStreamErrorChunkOutput"
    SearchStreamChunk:
      oneOf:
        - $ref: "#/components/schemas/SearchStreamTextDeltaChunkOutput"
        - $ref: "#/components/schemas/SearchStreamGroundingChunkOutput"
        - $ref: "#/components/schemas/SearchStreamResultsChunkOutput"
        - $ref: "#/components/schemas/SearchStreamResetChunkOutput"
        - $ref: "#/components/schemas/SearchStreamDoneChunkOutput"
        - $ref: "#/components/schemas/SearchStreamErrorChunkOutput"
      description: "`/search` Server-Sent Events 流中每个 JSON 负载的 schema。每个事件均以 `data:
        <json>` 形式发送，流以 `data: [DONE]` 结束；此 JSON schema 不表示该结束标记。"
      type: object
      discriminator:
        propertyName: type
        mapping:
          text-delta: "#/components/schemas/SearchStreamTextDeltaChunkOutput"
          grounding: "#/components/schemas/SearchStreamGroundingChunkOutput"
          results: "#/components/schemas/SearchStreamResultsChunkOutput"
          stream-reset: "#/components/schemas/SearchStreamResetChunkOutput"
          done: "#/components/schemas/SearchStreamDoneChunkOutput"
          error: "#/components/schemas/SearchStreamErrorChunkOutput"
    AgentRunEvent:
      type: object
      properties:
        id:
          type: string
          description: 运行内的事件 ID。
        event:
          type: string
          enum:
            - agent_run.created
            - agent_run.started
            - agent_run.completed
            - agent_run.failed
            - agent_run.cancelled
        data:
          $ref: "#/components/schemas/JsonValue"
        createdAt:
          type: string
          format: date-time
          description: 事件创建时间
      required:
        - id
        - event
        - data
        - createdAt
      additionalProperties: false
    SearchResultOutput:
      type: object
      properties:
        title:
          type: string
          description: 搜索结果的标题。
          example: A Comprehensive Overview of Large Language Models
        url:
          type: string
          description: 搜索结果的 URL。
          example: https://arxiv.org/pdf/2307.06435.pdf
          format: uri
        publishedDate:
          description: 通过解析 HTML 内容估算的创建日期。格式为 YYYY-MM-DD。
          example: 2023-11-16T01:36:32.547Z
          format: date-time
          type: string
        author:
          description: 内容作者（如有）。
          example: Humza Naveed
          anyOf:
            - type: string
            - type: "null"
        id:
          description: 文档的临时 ID。可用于 `/contents` 端点。
          example: https://arxiv.org/abs/2307.06435
          type: string
        image:
          description: 与搜索结果关联的图片 URL（如有）。
          example: https://arxiv.org/pdf/2307.06435.pdf/page_1.png
          format: uri
          type: string
        favicon:
          description: 搜索结果所在域名的 favicon URL。
          example: https://arxiv.org/favicon.ico
          format: uri
          type: string
        text:
          description: 搜索结果的完整内容文本。
          example: Abstract Large Language Models (LLMs) have recently demonstrated
            remarkable capabilities...
          type: string
        highlights:
          description: 从搜索结果内容中提取的 highlights 数组。
          example:
            - Such requirements have limited their adoption...
          type: array
          items:
            type: string
        highlightScores:
          description: 各高亮片段的余弦相似度分数数组。
          example:
            - 0.4600165784358978
          type: array
          items:
            type: number
            format: float
        summary:
          description: 网页摘要。
          example: This overview paper on Large Language Models (LLMs) highlights key
            developments...
          type: string
        subpages:
          description: 搜索结果的子页面数组。
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                description: 搜索结果的标题。
                example: A Comprehensive Overview of Large Language Models
              url:
                type: string
                description: 搜索结果的 URL。
                example: https://arxiv.org/pdf/2307.06435.pdf
                format: uri
              publishedDate:
                description: 通过解析 HTML 内容估算的创建日期。格式为 YYYY-MM-DD。
                example: 2023-11-16T01:36:32.547Z
                format: date-time
                type: string
              author:
                description: 内容作者（如有）。
                example: Humza Naveed
                anyOf:
                  - type: string
                  - type: "null"
              id:
                description: 文档的临时 ID。可用于 `/contents` 端点。
                example: https://arxiv.org/abs/2307.06435
                type: string
              image:
                description: 与搜索结果关联的图片 URL（如有）。
                example: https://arxiv.org/pdf/2307.06435.pdf/page_1.png
                format: uri
                type: string
              favicon:
                description: 搜索结果所在域名的 favicon URL。
                example: https://arxiv.org/favicon.ico
                format: uri
                type: string
            required:
              - title
              - url
            additionalProperties: false
        entities:
          description: 公司、人员或出版物搜索结果的结构化实体数据。仅针对支持实体数据的类别返回。
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/SearchCompanyEntityOutput"
              - $ref: "#/components/schemas/SearchPersonEntityOutput"
              - $ref: "#/components/schemas/SearchPublicationEntityOutput"
            type: object
            discriminator:
              propertyName: type
              mapping:
                company: "#/components/schemas/SearchCompanyEntityOutput"
                person: "#/components/schemas/SearchPersonEntityOutput"
                publication: "#/components/schemas/SearchPublicationEntityOutput"
        extras:
          description: extras 返回的结果。仅在通过 `contents.extras` 请求时返回相应 field。
          example:
            links: []
          type: object
          properties:
            links:
              description: 搜索结果中的链接数组。
              example: []
              type: array
              items:
                type: string
            imageLinks:
              description: 搜索结果中的图片 URL 数组。
              example: []
              type: array
              items:
                type: string
            richImageLinks:
              description: 包含替代文本的图片数组，顺序与图片在页面中的出现顺序一致。
              example:
                - url: https://exa.ai/images/illustrations/api_illustration4.webp
                  alt: High rate limits, low latency and high reliability.
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: 图片的 URL。
                  alt:
                    description: 图片的替代文本（如果页面提供）。
                    type: string
                required:
                  - url
                additionalProperties: false
            richLinks:
              description: 包含锚文本的链接数组，顺序与链接在页面中的出现顺序一致。
              example:
                - url: https://dashboard.exa.ai
                  anchor: API Dashboard
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: 链接的 URL。
                  anchor:
                    description: 链接的锚文本（如果页面提供）。
                    type: string
                required:
                  - url
                additionalProperties: false
            codeBlocks:
              description: 搜索结果中的代码块数组。
              example:
                - text: pip install exa-py
                  source: bash
              type: array
              items:
                type: object
                properties:
                  text:
                    type: string
                    description: 代码块的内容。
                  source:
                    type: string
                    description: 代码块标注的语言（如有）。
                required:
                  - text
                  - source
                additionalProperties: false
          additionalProperties: false
      required:
        - title
        - url
      additionalProperties: false
    SearchCompanyEntityOutput:
      type: object
      properties:
        id:
          type: string
