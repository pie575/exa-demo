          type: boolean
          description: 如果为 true，则以服务器发送事件（SSE）流的形式返回响应。
          default: false
        text:
          type: boolean
          title: Simple text retrieval
          description: 如果为 true，则使用默认设置返回完整页面文本。如果为 false，则不返回文本。
          default: false
