                  description: 为每个结果返回的富图片链接数量。
                  default: 0
                - type: "null"
            richLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 为每个结果返回的富链接数量。
                  default: 0
                - type: "null"
            codeBlocks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 为每个结果返回的代码块数量。
                  default: 0
                - type: "null"
          description: 要传递的额外参数。
        context:
          description: 已弃用：请改用 highlights 或 text。将页面内容作为合并的上下文字符串返回。
          deprecated: true
          oneOf:
            - type: boolean
              description: 已弃用：请改用 highlights 或 text。将页面内容作为合并的上下文字符串返回。
              example: true
              deprecated: true
            - type: object
              properties:
                maxCharacters:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: 已弃用。上下文字符串的最大字符限制。支持的最大值为 10000。
                  example: 10000
              description: 已弃用：请改用 highlights 或 text。将页面内容作为合并的上下文字符串返回。
              deprecated: true
        livecrawl:
          description: 获取页面内容的抓取策略
          oneOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
            - type: string
              const: auto
        livecrawlTimeout:
          type: integer
          exclusiveMinimum: 0
          maximum: 90000
          description: 实时抓取的超时时间（毫秒）。
          example: 1000
          default: 10000
        maxAgeHours:
          type: integer
          minimum: -1
          maximum: 720
          description: 缓存内容的最长缓存时间（小时）。正值表示当缓存内容的缓存时间小于该值时使用缓存内容；0
            表示获取最新内容，也是将文本渲染选项应用于新获取页面的受支持方式；-1
            表示始终使用缓存；省略时，如果缓存内容不可用，则会回退到重新获取。支持的最大值为 720 小时。
          example: 24
        filterEmptyResults:
          type: boolean
          description: 过滤掉无内容的结果
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: 要抓取的子页面数量。实际抓取数量可能受系统限制。
          example: 1
          default: 0
        subpageTarget:
          description: 用于在搜索结果中查找特定子页面的词语。可以是单个字符串或字符串数组。
          example: sources
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
      description: 应用于每个搜索结果的内容提取选项。所有 field 均为可选。
    SummaryWithMaxTokensOptions:
      type: object
      properties:
        query:
          anyOf:
            - type: string
              description: 用于 LLM 生成摘要的自定义 query。
              example: Main developments
            - type: "null"
        maxTokens:
          type: integer
          minimum: 1
          description: 生成摘要的最大 token 数。
    SearchMonitorTrigger:
      type: object
      properties:
        type:
          type: string
          const: interval
          description: 触发器类型。目前仅支持 `interval`。
          default: interval
        period:
          type: string
          description: 指定 monitor 运行频率的时长字符串（例如 "1h"、"6h"、"1d"、"7d"）。仅支持单一时间单位。最小间隔为 1
            小时。schedule 以 monitor 的创建时间为基准（例如，下午 2:30 创建的每日 monitor 会在每天约下午 2:30
            运行）。
          example: 6h
      required:
        - type
        - period
    SearchMonitorOutputSchema:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaText"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: 用于综合输出的 JSON schema。支持的根类型为 "text" 和 "object"。提供后，响应会包含一个内容符合此
            schema 的输出对象。适用于所有搜索类型，并会在所选搜索类型的基础上额外增加约 2 秒的综合延迟。
          type: object
          discriminator:
            propertyName: type
            mapping:
              text: "#/components/schemas/OutputSchemaText"
              object: "#/components/schemas/OutputSchemaObject"
        - type: "null"
      description: '控制运行输出的格式。未指定时默认为 `{ "type": "text" }`。当 `type` 为 `"text"`
        时，输出为纯文本摘要。当 `type` 为 `"object"` 时，输出为结构化 JSON。若未为 `"object"` 类型指定
        `properties`，则会自动推断 schema；否则输出将遵循提供的 schema。'
    SearchMonitorWebhook:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: 用于接收 webhook 事件的 HTTPS URL。不得指向 localhost 或私有 IP 地址范围。
        events:
          type: array
          items:
            type: string
            enum:
              - monitor.created
              - monitor.updated
              - monitor.deleted
              - monitor.run.created
              - monitor.run.completed
          description: 要订阅的事件。未指定时默认为所有事件。
      required:
        - url
    BatchMonitorsRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - delete
            - pause
            - unpause
          description: 对匹配的 monitors 执行的操作。`delete` 会将其永久删除，`pause` 会将其状态设为暂停，`unpause`
            会将其状态设为活跃。
        filter:
          type: object
          properties:
            name:
              type: string
              maxLength: 250
              description: 按名称过滤（不区分大小写的子字符串匹配）
            status:
              type: string
              enum:
                - active
                - paused
                - disabled
              description: 按 monitor 状态过滤
            metadata:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
                maxLength: 1000
              description: 按元数据键值对过滤（精确匹配，AND 语义）
          description: 必须至少提供一个过滤 field，以防止意外执行批量操作。
        dry_run:
          type: boolean
          description: 设为 `true` 时，返回会受影响的 monitors，但不执行操作。默认为 `true`。
          default: true
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: 单个请求中可处理的 monitors 最大数量。默认为 50，最大为 500。
          default: 50
      required:
        - action
        - filter
    UpdateSearchMonitorParameters:
      type: object
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
          description: 更新 monitor 名称
        status:
          type: string
          enum:
            - active
            - paused
          description: 更新 monitor 状态（只能设为 `active` 或 `paused`）
        search:
          type: object
          properties:
            query:
              type: string
              minLength: 1
              description: 搜索用的 query 字符串。
              example: Latest developments in LLM capabilities
            numResults:
              type: integer
              minimum: 1
              maximum: 100
              description: 要返回的结果数量。限制因搜索类型而异。公开的最大限制为 100 个结果。如需更高限制，请联系销售团队 (hello@exa.ai)。
              example: 10
              default: 10
            includeDomains:
              description: 将搜索结果限制在这些域名内。
              type: array
              items:
                type: string
            excludeDomains:
              description: 从搜索结果中排除这些域名。
              type: array
              items:
                type: string
            contents:
              $ref: "#/components/schemas/SearchMonitorContents"
          description: 要合并的部分搜索参数。更新时所有 field 均为可选。
        trigger:
          anyOf:
            - type: object
              properties:
                type:
                  type: string
                  const: interval
                  description: 触发器类型。目前仅支持 `interval`。
                  default: interval
                period:
                  type: string
                  description: 指定 monitor 运行频率的时长字符串（例如 "1h"、"6h"、"1d"、"7d"）。仅支持单一时间单位。最小间隔为 1 小时。
            - type: "null"
          description: 更新 schedule。设为 null 可移除 schedule。
        outputSchema:
          $ref: "#/components/schemas/SearchMonitorOutputSchema"
        metadata:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
              description: 调用方提供的键值元数据，用于自行跟踪。
              example:
                slack_channel_id: C123ABC
                slack_thread_id: "1745444400.123456"
                user_id: U123ABC
            - type: "null"
          description: 更新元数据。设为 null 可移除。该值会在 webhook 投递中原样返回，因此您可以将更新路由到 Slack 等系统。
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        webhook:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: 用于接收 webhook 事件的 HTTPS URL。不得指向 localhost 或私有 IP 地址范围。
            events:
              type: array
              items:
                type: string
                enum:
                  - monitor.created
                  - monitor.updated
                  - monitor.deleted
                  - monitor.run.created
                  - monitor.run.completed
              description: 要订阅的事件。未指定时默认为所有事件。
          description: 要合并的部分 webhook 参数。更新时所有 field 均为可选。
    CreateAgentRunRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: 请求所用的自然语言问题或指令。
          example: What are the most important AI infrastructure funding rounds announced
            this week?
        systemPrompt:
          type: string
          description: 用于指导生成输出或 agent 行为的附加指令。可用于指定来源偏好、新颖性限制、去重限制或其他行为指导。
          example: Prefer official sources and avoid duplicate results.
        effort:
          $ref: "#/components/schemas/AgentEffort"
        input:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: JSON 对象记录。
              description: agent 应处理或丰富的记录。
            exclusion:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: JSON 对象记录。
              description: agent 应避免返回的记录或实体。
          description: 要处理的记录，以及要从答案中排除的记录或实体。
        outputSchema:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: "`output.structured` 中经验证的结构化输出的 JSON Schema。不受证据支持的 field 可能返回为
                `null`。可通过 `$schema` 使用 draft-07、2019-09 和 2020-12。"
            - type: "null"
        previousRunId:
          description: 要继续执行的已完成运行 ID。必须属于同一团队。
          $ref: "#/components/schemas/AgentRunId"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: 调用方提供并与该运行一同存储的元数据。
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        dataSources:
          maxItems: 5
          type: array
          items:
            $ref: "#/components/schemas/AgentDataSource"
          description: 为该运行启用的 Exa Connect 数据提供方。每个条目会启用该提供方的所有工具。
        budget:
          $ref: "#/components/schemas/AgentBudget"
      required:
        - query
    AgentEffort:
      type: string
      enum:
