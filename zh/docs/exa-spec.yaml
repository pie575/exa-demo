          type: string
          description: 用于指导生成输出或 agent 行为的附加说明。可用于指定来源偏好、新颖性约束、去重约束或其他行为指导。
          example: Prefer official sources and avoid duplicate results.
        userLocation:
          anyOf:
            - type: string
              description: 用户所在国家/地区的两字母 ISO 国家代码，例如 US。
              example: US
            - type: "null"
