          type: object
          properties:
            type:
              type: string
              description: 根 schema 类型（通常为 "object"）。
              example: object
            properties:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: 一个对象，其中每个键都是属性名称，每个值都是描述该属性的 JSON Schema（包含 `type`、`description`
                等）。
            required:
              type: array
              items:
                type: string
              description: 必填属性名称列表。
            description:
              type: string
              description: schema 的描述。
            additionalProperties:
              type: boolean
              description: 是否允许 `properties` 中未列出的属性。
              default: false
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: 用于定义所需答案结构的 [JSON Schema Draft 7](https://json-schema.org/draft-07)
            规范。提供后，答案将作为符合该 schema 的结构化对象返回，而非普通字符串。
