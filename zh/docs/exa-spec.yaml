components:
  schemas:
    SearchRequest:
      type: object
      properties:
        includeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: 要包含在搜索中的域名或域名路径列表。每个条目可以是主机名（例如 `example.com`）、带路径前缀的主机名（例如
                `example.com/docs`），或通配符子域名（例如
                `*.example.com`）。如果指定，仅会返回来自匹配域名或路径的结果。请使用此参数进行域名或路径过滤，而不要在
                query 中添加 `site:` 运算符。
              example:
                - arxiv.org
                - exa.ai/blog
            - type: "null"
        excludeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: 要从搜索结果中排除的域名或域名路径列表。每个条目可以是主机名（例如 `example.com`）、带路径前缀的主机名（例如
                `example.com/docs`），或通配符子域名（例如
                `*.example.com`）。如果指定，不会返回来自匹配域名或路径的结果。请使用此参数进行域名或路径过滤，而不要在
                query 中添加 `site:` 运算符。
              example:
                - docs.python.org/3
            - type: "null"
        startCrawlDate:
          anyOf:
            - type: string
              description: 已弃用且无效；API 会忽略此参数。必须采用 ISO 8601 格式指定。
              example: 2023-01-01T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        endCrawlDate:
          anyOf:
            - type: string
              description: 已弃用且无效；API 会忽略此参数。必须采用 ISO 8601 格式指定。
              example: 2023-12-31T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        startPublishedDate:
          anyOf:
            - type: string
              description: 仅返回发布日期晚于此日期的链接。必须采用 ISO 8601 格式指定。
              example: 2023-01-01T00:00:00.000Z
              format: date-time
            - type: "null"
        endPublishedDate:
          anyOf:
            - type: string
              description: 仅返回发布日期早于此日期的链接。必须采用 ISO 8601 格式指定。
              example: 2023-12-31T00:00:00.000Z
              format: date-time
            - type: "null"
        numResults:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 100
              description: 要返回的结果数量。限制因搜索类型而异。公开可用的最大限制为 100 个结果。如需更高限制，请联系销售团队（hello@exa.ai）。
              example: 10
              default: 10
            - type: "null"
        context:
          anyOf:
