    SearchMonitorSearchOutput:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: 用于搜索的 query 字符串。
          example: Latest developments in LLM capabilities
        numResults:
          type: integer
          minimum: 1
          maximum: 100
          description: 要返回的结果数量。限制因搜索类型而异。公开最大限制为 100 个结果。如需更高限制，请联系销售团队（hello@exa.ai）。
          example: 10
          default: 10
        includeDomains:
          description: 将搜索结果限制在这些域名内。
          type: array
          items:
            type: string
        excludeDomains:
          description: 从搜索结果中排除这些域名。
          type: array
          items:
            type: string
        contents:
          $ref: "#/components/schemas/SearchMonitorContentsOutput"
      required:
        - query
      additionalProperties: false
    SearchMonitorContentsOutput:
      type: object
      properties:
        text:
          description: 每个结果的文本提取选项。
          oneOf:
            - type: boolean
              title: Simple text retrieval
              description: 如果为 true，则使用默认设置返回完整页面文本。如果为 false，则不返回文本。
              default: false
            - type: object
              properties:
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: 完整页面文本的最大字符数限制。可用于控制响应大小和 API 费用。支持的最大值为 10000。
                      example: 1000
                    - type: "null"
                includeHtmlTags:
                  anyOf:
                    - type: boolean
                      description: "如果为 true，则在返回的文本中包含轻量级 HTML tag，而非纯 Markdown
                        风格文本。需要将此设置应用于新抓取的内容时，请使用 maxAgeHours: 0。"
                      example: false
                      default: false
                    - type: "null"
                verbosity:
                  anyOf:
                    - type: string
                      enum:
                        - compact
                        - standard
                        - full
                      description: "控制文本渲染的详细程度。compact 聚焦主要内容，standard 包含更多周边页面上下文，full
                        请求最完整的渲染文本。某些页面的 standard 和 full
                        输出可能相同。需要将此设置应用于新抓取的内容时，请使用 maxAgeHours: 0。"
                      example: standard
                      default: compact
                    - type: "null"
                includeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "尽力而为。仅包含归类到这些语义页面区段的内容。某些页面的区段分类可能不可用或不完整；如需严格过滤，请验证输出。需要将此设置应用于新\
                        抓取的内容时，请使用 maxAgeHours: 0。"
                      example:
                        - body
                        - header
                    - type: "null"
                excludeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "排除归类到这些语义页面区段的内容。区段分类采用尽力而为的方式。需要将此设置应用于新抓取的内容时，请使用 maxAgeHours:
                        0。"
                      example:
                        - navigation
                        - footer
                        - sidebar
                    - type: "null"
              additionalProperties: false
              title: Advanced text options
              description: 用于控制文本提取的高级选项。需要限制文本长度或保留 HTML 结构时使用此项。
        highlights:
          description: LLM 从每个页面中识别出的最相关文本片段。
          oneOf:
            - type: boolean
              title: Simple highlights retrieval
              description: 如果为 true，则使用默认设置返回 highlights。如果为 false，则不返回 highlights。
              default: false
            - type: object
              properties:
                query:
                  anyOf:
                    - type: string
                      description: 用于引导 LLM 选择 highlights 的自定义 query。
                      example: Key advancements
                    - type: "null"
                verbosity:
                  anyOf:
                    - type: string
                      enum:
                        - low
                        - medium
                        - high
                      description: "预设 highlights 长度：`low`、`medium` 和 `high` 会为返回的 highlights 依次分配更大的
                        token 预算。使用 highlights.dynamic 时，预设会为整个结果集设置单个共享预算，而非按
                        URL 设置预算。具体预算由 Exa 调整，可能发生变化。与 maxCharacters 或
                        numSentences 不兼容。Beta：需要 `Exa-Beta:
                        dynamic-highlights-2026-08-28` 请求 header；未提供该 header 而设置
                        `verbosity` 的请求会被拒绝。"
                      example: medium
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                dynamic:
                  anyOf:
                    - type: boolean
                      description: "启用 Dynamic
                        Highlights（研究预览）：综合考虑所有结果，并为整个结果集分配单个共享上下文预算，而非按文档分配预算。与
                        maxCharacters 不兼容。Beta：需要 `Exa-Beta:
                        dynamic-highlights-2026-08-28` 请求 header；未提供该 header 而设置
                        `dynamic` 的请求会被拒绝。"
                      example: true
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: highlights 返回的最大字符数。控制每个 URL 返回的 highlights 文本总长度。支持的最大值为 10000。与
                        highlights.dynamic 不兼容。
                      example: 2000
                    - type: "null"
                numSentences:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "已弃用，将在未来版本中移除。目前映射为每句约 1333 个字符的字符预算。传入 highlights: true 可获取默认
                        highlights，或传入 { query } 以使用自己的 query 引导选择。"
                      example: 1
                      deprecated: true
                    - type: "null"
                highlightsPerUrl:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "已弃用，将在未来版本中移除。目前会被忽略。传入 highlights: true 可获取默认 highlights，或传入 {
                        query } 以使用自己的 query 引导选择。"
                      example: 1
                      deprecated: true
                    - type: "null"
              additionalProperties: false
              title: Advanced highlights options
              description: "用于引导 highlights 提取的高级选项。传入 highlights: true 可获得质量最高的默认结果；仅当需要使用自己的
                query 引导选择时才提供此对象。"
        summary:
          description: 返回由 LLM 生成的摘要。传入 `true` 使用默认值，或传入包含 `query` 和 `maxTokens` 的对象。
          oneOf:
            - type: boolean
            - $ref: "#/components/schemas/SummaryWithMaxTokensOptionsOutput"
        extras:
          type: object
          properties:
            links:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 从每个网页返回的 URL 数量。
                  example: 1
                  default: 0
                - type: "null"
            imageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 每个结果返回的图片数量。
                  example: 1
                  default: 0
                - type: "null"
            richImageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 每个结果返回的富媒体图片链接数量。
                  default: 0
                - type: "null"
            richLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 每个结果返回的富媒体链接数量。
                  default: 0
                - type: "null"
            codeBlocks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 每个结果返回的代码块数量。
                  default: 0
                - type: "null"
          additionalProperties: false
          description: 要传递的额外参数。
        context:
          description: 已弃用：请改用 highlights 或 text。将页面内容作为合并的上下文字符串返回。
          deprecated: true
          oneOf:
            - type: boolean
              description: 已弃用：请改用 highlights 或 text。将页面内容作为合并的上下文字符串返回。
              example: true
              deprecated: true
            - type: object
              properties:
                maxCharacters:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: 已弃用。上下文字符串的最大字符数限制。支持的最大值为 10000。
                  example: 10000
              additionalProperties: false
              description: 已弃用：请改用 highlights 或 text。将页面内容作为合并的上下文字符串返回。
              deprecated: true
        livecrawl:
          description: 获取页面内容的抓取策略
          oneOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
            - type: string
              const: auto
        livecrawlTimeout:
          type: integer
          exclusiveMinimum: 0
          maximum: 90000
          description: livecrawling 的超时时间，单位为毫秒。
          example: 1000
          default: 10000
        maxAgeHours:
          type: integer
          minimum: -1
          maximum: 720
          description: 缓存内容的最大有效期，单位为小时。正值表示缓存内容未超过指定小时数时使用缓存；0
            表示获取最新内容，也是将文本渲染选项应用于新获取页面的受支持方式；-1
            表示始终使用缓存；省略时，如果缓存内容不可用，则使用回退抓取。支持的最大值为 720 小时。
          example: 24
        filterEmptyResults:
          type: boolean
          description: 过滤掉没有内容的结果
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: 要抓取的子页面数量。实际抓取数量可能受系统限制。
          example: 1
          default: 0
        subpageTarget:
          description: 用于查找搜索结果中特定子页面的词条。可以是单个字符串或字符串 array。
          example: sources
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
      additionalProperties: false
      description: 应用于每个搜索结果的内容提取选项。所有 field 均为可选。
    SummaryWithMaxTokensOptionsOutput:
      type: object
      properties:
        query:
          anyOf:
            - type: string
              description: 用于 LLM 生成摘要的自定义 query。
              example: Main developments
            - type: "null"
        maxTokens:
          type: integer
          minimum: 1
          description: 生成摘要的最大 token 数。
      additionalProperties: false
    SearchMonitorTriggerOutput:
      type: object
      properties:
        type:
          type: string
          const: interval
          description: 触发器类型。目前仅支持 `interval`。
          default: interval
        period:
          type: string
          description: 指定监控器运行频率的时长字符串（例如 "1h"、"6h"、"1d"、"7d"）。仅支持单个时间单位。最小 interval 为 1
            小时。schedule 以监控器创建时间为基准（例如，每日监控器若在下午 2:30 创建，之后每天将在下午 2:30 左右运行）。
          example: 6h
      required:
        - type
        - period
      additionalProperties: false
    SearchMonitorOutputSchemaOutput:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaTextOutput"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: 用于综合输出的 JSON schema。支持的根类型为 "text" 和 "object"。提供此项时，响应会包含一个内容符合该
            schema 的输出对象。适用于所有搜索类型，并会在所选搜索类型的基础上额外增加约 2 秒的综合延迟。
          type: object
          discriminator:
            propertyName: type
            mapping:
              text: "#/components/schemas/OutputSchemaTextOutput"
              object: "#/components/schemas/OutputSchemaObject"
        - type: "null"
      description: '控制运行输出的格式。未指定时，默认为 `{ "type": "text" }`。当 `type` 为 `"text"`
        时，输出为纯文本摘要；当 `type` 为 `"object"` 时，输出为结构化 JSON。若未为 `"object"` 类型指定
        `properties`，系统会自动推断 schema；否则输出将遵循所提供的 schema。'
    OutputSchemaTextOutput:
      type: object
      properties:
        type:
          type: string
          const: text
        description:
          type: string
      required:
        - type
      additionalProperties: false
    SearchMonitorWebhookOutput:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: 用于接收 webhook 事件的 HTTPS URL。不得指向 localhost 或私有 IP 地址范围。
        events:
          type: array
          items:
            type: string
            enum:
              - monitor.created
              - monitor.updated
              - monitor.deleted
              - monitor.run.created
              - monitor.run.completed
          description: 要订阅的事件。未指定时，默认订阅所有事件。
      required:
        - url
      additionalProperties: false
    AgentDataSourceOutput:
      type: object
      properties:
        provider:
          description: 要为该运行启用的 Exa Connect 数据提供方。默认可使用该提供方的所有工具。
          example: fiber
          $ref: "#/components/schemas/AgentDataSourceProvider"
      required:
        - provider
      additionalProperties: false
    AgentBudgetOutput:
      type: object
      properties:
        maxCostDollars:
          type: number
          description: 此次运行最多可花费的美元金额。可设为 $1–$100，仅适用于 `auto` 和 `max`；省略时，`auto` 的默认上限为
            $5，`max` 的默认上限为 $20。
          example: 10
      additionalProperties: false
      description: 适用于按量计费的 `auto` 和 `max` effort 的可选单次运行费用上限。提前完成的运行费用可能低于该上限。
    CreateWebsetParameters:
      properties:
        title:
          minLength: 1
          type: string
          description: 显示 Webset 时所用的可选名称。留空可由 Exa 自动生成名称。
          examples:
            - Leading climate tech startups
          nullable: true
        search:
          properties:
            query:
              minLength: 1
              maxLength: 5000
              description: |-
                描述您要查找内容的自然语言 search query。

                请具体说明您的要求、特征，以及任何有助于缩小结果范围的限制条件。

                提供的任何 URL 都会被抓取，并作为 search 的额外上下文。
              examples:
                - Marketing agencies based in the US, that focus on consumer
                  products.
                - AI startups in Europe that raised Series A funding in 2024
                - SaaS companies with 50-200 employees in the fintech space
              type: string
            count:
              default: 10
              description: |-
                Webset 将尝试查找的项目数量。

                实际找到的项目数量可能会因 search 的复杂程度而少于此数量。
              minimum: 1
              type: number
            entity:
              description: |-
                Webset 将返回结果所对应的实体。

                无需提供此项，我们会根据 query 中提供的所有信息自动识别实体。仅在需要更精细控制时使用此项。
              $ref: "#/components/schemas/Entity"
            criteria:
              description: >-
                评估每个项目时所依据的 criteria。


                无需提供您自己的 criteria，我们会根据 query 中提供的所有信息自动识别
                criteria。仅在需要更精细控制时使用此项。
              minItems: 1
              maxItems: 5
              items:
                title: CreateCriterionParameters
                $ref: "#/components/schemas/CreateCriterionParameters"
              type: array
            maxPeoplePerCompany:
              description: 适用于人员 search 的可选软上限。设置后，search 会尽量将来自同一现任雇主的匹配人员数量控制在此值以内。
              minimum: 1
              type: integer
            recall:
              description: |-
                是否估算此次 search 可能存在的相关结果总数。
                分析结果可在 search 请求的 `recall` field 中获取。
              type: boolean
            exclude:
              description: 要从 search 结果中排除的来源（现有导入或 webset）。这些来源中的结果将被省略，以避免在 search 期间返回它们。
              items:
                properties:
                  source:
                    enum:
                      - import
                      - webset
                    type: string
                  id:
                    minLength: 1
                    description: 要排除的来源 ID。
                    type: string
                required:
                  - source
                  - id
                type: object
              type: array
            scope:
              description: 将 search 限制在特定来源内（现有导入或 webset）。这些来源中符合 search criteria 的结果将被纳入
                Webset。
              items:
                properties:
                  source:
                    enum:
                      - import
                      - webset
                    type: string
                  id:
                    minLength: 1
                    description: 要 search 的来源 ID。
                    type: string
                  relationship:
                    properties:
                      definition:
                        description: 您希望找到的实体与所提供来源中实体之间的关系。
                        type: string
                      limit:
                        minimum: 1
                        maximum: 10
                        type: number
                    required:
                      - definition
                      - limit
                    type: object
                required:
                  - source
                  - id
                type: object
              type: array
          required:
            - query
          description: 为 Webset 创建初始 Search。
          type: object
        import:
          description: 将现有 Websets 和导入中的数据导入此 Webset。
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: 要导入的来源 ID。
                type: string
              evaluate:
                description: 为 true 时，将根据 search criteria 评估此次导入中的项目。需要提供 search。
                type: boolean
            required:
              - source
              - id
            type: object
          type: array
        enrichments:
          description: |-
            添加增强以从找到的项目中提取额外数据。

            增强会自动从添加到 Webset 的每个项目中查找并提取特定信息（如联系方式、融资数据、员工人数等）。
          items:
            title: CreateEnrichmentParameters
            $ref: "#/components/schemas/CreateEnrichmentParameters"
          type: array
        exclude:
          description: 适用于此 Webset 内所有操作的全局排除来源（现有导入或 webset）。这些来源中的结果将在所有 search 和导入操作中被省略。
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: 要排除的来源 ID。
                type: string
            required:
              - source
              - id
            type: object
