                  - type: "null"
              id:
                description: 文档的临时 ID。可用于 /contents 端点。
                example: https://arxiv.org/abs/2307.06435
                type: string
              image:
                description: 与搜索结果关联的图片 URL（如有）。
                example: https://arxiv.org/pdf/2307.06435.pdf/page_1.png
                format: uri
                type: string
              favicon:
                description: 搜索结果所在域名的站点图标 URL。
                example: https://arxiv.org/favicon.ico
                format: uri
                type: string
              text:
                description: 每个来源的 full text 内容。仅在请求文本页面内容时返回。
                example: SpaceX valued at $350bn as company agrees to buy shares from ...
