      description: 该运行的费用和推理 effort 偏好。`auto` 让 Exa 选择合适的 effort。`max` 是公开测试中 effort
        最高的层级，适用于完整性和全面性比延迟或费用更重要的工作，包括大型列表构建、深入的多来源研究，以及难以验证的 criteria。
