    ErrorResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Identifier unik untuk permintaan.
          example: b5947044c4b78efa9552a7c89b306d95
        error:
          type: string
          description: Pesan yang dapat dibaca manusia yang menjelaskan error.
          example: Invalid API key
        tag:
