                    - type: "null"
                highlightsPerUrl:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "Usang dan akan dihapus pada rilis mendatang. Saat ini diabaikan.
                        Berikan highlights: true untuk kutipan default, atau {
                        query } untuk memandu pemilihan dengan query Anda
                        sendiri."
                      example: 1
                      deprecated: true
                    - type: "null"
