  headers:
    XRequestId:
      description: Identifier unik untuk permintaan. Sesuai dengan field `requestId`
        yang dikembalikan dalam body response yang memuat field tersebut.
      schema:
        type: string
      example: 07e29bb1f4f1dd05f0d4b57bbcf6e4b8
    XExaQueued:
      description: Apakah permintaan menunggu dalam antrean rate limit pelanggan
        sebelum diterima.
      schema:
        type: string
        enum:
          - "true"
          - "false"
      example: "false"
    XExaQueueMs:
      description: Total milidetik waktu tunggu permintaan dalam antrean rate limit
        pelanggan.
      schema:
        type: string
      example: "0"
  responses:
    BadRequestResponse:
      description: Body permintaan atau parameter query gagal divalidasi.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 0a1b2c3d4e5f60718293a4b5c6d7e8f9
            error: "Invalid request body: query: Invalid input: expected string, received
              undefined"
            tag: INVALID_REQUEST_BODY
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedResponse:
      description: API key tidak ada atau tidak valid.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: f2a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2
            error: Invalid API key
            tag: INVALID_API_KEY
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequestsResponse:
      description: Rate limit untuk API key, Team, atau jaringan ini telah terlampaui.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 7f9b1d3e5a0c2e4b6d8f0a2c4e6b8d0f
            error: You've exceeded the Exa rate limit for your network. If you believe this
              is in error, please email hello@exa.ai :)
            tag: RATE_LIMIT_EXCEEDED
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerErrorResponse:
      description: Terjadi kesalahan tak terduga saat memproses permintaan.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 9b1d3f5e7a0c2e4b6d8f0a2c4e6b8d0f
            error: Sorry, we encountered an error while processing your request. Please try
              again later
            tag: DEFAULT_ERROR
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailableResponse:
      description: Exa untuk sementara kelebihan kapasitas atau tidak tersedia.
        Permintaan tidak diproses; coba lagi dengan exponential backoff.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: b3d5f7a9c1e0a2c4e6b8d0f2a4c6e8b1
            error: Exa is temporarily over capacity. Please retry with exponential backoff.
            tag: SERVICE_OVERLOADED
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaymentRequiredResponse:
      description: Team kehabisan credits atau melampaui anggaran pengeluaran.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 1c3e5a7b9d0f2a4c6e8b0d2f4a6c8e0b
            error: You have exceeded your credits limit. Please top up to keep using Exa at
              dashboard.exa.ai
