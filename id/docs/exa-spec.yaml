                example: https://arxiv.org/pdf/2307.06435.pdf/page_1.png
                format: uri
                type: string
              favicon:
                description: URL favicon untuk domain hasil search.
                example: https://arxiv.org/favicon.ico
                format: uri
                type: string
              text:
                description: Konten teks penuh setiap sumber. Hanya tersedia jika contents teks
                  diminta.
                example: SpaceX valued at $350bn as company agrees to buy shares from ...
                type: string
            required:
              - title
              - url
            additionalProperties: false
          description: Hasil search yang disitasi oleh jawaban stream final.
      required:
        - citations
      additionalProperties: false
    AnswerStreamCostChunkOutput:
      type: object
      properties:
        costDollars:
          $ref: "#/components/schemas/CostDollarsOutput"
        requestId:
          type: string
          description: Identifier unik untuk permintaan.
          example: b5947044c4b78efa9552a7c89b306d95
      required:
        - costDollars
      additionalProperties: false
    AnswerStreamErrorChunkOutput:
      type: object
      properties:
        tag:
          type: string
          const: ERROR
        payload:
          type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            requestId:
              type: string
              description: Identifier unik untuk permintaan.
              example: b5947044c4b78efa9552a7c89b306d95
          required:
            - error
          additionalProperties: false
      required:
        - tag
        - payload
      additionalProperties: false
    SearchMonitorSearchOutput:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: String query untuk search.
          example: Latest developments in LLM capabilities
        numResults:
          type: integer
          minimum: 1
          maximum: 100
          description: Jumlah hasil yang akan dikembalikan. Batas bervariasi menurut jenis
            search. Batas publik maksimum adalah 100 hasil. Hubungi tim sales
            (hello@exa.ai) untuk membahas batas yang lebih tinggi.
          example: 10
          default: 10
        includeDomains:
          description: Batasi hasil pencarian ke domain ini.
          type: array
          items:
            type: string
        excludeDomains:
          description: Kecualikan domain ini dari hasil pencarian.
          type: array
          items:
            type: string
        contents:
          $ref: "#/components/schemas/SearchMonitorContentsOutput"
      required:
        - query
      additionalProperties: false
    SearchMonitorContentsOutput:
      type: object
      properties:
        text:
          description: Opsi ekstraksi teks untuk setiap hasil.
          oneOf:
            - type: boolean
              title: Simple text retrieval
              description: Jika true, mengembalikan teks halaman lengkap dengan pengaturan
                default. Jika false, menonaktifkan pengembalian teks.
              default: false
            - type: object
              properties:
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: Batas karakter maksimum untuk teks halaman lengkap. Berguna untuk
                        mengontrol ukuran response dan biaya API. Nilai maksimum
                        yang didukung adalah 10000.
                      example: 1000
                    - type: "null"
                includeHtmlTags:
                  anyOf:
                    - type: boolean
                      description: "Jika true, sertakan tag HTML ringan dalam teks yang dikembalikan,
                        bukan teks biasa bergaya markdown. Gunakan maxAgeHours:
                        0 jika opsi ini perlu diterapkan pada konten yang baru
                        diambil."
                      example: false
                      default: false
                    - type: "null"
                verbosity:
                  anyOf:
                    - type: string
                      enum:
                        - compact
                        - standard
                        - full
                      description: "Mengontrol tingkat kerincian perenderan teks. compact berfokus
                        pada konten utama, standard menyertakan lebih banyak
                        konteks halaman di sekitarnya, dan full meminta teks
                        hasil render yang paling lengkap. Beberapa halaman
                        mungkin menghasilkan output standard dan full yang
                        identik. Gunakan maxAgeHours: 0 jika opsi ini perlu
                        diterapkan pada konten yang baru diambil."
                      example: standard
                      default: compact
                    - type: "null"
                includeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "Sebisa mungkin. Hanya sertakan konten yang diklasifikasikan ke
                        dalam bagian halaman semantik ini. Klasifikasi bagian
                        mungkin tidak tersedia atau tidak lengkap untuk beberapa
                        halaman; validasi output jika pemfilteran ketat
                        diperlukan. Gunakan maxAgeHours: 0 jika opsi ini perlu
                        diterapkan pada konten yang baru diambil."
                      example:
                        - body
                        - header
                    - type: "null"
                excludeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "Kecualikan konten yang diklasifikasikan ke dalam bagian halaman
                        semantik ini. Klasifikasi bagian dilakukan sebisa
                        mungkin. Gunakan maxAgeHours: 0 jika opsi ini perlu
                        diterapkan pada konten yang baru diambil."
                      example:
                        - navigation
                        - footer
                        - sidebar
                    - type: "null"
              additionalProperties: false
              title: Advanced text options
              description: Opsi lanjutan untuk mengontrol ekstraksi teks. Gunakan jika Anda
                perlu membatasi panjang teks atau menyertakan struktur HTML.
        highlights:
          description: Kutipan teks yang diidentifikasi LLM sebagai paling relevan dari
            setiap halaman.
          oneOf:
            - type: boolean
              title: Simple highlights retrieval
              description: Jika true, mengembalikan kutipan dengan pengaturan default. Jika
                false, menonaktifkan kutipan.
              default: false
            - type: object
              properties:
                query:
                  anyOf:
                    - type: string
                      description: Query khusus yang memandu pemilihan kutipan oleh LLM.
                      example: Key advancements
                    - type: "null"
                verbosity:
                  anyOf:
                    - type: string
                      enum:
                        - low
                        - medium
                        - high
                      description: "Prapreset panjang kutipan: `low`, `medium`, dan `high`
                        mengalokasikan anggaran token yang makin besar untuk
                        kutipan yang dikembalikan. Dengan highlights.dynamic,
                        prapreset menetapkan satu anggaran bersama untuk seluruh
                        kumpulan hasil, bukan anggaran per URL. Anggaran
                        pastinya ditentukan oleh Exa dan dapat berubah. Tidak
                        kompatibel dengan maxCharacters atau numSentences. Beta:
                        memerlukan header permintaan `Exa-Beta:
                        dynamic-highlights-2026-08-28`; permintaan yang
                        menetapkan `verbosity` tanpa header tersebut akan
                        ditolak."
                      example: medium
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                dynamic:
                  anyOf:
                    - type: boolean
                      description: "Aktifkan Dynamic Highlights (pratinjau Research): mempertimbangkan
                        semua hasil secara bersamaan dan mengalokasikan satu
                        anggaran konteks bersama untuk seluruh kumpulan hasil,
                        bukan anggaran per dokumen. Tidak kompatibel dengan
                        maxCharacters. Beta: memerlukan header permintaan
                        `Exa-Beta: dynamic-highlights-2026-08-28`; permintaan
                        yang menetapkan `dynamic` tanpa header tersebut akan
                        ditolak."
                      example: true
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: Jumlah karakter maksimum yang dikembalikan untuk kutipan.
                        Mengontrol total panjang teks kutipan yang dikembalikan
                        per URL. Nilai maksimum yang didukung adalah 10000.
                        Tidak kompatibel dengan highlights.dynamic.
                      example: 2000
                    - type: "null"
                numSentences:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "Usang dan akan dihapus dalam rilis mendatang. Saat ini dipetakan
                        ke anggaran karakter sekitar 1333 karakter per kalimat.
                        Berikan highlights: true untuk kutipan default, atau {
                        query } untuk memandu pemilihan dengan query sendiri."
                      example: 1
                      deprecated: true
                    - type: "null"
                highlightsPerUrl:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "Usang dan akan dihapus dalam rilis mendatang. Saat ini diabaikan.
                        Berikan highlights: true untuk kutipan default, atau {
                        query } untuk memandu pemilihan dengan query sendiri."
                      example: 1
                      deprecated: true
                    - type: "null"
              additionalProperties: false
              title: Advanced highlights options
              description: "Opsi lanjutan untuk mengarahkan ekstraksi kutipan. Berikan
                highlights: true untuk default dengan kualitas tertinggi;
                berikan objek ini hanya jika Anda perlu memandu pemilihan dengan
                query sendiri."
        summary:
          description: Kembalikan ringkasan yang dihasilkan LLM. Berikan `true` untuk
            default, atau objek dengan `query` dan `maxTokens`.
          oneOf:
            - type: boolean
            - $ref: "#/components/schemas/SummaryWithMaxTokensOptionsOutput"
        extras:
          type: object
          properties:
            links:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Jumlah URL yang dikembalikan dari setiap halaman web.
                  example: 1
                  default: 0
                - type: "null"
            imageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Jumlah gambar yang dikembalikan untuk setiap hasil.
                  example: 1
                  default: 0
                - type: "null"
            richImageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Jumlah tautan gambar kaya yang dikembalikan untuk setiap hasil.
                  default: 0
                - type: "null"
            richLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Jumlah tautan kaya yang dikembalikan untuk setiap hasil.
                  default: 0
                - type: "null"
            codeBlocks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Jumlah blok kode yang dikembalikan untuk setiap hasil.
                  default: 0
                - type: "null"
          additionalProperties: false
          description: Parameter tambahan untuk diberikan.
        context:
          description: "Usang: Gunakan kutipan atau teks sebagai gantinya. Mengembalikan
            konten halaman sebagai string konteks gabungan."
          deprecated: true
          oneOf:
            - type: boolean
              description: "Usang: Gunakan kutipan atau teks sebagai gantinya. Mengembalikan
                konten halaman sebagai string konteks gabungan."
              example: true
              deprecated: true
            - type: object
              properties:
                maxCharacters:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: Usang. Batas karakter maksimum untuk string konteks. Nilai maksimum
                    yang didukung adalah 10000.
                  example: 10000
              additionalProperties: false
              description: "Usang: Gunakan kutipan atau teks sebagai gantinya. Mengembalikan
                konten halaman sebagai string konteks gabungan."
              deprecated: true
        livecrawl:
          description: Strategi crawl untuk mengambil konten halaman
          oneOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
            - type: string
              const: auto
        livecrawlTimeout:
          type: integer
          exclusiveMinimum: 0
          maximum: 90000
          description: Batas waktu livecrawling dalam milidetik.
          example: 1000
          default: 10000
        maxAgeHours:
          type: integer
          minimum: -1
          maximum: 720
          description: Usia maksimum konten cache dalam jam. Nilai positif menggunakan
            konten cache jika usianya kurang dari jumlah jam ini; 0 mengambil
            konten baru dan merupakan cara yang didukung untuk menerapkan opsi
            perenderan teks pada halaman yang baru diambil; -1 selalu
            menggunakan cache; jika dihilangkan, pengambilan fallback digunakan
            saat konten cache tidak tersedia. Nilai maksimum yang didukung
            adalah 720 jam.
          example: 24
        filterEmptyResults:
          type: boolean
          description: Filter hasil yang tidak memiliki konten
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: Jumlah subhalaman yang akan di-crawl. Jumlah sebenarnya yang
            di-crawl mungkin dibatasi oleh batasan sistem.
          example: 1
          default: 0
        subpageTarget:
          description: Istilah untuk menemukan subhalaman tertentu dari hasil pencarian.
            Dapat berupa satu string atau array string.
          example: sources
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
      additionalProperties: false
      description: Opsi ekstraksi konten yang diterapkan pada setiap hasil pencarian.
        Semua field bersifat opsional.
    SummaryWithMaxTokensOptionsOutput:
      type: object
      properties:
        query:
          anyOf:
            - type: string
              description: Query khusus untuk ringkasan yang dihasilkan LLM.
              example: Main developments
            - type: "null"
        maxTokens:
          type: integer
          minimum: 1
          description: Jumlah token maksimum untuk ringkasan yang dihasilkan.
      additionalProperties: false
    SearchMonitorTriggerOutput:
      type: object
      properties:
        type:
          type: string
          const: interval
          description: Jenis pemicu. Saat ini hanya `interval` yang didukung.
          default: interval
        period:
          type: string
          description: String durasi yang menentukan seberapa sering monitor berjalan
            (misalnya, "1h", "6h", "1d", "7d"). Hanya satu unit. Interval
            minimum adalah 1 jam. Jadwal ditambatkan ke waktu pembuatan monitor
            (misalnya, monitor harian yang dibuat pukul 14.30 berjalan setiap
            hari sekitar pukul 14.30).
          example: 6h
      required:
        - type
        - period
      additionalProperties: false
    SearchMonitorOutputSchemaOutput:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaTextOutput"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: Schema JSON untuk output synthesis. Tipe root yang didukung adalah
            "text" dan "object". Jika diberikan, response menyertakan objek
            output yang kontennya sesuai dengan schema ini. Berfungsi dengan
            semua search type dan menambahkan latency synthesis sekitar 2 detik
            di atas search type yang dipilih.
          type: object
          discriminator:
            propertyName: type
            mapping:
              text: "#/components/schemas/OutputSchemaTextOutput"
              object: "#/components/schemas/OutputSchemaObject"
        - type: "null"
      description: 'Mengatur format output run. Nilai defaultnya adalah `{ "type":
        "text" }` jika tidak ditentukan. Jika `type` adalah `"text"`, output
        berupa ringkasan teks biasa. Jika `type` adalah `"object"`, output
        berupa JSON terstruktur. Jika tidak ada `properties` yang ditentukan
        untuk tipe `"object"`, schema akan diinferensikan secara otomatis; jika
        tidak, output mengikuti schema yang diberikan.'
    OutputSchemaTextOutput:
      type: object
      properties:
        type:
          type: string
          const: text
        description:
          type: string
      required:
        - type
      additionalProperties: false
    SearchMonitorWebhookOutput:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL HTTPS untuk menerima event webhook. Tidak boleh mengarah ke
            localhost atau rentang IP privat.
        events:
          type: array
          items:
            type: string
            enum:
              - monitor.created
              - monitor.updated
              - monitor.deleted
              - monitor.run.created
              - monitor.run.completed
          description: Event yang akan dilanggani. Secara default, semua event digunakan
            jika tidak ditentukan.
      required:
        - url
      additionalProperties: false
    AgentDataSourceOutput:
      type: object
      properties:
        provider:
          description: Provider data Exa Connect yang akan diaktifkan untuk run. Semua
            tool provider tersedia secara default.
          example: fiber
          $ref: "#/components/schemas/AgentDataSourceProvider"
      required:
        - provider
      additionalProperties: false
    AgentBudgetOutput:
      type: object
      properties:
        maxCostDollars:
          type: number
          description: Jumlah maksimum yang dapat dibelanjakan oleh run ini dalam dolar
            AS. Menerima $1–$100 dan hanya berlaku untuk `auto` dan `max`; jika
            dihilangkan, batas default adalah $5 untuk `auto` dan $20 untuk
            `max`.
          example: 10
      additionalProperties: false
      description: Batas pengeluaran opsional per run untuk effort terukur `auto` dan
        `max`. Run yang selesai lebih awal mungkin berbiaya kurang dari batas
        tersebut.
    CreateWebsetParameters:
      properties:
        title:
          minLength: 1
          type: string
          description: Nama opsional yang muncul di mana pun Webset ditampilkan. Biarkan
            kosong agar Exa membuatnya secara otomatis.
          examples:
            - Leading climate tech startups
          nullable: true
        search:
          properties:
            query:
              minLength: 1
              maxLength: 5000
              description: >-
                Query search bahasa alami yang menjelaskan apa yang Anda cari.


                Jelaskan persyaratan, karakteristik, dan batasan Anda secara
                spesifik untuk membantu mempersempit hasil.


                URL apa pun yang diberikan akan dirayapi dan digunakan sebagai
                konteks tambahan untuk search.
              examples:
                - Marketing agencies based in the US, that focus on consumer
                  products.
                - AI startups in Europe that raised Series A funding in 2024
                - SaaS companies with 50-200 employees in the fintech space
              type: string
            count:
              default: 10
              description: >-
                Jumlah Item yang akan dicoba ditemukan oleh Webset.


                Jumlah Item yang benar-benar ditemukan mungkin kurang dari
                jumlah ini, bergantung pada kompleksitas search.
              minimum: 1
              type: number
            entity:
              description: >-
                Entitas yang hasilnya akan dikembalikan oleh Webset.


                Anda tidak wajib memberikannya karena kami akan mendeteksi
                entitas secara otomatis dari semua informasi dalam query.
                Gunakan ini hanya jika Anda memerlukan kontrol yang lebih
                terperinci.
              $ref: "#/components/schemas/Entity"
            criteria:
              description: >-
                Kriteria untuk mengevaluasi setiap item.


                Anda tidak wajib memberikan kriteria sendiri karena kami akan
                mendeteksi kriteria secara otomatis dari semua informasi dalam
                query. Gunakan ini hanya jika Anda memerlukan kontrol yang lebih
                terperinci.
              minItems: 1
              maxItems: 5
              items:
                title: CreateCriterionParameters
                $ref: "#/components/schemas/CreateCriterionParameters"
              type: array
            maxPeoplePerCompany:
              description: Batas lunak opsional untuk pencarian orang. Jika ditetapkan, search
                akan berupaya menyertakan paling banyak sejumlah orang yang
                cocok dari perusahaan tempat mereka saat ini bekerja yang sama.
              minimum: 1
              type: integer
            recall:
              description: >-
                Apakah akan memberikan perkiraan jumlah total hasil relevan yang
                mungkin ada untuk search ini.

                Hasil analisis akan tersedia di field `recall` dalam permintaan
                search.
              type: boolean
            exclude:
              description: Sources (impor atau webset yang ada) yang dikecualikan dari hasil
                search. Hasil apa pun yang ditemukan dalam sources ini akan
                dihilangkan agar tidak ditemukan dalam search.
              items:
                properties:
                  source:
                    enum:
                      - import
                      - webset
                    type: string
                  id:
                    minLength: 1
                    description: ID source yang akan dikecualikan.
                    type: string
                required:
                  - source
                  - id
                type: object
              type: array
            scope:
              description: Batasi search ke sources tertentu (impor atau webset yang ada).
                Hasil apa pun dalam sources ini yang sesuai dengan kriteria
                search akan disertakan dalam Webset.
              items:
                properties:
                  source:
                    enum:
                      - import
                      - webset
                    type: string
                  id:
                    minLength: 1
                    description: ID source yang akan dicari.
                    type: string
                  relationship:
                    properties:
                      definition:
                        description: Hubungan antara entitas yang ingin Anda temukan dan entitas dalam
                          source yang diberikan.
                        type: string
                      limit:
                        minimum: 1
                        maximum: 10
                        type: number
                    required:
                      - definition
                      - limit
                    type: object
                required:
                  - source
                  - id
                type: object
              type: array
          required:
            - query
          description: Buat Search awal untuk Webset.
          type: object
        import:
          description: Impor data dari Websets dan Impor yang ada ke dalam Webset ini.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: ID source yang akan diimpor.
                type: string
              evaluate:
                description: Jika true, item dari impor ini akan dievaluasi berdasarkan kriteria
                  search. Memerlukan search yang diberikan.
                type: boolean
            required:
              - source
              - id
            type: object
          type: array
        enrichments:
          description: >-
            Tambahkan enrichment untuk mengekstrak data tambahan dari item yang
            ditemukan.


            Enrichment secara otomatis mencari dan mengekstrak informasi
            spesifik (seperti detail kontak, data pendanaan, jumlah karyawan,
            dll.) dari setiap item yang ditambahkan ke Webset Anda.
          items:
            title: CreateEnrichmentParameters
            $ref: "#/components/schemas/CreateEnrichmentParameters"
          type: array
        exclude:
          description: Sources pengecualian global (impor atau webset yang ada) yang
            berlaku untuk semua operasi dalam Webset ini. Hasil apa pun yang
            ditemukan dalam sources ini akan dihilangkan dari semua operasi
            search dan impor.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: ID source yang akan dikecualikan.
                type: string
            required:
              - source
              - id
            type: object
          type: array
        externalId:
          description: >-
            Identifier eksternal untuk webset.


            Anda dapat menggunakannya untuk mereferensikan Webset dengan
            identifier internal Anda sendiri.
          maxLength: 300
          type: string
        metadata:
          description: Kumpulan pasangan kunci-nilai yang ingin Anda kaitkan dengan objek
            ini.
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
      examples:
        - search:
            query: Marketing agencies based in the US, that focus on consumer products.
            count: 10
      type: object
    Entity:
      oneOf:
        - $ref: "#/components/schemas/CompanyEntity"
        - $ref: "#/components/schemas/PersonEntity"
        - $ref: "#/components/schemas/ArticleEntity"
        - $ref: "#/components/schemas/ResearchPaperEntity"
        - $ref: "#/components/schemas/CustomEntity"
    CompanyEntity:
      properties:
        type:
          type: string
          const: company
          default: company
      required:
        - type
      title: Company
      type: object
    PersonEntity:
      properties:
        type:
          type: string
          const: person
          default: person
      required:
        - type
      title: Person
      type: object
    ArticleEntity:
      properties:
        type:
          type: string
          const: article
          default: article
      required:
        - type
      title: Article
      type: object
    ResearchPaperEntity:
      properties:
        type:
          type: string
