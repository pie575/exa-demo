                  default: 0
                - type: "null"
            richImageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Jumlah tautan gambar kaya yang dikembalikan untuk setiap hasil.
                  default: 0
                - type: "null"
            richLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Jumlah tautan kaya yang dikembalikan untuk setiap hasil.
                  default: 0
                - type: "null"
            codeBlocks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Jumlah blok kode yang dikembalikan untuk setiap hasil.
                  default: 0
                - type: "null"
          description: Parameter tambahan yang akan diteruskan.
        context:
          description: "Usang: Gunakan highlights atau text sebagai gantinya.
            Mengembalikan konten halaman sebagai satu string konteks gabungan."
          deprecated: true
          oneOf:
            - type: boolean
              description: "Usang: Gunakan highlights atau text sebagai gantinya.
                Mengembalikan konten halaman sebagai satu string konteks
                gabungan."
              example: true
              deprecated: true
            - type: object
              properties:
                maxCharacters:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: Usang. Batas karakter maksimum untuk string konteks. Nilai maksimum
                    yang didukung adalah 10000.
                  example: 10000
              description: "Usang: Gunakan highlights atau text sebagai gantinya.
                Mengembalikan konten halaman sebagai satu string konteks
                gabungan."
              deprecated: true
        livecrawl:
          description: Strategi crawling untuk mengambil konten halaman
          oneOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
            - type: string
              const: auto
        livecrawlTimeout:
          type: integer
          exclusiveMinimum: 0
          maximum: 90000
          description: Batas waktu livecrawling dalam milidetik.
          example: 1000
          default: 10000
        maxAgeHours:
          type: integer
          minimum: -1
          maximum: 720
          description: Usia maksimum konten cache dalam jam. Nilai positif menggunakan
            konten cache jika usianya kurang dari jumlah jam ini; 0 mengambil
            konten terbaru dan merupakan cara yang didukung untuk menerapkan
            opsi perenderan teks pada halaman yang baru diambil; -1 selalu
            menggunakan cache; jika dihilangkan, pengambilan fallback digunakan
            saat konten cache tidak tersedia. Nilai maksimum yang didukung
            adalah 720 jam.
          example: 24
        filterEmptyResults:
          type: boolean
          description: Filter hasil tanpa konten
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: Jumlah subhalaman yang akan di-crawl. Jumlah aktual yang di-crawl
            mungkin dibatasi oleh batasan sistem.
          example: 1
          default: 0
        subpageTarget:
          description: Istilah untuk menemukan subhalaman tertentu dari hasil search.
            Dapat berupa satu string atau array string.
          example: sources
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
      description: Opsi ekstraksi konten yang diterapkan pada setiap hasil pencarian.
        Semua field bersifat opsional.
    SummaryWithMaxTokensOptions:
      type: object
      properties:
        query:
          anyOf:
            - type: string
              description: Query kustom untuk ringkasan yang dihasilkan LLM.
              example: Main developments
            - type: "null"
        maxTokens:
          type: integer
          minimum: 1
          description: Jumlah token maksimum untuk ringkasan yang dihasilkan.
    SearchMonitorTrigger:
      type: object
      properties:
        type:
          type: string
          const: interval
          description: Jenis pemicu. Saat ini, hanya `interval` yang didukung.
          default: interval
        period:
          type: string
          description: String durasi yang menentukan seberapa sering monitor berjalan
            (misalnya, "1h", "6h", "1d", "7d"). Hanya mendukung satu unit.
            Interval minimum adalah 1 jam. Jadwal berpatokan pada waktu
            pembuatan monitor (misalnya, monitor harian yang dibuat pukul 14.30
            akan berjalan setiap hari sekitar pukul 14.30).
          example: 6h
      required:
        - type
        - period
    SearchMonitorOutputSchema:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaText"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: Schema JSON untuk output synthesis. Tipe root yang didukung adalah
            "text" dan "object". Jika diberikan, response menyertakan objek
            output dengan konten yang sesuai schema ini. Berfungsi dengan semua
            search type dan menambahkan latency synthesis sekitar 2 detik di
            atas search type yang dipilih.
          type: object
          discriminator:
            propertyName: type
            mapping:
              text: "#/components/schemas/OutputSchemaText"
              object: "#/components/schemas/OutputSchemaObject"
        - type: "null"
      description: 'Mengontrol format output run. Jika tidak ditentukan, default-nya
        adalah `{ "type": "text" }`. Saat `type` adalah `"text"`, output berupa
        ringkasan teks biasa. Saat `type` adalah `"object"`, output berupa JSON
        terstruktur. Jika tidak ada `properties` yang ditentukan untuk tipe
        `"object"`, schema akan diinferensikan secara otomatis; jika tidak,
        output mengikuti schema yang diberikan.'
    SearchMonitorWebhook:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL HTTPS untuk menerima event webhook. Tidak boleh mengarah ke
            localhost atau rentang IP privat.
        events:
          type: array
          items:
            type: string
            enum:
              - monitor.created
              - monitor.updated
              - monitor.deleted
              - monitor.run.created
              - monitor.run.completed
          description: Event yang akan dilanggani. Jika tidak ditentukan, default-nya
            adalah semua event.
      required:
        - url
    BatchMonitorsRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - delete
            - pause
            - unpause
          description: Tindakan yang akan dilakukan pada monitor yang cocok. `delete` akan
            menghapusnya secara permanen, `pause` mengatur statusnya menjadi
            dijeda, dan `unpause` mengatur statusnya menjadi aktif.
        filter:
          type: object
          properties:
            name:
              type: string
              maxLength: 250
              description: Filter berdasarkan nama (kecocokan substring tanpa membedakan huruf
                besar/kecil)
            status:
              type: string
              enum:
                - active
                - paused
                - disabled
              description: Filter berdasarkan status monitor
            metadata:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
                maxLength: 1000
              description: Filter berdasarkan pasangan key-value metadata (kecocokan persis,
                semantik AND)
          description: Setidaknya satu field filter harus diberikan untuk mencegah operasi
            massal yang tidak disengaja.
        dry_run:
          type: boolean
          description: Saat `true`, mengembalikan monitor yang akan terpengaruh tanpa
            menjalankan tindakan. Default-nya adalah `true`.
          default: true
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: Jumlah maksimum monitor yang diproses dalam satu permintaan.
            Default-nya 50, maksimum 500.
          default: 50
      required:
        - action
        - filter
    UpdateSearchMonitorParameters:
      type: object
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
          description: Perbarui nama monitor
        status:
          type: string
          enum:
            - active
            - paused
          description: Perbarui status monitor (hanya dapat diatur ke `active` atau
            `paused`)
        search:
          type: object
          properties:
            query:
              type: string
              minLength: 1
              description: String query untuk search.
              example: Latest developments in LLM capabilities
            numResults:
              type: integer
              minimum: 1
              maximum: 100
              description: Jumlah hasil yang dikembalikan. Batas bervariasi berdasarkan search
                type. Batas publik maksimum adalah 100 hasil. Hubungi tim sales
                (hello@exa.ai) untuk membahas batas yang lebih tinggi.
              example: 10
              default: 10
            includeDomains:
              description: Batasi hasil search pada domain ini.
              type: array
              items:
                type: string
            excludeDomains:
              description: Kecualikan domain ini dari hasil search.
              type: array
              items:
                type: string
            contents:
              $ref: "#/components/schemas/SearchMonitorContents"
          description: Parameter search parsial untuk digabungkan. Semua field opsional
            untuk pembaruan.
        trigger:
          anyOf:
            - type: object
              properties:
                type:
                  type: string
                  const: interval
                  description: Jenis pemicu. Saat ini, hanya `interval` yang didukung.
                  default: interval
                period:
                  type: string
                  description: String durasi yang menentukan seberapa sering monitor berjalan
                    (misalnya, "1h", "6h", "1d", "7d"). Hanya mendukung satu
                    unit. Interval minimum adalah 1 jam.
            - type: "null"
          description: Perbarui jadwal. Atur ke null untuk menghapus jadwal.
        outputSchema:
          $ref: "#/components/schemas/SearchMonitorOutputSchema"
        metadata:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
              description: Metadata key-value yang disediakan pemanggil untuk pelacakan
                sendiri.
              example:
                slack_channel_id: C123ABC
                slack_thread_id: "1745444400.123456"
                user_id: U123ABC
            - type: "null"
          description: Perbarui metadata. Atur ke null untuk menghapusnya. Metadata
            dikirim kembali dalam pengiriman webhook sehingga Anda dapat
            merutekan pembaruan ke sistem seperti Slack.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        webhook:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: URL HTTPS untuk menerima event webhook. Tidak boleh mengarah ke
                localhost atau rentang IP privat.
            events:
              type: array
              items:
                type: string
                enum:
                  - monitor.created
                  - monitor.updated
                  - monitor.deleted
                  - monitor.run.created
                  - monitor.run.completed
              description: Event yang akan dilanggani. Jika tidak ditentukan, default-nya
                adalah semua event.
          description: Parameter webhook parsial untuk digabungkan. Semua field opsional
            untuk pembaruan.
    CreateAgentRunRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Pertanyaan atau instruksi dalam bahasa alami untuk permintaan.
          example: What are the most important AI infrastructure funding rounds announced
            this week?
        systemPrompt:
          type: string
          description: Instruksi tambahan yang memandu output yang dihasilkan atau
            perilaku agent. Gunakan untuk preferensi sumber, batasan kebaruan,
            batasan duplikasi, atau instruksi perilaku lainnya.
          example: Prefer official sources and avoid duplicate results.
        effort:
          $ref: "#/components/schemas/AgentEffort"
        input:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Catatan berupa objek JSON.
              description: Catatan yang harus diproses atau di-enrich oleh agent.
            exclusion:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Catatan berupa objek JSON.
              description: Catatan atau entitas yang sebaiknya tidak dikembalikan oleh agent.
          description: Catatan yang akan diproses, serta catatan atau entitas yang akan
            dikecualikan dari jawaban.
        outputSchema:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: JSON Schema untuk output terstruktur tervalidasi dalam
                `output.structured`. Field yang tidak didukung oleh bukti dapat
                dikembalikan sebagai `null`. Mendukung draft-07, 2019-09, dan
                2020-12 melalui `$schema`.
            - type: "null"
        previousRunId:
          description: ID run yang telah selesai untuk dilanjutkan. Harus milik Team yang
            sama.
          $ref: "#/components/schemas/AgentRunId"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Metadata yang disediakan pemanggil dan disimpan bersama run.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        dataSources:
          maxItems: 5
          type: array
          items:
            $ref: "#/components/schemas/AgentDataSource"
          description: Provider data Exa Connect yang akan diaktifkan untuk run. Setiap
            entri mengaktifkan semua tool milik provider tersebut.
        budget:
          $ref: "#/components/schemas/AgentBudget"
      required:
        - query
    AgentEffort:
      type: string
      enum:
        - minimal
        - low
        - medium
        - high
        - xhigh
        - auto
        - max
      description: Preferensi cost dan effort penalaran untuk run. `auto` memungkinkan
        Exa memilih effort yang sesuai. `max` adalah tingkat beta publik dengan
        effort tertinggi untuk pekerjaan yang lebih mengutamakan kelengkapan dan
        ketelitian daripada latency atau cost, termasuk list building berskala
        besar, Research mendalam dari berbagai sumber, dan kriteria yang sulit
        diverifikasi.
      default: auto
    AgentRunId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[A-Za-z0-9_.:-]+$
      description: ID Agent run. ID run baru dikembalikan dengan prefiks `agent_run_`.
      example: agent_run_01j7x9v0m2n4p6q8r0s2t4v6w8
    AgentDataSource:
      type: object
      properties:
        provider:
          description: Provider data Exa Connect yang akan diaktifkan untuk run. Semua
            tool provider tersedia secara default.
          example: fiber
          $ref: "#/components/schemas/AgentDataSourceProvider"
      required:
        - provider
    AgentDataSourceProvider:
      type: string
      enum:
        - fiber
        - financial_datasets
        - similarweb
        - baselayer
        - affiliate
        - particle
        - jinko
        - polymarket
      description: Identifier provider data Exa Connect.
    AgentBudget:
      type: object
      properties:
        maxCostDollars:
          type: number
          description: Jumlah maksimum yang dapat dibelanjakan run ini dalam dolar AS.
            Menerima $1–$100 dan hanya berlaku untuk `auto` dan `max`; jika
            dihilangkan, batas default adalah $5 untuk `auto` dan $20 untuk
            `max`.
          example: 10
      description: Batas pengeluaran opsional per run untuk effort `auto` dan `max`
        berbasis penggunaan. Run yang selesai lebih awal mungkin menghabiskan
        biaya lebih rendah daripada batas tersebut.
    CreateBatchRequest:
      type: object
      properties:
        requests:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/BatchRequestItem"
          description: Permintaan yang akan diantrikan. Setiap `customId` harus unik dalam
            batch.
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Metadata yang disediakan pemanggil dan disimpan bersama batch.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
      required:
        - requests
    BatchRequestItem:
      type: object
      properties:
        customId:
          type: string
          minLength: 1
          maxLength: 64
          description: Penanda unik Anda untuk permintaan ini; digunakan sebagai pengenal
            hasil dan harus unik dalam batch.
          example: row-1
        method:
          type: string
          const: POST
          description: Metode HTTP untuk permintaan dalam batch. Hanya POST di v1.
        url:
          type: string
          enum:
            - /search
            - /agent/runs
          description: Rute API target untuk permintaan. Salah satu dari `/search` atau
            `/agent/runs` di v1.
          example: /search
        body:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: "Body permintaan untuk rute target. Harus berupa objek JSON;
            `stream: true` tidak diizinkan."
      required:
        - customId
        - method
        - url
        - body
    AnswerStreamTextDeltaChunk:
      type: object
      properties:
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                minimum: 0
                description: Indeks pilihan streaming ini.
              delta:
                type: object
                properties:
                  role:
                    type: string
                    const: assistant
                  content:
                    type: string
                  refusal:
                    anyOf:
                      - type: string
                      - type: "null"
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Konten jawaban bertahap yang dipancarkan oleh model.
              finish_reason:
                description: Alasan pilihan streaming ini selesai, jika tersedia.
                oneOf:
                  - type: string
                  - type: "null"
            required:
              - index
              - delta
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
          description: Pilihan completion streaming yang kompatibel dengan OpenAI, dengan
            field provider internal dihapus.
      required:
        - choices
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    SearchResponse:
      oneOf:
        - $ref: "#/components/schemas/SearchSynthesisResponse"
        - $ref: "#/components/schemas/SearchResultsResponse"
    SearchSynthesisResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Identifier unik untuk permintaan.
          example: b5947044c4b78efa9552a7c89b306d95
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultOutput"
          description: Daftar hasil pencarian yang berisi judul, URL, tanggal publikasi,
            dan penulis.
        resolvedSearchType:
          description: Field lama yang usang. Response production saat ini mungkin
            mengembalikan string kosong; client tidak boleh melakukan
            percabangan berdasarkan nilai ini.
          example: ""
          deprecated: true
          type: string
        context:
          type: string
          description: Usang. String konteks gabungan dari hasil pencarian. Gunakan
            kutipan atau teks sebagai gantinya.
          deprecated: true
        costDollars:
          $ref: "#/components/schemas/CostDollarsOutput"
        searchTime:
          type: number
          description: Waktu pemrosesan sisi server dalam milidetik, diukur pada gateway.
            Mencakup retrieval, tetapi mungkin tidak mencakup fase berikutnya
            seperti synthesis output terstruktur, sehingga dapat lebih rendah
            daripada latency permintaan menyeluruh.
          example: 312.4
        output:
          $ref: "#/components/schemas/SearchSynthesisOutputOutput"
      required:
        - results
        - output
      additionalProperties: false
    SearchResultsResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Identifier unik untuk permintaan.
          example: b5947044c4b78efa9552a7c89b306d95
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultOutput"
          description: Daftar hasil pencarian yang berisi judul, URL, tanggal publikasi,
            dan penulis.
        resolvedSearchType:
          description: Field lama yang usang. Response production saat ini mungkin
            mengembalikan string kosong; client tidak boleh melakukan
            percabangan berdasarkan nilai ini.
          example: ""
          deprecated: true
          type: string
        context:
          type: string
          description: Usang. String konteks gabungan dari hasil pencarian. Gunakan
            kutipan atau teks sebagai gantinya.
          deprecated: true
        costDollars:
          $ref: "#/components/schemas/CostDollarsOutput"
        searchTime:
          type: number
          description: Waktu pemrosesan sisi server dalam milidetik, diukur pada gateway.
            Mencakup retrieval, tetapi mungkin tidak mencakup fase berikutnya
