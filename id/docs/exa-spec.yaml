      required:
        - id
        - object
        - status
        - stopReason
        - createdAt
        - completedAt
        - request
        - output
        - usage
        - costDollars
      additionalProperties: false
    AgentRunStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
        - cancelled
    AgentStopReason:
      type: string
      enum:
        - schema_satisfied
        - budget_reached
        - stopped
        - error
        - cancelled
    AgentRunRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Pertanyaan atau instruksi bahasa alami untuk permintaan.
          example: What are the most important AI infrastructure funding rounds announced
            this week?
        systemPrompt:
          type: string
          description: Instruksi tambahan yang memandu output yang dihasilkan atau
            perilaku agent. Gunakan untuk preferensi sumber, batasan kebaruan,
            batasan duplikasi, atau instruksi perilaku lainnya.
          example: Prefer official sources and avoid duplicate results.
        effort:
          $ref: "#/components/schemas/AgentEffort"
        input:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Catatan berupa objek JSON.
              description: Catatan yang harus diproses atau di-enrich oleh agent.
            exclusion:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Catatan berupa objek JSON.
              description: Catatan atau entitas yang tidak boleh dikembalikan oleh agent.
          additionalProperties: false
        outputSchema:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: JSON Schema untuk output terstruktur tervalidasi dalam
                `output.structured`. Field yang tidak didukung oleh evidence
                dapat dikembalikan sebagai `null`. Mendukung draft-07, 2019-09,
                dan 2020-12 melalui `$schema`.
            - type: "null"
        previousRunId:
          $ref: "#/components/schemas/AgentRunId"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Metadata pasangan kunci-nilai yang disediakan pemanggil untuk
            pelacakan Anda sendiri.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        dataSources:
          type: array
          items:
            $ref: "#/components/schemas/AgentDataSourceOutput"
          description: Penyedia data Exa Connect yang dikonfigurasi untuk run.
        budget:
          $ref: "#/components/schemas/AgentBudgetOutput"
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
      description: Field permintaan yang dikanonikalisasi dan disimpan bersama run.
    AgentRunOutput:
      type: object
      properties:
        text:
          type: string
          description: Jawaban atau ringkasan dalam bahasa alami.
        structured:
          anyOf:
            - $ref: "#/components/schemas/JsonValue"
            - type: "null"
          description: JSON yang dibentuk oleh `outputSchema`; field yang tidak didukung
            bukti dapat bernilai `null`. Bernilai `null` jika tidak ada skema
            yang diberikan.
        grounding:
          type: array
          items:
            $ref: "#/components/schemas/AgentGrounding"
          description: Sitasi per field yang dihasilkan oleh run.
      required:
        - text
        - structured
        - grounding
      additionalProperties: false
    AgentGrounding:
      type: object
      properties:
        field:
          type: string
          description: Field output yang didukung sitasi.
          example: structured.companies[0].sourceUrl
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AgentCitation"
        confidence:
          anyOf:
            - type: string
              enum:
                - low
                - medium
                - high
              description: Tingkat keandalan untuk field ini yang dilaporkan oleh model.
            - type: "null"
      required:
        - field
        - citations
      additionalProperties: false
    AgentCitation:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL sumber.
        title:
          type: string
          description: Judul sumber.
      required:
        - url
      additionalProperties: false
    AgentUsage:
      type: object
      properties:
        agentComputeUnits:
          type: number
          minimum: 0
        searches:
          type: integer
          minimum: 0
        emails:
          type: integer
          minimum: 0
        phoneNumbers:
          type: integer
          minimum: 0
        dataSources:
          $ref: "#/components/schemas/AgentDataSourceUsage"
      required:
        - agentComputeUnits
        - searches
        - emails
        - phoneNumbers
      additionalProperties: false
    AgentDataSourceUsage:
      type: object
      propertyNames:
        type: string
      additionalProperties:
        type: integer
        minimum: 0
      description: Jumlah tool call per provider untuk sumber data Exa Connect yang
        digunakan selama run. Key adalah nama provider (misalnya, `fiber`,
        `similarweb`). Hanya provider dengan penggunaan nonnol yang disertakan.
    AgentCostDollars:
      type: object
      properties:
        total:
          type: number
          minimum: 0
        agentCompute:
          type: number
          minimum: 0
        search:
          type: number
          minimum: 0
        emails:
          type: number
          minimum: 0
        phoneNumbers:
          type: number
          minimum: 0
        dataSources:
          $ref: "#/components/schemas/AgentDataSourceCost"
      required:
        - total
        - agentCompute
        - search
        - emails
        - phoneNumbers
      additionalProperties: false
    AgentDataSourceCost:
      type: object
      propertyNames:
        type: string
      additionalProperties:
        type: number
        minimum: 0
      description: Biaya per provider dalam dolar untuk sumber data Exa Connect yang
        digunakan selama run. Key adalah nama provider (misalnya, `fiber`,
        `similarweb`). Hanya provider dengan penggunaan nonnol yang disertakan.
    AgentErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/AgentError"
      required:
        - error
      additionalProperties: false
    AgentError:
      type: object
      properties:
        type:
          type: string
          enum:
            - INVALID_REQUEST
            - AUTHENTICATION_ERROR
            - RATE_LIMIT_ERROR
            - NOT_FOUND
            - SERVER_ERROR
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - TEAM_NOT_FOUND
            - RUN_NOT_FOUND
            - PREVIOUS_RUN_NOT_FOUND
            - PREVIOUS_RUN_NOT_COMPLETED
            - CONCURRENCY_LIMIT_REACHED
            - INVALID_OUTPUT_SCHEMA
            - INVALID_DATA_SOURCE
            - TIMEOUT
            - SERVER_ERROR
        message:
          type: string
      required:
        - type
        - code
        - message
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    AgentRunList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
        hasMore:
          type: boolean
          description: Apakah ada hasil lainnya
        nextCursor:
          anyOf:
            - $ref: "#/components/schemas/AgentRunId"
            - type: "null"
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    DeleteAgentRunResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/AgentRunId"
        object:
          type: string
          const: agent_run.deleted
        deleted:
          type: boolean
          const: true
      required:
        - id
        - object
        - deleted
      additionalProperties: false
    AgentRunEventList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentRunEvent"
        hasMore:
          type: boolean
          description: Apakah ada hasil lainnya
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    Batch:
      type: object
      properties:
        id:
          type: string
          description: ID batch. ID batch baru dikembalikan dengan prefiks `batch_`.
          example: batch_01j7x9v0m2n4p6q8r0s2t4v6w8
        object:
          type: string
          const: batch
          description: Tipe objek, selalu `batch`.
        status:
          $ref: "#/components/schemas/BatchStatus"
        requestCounts:
          $ref: "#/components/schemas/BatchRequestCounts"
        createdAt:
          type: string
          format: date-time
          description: Waktu batch dibuat.
        expiresAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Waktu batch kedaluwarsa, atau `null` jika tidak kedaluwarsa.
          format: date-time
        endedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Waktu batch mencapai status terminal, atau `null` saat masih
            berjalan.
          format: date-time
        resultsUrl:
          anyOf:
            - type: string
            - type: "null"
          description: URL unduhan prapenandatanganan yang berlaku singkat untuk file
            hasil batch (JSONL), atau `null` hingga batch selesai. Ini adalah
            tautan unduhan langsung dari penyimpanan objek, bukan rute API;
            ambil apa adanya dan ambil ulang batch untuk membuat URL baru
            setelah URL tersebut kedaluwarsa.
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Metadata key-value yang diberikan pemanggil untuk pelacakan sendiri.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
      required:
        - id
        - object
        - status
        - requestCounts
        - createdAt
        - expiresAt
        - endedAt
        - resultsUrl
        - metadata
      additionalProperties: false
    BatchStatus:
      type: string
      enum:
        - in_progress
        - completed
        - cancelling
        - cancelled
        - expired
      description: Status siklus hidup batch.
    BatchRequestCounts:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
          description: Total permintaan dalam batch.
        completed:
          type: integer
          minimum: 0
          description: Permintaan yang berhasil diselesaikan.
        failed:
          type: integer
          minimum: 0
          description: Permintaan yang gagal.
      required:
        - total
        - completed
        - failed
      additionalProperties: false
    BatchList:
      type: object
      properties:
        object:
          type: string
          const: list
          description: Tipe objek, selalu `list`.
        data:
          type: array
          items:
            $ref: "#/components/schemas/Batch"
          description: Halaman batch, dari yang terbaru.
        hasMore:
          type: boolean
          description: Apakah ada hasil lainnya
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
          description: Cursor untuk halaman berikutnya
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    DeletedBatch:
      type: object
      properties:
        id:
          type: string
          description: ID batch yang dihapus.
        object:
          type: string
          const: batch.deleted
          description: Tipe objek, selalu `batch.deleted`.
        deleted:
          type: boolean
          const: true
          description: Selalu `true` untuk penghapusan yang berhasil.
      required:
        - id
        - object
        - deleted
      additionalProperties: false
    WebsetsTeamInfo:
      type: object
      properties:
        object:
          type: string
          const: team
          description: Tipe objek, selalu `"team"`.
        id:
          type: string
          description: Identifier unik untuk Team.
        name:
          type: string
          description: Nama Team.
        concurrency:
          type: object
          properties:
            active:
              type: integer
              description: Jumlah permintaan yang sedang diproses.
            queued:
              type: integer
              description: Jumlah permintaan yang sedang dalam antrean.
          required:
            - active
            - queued
          additionalProperties: false
          description: Penggunaan konkurensi saat ini.
        limits:
          type: object
          properties:
            maxConcurrent:
              anyOf:
                - type: integer
                - type: "null"
              description: Jumlah maksimum permintaan serentak yang diizinkan. Null berarti
                tidak terbatas.
            maxQueued:
              anyOf:
                - type: integer
                - type: "null"
              description: Jumlah maksimum permintaan dalam antrean yang diizinkan. Null
                berarti tidak terbatas.
          required:
            - maxConcurrent
            - maxQueued
          additionalProperties: false
          description: Batas konkurensi untuk Team.
      required:
        - object
        - id
        - name
        - concurrency
        - limits
      additionalProperties: false
    AnswerStreamChunk:
      description: "Skema untuk setiap payload JSON yang dihasilkan dalam stream
        server-sent event `/answer`. Setiap event dihasilkan sebagai `data:
        <json>`."
      oneOf:
        - $ref: "#/components/schemas/AnswerStreamTextDeltaChunk"
        - $ref: "#/components/schemas/AnswerStreamCitationsChunkOutput"
        - $ref: "#/components/schemas/AnswerStreamCostChunkOutput"
        - $ref: "#/components/schemas/AnswerStreamErrorChunkOutput"
    SearchStreamChunk:
      oneOf:
        - $ref: "#/components/schemas/SearchStreamTextDeltaChunkOutput"
        - $ref: "#/components/schemas/SearchStreamGroundingChunkOutput"
        - $ref: "#/components/schemas/SearchStreamResultsChunkOutput"
        - $ref: "#/components/schemas/SearchStreamResetChunkOutput"
        - $ref: "#/components/schemas/SearchStreamDoneChunkOutput"
        - $ref: "#/components/schemas/SearchStreamErrorChunkOutput"
      description: "Skema untuk setiap payload JSON yang dihasilkan dalam stream
        server-sent event `/search`. Setiap event dihasilkan sebagai `data:
        <json>` dan stream diakhiri dengan `data: [DONE]`, yang tidak
        direpresentasikan oleh skema JSON ini."
      type: object
      discriminator:
        propertyName: type
        mapping:
          text-delta: "#/components/schemas/SearchStreamTextDeltaChunkOutput"
          grounding: "#/components/schemas/SearchStreamGroundingChunkOutput"
          results: "#/components/schemas/SearchStreamResultsChunkOutput"
          stream-reset: "#/components/schemas/SearchStreamResetChunkOutput"
          done: "#/components/schemas/SearchStreamDoneChunkOutput"
          error: "#/components/schemas/SearchStreamErrorChunkOutput"
    AgentRunEvent:
      type: object
      properties:
        id:
          type: string
          description: ID event dalam run.
        event:
          type: string
          enum:
            - agent_run.created
            - agent_run.started
            - agent_run.completed
            - agent_run.failed
            - agent_run.cancelled
        data:
          $ref: "#/components/schemas/JsonValue"
        createdAt:
          type: string
          format: date-time
          description: Waktu event dibuat
      required:
        - id
        - event
        - data
        - createdAt
      additionalProperties: false
    SearchResultOutput:
      type: object
      properties:
        title:
          type: string
          description: Judul hasil search.
          example: A Comprehensive Overview of Large Language Models
        url:
          type: string
          description: URL hasil search.
          example: https://arxiv.org/pdf/2307.06435.pdf
          format: uri
        publishedDate:
          description: Perkiraan tanggal pembuatan berdasarkan penguraian konten HTML.
            Formatnya YYYY-MM-DD.
          example: 2023-11-16T01:36:32.547Z
          format: date-time
          type: string
        author:
          description: Penulis konten, jika tersedia.
          example: Humza Naveed
          anyOf:
            - type: string
            - type: "null"
        id:
          description: ID sementara untuk dokumen. Berguna untuk endpoint /contents.
          example: https://arxiv.org/abs/2307.06435
          type: string
        image:
          description: URL gambar yang terkait dengan hasil search, jika tersedia.
          example: https://arxiv.org/pdf/2307.06435.pdf/page_1.png
          format: uri
          type: string
        favicon:
          description: URL favicon untuk domain hasil search.
          example: https://arxiv.org/favicon.ico
          format: uri
          type: string
        text:
          description: Teks konten lengkap hasil search.
          example: Abstract Large Language Models (LLMs) have recently demonstrated
            remarkable capabilities...
          type: string
        highlights:
          description: Array kutipan yang diekstrak dari konten hasil search.
          example:
            - Such requirements have limited their adoption...
          type: array
          items:
            type: string
        highlightScores:
          description: Array skor kemiripan kosinus untuk setiap kutipan.
          example:
            - 0.4600165784358978
          type: array
          items:
            type: number
            format: float
        summary:
          description: Ringkasan halaman web.
          example: This overview paper on Large Language Models (LLMs) highlights key
            developments...
          type: string
        subpages:
          description: Array subhalaman untuk hasil search.
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                description: Judul hasil search.
                example: A Comprehensive Overview of Large Language Models
              url:
                type: string
                description: URL hasil search.
                example: https://arxiv.org/pdf/2307.06435.pdf
                format: uri
              publishedDate:
                description: Perkiraan tanggal pembuatan berdasarkan penguraian konten HTML.
                  Formatnya YYYY-MM-DD.
                example: 2023-11-16T01:36:32.547Z
                format: date-time
                type: string
              author:
                description: Penulis konten, jika tersedia.
                example: Humza Naveed
                anyOf:
                  - type: string
                  - type: "null"
              id:
                description: ID sementara untuk dokumen. Berguna untuk endpoint /contents.
                example: https://arxiv.org/abs/2307.06435
                type: string
              image:
                description: URL gambar yang terkait dengan hasil search, jika tersedia.
                example: https://arxiv.org/pdf/2307.06435.pdf/page_1.png
                format: uri
                type: string
              favicon:
                description: URL favicon untuk domain hasil search.
                example: https://arxiv.org/favicon.ico
                format: uri
                type: string
            required:
              - title
              - url
            additionalProperties: false
        entities:
          description: Data entitas terstruktur untuk hasil search perusahaan, orang, atau
            publikasi. Dikembalikan untuk kategori yang didukung entitas.
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/SearchCompanyEntityOutput"
              - $ref: "#/components/schemas/SearchPersonEntityOutput"
              - $ref: "#/components/schemas/SearchPublicationEntityOutput"
            type: object
            discriminator:
              propertyName: type
              mapping:
                company: "#/components/schemas/SearchCompanyEntityOutput"
                person: "#/components/schemas/SearchPersonEntityOutput"
                publication: "#/components/schemas/SearchPublicationEntityOutput"
        extras:
          description: Hasil dari extras. Setiap field dikembalikan hanya jika diminta
            melalui contents.extras.
          example:
            links: []
          type: object
          properties:
            links:
              description: Array tautan dari hasil search.
              example: []
              type: array
              items:
                type: string
            imageLinks:
              description: Array URL gambar dari hasil search.
              example: []
              type: array
              items:
                type: string
            richImageLinks:
              description: Array gambar beserta teks alt-nya, sesuai urutan kemunculannya di
                halaman.
              example:
                - url: https://exa.ai/images/illustrations/api_illustration4.webp
                  alt: High rate limits, low latency and high reliability.
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: URL gambar.
                  alt:
                    description: Teks alt gambar, jika disediakan oleh halaman.
                    type: string
                required:
                  - url
                additionalProperties: false
            richLinks:
              description: Array tautan beserta teks anchor-nya, sesuai urutan kemunculannya
                di halaman.
              example:
                - url: https://dashboard.exa.ai
                  anchor: API Dashboard
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: URL tautan.
                  anchor:
                    description: Teks anchor tautan, jika disediakan oleh halaman.
                    type: string
                required:
                  - url
                additionalProperties: false
            codeBlocks:
              description: Array blok kode dari hasil search.
              example:
                - text: pip install exa-py
                  source: bash
              type: array
              items:
                type: object
                properties:
                  text:
                    type: string
                    description: Isi blok kode.
                  source:
                    type: string
                    description: Bahasa yang dianotasikan pada blok kode, jika ada.
                required:
                  - text
                  - source
                additionalProperties: false
          additionalProperties: false
      required:
        - title
        - url
      additionalProperties: false
