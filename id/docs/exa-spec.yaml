      - url: https://api.exa.ai/websets
    post:
      operationId: websets-create
      summary: Buat Webset
      description: >-
        Membuat Webset baru dengan konfigurasi search, impor, dan Enrichment
        opsional. Webset akan mulai diproses secara otomatis setelah dibuat.


        Anda dapat menentukan `externalId` untuk merujuk Webset menggunakan
        identifier Anda sendiri agar integrasi lebih mudah.
      tags:
        - Websets
      security:
        - apiKey: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebsetParameters"
      responses:
        "201":
          description: Webset dibuat
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identifier unik untuk permintaan.
              example: req_N6SsgoiaOQOPqsYKKiw5
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webset"
        "409":
          description: Webset dengan externalId ini sudah ada
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identifier unik untuk permintaan.
              example: req_N6SsgoiaOQOPqsYKKiw5
              required: true
    get:
      operationId: websets-list
      summary: Daftar semua Websets
      description: >-
        Mengembalikan daftar Websets.


        Anda dapat melakukan paginasi hasil menggunakan parameter `cursor`.


        Anda dapat memfilter hasil menggunakan parameter `search` untuk
        menemukan Websets berdasarkan ID, ID eksternal, atau judul.
      tags:
        - Websets
      security:
        - apiKey: []
        - bearer: []
      parameters:
        - in: query
          name: cursor
          schema:
            minLength: 1
            type: string
          required: false
          description: Cursor untuk melakukan paginasi hasil
        - in: query
          name: limit
          schema:
            default: 25
            minimum: 1
            maximum: 100
            type: number
          required: false
          description: Jumlah Websets yang dikembalikan
        - in: query
          name: search
          schema:
            minLength: 2
            maxLength: 50
            type: string
          required: false
          description: Istilah pencarian untuk memfilter Websets berdasarkan ID, ID
            eksternal, atau judul
      responses:
        "200":
          description: Daftar Websets
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identifier unik untuk permintaan.
              example: req_N6SsgoiaOQOPqsYKKiw5
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListWebsetsResponse"
  /v0/websets/{id}:
    servers:
      - url: https://api.exa.ai/websets
    get:
      operationId: websets-get
      summary: Dapatkan Webset
      description: >-
        Mengembalikan Webset berdasarkan `id` atau `externalId`, termasuk
        status, searches, impor, enrichments, dan monitors-nya.


        Teruskan `expand=items` untuk menyertakan hingga 100 item pertama dalam
        response.
      tags:
        - Websets
      security:
        - apiKey: []
        - bearer: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: "`id` atau `externalId` Webset."
          required: true
        - in: query
          name: expand
          schema:
            items:
              enum:
                - items
              type: string
            type: array
          required: false
          description: Perluas response dengan sumber daya yang ditentukan
      responses:
        "200":
          description: Webset
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identifier unik untuk permintaan.
              example: req_N6SsgoiaOQOPqsYKKiw5
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetWebsetResponse"
        "404":
          description: Webset tidak ditemukan
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identifier unik untuk permintaan.
              example: req_N6SsgoiaOQOPqsYKKiw5
              required: true
    post:
      operationId: websets-update
      summary: Perbarui Webset
      description: Memperbarui `title` atau `metadata` Webset. Searches, impor, dan
        enrichments dikelola melalui endpoint masing-masing.
      tags:
        - Websets
      security:
        - apiKey: []
        - bearer: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: id atau externalId Webset
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebsetRequest"
      responses:
        "200":
          description: Webset diperbarui
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identifier unik untuk permintaan.
              example: req_N6SsgoiaOQOPqsYKKiw5
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webset"
        "404":
          description: Webset tidak ditemukan
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identifier unik untuk permintaan.
              example: req_N6SsgoiaOQOPqsYKKiw5
              required: true
    delete:
      operationId: websets-delete
      summary: Hapus Webset
      description: |-
