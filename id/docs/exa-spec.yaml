          description: Rincian perkiraan biaya untuk retrieval konten mandiri (teks,
            kutipan, dan ringkasan ditagihkan di luar harga paket search).
          type: object
          properties:
            text:
              description: Biaya ekstraksi teks.
              example: 0.001
              format: float
              type: number
