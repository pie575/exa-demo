components:
  schemas:
    SearchRequest:
      type: object
      properties:
        includeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: Daftar domain atau jalur domain yang akan disertakan dalam
                pencarian. Setiap entri dapat berupa hostname (misalnya,
                `example.com`), hostname dengan awalan jalur (misalnya,
                `example.com/docs`), atau subdomain wildcard (misalnya,
                `*.example.com`). Jika ditentukan, hasil hanya akan berasal dari
                domain atau jalur yang cocok. Gunakan parameter ini untuk
                pemfilteran domain atau jalur, alih-alih menambahkan operator
                `site:` ke query.
              example:
                - arxiv.org
                - exa.ai/blog
            - type: "null"
        excludeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: Daftar domain atau jalur domain yang akan dikecualikan dari hasil
                pencarian. Setiap entri dapat berupa hostname (misalnya,
                `example.com`), hostname dengan awalan jalur (misalnya,
                `example.com/docs`), atau subdomain wildcard (misalnya,
                `*.example.com`). Jika ditentukan, tidak ada hasil yang akan
                dikembalikan dari domain atau jalur yang cocok. Gunakan
                parameter ini untuk pemfilteran domain atau jalur, alih-alih
                menambahkan operator `site:` ke query.
              example:
                - docs.python.org/3
            - type: "null"
        startCrawlDate:
          anyOf:
            - type: string
              description: Usang dan tidak berpengaruh; diabaikan oleh API. Harus ditentukan
                dalam format ISO 8601.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        endCrawlDate:
          anyOf:
            - type: string
              description: Usang dan tidak berpengaruh; diabaikan oleh API. Harus ditentukan
                dalam format ISO 8601.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        startPublishedDate:
          anyOf:
            - type: string
              description: Hanya tautan dengan tanggal publikasi setelah waktu ini yang akan
                dikembalikan. Harus ditentukan dalam format ISO 8601.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
            - type: "null"
        endPublishedDate:
          anyOf:
            - type: string
              description: Hanya tautan dengan tanggal publikasi sebelum waktu ini yang akan
                dikembalikan. Harus ditentukan dalam format ISO 8601.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
            - type: "null"
        numResults:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 100
              description: Jumlah hasil yang akan dikembalikan. Batas berbeda-beda menurut
                jenis pencarian. Batas publik maksimum adalah 100 hasil. Hubungi
                tim sales (hello@exa.ai) untuk membahas batas yang lebih tinggi.
              example: 10
              default: 10
            - type: "null"
        context:
          anyOf:
            - description: "Usang: Gunakan kutipan atau teks sebagai gantinya. Mengembalikan
                konten halaman sebagai string konteks gabungan."
              deprecated: true
              oneOf:
                - type: boolean
                  description: "Usang: Gunakan kutipan atau teks sebagai gantinya. Mengembalikan
                    konten halaman sebagai string konteks gabungan."
                  example: true
                  deprecated: true
                - type: object
                  properties:
                    maxCharacters:
                      type: integer
                      minimum: 1
                      maximum: 10000
                      description: Usang. Batas karakter maksimum untuk string konteks. Nilai maksimum
                        yang didukung adalah 10000.
                      example: 10000
                  description: "Usang: Gunakan kutipan atau teks sebagai gantinya. Mengembalikan
                    konten halaman sebagai string konteks gabungan."
                  deprecated: true
            - type: "null"
        moderation:
          anyOf:
            - type: boolean
              description: Aktifkan moderasi konten untuk memfilter konten tidak aman dari
                hasil pencarian.
              example: true
              default: false
            - type: "null"
        contents:
          anyOf:
            - description: Content options untuk teks, kutipan, ringkasan, ekstra, dan kontrol
                kebaruan.
              $ref: "#/components/schemas/ContentsOptions"
            - type: "null"
        query:
          type: string
          minLength: 1
          description: String query untuk pencarian.
          example: Latest developments in LLM capabilities
        additionalQueries:
          anyOf:
            - minItems: 1
              maxItems: 10
              type: array
              items:
                type: string
              description: Variasi query tambahan untuk varian deep-search. Hanya berfungsi
                dengan jenis deep-search. Jika diberikan, query ini digunakan
                bersama query utama untuk memperoleh hasil yang lebih luas.
              example:
                - LLM advancements
                - large language model progress
            - type: "null"
        type:
          anyOf:
            - type: string
              enum:
                - instant
                - fast
                - auto
                - deep-lite
                - deep
                - deep-reasoning
              description: Mode pencarian yang akan digunakan. `auto` (default) adalah mode
                seimbang yang mengoptimalkan kualitas dan kecepatan, serta
                direkomendasikan untuk sebagian besar aplikasi. `fast`
                mengembalikan hasil berkualitas tinggi dengan latency lebih
                rendah, sehingga cocok untuk pencarian yang langsung digunakan
                pengguna dan workflow interaktif. `instant` dioptimalkan untuk
                waktu response minimum, dengan mengorbankan sebagian kedalaman
                pencarian demi kecepatan dalam pengalaman real-time seperti
                chat, agent suara, dan pelengkapan otomatis. `deep-lite`
                melakukan Research ringan dengan hasil tersintesis dan latency
                konsisten 4 detik, lebih rendah daripada deep search penuh.
                `deep` melakukan Research multi-langkah yang komprehensif dengan
                synthesis, sedangkan `deep-reasoning` menambahkan penalaran
                lebih kuat untuk tugas analisis dan pengambilan keputusan yang
                kompleks.
              example: auto
              default: auto
            - type: "null"
        category:
          anyOf:
            - type: string
              enum:
                - company
                - publication
                - news
                - personal site
                - financial report
                - people
              description: "Kategori data yang menjadi fokus. Kategori yang dikenal mencakup
                `company`, `publication`, `news`, `personal site`, `financial
                report`, dan `people`. String lain juga diterima dan digunakan
                sebagai petunjuk kategori untuk pencarian. Kategori `people` dan
                `company` memberikan kualitas yang lebih baik untuk menemukan
                profil orang dan halaman perusahaan. Kategori `publication`
                menampilkan publikasi ilmiah seperti paper Research, pracetak,
                dan artikel jurnal, dengan metadata terstruktur seperti penulis,
                tempat publikasi, dan sitasi. Catatan: Kategori `company` dan
                `people` hanya mendukung sejumlah filter terbatas. Parameter
                berikut TIDAK didukung untuk kategori ini: `startPublishedDate`,
                `endPublishedDate`, `excludeDomains`. Penggunaan parameter yang
                tidak didukung akan menghasilkan kesalahan 400."
              example: publication
            - type: "null"
        userLocation:
          anyOf:
            - type: string
              description: Kode negara ISO dua huruf pengguna, misalnya US.
              example: US
            - type: "null"
        compliance:
          anyOf:
            - type: string
              enum:
                - hipaa
              description: Mode kepatuhan khusus Enterprise. Atur ke `hipaa` untuk mode HIPAA.
                Memerlukan retrieval khusus cache dengan parameter yang
                didukung. Lihat dokumentasi HIPAA untuk detail.
              example: hipaa
            - type: "null"
        outputSchema:
          anyOf:
            - oneOf:
                - $ref: "#/components/schemas/OutputSchemaText"
                - $ref: "#/components/schemas/OutputSchemaObject"
              description: Schema JSON untuk output tersintesis. Tipe root yang didukung
                adalah "text" dan "object". Jika diberikan, response menyertakan
                objek output dengan konten yang sesuai schema ini. Berfungsi
                dengan semua search type dan menambahkan sekitar 2 detik latency
                synthesis di atas search type yang dipilih.
              type: object
              discriminator:
                propertyName: type
                mapping:
                  text: "#/components/schemas/OutputSchemaText"
                  object: "#/components/schemas/OutputSchemaObject"
            - type: "null"
        systemPrompt:
          anyOf:
            - type: string
