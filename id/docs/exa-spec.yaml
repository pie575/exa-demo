                          - metadata
                      description: "Kecualikan konten yang diklasifikasikan ke dalam bagian halaman
                        semantik ini. Klasifikasi bagian dilakukan sebisa
                        mungkin. Gunakan maxAgeHours: 0 saat Anda memerlukan
                        pengaturan ini diterapkan pada konten yang baru
                        diambil."
                      example:
                        - navigation
                        - footer
                        - sidebar
                    - type: "null"
              title: Advanced text options
              description: Opsi lanjutan untuk mengontrol ekstraksi teks. Gunakan opsi ini
                saat Anda perlu membatasi panjang teks atau menyertakan struktur
