                perilaku agent. Gunakan untuk menentukan preferensi sumber,
                batasan kebaruan, batasan duplikasi, atau instruksi perilaku
                lainnya.
              example: Prefer official sources and avoid duplicate results.
            - type: "null"
        stream:
          anyOf:
            - type: boolean
              description: Meminta server-sent events untuk streaming output tersintesis.
                Streaming saat ini hanya digunakan jika outputSchema diberikan;
                jika tidak, endpoint mengembalikan response pencarian JSON
                normal.
              default: false
            - type: "null"
      required:
        - query
