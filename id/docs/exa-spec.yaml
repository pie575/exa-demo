                            Tetapkan highlights: true untuk kutipan default,
                            atau { query } untuk memandu pemilihan dengan query
                            Anda sendiri."
                          example: 1
                          deprecated: true
                        - type: "null"
                    highlightsPerUrl:
                      anyOf:
                        - type: integer
                          minimum: 1
                          description: "Usang dan akan dihapus dalam rilis mendatang. Saat ini diabaikan.
                            Tetapkan highlights: true untuk kutipan default,
                            atau { query } untuk memandu pemilihan dengan query
                            Anda sendiri."
                          example: 1
                          deprecated: true
                        - type: "null"
                  title: Advanced highlights options
                  description: "Opsi lanjutan untuk mengarahkan ekstraksi kutipan. Teruskan
                    highlights: true untuk default berkualitas tertinggi;
                    berikan objek ini hanya jika Anda perlu memandu pemilihan
                    dengan query Anda sendiri."
            - type: "null"
        summary:
          anyOf:
            - type: object
              properties:
                query:
                  anyOf:
                    - type: string
                      description: Query kustom untuk ringkasan yang dihasilkan LLM.
                      example: Main developments
                    - type: "null"
                schema:
                  anyOf:
                    - type: object
                      propertyNames:
                        type: string
                      additionalProperties:
                        $ref: "#/components/schemas/JsonValue"
                      description: Skema JSON untuk output terstruktur dari ringkasan. Lihat
                        https://json-schema.org/overview/what-is-jsonschema
                        untuk dokumentasi JSON Schema.
                      example:
                        $schema: http://json-schema.org/draft-07/schema#
                        title: Title
                        type: object
                        properties:
                          Property 1:
                            type: string
                            description: Deskripsi
                          Property 2:
                            type: string
                            enum:
                              - option 1
                              - option 2
                              - option 3
                            description: Deskripsi
                        required:
                          - Property 1
                    - type: "null"
              description: Ringkasan halaman web.
            - type: "null"
        extras:
          anyOf:
            - type: object
              properties:
                links:
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 1000
                      description: Jumlah URL yang dikembalikan dari setiap halaman web.
                      example: 1
                      default: 0
                    - type: "null"
                imageLinks:
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 1000
                      description: Jumlah gambar yang dikembalikan untuk setiap hasil.
                      example: 1
                      default: 0
                    - type: "null"
                richImageLinks:
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 1000
                      description: Jumlah tautan gambar kaya yang dikembalikan untuk setiap hasil.
                      default: 0
                    - type: "null"
                richLinks:
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 1000
                      description: Jumlah tautan kaya yang dikembalikan untuk setiap hasil.
                      default: 0
                    - type: "null"
                codeBlocks:
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 1000
                      description: Jumlah blok kode yang dikembalikan untuk setiap hasil.
                      default: 0
                    - type: "null"
              description: Parameter tambahan yang akan diteruskan.
            - type: "null"
        context:
          anyOf:
            - description: "Usang: Gunakan highlights atau text sebagai gantinya.
                Mengembalikan konten halaman sebagai satu string konteks."
              deprecated: true
              oneOf:
                - type: boolean
                  description: "Usang: Gunakan highlights atau text sebagai gantinya.
                    Mengembalikan konten halaman sebagai satu string konteks."
                  example: true
                  deprecated: true
                - type: object
                  properties:
                    maxCharacters:
                      type: integer
                      minimum: 1
                      maximum: 10000
                      description: Usang. Batas karakter maksimum untuk string konteks. Nilai maksimum
                        yang didukung adalah 10000.
                      example: 10000
                  description: "Usang: Gunakan highlights atau text sebagai gantinya.
                    Mengembalikan konten halaman sebagai satu string konteks."
                  deprecated: true
            - type: "null"
        livecrawl:
          anyOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
              description: "Usang: Gunakan maxAgeHours sebagai gantinya untuk mengontrol
                kebaruan konten. livecrawl tidak menjamin output parser yang
                baru diambil dan dapat disajikan sesuai kebijakan kebaruan
                server. Jangan kirim livecrawl dan maxAgeHours secara
                bersamaan."
              example: preferred
              deprecated: true
            - type: "null"
        livecrawlTimeout:
          anyOf:
            - type: integer
              exclusiveMinimum: 0
              maximum: 90000
              description: Batas waktu livecrawling dalam milidetik.
              example: 1000
              default: 10000
            - type: "null"
        maxAgeHours:
          anyOf:
            - type: integer
              minimum: -1
              maximum: 720
              description: Usia maksimum konten cache dalam jam. Nilai positif menggunakan
                konten cache jika usianya kurang dari jumlah jam ini; 0
                mengambil konten baru dan merupakan cara yang didukung untuk
                menerapkan opsi perenderan teks pada halaman yang baru diambil;
                -1 selalu menggunakan cache; jika dihilangkan, pengambilan
                fallback digunakan saat konten cache tidak tersedia. Nilai
                maksimum yang didukung adalah 720 jam.
              example: 24
            - type: "null"
        snapshotAsOf:
          anyOf:
            - type: string
              description: Kembalikan stored version terbaru setiap halaman pada waktu ini
                (tanggal-waktu ISO 8601). Permintaan historis hanya dilayani
                dari stored version dan tidak pernah mengambil halaman langsung.
              example: 2026-01-15T00:00:00Z
              format: date-time
            - type: "null"
        subpages:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 100
              description: Jumlah subhalaman yang akan di-crawl. Jumlah sebenarnya yang
                di-crawl dapat dibatasi oleh batasan sistem.
              example: 1
              default: 0
            - type: "null"
        subpageTarget:
          anyOf:
            - description: Istilah untuk menemukan subhalaman tertentu dari hasil pencarian.
                Dapat berupa satu string atau array string.
              example: sources
              oneOf:
                - type: string
                  minLength: 1
                  maxLength: 100
                - minItems: 0
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
            - type: "null"
      description: Berikan `ids` atau `urls`, tetapi bukan keduanya.
      oneOf:
        - required:
            - ids
        - required:
            - urls
    AnswerRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Pertanyaan atau instruksi bahasa alami untuk permintaan.
          example: What is the latest valuation of SpaceX?
        stream:
          type: boolean
          description: Jika true, response dikembalikan sebagai stream server-sent events
            (SSE).
          default: false
        text:
          type: boolean
          title: Simple text retrieval
          description: Jika true, mengembalikan teks halaman lengkap dengan pengaturan
            default. Jika false, menonaktifkan pengembalian teks.
          default: false
        model:
          description: Model yang digunakan untuk menghasilkan jawaban.
          default: exa
          type: string
          enum:
            - exa
            - exa-pro
            - exa-research
            - exa-fast
        systemPrompt:
          type: string
          description: Instruksi tambahan yang memandu output yang dihasilkan atau
            perilaku agent. Gunakan untuk preferensi sumber, batasan kebaruan,
            batasan duplikasi, atau instruksi perilaku lainnya.
          example: Prefer official sources and avoid duplicate results.
        userLocation:
          anyOf:
            - type: string
              description: Kode negara ISO dua huruf pengguna, misalnya US.
              example: US
            - type: "null"
        outputSchema:
          type: object
          properties:
            type:
              type: string
              description: Tipe skema root (biasanya "object").
              example: object
            properties:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: Objek yang setiap key-nya adalah nama properti dan setiap nilainya
                adalah JSON Schema yang menjelaskan properti tersebut (dengan
                `type`, `description`, dll.).
            required:
              type: array
              items:
                type: string
              description: Daftar nama properti wajib.
            description:
              type: string
              description: Deskripsi skema.
            additionalProperties:
              type: boolean
              description: Apakah akan mengizinkan properti yang tidak tercantum dalam
                `properties`.
              default: false
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: Spesifikasi [JSON Schema Draft 7](https://json-schema.org/draft-07)
            untuk struktur jawaban yang diinginkan. Jika diberikan, jawaban
            dikembalikan sebagai objek terstruktur yang sesuai dengan skema,
            bukan string biasa.
      required:
        - query
    FindSimilarRequest:
      type: object
      properties:
        includeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: Daftar domain atau jalur domain yang akan disertakan dalam
                pencarian. Setiap entri dapat berupa nama host (misalnya,
                `example.com`), nama host dengan awalan jalur (misalnya,
                `example.com/docs`), atau subdomain wildcard (misalnya,
                `*.example.com`). Jika ditentukan, hasil hanya akan berasal dari
                domain atau jalur yang cocok. Gunakan parameter ini untuk
                pemfilteran domain atau jalur alih-alih menambahkan operator
                `site:` ke query.
              example:
                - arxiv.org
                - exa.ai/blog
            - type: "null"
        excludeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: Daftar domain atau jalur domain yang akan dikecualikan dari hasil
                pencarian. Setiap entri dapat berupa nama host (misalnya,
                `example.com`), nama host dengan awalan jalur (misalnya,
                `example.com/docs`), atau subdomain wildcard (misalnya,
                `*.example.com`). Jika ditentukan, tidak ada hasil yang akan
                dikembalikan dari domain atau jalur yang cocok. Gunakan
                parameter ini untuk pemfilteran domain atau jalur alih-alih
                menambahkan operator `site:` ke query.
              example:
                - docs.python.org/3
            - type: "null"
        startCrawlDate:
          anyOf:
            - type: string
              description: Usang dan tidak berpengaruh; diabaikan oleh API. Harus ditentukan
                dalam format ISO 8601.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        endCrawlDate:
          anyOf:
            - type: string
              description: Usang dan tidak berpengaruh; diabaikan oleh API. Harus ditentukan
                dalam format ISO 8601.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        startPublishedDate:
          anyOf:
            - type: string
              description: Hanya tautan dengan tanggal publikasi setelah waktu ini yang akan
                dikembalikan. Harus ditentukan dalam format ISO 8601.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
            - type: "null"
        endPublishedDate:
          anyOf:
            - type: string
              description: Hanya tautan dengan tanggal publikasi sebelum waktu ini yang akan
                dikembalikan. Harus ditentukan dalam format ISO 8601.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
            - type: "null"
        numResults:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 100
              description: Jumlah hasil yang dikembalikan. Batas berbeda menurut search type.
                Batas publik maksimum adalah 100 hasil. Hubungi tim sales
                (hello@exa.ai) untuk membahas batas yang lebih tinggi.
              example: 10
              default: 10
            - type: "null"
        contents:
          anyOf:
            - description: Content options untuk teks, kutipan, ringkasan, ekstra, dan kontrol
                kebaruan.
              $ref: "#/components/schemas/ContentsOptions"
            - type: "null"
        url:
          type: string
          minLength: 3
          description: URL untuk menemukan tautan serupa.
          example: https://arxiv.org/abs/2307.06435
        category:
          anyOf:
            - type: string
              enum:
                - company
                - publication
                - news
                - personal site
                - financial report
                - people
              description: "Kategori data yang menjadi fokus. Kategori yang didukung mencakup
                `company`, `publication`, `news`, `personal site`, `financial
                report`, dan `people`. String lain juga diterima dan digunakan
                sebagai petunjuk kategori untuk pencarian. Kategori `people` dan
                `company` memiliki kualitas yang lebih baik untuk menemukan
                profil orang dan halaman perusahaan. Kategori `publication`
                menampilkan publikasi ilmiah seperti paper penelitian, pracetak,
                dan artikel jurnal, dengan metadata terstruktur seperti penulis,
                publikasi, dan sitasi. Catatan: Kategori `company` dan `people`
                hanya mendukung sejumlah filter terbatas. Parameter berikut
                TIDAK didukung untuk kategori ini: `startPublishedDate`,
                `endPublishedDate`, `excludeDomains`. Penggunaan parameter yang
                tidak didukung akan menghasilkan error 400."
              example: publication
            - type: "null"
        excludeSourceDomain:
          anyOf:
            - type: boolean
              description: Jika true, hasil dari domain yang sama dengan URL sumber akan
                dikecualikan.
              example: true
            - type: "null"
      required:
        - url
    CreateSearchMonitorParameters:
