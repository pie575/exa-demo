              example: 0.0025
              format: float
              type: number
          additionalProperties: false
        summary:
          description: Coût de génération d’un résumé synthétisé pour les requêtes de
            recherche.
          example: 0.005
          format: float
          type: number
        contents:
          description: Répartition estimée du coût du retrieval de contenu autonome
            (texte, highlights et résumés facturés en dehors du tarif groupé de
            recherche).
          type: object
          properties:
            text:
              description: Coût de l’extraction de texte.
              example: 0.001
              format: float
              type: number
            highlights:
              description: Coût de l’extraction des highlights.
              example: 0.001
              format: float
              type: number
            summary:
              description: Coût de génération d’un résumé par résultat.
              example: 0.001
              format: float
              type: number
          additionalProperties: false
