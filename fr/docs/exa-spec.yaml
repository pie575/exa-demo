                uniquement depuis le cache avec des paramètres pris en charge.
                Consultez la documentation HIPAA pour plus de détails.
              example: hipaa
            - type: "null"
        outputSchema:
          anyOf:
            - oneOf:
                - $ref: "#/components/schemas/OutputSchemaText"
                - $ref: "#/components/schemas/OutputSchemaObject"
              description: Schéma JSON pour la sortie synthétisée. Les types racine pris en
                charge sont "text" et "object". Lorsqu'il est fourni, la réponse
                inclut un objet de sortie dont le contenu correspond à ce
                schéma. Fonctionne avec tous les types de recherche et ajoute
                environ 2 secondes de latence de synthèse à celle du type de
                recherche sélectionné.
              type: object
              discriminator:
                propertyName: type
                mapping:
                  text: "#/components/schemas/OutputSchemaText"
                  object: "#/components/schemas/OutputSchemaObject"
            - type: "null"
        systemPrompt:
          anyOf:
            - type: string
              description: Instructions supplémentaires guidant la sortie générée ou le
                comportement de l'agent. Utilisez-les pour indiquer des
                préférences de sources, des contraintes de nouveauté, des
                contraintes de duplication ou d'autres consignes de
                comportement.
              example: Prefer official sources and avoid duplicate results.
            - type: "null"
        stream:
          anyOf:
            - type: boolean
              description: Demande des server-sent events pour le streaming de la sortie
                synthétisée. Le streaming est actuellement utilisé uniquement
                lorsque outputSchema est fourni ; sinon, l'endpoint renvoie la
                réponse JSON de recherche habituelle.
              default: false
            - type: "null"
      required:
        - query
    JsonValue:
      description: Toute valeur JSON.
      oneOf:
        - type: "null"
        - type: boolean
        - type: number
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/JsonValue"
        - type: object
          propertyNames:
            type: string
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
    ContentsOptions:
      type: object
      properties:
