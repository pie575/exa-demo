    CreateWebsetSearchParameters:
      properties:
        count:
          minimum: 1
          description: >-
            Nombre d’Items que le Search tentera de trouver.


            Le nombre réel d’Items trouvés peut être inférieur à ce nombre selon
            la complexité de la requête.
          type: number
        query:
          minLength: 1
          maxLength: 5000
          description: >-
            Requête de recherche en langage naturel décrivant ce que vous
            recherchez.


            Soyez précis dans la description de vos exigences, des
            caractéristiques recherchées et de toute contrainte permettant
            d’affiner les résultats.


            Toutes les URL fournies seront explorées et utilisées comme contexte
            supplémentaire pour la recherche.
          examples:
            - Marketing agencies based in the US, that focus on consumer
              products. Get brands worked with and city
            - AI startups in Europe that raised Series A funding in 2024
            - SaaS companies with 50-200 employees in the fintech space
          type: string
        entity:
          description: >-
            Entité pour laquelle la recherche renverra des résultats.


            Il n’est pas nécessaire de la fournir : nous détectons
            automatiquement l’entité à partir de toutes les informations
            fournies dans la requête. Utilisez ce champ uniquement lorsque vous
            avez besoin d’un contrôle plus précis.
          $ref: "#/components/schemas/Entity"
        criteria:
          description: >-
            Critères selon lesquels chaque élément est évalué.


            Il n’est pas nécessaire de fournir vos propres critères : nous les
            détectons automatiquement à partir de toutes les informations
            fournies dans la requête. Utilisez cette option uniquement si vous
            avez besoin d’un contrôle plus précis.
          minItems: 1
          maxItems: 5
          items:
            title: CreateCriterionParameters
            $ref: "#/components/schemas/CreateCriterionParameters"
          type: array
        maxPeoplePerCompany:
          description: Plafond souple facultatif pour les recherches de personnes.
            Lorsqu’il est défini, la recherche tentera d’inclure au plus ce
            nombre de personnes correspondantes travaillant actuellement dans la
            même entreprise.
          minimum: 1
          type: integer
        exclude:
          description: Sources (imports ou websets existants) à exclure des résultats de
            recherche. Les résultats provenant de ces sources seront omis afin
            qu’ils ne soient pas retrouvés lors de la recherche.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: L’ID de la source à exclure.
                type: string
            required:
              - source
              - id
            type: object
          type: array
        scope:
          description: Limite la recherche à des sources spécifiques (imports existants).
            Tous les résultats de ces sources qui correspondent aux critères de
            recherche seront inclus dans le Webset.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: L’ID de la source dans laquelle effectuer la recherche.
                type: string
              relationship:
                properties:
                  definition:
                    description: Relation entre les entités que vous souhaitez trouver et celles
                      contenues dans la source fournie.
                    type: string
                  limit:
                    minimum: 1
                    maximum: 10
                    type: number
                required:
                  - definition
                  - limit
                type: object
            required:
              - source
              - id
            type: object
          type: array
        recall:
          description: >-
            Indique s’il faut fournir une estimation du nombre total de
            résultats pertinents pouvant exister pour cette recherche.

            Le résultat de l’analyse sera disponible dans le field `recall` de
            la requête de recherche.
          type: boolean
        behavior:
          default: override
          description: >-
            Interaction de cette recherche avec les éléments existants dans le
            Webset :


            - **override** : remplacer les éléments existants et évaluer tous
            les éléments selon les nouveaux critères

            - **append** : ajouter de nouveaux éléments aux éléments existants,
            en conservant ceux qui correspondent aux nouveaux critères
          $ref: "#/components/schemas/WebsetSearchBehavior"
        metadata:
          description: Ensemble de paires clé-valeur à associer à cet objet.
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
      required:
        - count
        - query
      type: object
