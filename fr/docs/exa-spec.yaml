              description: "Options avancées pour orienter l’extraction des highlights.
                Transmettez highlights: true pour bénéficier du réglage par
                défaut de la meilleure qualité ; fournissez cet objet uniquement
                si vous devez guider la sélection avec votre propre requête."
        summary:
          description: Renvoyer un résumé généré par un LLM. Transmettez `true` pour
            utiliser les valeurs par défaut, ou un objet avec `query` et
            `maxTokens`.
          oneOf:
            - type: boolean
            - $ref: "#/components/schemas/SummaryWithMaxTokensOptions"
        extras:
          type: object
          properties:
            links:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Nombre d’URL à renvoyer depuis chaque page web.
                  example: 1
                  default: 0
                - type: "null"
            imageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Nombre d’images à renvoyer pour chaque résultat.
                  example: 1
                  default: 0
                - type: "null"
            richImageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Nombre de liens vers des images enrichies à renvoyer pour chaque
                    résultat.
                  default: 0
                - type: "null"
            richLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Nombre de liens enrichis à renvoyer pour chaque résultat.
                  default: 0
                - type: "null"
            codeBlocks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Nombre de blocs de code à renvoyer pour chaque résultat.
                  default: 0
                - type: "null"
          description: Paramètres supplémentaires à transmettre.
        context:
          description: "Déprécié : utilisez plutôt les highlights ou le texte. Renvoie les
            page contents sous la forme d’une chaîne de context combinée."
          deprecated: true
          oneOf:
            - type: boolean
              description: "Déprécié : utilisez plutôt les highlights ou le texte. Renvoie les
                page contents sous la forme d’une chaîne de context combinée."
              example: true
              deprecated: true
            - type: object
              properties:
                maxCharacters:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: Déprécié. Limite maximale de caractères pour la chaîne de context.
                    La valeur maximale prise en charge est de 10000.
                  example: 10000
              description: "Déprécié : utilisez plutôt les highlights ou le texte. Renvoie les
                page contents sous la forme d’une chaîne de context combinée."
              deprecated: true
        livecrawl:
          description: Stratégie d’exploration pour récupérer le contenu de la page
          oneOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
            - type: string
              const: auto
        livecrawlTimeout:
          type: integer
          exclusiveMinimum: 0
          maximum: 90000
          description: Délai d’expiration du livecrawling, en millisecondes.
          example: 1000
          default: 10000
        maxAgeHours:
          type: integer
          minimum: -1
          maximum: 720
          description: Âge maximal du contenu mis en cache, en heures. Les valeurs
            positives utilisent le contenu mis en cache s’il date de moins de ce
            nombre d’heures ; 0 récupère du contenu récent et constitue la
            méthode prise en charge pour appliquer les options de rendu de texte
            aux pages nouvellement récupérées ; -1 utilise toujours le cache ;
            si cette valeur est omise, la récupération de secours est utilisée
            lorsque le contenu mis en cache n’est pas disponible. La valeur
            maximale prise en charge est de 720 heures.
          example: 24
        filterEmptyResults:
          type: boolean
          description: Filtrer les résultats sans contenu
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: Nombre de sous-pages à explorer. Le nombre réel de pages explorées
            peut être limité par les contraintes du système.
          example: 1
          default: 0
        subpageTarget:
          description: Terme permettant de trouver des sous-pages spécifiques dans les
            résultats de recherche. Peut être une chaîne unique ou un tableau de
            chaînes.
          example: sources
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
      description: Options d’extraction de contenu appliquées à chaque résultat de
        recherche. Tous les field sont facultatifs.
    SummaryWithMaxTokensOptions:
      type: object
      properties:
        query:
          anyOf:
            - type: string
              description: Requête personnalisée pour le résumé généré par le LLM.
              example: Main developments
            - type: "null"
        maxTokens:
          type: integer
          minimum: 1
          description: Nombre maximal de jetons pour le résumé généré.
    SearchMonitorTrigger:
      type: object
      properties:
        type:
          type: string
          const: interval
          description: Type de déclencheur. Seul `interval` est actuellement pris en charge.
          default: interval
        period:
          type: string
          description: Chaîne de durée indiquant la fréquence d’exécution du monitor (par
            exemple, "1h", "6h", "1d", "7d"). Une seule unité est autorisée.
            L’intervalle minimal est de 1 heure. Le schedule est ancré sur
            l’heure de création du monitor (par exemple, un monitor quotidien
            créé à 14 h 30 s’exécute chaque jour vers 14 h 30).
          example: 6h
      required:
        - type
        - period
    SearchMonitorOutputSchema:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaText"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: Schéma JSON pour l’output synthétisé. Les types racine pris en
            charge sont "text" et "object". Lorsqu’il est fourni, la réponse
            inclut un objet output dont le contenu correspond à ce schéma.
            Fonctionne avec tous les types de recherche et ajoute environ
            2 secondes de latence de synthèse au type de recherche sélectionné.
          type: object
          discriminator:
            propertyName: type
            mapping:
              text: "#/components/schemas/OutputSchemaText"
              object: "#/components/schemas/OutputSchemaObject"
        - type: "null"
      description: 'Contrôle le format de l’output du run. Par défaut, `{ "type":
        "text" }` est utilisé s’il n’est pas spécifié. Lorsque `type` est
        `"text"`, l’output est un résumé en texte brut. Lorsque `type` est
        `"object"`, l’output est du JSON structuré. Si aucune `properties` n’est
        spécifiée avec le type `"object"`, un schéma est déduit
        automatiquement ; sinon, l’output respecte le schéma fourni.'
    SearchMonitorWebhook:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL HTTPS recevant les événements webhook. Ne doit pas pointer vers
            localhost ni vers des plages d’adresses IP privées.
        events:
          type: array
          items:
            type: string
            enum:
              - monitor.created
              - monitor.updated
              - monitor.deleted
              - monitor.run.created
              - monitor.run.completed
          description: Événements auxquels s’abonner. Tous les événements sont utilisés
            par défaut s’ils ne sont pas spécifiés.
      required:
        - url
    BatchMonitorsRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - delete
            - pause
            - unpause
          description: Action à effectuer sur les monitors correspondants. `delete` les
            supprime définitivement, `pause` définit leur statut sur suspendu et
            `unpause` définit leur statut sur actif.
        filter:
          type: object
          properties:
            name:
              type: string
              maxLength: 250
              description: Filtrer par nom (correspondance de sous-chaîne insensible à la
                casse)
            status:
              type: string
              enum:
                - active
                - paused
                - disabled
              description: Filtrer par statut du monitor
            metadata:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
                maxLength: 1000
              description: Filtrer par paires clé-valeur de métadonnées (correspondance
                exacte, sémantique ET)
          description: Au moins un field de filtre doit être fourni pour éviter les
            opérations groupées accidentelles.
        dry_run:
          type: boolean
          description: Lorsque `true`, renvoie les monitors qui seraient affectés sans
            effectuer l’action. La valeur par défaut est `true`.
          default: true
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: "Nombre maximal de monitors à traiter dans une seule requête.
            Valeur par défaut : 50 ; maximum : 500."
          default: 50
      required:
        - action
        - filter
    UpdateSearchMonitorParameters:
      type: object
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
          description: Mettre à jour le nom du monitor
        status:
          type: string
          enum:
            - active
            - paused
          description: Mettre à jour le statut du monitor (peut uniquement être défini sur
            `active` ou `paused`)
        search:
          type: object
          properties:
            query:
              type: string
              minLength: 1
              description: Chaîne de requête pour la recherche.
              example: Latest developments in LLM capabilities
            numResults:
              type: integer
              minimum: 1
              maximum: 100
              description: Nombre de résultats à renvoyer. Les limites varient selon le type
                de recherche. La limite publique maximale est de 100 résultats.
                Contactez l’équipe commerciale (hello@exa.ai) pour discuter de
                limites plus élevées.
              example: 10
              default: 10
            includeDomains:
              description: Restreindre les résultats de recherche à ces domaines.
              type: array
              items:
                type: string
            excludeDomains:
              description: Exclure ces domaines des résultats de recherche.
              type: array
              items:
                type: string
            contents:
              $ref: "#/components/schemas/SearchMonitorContents"
          description: Paramètres de recherche partiels à fusionner. Tous les fields sont
            facultatifs lors des mises à jour.
        trigger:
          anyOf:
            - type: object
              properties:
                type:
                  type: string
                  const: interval
                  description: Type de déclencheur. Seul `interval` est actuellement pris en
                    charge.
                  default: interval
                period:
                  type: string
                  description: Chaîne de durée indiquant la fréquence d’exécution du monitor (par
                    exemple, "1h", "6h", "1d", "7d"). Une seule unité est
                    autorisée. L’intervalle minimal est de 1 heure.
            - type: "null"
          description: Mettre à jour le schedule. Définissez-le sur null pour supprimer le
            schedule.
        outputSchema:
          $ref: "#/components/schemas/SearchMonitorOutputSchema"
        metadata:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
              description: Métadonnées clé-valeur fournies par l’appelant pour son propre
                suivi.
              example:
                slack_channel_id: C123ABC
                slack_thread_id: "1745444400.123456"
                user_id: U123ABC
            - type: "null"
          description: Mettre à jour les métadonnées. Définissez-les sur null pour les
            supprimer. Elles sont renvoyées dans les livraisons webhook afin que
            vous puissiez acheminer les mises à jour vers des systèmes comme
            Slack.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        webhook:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: URL HTTPS recevant les événements webhook. Ne doit pas pointer vers
                localhost ni vers des plages d’adresses IP privées.
            events:
              type: array
              items:
                type: string
                enum:
                  - monitor.created
                  - monitor.updated
                  - monitor.deleted
                  - monitor.run.created
                  - monitor.run.completed
              description: Événements auxquels s’abonner. Tous les événements sont utilisés
                par défaut s’ils ne sont pas spécifiés.
          description: Paramètres webhook partiels à fusionner. Tous les fields sont
            facultatifs lors des mises à jour.
    CreateAgentRunRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Question ou instructions en langage naturel pour la requête.
          example: What are the most important AI infrastructure funding rounds announced
            this week?
        systemPrompt:
          type: string
          description: Instructions supplémentaires guidant l’output généré ou le
            comportement de l’agent. Utilisez-les pour définir des préférences
            de sources, des contraintes de nouveauté, des contraintes de
            duplication ou toute autre indication de comportement.
          example: Prefer official sources and avoid duplicate results.
        effort:
          $ref: "#/components/schemas/AgentEffort"
        input:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Un record d’objet JSON.
              description: Records que l’agent doit traiter ou enrichir.
            exclusion:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Un record d’objet JSON.
              description: Records ou entités que l’agent doit éviter de renvoyer.
          description: Records à traiter et records ou entités à exclure de la réponse.
        outputSchema:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: Schéma JSON pour une sortie structurée validée dans
                `output.structured`. Les fields non pris en charge par les
                preuves peuvent être renvoyés sous la forme `null`. Prend en
                charge draft-07, 2019-09 et 2020-12 via `$schema`.
            - type: "null"
        previousRunId:
          description: ID d’un run terminé à partir duquel poursuivre. Doit appartenir à
            la même équipe.
          $ref: "#/components/schemas/AgentRunId"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Métadonnées fournies par l’appelant et stockées avec le run.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        dataSources:
          maxItems: 5
          type: array
          items:
            $ref: "#/components/schemas/AgentDataSource"
          description: Fournisseurs de données Exa Connect à activer pour le run. Chaque
            entrée active tous les tools de ce fournisseur.
        budget:
          $ref: "#/components/schemas/AgentBudget"
      required:
        - query
    AgentEffort:
      type: string
      enum:
        - minimal
        - low
        - medium
        - high
        - xhigh
        - auto
        - max
      description: Préférence de coût et d’effort de raisonnement pour le run. `auto`
        laisse Exa choisir l’effort approprié. `max` est le niveau de bêta
        publique nécessitant le plus d’effort, destiné aux tâches où
        l’exhaustivité et la rigueur priment sur la latence ou le coût,
        notamment la constitution de grandes listes, la recherche approfondie
        multisource et les critères difficiles à vérifier.
      default: auto
    AgentRunId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[A-Za-z0-9_.:-]+$
      description: ID du run Agent. Les nouveaux ID de run sont renvoyés avec le
        préfixe `agent_run_`.
      example: agent_run_01j7x9v0m2n4p6q8r0s2t4v6w8
    AgentDataSource:
      type: object
      properties:
        provider:
          description: Fournisseur de données Exa Connect à activer pour le run. Tous les
            tools du fournisseur sont disponibles par défaut.
          example: fiber
          $ref: "#/components/schemas/AgentDataSourceProvider"
      required:
        - provider
    AgentDataSourceProvider:
      type: string
      enum:
        - fiber
        - financial_datasets
        - similarweb
        - baselayer
        - affiliate
        - particle
        - jinko
        - polymarket
      description: Identifiant d’un fournisseur de données Exa Connect.
    AgentBudget:
      type: object
      properties:
        maxCostDollars:
          type: number
          description: Montant maximal que ce run peut dépenser en dollars américains.
            Accepte les montants de 1 $ à 100 $ et s’applique uniquement à
            `auto` et `max` ; s’il est omis, le plafond par défaut est de 5 $
            pour `auto` et de 20 $ pour `max`.
          example: 10
      description: Limite de dépenses facultative par run pour les efforts facturés à
        l’usage `auto` et `max`. Les runs qui se terminent plus tôt peuvent
        coûter moins que cette limite.
    CreateBatchRequest:
      type: object
      properties:
        requests:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/BatchRequestItem"
          description: Les requests à mettre en file d’attente. Chaque `customId` doit
            être unique au sein du batch.
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Métadonnées fournies par l’appelant et stockées avec le batch.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
      required:
        - requests
    BatchRequestItem:
      type: object
      properties:
        customId:
          type: string
          minLength: 1
          maxLength: 64
          description: Votre identifiant unique pour cette requête ; il identifie le
            résultat et doit être unique au sein du batch.
          example: row-1
        method:
          type: string
          const: POST
          description: Méthode HTTP de la requête du batch. Seule la méthode POST est
            prise en charge en v1.
        url:
          type: string
          enum:
            - /search
            - /agent/runs
          description: Route API cible de la requête. `/search` ou `/agent/runs` en v1.
          example: /search
        body:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: "Corps de la requête pour la route cible. Doit être un objet JSON ;
            `stream: true` n’est pas autorisé."
      required:
        - customId
        - method
        - url
        - body
    AnswerStreamTextDeltaChunk:
      type: object
      properties:
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                minimum: 0
                description: Index de ce choix diffusé en continu.
              delta:
                type: object
                properties:
                  role:
                    type: string
                    const: assistant
                  content:
                    type: string
                  refusal:
                    anyOf:
                      - type: string
                      - type: "null"
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Contenu incrémentiel de la réponse émis par le modèle.
              finish_reason:
                description: Motif de fin de ce choix diffusé en continu, lorsqu’il est présent.
                oneOf:
                  - type: string
                  - type: "null"
            required:
              - index
              - delta
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
          description: Choix de complétion diffusés en continu compatibles avec OpenAI,
            dont les field internes du fournisseur ont été supprimés.
      required:
        - choices
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    SearchResponse:
      oneOf:
        - $ref: "#/components/schemas/SearchSynthesisResponse"
        - $ref: "#/components/schemas/SearchResultsResponse"
    SearchSynthesisResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Identifiant unique de la requête.
          example: b5947044c4b78efa9552a7c89b306d95
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultOutput"
          description: Liste de résultats de recherche contenant le titre, l’URL, la date
            de publication et l’auteur.
        resolvedSearchType:
          description: Field hérité déprécié. Les réponses de production actuelles peuvent
            renvoyer une chaîne vide ; les clients ne doivent pas effectuer de
            branchement sur cette valeur.
          example: ""
          deprecated: true
          type: string
        context:
          type: string
          description: Déprécié. Chaîne de contexte combinant les résultats de recherche.
            Utilisez plutôt les highlights ou le texte.
          deprecated: true
        costDollars:
          $ref: "#/components/schemas/CostDollarsOutput"
        searchTime:
          type: number
          description: Temps de traitement côté serveur en millisecondes, mesuré au niveau
            du gateway. Couvre le retrieval, mais peut exclure des phases
            ultérieures telles que la synthèse de sortie structurée ; il peut
            donc être inférieur à la latence de la requête de bout en bout.
          example: 312.4
        output:
          $ref: "#/components/schemas/SearchSynthesisOutputOutput"
      required:
        - results
        - output
      additionalProperties: false
    SearchResultsResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Identifiant unique de la requête.
          example: b5947044c4b78efa9552a7c89b306d95
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultOutput"
          description: Liste de résultats de recherche contenant le titre, l’URL, la date
            de publication et l’auteur.
        resolvedSearchType:
          description: Field hérité déprécié. Les réponses de production actuelles peuvent
            renvoyer une chaîne vide ; les clients ne doivent pas effectuer de
            branchement sur cette valeur.
          example: ""
          deprecated: true
          type: string
        context:
          type: string
          description: Déprécié. Chaîne de contexte combinant les résultats de recherche.
            Utilisez plutôt les highlights ou le texte.
          deprecated: true
        costDollars:
          $ref: "#/components/schemas/CostDollarsOutput"
        searchTime:
          type: number
          description: Temps de traitement côté serveur en millisecondes, mesuré au niveau
            du gateway. Couvre le retrieval, mais peut exclure des phases
            ultérieures telles que la synthèse de sortie structurée ; il peut
            donc être inférieur à la latence de la requête de bout en bout.
          example: 312.4
      required:
        - results
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Identifiant unique de la requête.
          example: b5947044c4b78efa9552a7c89b306d95
        error:
          type: string
          description: Message lisible par l’humain décrivant l’erreur.
          example: Invalid API key
        tag:
          type: string
          description: "Tag d’erreur lisible par machine identifiant l’échec. L’ensemble
            des tags est ouvert : de nouveaux tags peuvent être ajoutés à tout
            moment. Traitez les tags non reconnus comme une erreur générique
            correspondant au code de statut HTTP de la réponse. Les tags connus
            sont répertoriés à titre d’exemple."
          examples:
            - DEFAULT_ERROR
            - INTERNAL_ERROR
            - INVALID_API_KEY
            - INVALID_REQUEST
            - INVALID_REQUEST_BODY
            - INVALID_REQUEST_QUERY
            - INVALID_JSON_SCHEMA
            - INVALID_NUM_RESULTS
            - NUM_RESULTS_EXCEEDED
            - NO_MORE_CREDITS
            - API_KEY_BUDGET_EXCEEDED
            - TEAM_BUDGET_EXCEEDED
            - NO_CONTENT_FOUND
            - PROHIBITED_CONTENT
            - INSUFFICIENT_SCOPE
            - UNABLE_TO_GENERATE_RESPONSE
            - UNSUPPORTED_PUBLICATION_INCLUDE_FILTER
            - SUBPAGES_LIMIT_EXCEEDED
            - FEATURE_DISABLED
            - INVALID_URLS
            - FETCH_DOCUMENT_ERROR
            - TEAM_BLOCKED
            - NOT_FOUND
            - RATE_LIMIT_EXCEEDED
            - SNAPSHOT_RATE_LIMIT_EXCEEDED
            - SNAPSHOT_NOT_ON_PLAN
            - SNAPSHOT_NOT_IN_CONTRACT
            - SNAPSHOT_TRIAL_EXHAUSTED
            - SNAPSHOT_TRIAL_CAP_EXCEEDED
      required:
        - requestId
        - error
        - tag
      additionalProperties: false
      description: Enveloppe d’erreur standard renvoyée par l’API Exa pour les
        requêtes ayant échoué.
    X402PaymentChallenge:
      type: object
      properties:
        requestId:
          type: string
          description: Identifiant unique de la requête.
