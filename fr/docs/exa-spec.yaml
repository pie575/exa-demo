components:
  schemas:
    SearchRequest:
      type: object
      properties:
        includeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: Liste des domaines ou chemins de domaine à inclure dans la
                recherche. Chaque entrée peut être un nom d’hôte (par exemple,
                `example.com`), un nom d’hôte avec un préfixe de chemin (par
                exemple, `example.com/docs`) ou un sous-domaine générique (par
                exemple, `*.example.com`). Si ce paramètre est spécifié, les
                résultats proviendront uniquement des domaines ou chemins
                correspondants. Utilisez ce paramètre pour filtrer par domaine
                ou chemin au lieu d’ajouter un opérateur `site:` à la requête.
              example:
                - arxiv.org
                - exa.ai/blog
            - type: "null"
        excludeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: Liste des domaines ou chemins de domaine à exclure des résultats de
                recherche. Chaque entrée peut être un nom d’hôte (par exemple,
                `example.com`), un nom d’hôte avec un préfixe de chemin (par
                exemple, `example.com/docs`) ou un sous-domaine générique (par
                exemple, `*.example.com`). Si ce paramètre est spécifié, aucun
                résultat ne proviendra des domaines ou chemins correspondants.
                Utilisez ce paramètre pour filtrer par domaine ou chemin au lieu
                d’ajouter un opérateur `site:` à la requête.
              example:
                - docs.python.org/3
            - type: "null"
        startCrawlDate:
          anyOf:
            - type: string
              description: Obsolète et sans effet ; ignoré par l’API. Doit être spécifié au
                format ISO 8601.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        endCrawlDate:
          anyOf:
            - type: string
              description: Obsolète et sans effet ; ignoré par l’API. Doit être spécifié au
                format ISO 8601.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        startPublishedDate:
          anyOf:
            - type: string
              description: Seuls les liens dont la date de publication est postérieure à
                celle-ci seront renvoyés. Doit être spécifiée au format
                ISO 8601.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
            - type: "null"
        endPublishedDate:
          anyOf:
            - type: string
              description: Seuls les liens dont la date de publication est antérieure à
                celle-ci seront renvoyés. Doit être spécifiée au format
                ISO 8601.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
            - type: "null"
        numResults:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 100
              description: Nombre de résultats à renvoyer. Les limites varient selon le type
                de recherche. La limite publique maximale est de 100 résultats.
                Contactez l’équipe commerciale (hello@exa.ai) pour discuter de
                limites plus élevées.
              example: 10
              default: 10
            - type: "null"
        context:
          anyOf:
            - description: "Obsolète : utilisez plutôt les extraits ou le texte. Renvoie le
                contenu des pages sous forme d’une chaîne de contexte combinée."
              deprecated: true
              oneOf:
                - type: boolean
                  description: "Obsolète : utilisez plutôt les extraits ou le texte. Renvoie le
                    contenu des pages sous forme d’une chaîne de contexte
                    combinée."
                  example: true
                  deprecated: true
                - type: object
                  properties:
                    maxCharacters:
                      type: integer
                      minimum: 1
                      maximum: 10000
                      description: Obsolète. Nombre maximal de caractères pour la chaîne de contexte.
                        La valeur maximale prise en charge est 10000.
                      example: 10000
                  description: "Obsolète : utilisez plutôt les extraits ou le texte. Renvoie le
                    contenu des pages sous forme d’une chaîne de contexte
                    combinée."
                  deprecated: true
            - type: "null"
        moderation:
          anyOf:
            - type: boolean
              description: Activez la modération du contenu pour filtrer les contenus
                dangereux des résultats de recherche.
              example: true
              default: false
            - type: "null"
        contents:
          anyOf:
            - description: Options de contenu pour le texte, les extraits, le résumé, les
                éléments supplémentaires et les contrôles de fraîcheur.
              $ref: "#/components/schemas/ContentsOptions"
            - type: "null"
        query:
          type: string
          minLength: 1
          description: La chaîne de requête pour la recherche.
          example: Latest developments in LLM capabilities
        additionalQueries:
          anyOf:
            - minItems: 1
              maxItems: 10
              type: array
              items:
                type: string
              description: Variantes de requête supplémentaires pour les recherches
                approfondies. Fonctionne uniquement avec un type de recherche
                approfondie. Lorsqu’elles sont fournies, ces requêtes sont
                utilisées avec la requête principale afin d’obtenir des
                résultats plus larges.
              example:
                - LLM advancements
                - large language model progress
            - type: "null"
        type:
          anyOf:
            - type: string
              enum:
                - instant
                - fast
                - auto
                - deep-lite
                - deep
                - deep-reasoning
              description: Le mode de recherche à utiliser. `auto` (par défaut) est un mode
                équilibré qui optimise à la fois la qualité et la rapidité, et
                est recommandé pour la plupart des applications. `fast` renvoie
                des résultats de haute qualité avec une latence réduite, ce qui
                le rend adapté à la recherche orientée utilisateur et aux
                workflows interactifs. `instant` est optimisé pour un temps de
                réponse minimal, sacrifiant une partie de la profondeur de
                recherche au profit de la rapidité dans les expériences en temps
                réel telles que le chat, les agents vocaux et la saisie
                semi-automatique. `deep-lite` effectue une recherche légère avec
                des résultats synthétisés et une latence constante de 4
                secondes, inférieure à celle d'une recherche approfondie
                complète. `deep` mène une recherche exhaustive en plusieurs
                étapes avec synthèse, tandis que `deep-reasoning` apporte un
                raisonnement plus poussé pour les tâches d'analyse complexe et
                de prise de décision.
              example: auto
              default: auto
            - type: "null"
        category:
          anyOf:
            - type: string
              enum:
                - company
                - publication
                - news
                - personal site
                - financial report
                - people
              description: "Catégorie de données sur laquelle se concentrer. Les catégories
                connues incluent `company`, `publication`, `news`, `personal
                site`, `financial report` et `people`. D'autres chaînes sont
                acceptées et utilisées comme indications de catégorie pour la
                recherche. Les catégories `people` et `company` offrent une
                qualité améliorée pour trouver des profils de personnes et des
                pages d'entreprise. La catégorie `publication` fait remonter des
                publications académiques telles que des papers de recherche, des
                preprints et des articles de revues, avec des métadonnées
                structurées telles que les auteurs, le lieu de publication et
                les citations. Remarque : les catégories `company` et `people`
                ne prennent en charge qu'un ensemble limité de filtres. Les
                paramètres suivants ne sont PAS pris en charge pour ces
                catégories : `startPublishedDate`, `endPublishedDate`,
                `excludeDomains`. L'utilisation de paramètres non pris en charge
                entraînera une erreur 400."
              example: publication
            - type: "null"
        userLocation:
          anyOf:
            - type: string
              description: Le code pays ISO à deux lettres de l'utilisateur, par exemple US.
              example: US
            - type: "null"
        compliance:
          anyOf:
            - type: string
              enum:
                - hipaa
              description: Mode de conformité réservé à Enterprise. Définissez-le sur `hipaa`
