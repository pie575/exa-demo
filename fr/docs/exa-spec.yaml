    SearchMonitorOutputSchemaOutput:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaTextOutput"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: Schéma JSON de la sortie synthétisée. Les types racine pris en
            charge sont "text" et "object". Lorsqu’il est fourni, la réponse
            inclut un objet de sortie dont le contenu correspond à ce schéma.
            Fonctionne avec tous les types de recherche et ajoute environ
            2 secondes de latence de synthèse au temps de latence du type de
