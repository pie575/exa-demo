        découvrir de nouveaux Items correspondant à vos critères

        - **Mettre à jour le contenu existant** : exécuter des opérations
        `refresh` pour mettre à jour le contenu et les enrichissements des Items

        - **Planification automatisée** : configurer les expressions `cron` et
        le `timezone` pour contrôler précisément la planification
