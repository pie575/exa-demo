  headers:
    XRequestId:
      description: Identifiant unique de la requête. Correspond au field `requestId`
        renvoyé dans les corps de réponse qui en contiennent un.
      schema:
        type: string
      example: 07e29bb1f4f1dd05f0d4b57bbcf6e4b8
    XExaQueued:
      description: Indique si la requête a attendu dans la file d’attente de limite de
        débit du client avant d’être acceptée.
      schema:
        type: string
        enum:
          - "true"
          - "false"
      example: "false"
    XExaQueueMs:
      description: Nombre total de millisecondes pendant lesquelles la requête a
        attendu dans la file d’attente de limite de débit du client.
      schema:
        type: string
      example: "0"
  responses:
    BadRequestResponse:
      description: Le corps de la requête ou les paramètres de requête n’ont pas passé
        la validation.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 0a1b2c3d4e5f60718293a4b5c6d7e8f9
            error: "Invalid request body: query: Invalid input: expected string, received
              undefined"
            tag: INVALID_REQUEST_BODY
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedResponse:
      description: L’API key est absente ou non valide.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: f2a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2
            error: Invalid API key
            tag: INVALID_API_KEY
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequestsResponse:
      description: La limite de débit de cette API key, de cette équipe ou de ce
        réseau a été dépassée.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 7f9b1d3e5a0c2e4b6d8f0a2c4e6b8d0f
            error: You've exceeded the Exa rate limit for your network. If you believe this
              is in error, please email hello@exa.ai :)
            tag: RATE_LIMIT_EXCEEDED
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerErrorResponse:
      description: Une erreur inattendue s’est produite lors du traitement de la requête.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 9b1d3f5e7a0c2e4b6d8f0a2c4e6b8d0f
            error: Sorry, we encountered an error while processing your request. Please try
              again later
            tag: DEFAULT_ERROR
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailableResponse:
      description: Exa est temporairement saturé ou indisponible. La requête n’a pas
        été traitée ; réessayez avec un backoff exponentiel.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: b3d5f7a9c1e0a2c4e6b8d0f2a4c6e8b1
            error: Exa is temporarily over capacity. Please retry with exponential backoff.
            tag: SERVICE_OVERLOADED
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaymentRequiredResponse:
      description: L’équipe n’a plus de crédits ou un budget de dépenses a été dépassé.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 1c3e5a7b9d0f2a4c6e8b0d2f4a6c8e0b
            error: You have exceeded your credits limit. Please top up to keep using Exa at
              dashboard.exa.ai
            tag: NO_MORE_CREDITS
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundResponse:
      description: La ressource demandée n’existe pas.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 3b1d5f7a9c0e2b4d6f8a0c2e4b6d8f0a
            error: Not found
            tag: NOT_FOUND
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictResponse:
      description: La requête entre en conflit avec l’état actuel de la ressource.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          example:
            requestId: 5d7f9b1c3e0a2c4e6b8d0f2a4c6e8b0d
            error: Batch is not in a cancellable state
            tag: INVALID_REQUEST
          schema:
            $ref: "#/components/schemas/ErrorResponse"
