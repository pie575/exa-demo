      type: object
      properties:
        total:
          description: Coût total estimé en dollars pour la requête terminée. Cette valeur
            de réponse ne constitue pas une facture.
          example: 0.007
          format: float
          type: number
        search:
          description: Ventilation estimée du coût de recherche par mode de récupération,
            selon l’endpoint. Les réponses de recherche instantanée, rapide et
            automatique peuvent inclure le coût de la recherche neuronale. Les
            modes de recherche approfondie peuvent n’être pris en compte que
            dans le total.
          type: object
          properties:
            neural:
              description: Coût des opérations de recherche neuronale.
              example: 0.007
              format: float
              type: number
            keyword:
              description: Coût des opérations de recherche par mots-clés.
              example: 0.0025
              format: float
              type: number
          additionalProperties: false
        summary:
          description: Coût de génération de résumés synthétisés pour les requêtes de
            recherche.
          example: 0.005
          format: float
          type: number
        contents:
          description: Ventilation estimée du coût de la récupération autonome de contenu
            (texte, extraits et résumés facturés en dehors du tarif groupé de
            recherche).
          type: object
          properties:
            text:
              description: Coût de l’extraction de texte.
              example: 0.001
              format: float
              type: number
            highlights:
              description: Coût de l’extraction des extraits.
              example: 0.001
              format: float
              type: number
            summary:
              description: Coût de génération de résumés par résultat.
              example: 0.001
              format: float
              type: number
          additionalProperties: false
      additionalProperties: false
      description: Ventilation estimée du coût en dollars de la requête terminée,
        selon l’endpoint. La facturation est calculée à partir des compteurs
        d’utilisation, et non de cet objet de réponse.
