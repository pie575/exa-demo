              description: Instructions supplémentaires qui guident l'output généré ou le
                comportement de l'agent. Utilisez-les pour définir des
                préférences de sources, des contraintes de nouveauté ou de
                duplication, ou toute autre indication de comportement.
              example: Prefer official sources and avoid duplicate results.
            - type: "null"
        stream:
          anyOf:
            - type: boolean
              description: Demande des événements envoyés par le serveur pour le streaming de
                l'output synthétisé. Le streaming n'est actuellement utilisé que
                lorsque outputSchema est fourni ; sinon, l'endpoint renvoie la
                réponse JSON de recherche normale.
              default: false
            - type: "null"
      required:
        - query
