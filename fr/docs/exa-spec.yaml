        scope:
          description: Limitez la recherche à des sources spécifiques (imports existants).
            Tous les résultats trouvés dans ces sources et correspondant aux
            critères de recherche seront inclus dans le Webset.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: L'ID de la source dans laquelle effectuer la recherche.
                type: string
              relationship:
                properties:
                  definition:
                    description: Relation entre les entités que vous souhaitez trouver et celles
                      contenues dans la source fournie.
                    type: string
                  limit:
                    minimum: 1
                    maximum: 10
                    type: number
                required:
                  - definition
                  - limit
                type: object
            required:
              - source
              - id
            type: object
          type: array
        recall:
          description: >-
            Indique s'il faut fournir une estimation du nombre total de
            résultats pertinents susceptibles d'exister pour cette recherche.

            Le résultat de l'analyse sera disponible dans le champ `recall` de
