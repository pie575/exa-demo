    CreateWebsetParameters:
      properties:
        title:
          minLength: 1
          type: string
          description: Nom facultatif qui apparaît partout où le Webset est affiché.
            Laissez ce champ vide pour qu’Exa en génère un automatiquement.
          examples:
            - Leading climate tech startups
          nullable: true
        search:
          properties:
            query:
              minLength: 1
              maxLength: 5000
              description: >-
                Requête de recherche en langage naturel décrivant ce que vous
                recherchez.


                Soyez précis dans la description de vos exigences, des
                caractéristiques recherchées et des contraintes susceptibles
                d’affiner les résultats.


                Toutes les URL fournies seront explorées et utilisées comme
                contexte supplémentaire pour la recherche.
              examples:
                - Marketing agencies based in the US, that focus on consumer
                  products.
                - AI startups in Europe that raised Series A funding in 2024
                - SaaS companies with 50-200 employees in the fintech space
              type: string
            count:
              default: 10
              description: >-
                Nombre d’Items que le Webset tentera de trouver.


                Le nombre réel d’Items trouvés peut être inférieur à ce nombre
                selon la complexité de la recherche.
              minimum: 1
              type: number
            entity:
              description: >-
                Entité pour laquelle le Webset renverra des résultats.


                Il n’est pas nécessaire de la fournir : nous détectons
                automatiquement l’entité à partir de toutes les informations
                fournies dans la requête. Utilisez ce champ uniquement lorsque
                vous avez besoin d’un contrôle plus précis.
              $ref: "#/components/schemas/Entity"
            criteria:
              description: >-
                Critères par rapport auxquels chaque item est évalué.


                Il n’est pas nécessaire de fournir vos propres critères : nous
                les détectons automatiquement à partir de toutes les
                informations fournies dans la requête. Utilisez ce champ
                uniquement lorsque vous avez besoin d’un contrôle plus précis.
              minItems: 1
              maxItems: 5
              items:
                title: CreateCriterionParameters
                $ref: "#/components/schemas/CreateCriterionParameters"
              type: array
            maxPeoplePerCompany:
              description: Plafond souple facultatif pour les recherches de personnes.
                Lorsqu’il est défini, la recherche tentera d’inclure au plus ce
                nombre de personnes correspondantes travaillant actuellement
                pour la même entreprise.
