        livecrawl:
          anyOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
              description: "Déprécié : utilisez plutôt maxAgeHours pour contrôler la fraîcheur
                du contenu. livecrawl ne garantit pas que la sortie de
                l’analyseur soit récemment récupérée et peut être renvoyé
                conformément à la politique de fraîcheur du serveur. N’envoyez
                pas livecrawl et maxAgeHours simultanément."
              example: preferred
              deprecated: true
            - type: "null"
        livecrawlTimeout:
          anyOf:
            - type: integer
              exclusiveMinimum: 0
              maximum: 90000
              description: Délai d’expiration de l’exploration en direct, en millisecondes.
              example: 1000
              default: 10000
            - type: "null"
        maxAgeHours:
          anyOf:
            - type: integer
              minimum: -1
              maximum: 720
              description: Âge maximal du contenu mis en cache, en heures. Les valeurs
                positives utilisent le contenu mis en cache s’il date de moins
                de ce nombre d’heures ; 0 récupère du contenu récent et
                constitue la méthode prise en charge pour appliquer des options
                de rendu de texte aux pages nouvellement récupérées ; -1 utilise
                toujours le cache ; si cette valeur est omise, une récupération
                de secours est utilisée lorsque le contenu mis en cache n’est
                pas disponible. La valeur maximale prise en charge est 720
                heures.
