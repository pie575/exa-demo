        "type": "text" }` si aucune valeur n’est spécifiée. Lorsque `type` est
        `"text"`, la sortie est un résumé textuel en texte brut. Lorsque `type`
        est `"object"`, la sortie est un JSON structuré. Si aucune `properties`
        n’est spécifiée pour le type `"object"`, un schéma est déduit
        automatiquement ; sinon, la sortie respecte le schéma fourni.'
    OutputSchemaTextOutput:
      type: object
      properties:
        type:
          type: string
          const: text
        description:
          type: string
      required:
        - type
      additionalProperties: false
