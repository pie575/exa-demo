        behavior:
          default: override
          description: >-
            Le comportement de la recherche lorsqu’elle est ajoutée à un Webset.


            - `override` : la recherche remplacera les Items existants du Webset
            et les évaluera selon les nouveaux critères. Tous les Items qui ne
            correspondent pas aux nouveaux critères seront supprimés.

            - `append` : la recherche ajoutera les nouveaux Items trouvés au
            Webset existant. Tous les Items qui ne correspondent pas aux
            nouveaux critères seront supprimés.
          $ref: "#/components/schemas/WebsetSearchBehavior"
        exclude:
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                type: string
            required:
              - source
              - id
            type: object
          description: Sources (imports ou websets existants) utilisées pour exclure
            certains résultats de la recherche.
          type: array
        scope:
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                type: string
              relationship:
                properties:
                  definition:
                    description: La relation entre les entités que vous souhaitez trouver et celles
                      contenues dans la source fournie.
                    type: string
                  limit:
                    minimum: 1
                    maximum: 10
                    type: number
                required:
                  - definition
                  - limit
                type: object
            required:
              - source
              - id
            type: object
          description: >-
            Le périmètre de la recherche. Par défaut, aucun périmètre n’est
            défini, la recherche s’effectue donc sur le Web.


            S’il est fourni lors de la création, la recherche sera effectuée
            uniquement sur les sources indiquées.
          type: array
        progress:
          properties:
            found:
              description: Le nombre de résultats trouvés jusqu’à présent
              type: number
            analyzed:
              description: Le nombre de résultats analysés jusqu’à présent
              type: number
            completion:
              minimum: 0
              maximum: 100
              description: Le pourcentage d’avancement de la recherche
              type: number
            timeLeft:
              type: number
              description: Le temps restant estimé en secondes, null s’il est inconnu
              nullable: true
          required:
            - found
            - analyzed
            - completion
            - timeLeft
          description: La progression de la recherche
          type: object
        recall:
          properties:
            expected:
              properties:
                total:
                  description: Le nombre total estimé de correspondances potentielles
                  type: number
                confidence:
                  enum:
                    - high
                    - medium
                    - low
                  description: Le niveau de confiance de l’estimation
                  type: string
                bounds:
                  properties:
                    min:
                      description: Le nombre total minimal estimé de correspondances potentielles
                      type: number
                    max:
                      description: Le nombre total maximal estimé de correspondances potentielles
                      type: number
                  required:
                    - min
                    - max
                  type: object
              required:
                - total
                - confidence
                - bounds
              type: object
            reasoning:
              description: Le raisonnement justifiant l’estimation
              type: string
          required:
            - expected
            - reasoning
          type: object
          description: Métriques de rappel de la recherche, null si elles n’ont pas encore
            été calculées ou demandées.
          nullable: true
        metadata:
          default: {}
          description: Ensemble de paires clé-valeur à associer à cet objet.
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
        canceledAt:
          format: date-time
          type: string
          description: La date et l’heure d’annulation de la recherche
          nullable: true
        canceledReason:
          $ref: "#/components/schemas/WebsetSearchCanceledReason"
          description: La raison de l’annulation de la recherche
          nullable: true
        createdAt:
