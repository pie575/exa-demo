                        phrase. Transmettez highlights: true pour les highlights
                        par défaut, ou { query } pour guider la sélection avec
                        votre propre requête."
                      example: 1
                      deprecated: true
                    - type: "null"
                highlightsPerUrl:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "Obsolète et sera supprimé dans une prochaine version. Actuellement
                        ignoré. Transmettez highlights: true pour les highlights
                        par défaut, ou { query } pour guider la sélection avec
                        votre propre requête."
                      example: 1
                      deprecated: true
                    - type: "null"
              title: Advanced highlights options
              description: "Options avancées permettant d’orienter l’extraction des
                highlights. Transmettez highlights: true pour obtenir les
                highlights par défaut de la meilleure qualité ; fournissez cet
                objet uniquement si vous souhaitez guider la sélection avec
                votre propre requête."
        summary:
          description: Renvoyer un résumé généré par un LLM. Transmettez `true` pour
            utiliser les valeurs par défaut, ou un objet contenant `query` et
            `maxTokens`.
          oneOf:
            - type: boolean
            - $ref: "#/components/schemas/SummaryWithMaxTokensOptions"
        extras:
          type: object
          properties:
            links:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Nombre d’URL à renvoyer pour chaque page web.
                  example: 1
                  default: 0
                - type: "null"
            imageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Nombre d’images à renvoyer pour chaque résultat.
                  example: 1
                  default: 0
                - type: "null"
            richImageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Nombre de liens enrichis vers des images à renvoyer pour chaque
                    résultat.
                  default: 0
                - type: "null"
            richLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Nombre de liens enrichis à renvoyer pour chaque résultat.
                  default: 0
                - type: "null"
            codeBlocks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Nombre de blocs de code à renvoyer pour chaque résultat.
                  default: 0
                - type: "null"
          description: Paramètres supplémentaires à transmettre.
        context:
          description: "Obsolète : utilisez plutôt highlights ou text. Renvoie le contenu
            de la page sous la forme d’une chaîne de contexte combinée."
          deprecated: true
          oneOf:
            - type: boolean
              description: "Obsolète : utilisez plutôt highlights ou text. Renvoie le contenu
                de la page sous la forme d’une chaîne de contexte combinée."
              example: true
              deprecated: true
            - type: object
              properties:
                maxCharacters:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: Obsolète. Nombre maximal de caractères pour la chaîne de contexte.
                    La valeur maximale prise en charge est 10000.
                  example: 10000
              description: "Obsolète : utilisez plutôt highlights ou text. Renvoie le contenu
                de la page sous la forme d’une chaîne de contexte combinée."
              deprecated: true
        livecrawl:
          description: Stratégie d’exploration pour récupérer le contenu de la page
          oneOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
            - type: string
              const: auto
        livecrawlTimeout:
          type: integer
          exclusiveMinimum: 0
          maximum: 90000
          description: Délai d’expiration de l’exploration en direct, en millisecondes.
          example: 1000
          default: 10000
        maxAgeHours:
          type: integer
          minimum: -1
          maximum: 720
          description: Âge maximal du contenu mis en cache, en heures. Les valeurs
            positives utilisent le contenu mis en cache s’il date de moins de ce
            nombre d’heures ; 0 récupère du contenu récent et constitue la
            méthode prise en charge pour appliquer les options de rendu de texte
            aux pages nouvellement récupérées ; -1 utilise toujours le cache ;
            si cette valeur est omise, une récupération de secours est utilisée
            lorsque le contenu mis en cache n’est pas disponible. La valeur
            maximale prise en charge est de 720 heures.
          example: 24
        filterEmptyResults:
          type: boolean
          description: Filtrer les résultats sans contenu
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: Nombre de sous-pages à explorer. Le nombre réel de pages explorées
            peut être limité par les contraintes du système.
          example: 1
          default: 0
        subpageTarget:
          description: Terme permettant de trouver des sous-pages spécifiques dans les
            résultats de recherche. Peut être une chaîne unique ou un tableau de
            chaînes.
          example: sources
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
      description: Options d’extraction de contenu appliquées à chaque résultat de
        recherche. Tous les champs sont facultatifs.
    SummaryWithMaxTokensOptions:
      type: object
      properties:
        query:
          anyOf:
            - type: string
              description: Requête personnalisée pour le résumé généré par le LLM.
              example: Main developments
            - type: "null"
        maxTokens:
          type: integer
          minimum: 1
          description: Nombre maximal de jetons pour le résumé généré.
    SearchMonitorTrigger:
      type: object
      properties:
        type:
          type: string
          const: interval
          description: Type de déclencheur. Actuellement, seul `interval` est pris en
            charge.
          default: interval
        period:
          type: string
          description: Chaîne de durée indiquant la fréquence d’exécution du moniteur (par
            exemple, "1h", "6h", "1d", "7d"). Une seule unité est autorisée.
            L’intervalle minimal est de 1 heure. La planification est ancrée sur
            l’heure de création du moniteur (par exemple, un moniteur quotidien
            créé à 14:30 s’exécute chaque jour vers 14:30).
          example: 6h
      required:
        - type
        - period
    SearchMonitorOutputSchema:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaText"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: Schéma JSON pour la sortie synthétisée. Les types racine pris en
            charge sont "text" et "object". Lorsqu’il est fourni, la réponse
            inclut un objet de sortie dont le contenu correspond à ce schéma.
            Fonctionne avec chaque type de recherche et ajoute environ
            2 secondes de latence de synthèse au type de recherche sélectionné.
          type: object
          discriminator:
            propertyName: type
            mapping:
              text: "#/components/schemas/OutputSchemaText"
              object: "#/components/schemas/OutputSchemaObject"
        - type: "null"
      description: 'Contrôle le format du résultat de l’exécution. La valeur par
        défaut est `{ "type": "text" }` si elle n’est pas spécifiée. Lorsque
        `type` est `"text"`, le résultat est un résumé en texte brut. Lorsque
        `type` est `"object"`, le résultat est du JSON structuré. Si aucune
        `properties` n’est spécifiée avec le type `"object"`, un schéma est
        déduit automatiquement ; sinon, le résultat respecte le schéma fourni.'
    SearchMonitorWebhook:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL HTTPS destinée à recevoir les événements webhook. Ne doit pas
            pointer vers localhost ni vers des plages d’adresses IP privées.
        events:
          type: array
          items:
            type: string
            enum:
              - monitor.created
              - monitor.updated
              - monitor.deleted
              - monitor.run.created
              - monitor.run.completed
          description: Événements auxquels s’abonner. Par défaut, tous les événements sont
            sélectionnés si cette valeur n’est pas spécifiée.
      required:
        - url
    BatchMonitorsRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - delete
            - pause
            - unpause
          description: Action à effectuer sur les moniteurs correspondants. `delete` les
            supprime définitivement, `pause` définit leur statut sur suspendu et
            `unpause` définit leur statut sur actif.
        filter:
          type: object
          properties:
            name:
              type: string
              maxLength: 250
              description: Filtrer par nom (correspondance de sous-chaîne insensible à la
                casse)
            status:
              type: string
              enum:
                - active
                - paused
                - disabled
              description: Filtrer par statut du moniteur
            metadata:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
                maxLength: 1000
              description: Filtrer par paires clé-valeur de métadonnées (correspondance
                exacte, sémantique ET)
          description: Au moins un champ de filtre doit être fourni pour éviter les
            opérations groupées accidentelles.
        dry_run:
          type: boolean
          description: Lorsque `true`, renvoie les moniteurs qui seraient affectés sans
            effectuer l’action. La valeur par défaut est `true`.
          default: true
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: Nombre maximal de moniteurs à traiter dans une seule requête. La
            valeur par défaut est 50, le maximum est 500.
          default: 50
      required:
        - action
        - filter
    UpdateSearchMonitorParameters:
      type: object
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
          description: Mettre à jour le nom du moniteur
        status:
          type: string
          enum:
            - active
            - paused
          description: Mettre à jour le statut du moniteur (ne peut être défini que sur
            `active` ou `paused`)
        search:
          type: object
          properties:
            query:
              type: string
              minLength: 1
              description: Chaîne de requête pour la recherche.
              example: Latest developments in LLM capabilities
            numResults:
              type: integer
              minimum: 1
              maximum: 100
              description: Nombre de résultats à renvoyer. Les limites varient selon le type
                de recherche. La limite publique maximale est de 100 résultats.
                Contactez le service commercial (hello@exa.ai) pour discuter de
                limites plus élevées.
              example: 10
              default: 10
            includeDomains:
              description: Restreindre les résultats de recherche à ces domaines.
              type: array
              items:
                type: string
            excludeDomains:
              description: Exclure ces domaines des résultats de recherche.
              type: array
              items:
                type: string
            contents:
              $ref: "#/components/schemas/SearchMonitorContents"
          description: Paramètres de recherche partiels à fusionner. Tous les champs sont
            facultatifs pour les mises à jour.
        trigger:
          anyOf:
            - type: object
              properties:
                type:
                  type: string
                  const: interval
                  description: Type de déclencheur. Actuellement, seul `interval` est pris en
                    charge.
                  default: interval
                period:
                  type: string
                  description: Chaîne de durée indiquant la fréquence d’exécution du moniteur (par
                    exemple, "1h", "6h", "1d", "7d"). Une seule unité est
                    autorisée. L’intervalle minimal est de 1 heure.
            - type: "null"
          description: Mettre à jour la planification. Définissez cette valeur sur null
            pour supprimer la planification.
        outputSchema:
          $ref: "#/components/schemas/SearchMonitorOutputSchema"
        metadata:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
              description: Métadonnées clé-valeur fournies par l’appelant pour votre propre
                suivi.
              example:
                slack_channel_id: C123ABC
                slack_thread_id: "1745444400.123456"
                user_id: U123ABC
            - type: "null"
          description: Mettre à jour les métadonnées. Définissez cette valeur sur null
            pour les supprimer. Elles sont renvoyées dans les livraisons webhook
            afin que vous puissiez acheminer les mises à jour vers des systèmes
            comme Slack.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        webhook:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: URL HTTPS destinée à recevoir les événements webhook. Ne doit pas
                pointer vers localhost ni vers des plages d’adresses IP privées.
            events:
              type: array
              items:
                type: string
                enum:
                  - monitor.created
                  - monitor.updated
                  - monitor.deleted
                  - monitor.run.created
                  - monitor.run.completed
              description: Événements auxquels s’abonner. Par défaut, tous les événements sont
                sélectionnés si cette valeur n’est pas spécifiée.
          description: Paramètres webhook partiels à fusionner. Tous les champs sont
            facultatifs pour les mises à jour.
    CreateAgentRunRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Question ou instructions en langage naturel pour la requête.
          example: What are the most important AI infrastructure funding rounds announced
            this week?
        systemPrompt:
          type: string
          description: Instructions supplémentaires guidant la sortie générée ou le
            comportement de l’agent. Utilisez-les pour les préférences de
            sources, les contraintes de nouveauté, les contraintes de
            duplication ou d’autres indications comportementales.
          example: Prefer official sources and avoid duplicate results.
        effort:
          $ref: "#/components/schemas/AgentEffort"
        input:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Un enregistrement sous forme d’objet JSON.
              description: Enregistrements que l’agent doit traiter ou enrichir.
            exclusion:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Un enregistrement sous forme d’objet JSON.
              description: Enregistrements ou entités que l’agent doit éviter de renvoyer.
          description: Enregistrements à traiter et enregistrements ou entités à exclure
            de la réponse.
        outputSchema:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: Schéma JSON pour la sortie structurée validée dans
                `output.structured`. Les champs non étayés par des éléments
                probants peuvent être renvoyés comme `null`. Prend en charge
                draft-07, 2019-09 et 2020-12 via `$schema`.
            - type: "null"
        previousRunId:
          description: ID d’exécution terminée à partir duquel poursuivre. Doit appartenir
            à la même équipe.
          $ref: "#/components/schemas/AgentRunId"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Métadonnées fournies par l’appelant et stockées avec l’exécution.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        dataSources:
          maxItems: 5
          type: array
          items:
            $ref: "#/components/schemas/AgentDataSource"
          description: Fournisseurs de données Exa Connect à activer pour l’exécution.
            Chaque entrée active tous les outils de ce fournisseur.
        budget:
          $ref: "#/components/schemas/AgentBudget"
      required:
        - query
    AgentEffort:
      type: string
      enum:
        - minimal
        - low
        - medium
        - high
        - xhigh
        - auto
        - max
      description: Préférence de coût et de niveau d’effort de raisonnement pour
        l’exécution. `auto` laisse Exa choisir le niveau d’effort approprié.
        `max` est le niveau bêta public exigeant le plus d’effort, pour les
        tâches où l’exhaustivité et la rigueur priment sur la latence ou le
        coût, y compris la création de grandes listes, les recherches
        approfondies multi-sources et les critères difficiles à vérifier.
      default: auto
    AgentRunId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[A-Za-z0-9_.:-]+$
      description: ID d’exécution de l’Agent. Les nouveaux ID d’exécution sont
        renvoyés avec le préfixe `agent_run_`.
      example: agent_run_01j7x9v0m2n4p6q8r0s2t4v6w8
    AgentDataSource:
      type: object
      properties:
        provider:
          description: Fournisseur de données Exa Connect à activer pour l’exécution. Tous
            les outils du fournisseur sont disponibles par défaut.
          example: fiber
          $ref: "#/components/schemas/AgentDataSourceProvider"
      required:
        - provider
    AgentDataSourceProvider:
      type: string
      enum:
        - fiber
        - financial_datasets
        - similarweb
        - baselayer
        - affiliate
        - particle
        - jinko
        - polymarket
      description: Identifiant d’un fournisseur de données Exa Connect.
    AgentBudget:
      type: object
      properties:
        maxCostDollars:
          type: number
          description: Montant maximal que cette exécution peut dépenser en dollars
            américains. Accepte les montants de 1 $ à 100 $ et s’applique
            uniquement à `auto` et `max` ; s’il n’est pas renseigné, le plafond
            par défaut est de 5 $ pour `auto` et de 20 $ pour `max`.
          example: 10
      description: Plafond de dépenses facultatif par exécution pour les niveaux
        d’effort facturés à l’usage `auto` et `max`. Les exécutions qui se
        terminent plus tôt peuvent coûter moins que ce plafond.
    CreateBatchRequest:
      type: object
      properties:
        requests:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/BatchRequestItem"
          description: Les requêtes à mettre en file d’attente. Chaque `customId` doit
            être unique au sein du batch.
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Métadonnées fournies par l’appelant et stockées avec le batch.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
      required:
        - requests
    BatchRequestItem:
      type: object
      properties:
        customId:
          type: string
          minLength: 1
          maxLength: 64
          description: Votre identifiant unique pour cette requête ; il sert de clé pour
            le résultat et doit être unique dans le batch.
          example: row-1
        method:
          type: string
          const: POST
          description: Méthode HTTP de la requête du batch. Seule la méthode POST est
            prise en charge dans v1.
        url:
          type: string
          enum:
            - /search
            - /agent/runs
          description: Route d’API cible de la requête. `/search` ou `/agent/runs` dans v1.
          example: /search
        body:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: "Corps de la requête pour la route cible. Doit être un objet JSON ;
            `stream: true` n’est pas autorisé."
      required:
        - customId
        - method
        - url
        - body
    AnswerStreamTextDeltaChunk:
      type: object
      properties:
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                minimum: 0
                description: Index de ce choix diffusé en continu.
              delta:
                type: object
                properties:
                  role:
                    type: string
                    const: assistant
                  content:
                    type: string
                  refusal:
                    anyOf:
                      - type: string
                      - type: "null"
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Contenu de réponse incrémentiel émis par le modèle.
              finish_reason:
                description: Raison de fin de ce choix diffusé en continu, si présente.
                oneOf:
                  - type: string
                  - type: "null"
            required:
              - index
              - delta
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
          description: Choix de complétion diffusés en continu, compatibles avec OpenAI et
            dépourvus des champs internes du provider.
      required:
        - choices
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    SearchResponse:
      oneOf:
        - $ref: "#/components/schemas/SearchSynthesisResponse"
        - $ref: "#/components/schemas/SearchResultsResponse"
    SearchSynthesisResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Identifiant unique de la requête.
          example: b5947044c4b78efa9552a7c89b306d95
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultOutput"
          description: Liste de résultats de recherche contenant le titre, l’URL, la date
            de publication et l’auteur.
        resolvedSearchType:
          description: Champ hérité obsolète. Les réponses de production actuelles peuvent
            renvoyer une chaîne vide ; les clients ne doivent pas s’appuyer sur
            cette valeur.
          example: ""
          deprecated: true
          type: string
        context:
          type: string
          description: Obsolète. Chaîne de contexte combinant les résultats de recherche.
            Utilisez plutôt highlights ou text.
          deprecated: true
        costDollars:
          $ref: "#/components/schemas/CostDollarsOutput"
        searchTime:
          type: number
          description: Temps de traitement côté serveur en millisecondes, mesuré au niveau
            du gateway. Inclut la récupération, mais peut exclure des phases
            ultérieures telles que la synthèse de sortie structurée ; il peut
            donc être inférieur à la latence de bout en bout de la requête.
          example: 312.4
        output:
          $ref: "#/components/schemas/SearchSynthesisOutputOutput"
      required:
        - results
        - output
      additionalProperties: false
    SearchResultsResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Identifiant unique de la requête.
          example: b5947044c4b78efa9552a7c89b306d95
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultOutput"
          description: Liste de résultats de recherche contenant le titre, l’URL, la date
            de publication et l’auteur.
        resolvedSearchType:
          description: Champ hérité obsolète. Les réponses de production actuelles peuvent
            renvoyer une chaîne vide ; les clients ne doivent pas s’appuyer sur
            cette valeur.
          example: ""
          deprecated: true
          type: string
        context:
          type: string
          description: Obsolète. Chaîne de contexte combinant les résultats de recherche.
            Utilisez plutôt highlights ou text.
          deprecated: true
        costDollars:
          $ref: "#/components/schemas/CostDollarsOutput"
        searchTime:
          type: number
          description: Temps de traitement côté serveur en millisecondes, mesuré au niveau
            du gateway. Inclut la récupération, mais peut exclure des phases
            ultérieures telles que la synthèse de sortie structurée ; il peut
            donc être inférieur à la latence de bout en bout de la requête.
          example: 312.4
      required:
        - results
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Identifiant unique de la requête.
          example: b5947044c4b78efa9552a7c89b306d95
        error:
          type: string
          description: Message décrivant l’erreur, lisible par un humain.
          example: Invalid API key
        tag:
          type: string
          description: "Balise d’erreur lisible par machine identifiant l’échec.
            L’ensemble des balises est ouvert : de nouvelles balises peuvent
            être ajoutées à tout moment ; traitez donc les balises non reconnues
            comme une erreur générique correspondant au statut HTTP de la
            réponse. Les balises connues sont répertoriées à titre d’exemple."
          examples:
            - DEFAULT_ERROR
            - INTERNAL_ERROR
            - INVALID_API_KEY
            - INVALID_REQUEST
            - INVALID_REQUEST_BODY
            - INVALID_REQUEST_QUERY
            - INVALID_JSON_SCHEMA
            - INVALID_NUM_RESULTS
            - NUM_RESULTS_EXCEEDED
            - NO_MORE_CREDITS
            - API_KEY_BUDGET_EXCEEDED
            - TEAM_BUDGET_EXCEEDED
            - NO_CONTENT_FOUND
            - PROHIBITED_CONTENT
            - INSUFFICIENT_SCOPE
