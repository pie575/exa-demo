        - monitorId
        - status
        - output
        - failReason
        - startedAt
        - completedAt
        - failedAt
        - cancelledAt
        - durationMs
        - createdAt
        - updatedAt
      additionalProperties: false
    SearchMonitorRunOutput:
      type: object
      properties:
        results:
          anyOf:
            - type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
            - type: "null"
          description: Les résultats de recherche
        content:
          description: Contenu synthétisé à partir des résultats de recherche. La
            structure dépend de `outputSchema.type`.
          oneOf:
            - $ref: "#/components/schemas/JsonValue"
            - type: "null"
        grounding:
          anyOf:
            - type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: Le field d’output auquel cette citation s’applique
                  citations:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          format: uri
                          description: URL source.
                        title:
                          type: string
                          description: Titre source.
                      required:
                        - url
                        - title
                      additionalProperties: false
                  confidence:
                    type: string
                    enum:
                      - low
                      - medium
                      - high
                    description: Fiabilité indiquée par le modèle pour ce field.
                required:
                  - field
                  - citations
                  - confidence
                additionalProperties: false
            - type: "null"
          description: Citations au niveau des field avec niveaux de confiance
      additionalProperties: false
    AgentRun:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/AgentRunId"
        object:
          type: string
          const: agent_run
        status:
          $ref: "#/components/schemas/AgentRunStatus"
        stopReason:
          anyOf:
            - $ref: "#/components/schemas/AgentStopReason"
            - type: "null"
          description: La raison pour laquelle le run s’est arrêté. `null` tant que le run
            est en file d’attente ou en cours d’exécution.
        createdAt:
          type: string
          format: date-time
          description: Date de création du run
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          format: date-time
        request:
          anyOf:
            - $ref: "#/components/schemas/AgentRunRequest"
            - type: "null"
        output:
          $ref: "#/components/schemas/AgentRunOutput"
        usage:
          $ref: "#/components/schemas/AgentUsage"
        costDollars:
          $ref: "#/components/schemas/AgentCostDollars"
      required:
        - id
        - object
        - status
        - stopReason
        - createdAt
        - completedAt
        - request
        - output
        - usage
        - costDollars
      additionalProperties: false
    AgentRunStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
        - cancelled
    AgentStopReason:
      type: string
      enum:
        - schema_satisfied
        - budget_reached
        - stopped
        - error
        - cancelled
    AgentRunRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Question ou instructions en langage naturel pour la requête.
          example: What are the most important AI infrastructure funding rounds announced
            this week?
        systemPrompt:
          type: string
          description: Instructions supplémentaires guidant l’output généré ou le
            comportement de l’agent. Utilisez-les pour les préférences de
            sources, les contraintes de nouveauté, les contraintes de
            duplication ou toute autre indication de comportement.
          example: Prefer official sources and avoid duplicate results.
        effort:
          $ref: "#/components/schemas/AgentEffort"
        input:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Un record d’objet JSON.
              description: Records que l’agent doit traiter ou enrichir.
            exclusion:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Un record d’objet JSON.
              description: Records ou entités que l’agent doit éviter de renvoyer.
          additionalProperties: false
        outputSchema:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: Schéma JSON pour une sortie structurée validée dans
                `output.structured`. Les fields non pris en charge par les
                preuves peuvent être renvoyés sous la forme `null`. Prend en
                charge draft-07, 2019-09 et 2020-12 via `$schema`.
            - type: "null"
        previousRunId:
          $ref: "#/components/schemas/AgentRunId"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Métadonnées clé-valeur fournies par l’appelant pour votre propre
            suivi.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        dataSources:
          type: array
          items:
            $ref: "#/components/schemas/AgentDataSourceOutput"
          description: Fournisseurs de données Exa Connect configurés pour le run.
        budget:
          $ref: "#/components/schemas/AgentBudgetOutput"
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
      description: Fields de requête canonisés stockés avec le run.
    AgentRunOutput:
      type: object
      properties:
        text:
          type: string
          description: Réponse ou résumé en langage naturel.
        structured:
          anyOf:
            - $ref: "#/components/schemas/JsonValue"
            - type: "null"
          description: JSON structuré par `outputSchema` ; les field non étayés par des
            preuves peuvent être `null`. `null` lorsqu'aucun schéma n'a été
            fourni.
        grounding:
          type: array
          items:
            $ref: "#/components/schemas/AgentGrounding"
          description: Citations au niveau des field émises par le run.
      required:
        - text
        - structured
        - grounding
      additionalProperties: false
    AgentGrounding:
      type: object
      properties:
        field:
          type: string
          description: Field d'output étayé par les citations.
          example: structured.companies[0].sourceUrl
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AgentCitation"
        confidence:
          anyOf:
            - type: string
              enum:
                - low
                - medium
                - high
              description: Fiabilité indiquée par le modèle pour ce field.
            - type: "null"
      required:
        - field
        - citations
      additionalProperties: false
    AgentCitation:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL source.
        title:
          type: string
          description: Titre de la source.
      required:
        - url
      additionalProperties: false
    AgentUsage:
      type: object
      properties:
        agentComputeUnits:
          type: number
          minimum: 0
        searches:
          type: integer
          minimum: 0
        emails:
          type: integer
          minimum: 0
        phoneNumbers:
          type: integer
          minimum: 0
        dataSources:
          $ref: "#/components/schemas/AgentDataSourceUsage"
      required:
        - agentComputeUnits
        - searches
        - emails
        - phoneNumbers
      additionalProperties: false
    AgentDataSourceUsage:
      type: object
      propertyNames:
        type: string
      additionalProperties:
        type: integer
        minimum: 0
      description: Nombre d'appels d'outil par fournisseur pour les sources de données
        Exa Connect utilisées pendant le run. Les clés correspondent aux noms
        des fournisseurs (par ex. `fiber`, `similarweb`). Seuls les fournisseurs
        dont l'utilisation est non nulle sont inclus.
    AgentCostDollars:
      type: object
      properties:
        total:
          type: number
          minimum: 0
        agentCompute:
          type: number
          minimum: 0
        search:
          type: number
          minimum: 0
        emails:
          type: number
          minimum: 0
        phoneNumbers:
          type: number
          minimum: 0
        dataSources:
          $ref: "#/components/schemas/AgentDataSourceCost"
      required:
        - total
        - agentCompute
        - search
        - emails
        - phoneNumbers
      additionalProperties: false
    AgentDataSourceCost:
      type: object
      propertyNames:
        type: string
      additionalProperties:
        type: number
        minimum: 0
      description: Coût par fournisseur, en dollars, pour les sources de données Exa
        Connect utilisées pendant le run. Les clés correspondent aux noms des
        fournisseurs (par ex. `fiber`, `similarweb`). Seuls les fournisseurs
        dont l'utilisation est non nulle sont inclus.
    AgentErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/AgentError"
      required:
        - error
      additionalProperties: false
    AgentError:
      type: object
      properties:
        type:
          type: string
          enum:
            - INVALID_REQUEST
            - AUTHENTICATION_ERROR
            - RATE_LIMIT_ERROR
            - NOT_FOUND
            - SERVER_ERROR
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - TEAM_NOT_FOUND
            - RUN_NOT_FOUND
            - PREVIOUS_RUN_NOT_FOUND
            - PREVIOUS_RUN_NOT_COMPLETED
            - CONCURRENCY_LIMIT_REACHED
            - INVALID_OUTPUT_SCHEMA
            - INVALID_DATA_SOURCE
            - TIMEOUT
            - SERVER_ERROR
        message:
          type: string
      required:
        - type
        - code
        - message
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    AgentRunList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
        hasMore:
          type: boolean
          description: Indique s'il existe d'autres résultats
        nextCursor:
          anyOf:
            - $ref: "#/components/schemas/AgentRunId"
            - type: "null"
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    DeleteAgentRunResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/AgentRunId"
        object:
          type: string
          const: agent_run.deleted
        deleted:
          type: boolean
          const: true
      required:
        - id
        - object
        - deleted
      additionalProperties: false
    AgentRunEventList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentRunEvent"
        hasMore:
          type: boolean
          description: Indique s'il existe d'autres résultats
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    Batch:
      type: object
      properties:
        id:
          type: string
          description: ID du batch. Les nouveaux ID de batch sont renvoyés avec le préfixe
            `batch_`.
          example: batch_01j7x9v0m2n4p6q8r0s2t4v6w8
        object:
          type: string
          const: batch
          description: Type d'objet, toujours `batch`.
        status:
          $ref: "#/components/schemas/BatchStatus"
        requestCounts:
          $ref: "#/components/schemas/BatchRequestCounts"
        createdAt:
          type: string
          format: date-time
          description: Date de création du batch.
        expiresAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Date d'expiration du batch, ou `null` s'il n'expire pas.
          format: date-time
        endedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Date à laquelle le batch a atteint un statut terminal, ou `null`
            tant qu'il est en cours d'exécution.
          format: date-time
        resultsUrl:
          anyOf:
            - type: string
            - type: "null"
          description: URL de téléchargement présignée à durée de validité limitée pour le
            fichier de résultats du batch (JSONL), ou `null` jusqu'à la fin du
            batch. Il s'agit d'un lien de téléchargement direct depuis le
            stockage d'objets, et non d'une route d'API ; récupérez-le tel quel
            et récupérez à nouveau le batch pour générer une nouvelle URL après
            son expiration.
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Métadonnées clé-valeur fournies par l'appelant pour votre propre
            suivi.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
      required:
        - id
        - object
        - status
        - requestCounts
        - createdAt
        - expiresAt
        - endedAt
        - resultsUrl
        - metadata
      additionalProperties: false
    BatchStatus:
      type: string
      enum:
        - in_progress
        - completed
        - cancelling
        - cancelled
        - expired
      description: Statut du cycle de vie du batch.
    BatchRequestCounts:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
          description: Nombre total de requests dans le batch.
        completed:
          type: integer
          minimum: 0
          description: Requests terminées avec succès.
        failed:
          type: integer
          minimum: 0
          description: Requests ayant échoué.
      required:
        - total
        - completed
        - failed
      additionalProperties: false
    BatchList:
      type: object
      properties:
        object:
          type: string
          const: list
          description: Type d'objet, toujours `list`.
        data:
          type: array
          items:
            $ref: "#/components/schemas/Batch"
          description: Page de batches, du plus récent au plus ancien.
        hasMore:
          type: boolean
          description: Indique s'il existe d'autres résultats
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
          description: Curseur pour la page suivante
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    DeletedBatch:
      type: object
      properties:
        id:
          type: string
          description: ID du batch supprimé.
        object:
          type: string
          const: batch.deleted
          description: Type d'objet, toujours `batch.deleted`.
        deleted:
          type: boolean
          const: true
          description: Toujours `true` pour une suppression réussie.
      required:
        - id
        - object
        - deleted
      additionalProperties: false
    WebsetsTeamInfo:
      type: object
      properties:
        object:
          type: string
          const: team
          description: Type d'objet, toujours `"team"`.
        id:
          type: string
          description: Identifiant unique de l'équipe.
        name:
          type: string
          description: Nom de l'équipe.
        concurrency:
          type: object
          properties:
            active:
              type: integer
              description: Nombre de requests actuellement en cours de traitement.
            queued:
              type: integer
              description: Nombre de requests actuellement en file d'attente.
          required:
            - active
            - queued
          additionalProperties: false
          description: Utilisation actuelle de la concurrency.
        limits:
          type: object
          properties:
            maxConcurrent:
              anyOf:
                - type: integer
                - type: "null"
              description: Nombre maximal de requests simultanées autorisées. Null signifie
                illimité.
            maxQueued:
              anyOf:
                - type: integer
                - type: "null"
              description: Nombre maximal de requests en file d'attente autorisées. Null
                signifie illimité.
          required:
            - maxConcurrent
            - maxQueued
          additionalProperties: false
          description: Limites de concurrency de l'équipe.
      required:
        - object
        - id
        - name
        - concurrency
        - limits
      additionalProperties: false
    AnswerStreamChunk:
      description: "Schéma de chaque payload JSON émis dans un flux d'événements
        envoyés par le serveur `/answer`. Chaque événement est émis sous la
        forme `data: <json>`."
      oneOf:
        - $ref: "#/components/schemas/AnswerStreamTextDeltaChunk"
        - $ref: "#/components/schemas/AnswerStreamCitationsChunkOutput"
        - $ref: "#/components/schemas/AnswerStreamCostChunkOutput"
        - $ref: "#/components/schemas/AnswerStreamErrorChunkOutput"
    SearchStreamChunk:
      oneOf:
        - $ref: "#/components/schemas/SearchStreamTextDeltaChunkOutput"
        - $ref: "#/components/schemas/SearchStreamGroundingChunkOutput"
        - $ref: "#/components/schemas/SearchStreamResultsChunkOutput"
        - $ref: "#/components/schemas/SearchStreamResetChunkOutput"
        - $ref: "#/components/schemas/SearchStreamDoneChunkOutput"
        - $ref: "#/components/schemas/SearchStreamErrorChunkOutput"
      description: "Schéma de chaque payload JSON émis dans un flux d'événements
        envoyés par le serveur `/search`. Chaque événement est émis sous la
        forme `data: <json>` et le flux se termine par `data: [DONE]`, qui n'est
        pas représenté par ce schéma JSON."
      type: object
      discriminator:
        propertyName: type
        mapping:
          text-delta: "#/components/schemas/SearchStreamTextDeltaChunkOutput"
          grounding: "#/components/schemas/SearchStreamGroundingChunkOutput"
          results: "#/components/schemas/SearchStreamResultsChunkOutput"
          stream-reset: "#/components/schemas/SearchStreamResetChunkOutput"
          done: "#/components/schemas/SearchStreamDoneChunkOutput"
          error: "#/components/schemas/SearchStreamErrorChunkOutput"
    AgentRunEvent:
      type: object
      properties:
        id:
          type: string
          description: ID de l'événement au sein du run.
        event:
          type: string
          enum:
            - agent_run.created
            - agent_run.started
            - agent_run.completed
            - agent_run.failed
            - agent_run.cancelled
        data:
          $ref: "#/components/schemas/JsonValue"
        createdAt:
          type: string
          format: date-time
          description: Date de création de l'événement
      required:
        - id
        - event
        - data
        - createdAt
      additionalProperties: false
    SearchResultOutput:
      type: object
      properties:
        title:
          type: string
          description: Titre du résultat de recherche.
          example: A Comprehensive Overview of Large Language Models
        url:
          type: string
          description: URL du résultat de recherche.
          example: https://arxiv.org/pdf/2307.06435.pdf
          format: uri
        publishedDate:
          description: "Estimation de la date de création, obtenue par analyse du contenu
            HTML. Format : YYYY-MM-DD."
          example: 2023-11-16T01:36:32.547Z
          format: date-time
          type: string
        author:
          description: Auteur du contenu, s'il est disponible.
          example: Humza Naveed
          anyOf:
            - type: string
            - type: "null"
        id:
          description: ID temporaire du document. Utile pour l'endpoint /contents.
          example: https://arxiv.org/abs/2307.06435
          type: string
        image:
          description: URL d'une image associée au résultat de recherche, si disponible.
          example: https://arxiv.org/pdf/2307.06435.pdf/page_1.png
          format: uri
          type: string
        favicon:
          description: URL du favicon du domaine du résultat de recherche.
          example: https://arxiv.org/favicon.ico
          format: uri
          type: string
        text:
          description: Texte intégral du contenu du résultat de recherche.
          example: Abstract Large Language Models (LLMs) have recently demonstrated
            remarkable capabilities...
          type: string
        highlights:
          description: Tableau de highlights extraits du contenu du résultat de recherche.
          example:
            - Such requirements have limited their adoption...
          type: array
          items:
            type: string
        highlightScores:
          description: Tableau de scores de similarité cosinus pour chaque extrait mis en
            évidence.
          example:
            - 0.4600165784358978
          type: array
          items:
            type: number
            format: float
        summary:
          description: Résumé de la page web.
          example: This overview paper on Large Language Models (LLMs) highlights key
            developments...
          type: string
        subpages:
          description: Tableau de sous-pages du résultat de recherche.
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                description: Titre du résultat de recherche.
                example: A Comprehensive Overview of Large Language Models
              url:
                type: string
                description: URL du résultat de recherche.
                example: https://arxiv.org/pdf/2307.06435.pdf
                format: uri
              publishedDate:
                description: "Estimation de la date de création, obtenue par analyse du contenu
                  HTML. Format : YYYY-MM-DD."
                example: 2023-11-16T01:36:32.547Z
                format: date-time
                type: string
              author:
                description: Auteur du contenu, s'il est disponible.
                example: Humza Naveed
                anyOf:
                  - type: string
                  - type: "null"
              id:
                description: ID temporaire du document. Utile pour l'endpoint /contents.
                example: https://arxiv.org/abs/2307.06435
                type: string
              image:
                description: URL d'une image associée au résultat de recherche, si disponible.
                example: https://arxiv.org/pdf/2307.06435.pdf/page_1.png
                format: uri
                type: string
              favicon:
                description: URL du favicon du domaine du résultat de recherche.
                example: https://arxiv.org/favicon.ico
                format: uri
                type: string
            required:
              - title
              - url
            additionalProperties: false
        entities:
          description: Données d'entité structurées pour les résultats de recherche
            d'entreprises, de personnes ou de publications. Renvoyées pour les
            catégories prises en charge et adossées à des entités.
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/SearchCompanyEntityOutput"
              - $ref: "#/components/schemas/SearchPersonEntityOutput"
              - $ref: "#/components/schemas/SearchPublicationEntityOutput"
            type: object
            discriminator:
              propertyName: type
              mapping:
                company: "#/components/schemas/SearchCompanyEntityOutput"
                person: "#/components/schemas/SearchPersonEntityOutput"
                publication: "#/components/schemas/SearchPublicationEntityOutput"
        extras:
          description: Résultats des extras. Chaque field est renvoyé uniquement s'il est
            demandé via contents.extras.
          example:
            links: []
          type: object
          properties:
            links:
              description: Tableau de liens du résultat de recherche.
              example: []
              type: array
              items:
                type: string
            imageLinks:
              description: Tableau d'URL d'images du résultat de recherche.
              example: []
              type: array
              items:
                type: string
            richImageLinks:
              description: Tableau d'images avec leur texte alternatif, dans l'ordre où elles
                apparaissent sur la page.
              example:
                - url: https://exa.ai/images/illustrations/api_illustration4.webp
                  alt: High rate limits, low latency and high reliability.
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: URL de l'image.
                  alt:
                    description: Texte alternatif de l'image, lorsque la page en fournit un.
                    type: string
                required:
                  - url
                additionalProperties: false
            richLinks:
              description: Tableau de liens avec leur texte d'ancrage, dans l'ordre où ils
                apparaissent sur la page.
              example:
                - url: https://dashboard.exa.ai
                  anchor: API Dashboard
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: URL du lien.
                  anchor:
                    description: Texte d'ancrage du lien, lorsque la page en fournit un.
                    type: string
                required:
                  - url
                additionalProperties: false
            codeBlocks:
              description: Tableau de blocs de code du résultat de recherche.
              example:
                - text: pip install exa-py
                  source: bash
              type: array
              items:
                type: object
                properties:
                  text:
                    type: string
                    description: Contenu du bloc de code.
                  source:
                    type: string
                    description: Langage associé au bloc de code, le cas échéant.
                required:
                  - text
                  - source
                additionalProperties: false
          additionalProperties: false
      required:
        - title
        - url
      additionalProperties: false
    SearchCompanyEntityOutput:
      type: object
      properties:
        id:
          type: string
          description: Identifiant stable de l'entité entreprise.
        type:
          type: string
          const: company
          description: Discriminateur d'entité.
        version:
          type: integer
          minimum: 1
          description: Version du schéma d'entité.
        properties:
          type: object
          properties:
            name:
