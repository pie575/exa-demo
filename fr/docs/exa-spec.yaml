    SearchMonitorContentsOutput:
      type: object
      properties:
        text:
          description: Options d’extraction de texte pour chaque résultat.
          oneOf:
            - type: boolean
              title: Simple text retrieval
              description: Si true, renvoie le texte intégral de la page avec les paramètres
                par défaut. Si false, désactive le renvoi de texte.
              default: false
            - type: object
              properties:
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: Nombre maximal de caractères pour le texte intégral de la page.
                        Utile pour contrôler la taille de la réponse et les
                        coûts d’API. La valeur maximale prise en charge est
                        10000.
                      example: 1000
                    - type: "null"
                includeHtmlTags:
                  anyOf:
                    - type: boolean
                      description: "Si true, inclut des balises HTML légères dans le texte renvoyé au
                        lieu de texte brut de type Markdown. Utilisez
                        maxAgeHours: 0 lorsque vous devez appliquer ce paramètre
                        à du contenu fraîchement récupéré."
                      example: false
                      default: false
                    - type: "null"
                verbosity:
                  anyOf:
                    - type: string
                      enum:
                        - compact
                        - standard
                        - full
                      description: "Contrôle le niveau de détail du rendu du texte. compact se
                        concentre sur le contenu principal, standard inclut
                        davantage de contexte de la page et full demande le
                        texte rendu le plus complet. Certaines pages peuvent
                        produire une sortie identique avec standard et full.
                        Utilisez maxAgeHours: 0 lorsque vous devez appliquer ce
                        paramètre à du contenu fraîchement récupéré."
                      example: standard
                      default: compact
                    - type: "null"
                includeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "Dans la mesure du possible. Inclut uniquement le contenu classé
                        dans ces sections sémantiques de la page. La
                        classification des sections peut être indisponible ou
                        incomplète pour certaines pages ; validez la sortie si
                        un filtrage strict est requis. Utilisez maxAgeHours: 0
                        lorsque vous devez appliquer ce paramètre à du contenu
                        fraîchement récupéré."
                      example:
                        - body
                        - header
                    - type: "null"
                excludeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "Exclut le contenu classé dans ces sections sémantiques de la page.
                        La classification des sections est effectuée dans la
                        mesure du possible. Utilisez maxAgeHours: 0 lorsque vous
                        devez appliquer ce paramètre à du contenu fraîchement
                        récupéré."
                      example:
                        - navigation
                        - footer
                        - sidebar
                    - type: "null"
              additionalProperties: false
              title: Advanced text options
              description: Options avancées permettant de contrôler l’extraction de texte.
                Utilisez-les lorsque vous devez limiter la longueur du texte ou
                inclure la structure HTML.
        highlights:
          description: Extraits de texte que le LLM identifie comme les plus pertinents
            sur chaque page.
          oneOf:
            - type: boolean
              title: Simple highlights retrieval
              description: Si true, renvoie les extraits pertinents avec les paramètres par
                défaut. Si false, désactive les extraits pertinents.
              default: false
            - type: object
              properties:
                query:
                  anyOf:
                    - type: string
                      description: Requête personnalisée qui guide la sélection des extraits
                        pertinents par le LLM.
                      example: Key advancements
                    - type: "null"
                verbosity:
                  anyOf:
                    - type: string
                      enum:
                        - low
                        - medium
                        - high
                      description: "Longueur prédéfinie des extraits pertinents : `low`, `medium` et
                        `high` allouent des budgets de jetons progressivement
                        plus élevés aux extraits pertinents renvoyés. Avec
                        highlights.dynamic, le préréglage définit un budget
                        unique partagé pour l’ensemble des résultats plutôt
                        qu’un budget par URL. Les budgets exacts sont ajustés
                        par Exa et peuvent changer. Incompatible avec
                        maxCharacters ou numSentences. Bêta : nécessite le
                        header de requête `Exa-Beta:
                        dynamic-highlights-2026-08-28` ; les requêtes
                        définissant `verbosity` sans celui-ci sont rejetées."
                      example: medium
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                dynamic:
                  anyOf:
                    - type: boolean
                      description: "Active Dynamic Highlights (aperçu de recherche) : prend en compte
                        tous les résultats et alloue un budget de contexte
                        unique partagé à l’ensemble des résultats plutôt qu’un
                        budget par document. Incompatible avec maxCharacters.
                        Bêta : nécessite le header de requête `Exa-Beta:
                        dynamic-highlights-2026-08-28` ; les requêtes
                        définissant `dynamic` sans celui-ci sont rejetées."
                      example: true
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: Nombre maximal de caractères à renvoyer pour les extraits
                        pertinents. Contrôle la longueur totale des extraits
                        pertinents renvoyés par URL. La valeur maximale prise en
                        charge est 10000. Incompatible avec highlights.dynamic.
                      example: 2000
                    - type: "null"
                numSentences:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "Obsolète et sera supprimé dans une version ultérieure.
                        Actuellement associé à un budget d’environ 1333
                        caractères par phrase. Transmettez highlights: true pour
                        les extraits pertinents par défaut, ou { query } pour
                        guider la sélection avec votre propre requête."
                      example: 1
                      deprecated: true
                    - type: "null"
                highlightsPerUrl:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "Obsolète et sera supprimé dans une version ultérieure.
                        Actuellement ignoré. Transmettez highlights: true pour
                        les extraits pertinents par défaut, ou { query } pour
                        guider la sélection avec votre propre requête."
                      example: 1
                      deprecated: true
                    - type: "null"
              additionalProperties: false
              title: Advanced highlights options
              description: "Options avancées permettant d’orienter l’extraction des extraits
                pertinents. Transmettez highlights: true pour obtenir les
                extraits par défaut de la meilleure qualité ; fournissez cet
                objet uniquement lorsque vous devez guider la sélection avec
                votre propre requête."
        summary:
          description: Renvoie un résumé généré par un LLM. Transmettez `true` pour les
            valeurs par défaut, ou un objet avec `query` et `maxTokens`.
