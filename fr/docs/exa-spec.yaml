          description: L’identifiant unique du Webset auquel appartient cette recherche
          type: string
        status:
          enum:
            - created
            - pending
            - running
            - completed
            - canceled
          description: Le statut de la recherche
          title: WebsetSearchStatus
          type: string
        query:
          minLength: 1
          maxLength: 5000
          description: La requête utilisée pour créer la recherche.
          type: string
        entity:
          $ref: "#/components/schemas/Entity"
          description: >-
            L’entité pour laquelle la recherche renverra des résultats.


            Si aucune entité n’est fournie lors de la création, nous
            sélectionnerons automatiquement l’entité la plus appropriée en
            fonction de la requête.
          nullable: true
        criteria:
          items:
            properties:
              description:
                minLength: 1
                maxLength: 1000
                description: La description du critère
                type: string
              successRate:
                minimum: 0
                maximum: 100
                description: Valeur comprise entre 0 et 100 représentant le pourcentage de
                  résultats qui répondent au critère.
                type: number
            required:
              - description
              - successRate
            type: object
          description: Les critères utilisés par la recherche pour évaluer les résultats.
            S’ils ne sont pas fournis, nous les générerons automatiquement.
          type: array
        count:
          minimum: 1
          description: Le nombre de résultats que la recherche tentera de trouver. Selon
            la complexité de la recherche, le nombre réel de résultats peut être
            inférieur.
          type: number
        maxPeoplePerCompany:
          minimum: 1
          type: integer
          description: La limite souple demandée pour les personnes correspondant aux
            critères et travaillant actuellement dans la même entreprise, ou
            null si aucune limite n’a été demandée.
          nullable: true
        behavior:
          default: override
          description: >-
            Le comportement de la recherche lorsqu’elle est ajoutée à un Webset.


            - `override` : la recherche remplacera les Items existants du Webset
            et les évaluera selon les nouveaux critères. Tous les Items qui ne
            répondent pas aux nouveaux critères seront supprimés.

            - `append` : la recherche ajoutera les nouveaux Items trouvés au
            Webset existant. Tous les Items qui ne répondent pas aux nouveaux
            critères seront supprimés.
          $ref: "#/components/schemas/WebsetSearchBehavior"
        exclude:
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                type: string
            required:
              - source
              - id
            type: object
          description: Sources (imports ou websets existants) utilisées pour exclure
            certains résultats de la recherche.
          type: array
        scope:
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                type: string
              relationship:
                properties:
                  definition:
                    description: La relation recherchée entre les entités à trouver et celles
                      contenues dans la source fournie.
                    type: string
                  limit:
                    minimum: 1
                    maximum: 10
                    type: number
                required:
                  - definition
                  - limit
                type: object
            required:
              - source
              - id
            type: object
          description: >-
            Le scope de la recherche. Par défaut, aucun scope n’est défini : la
            recherche s’effectue donc sur le Web.


            S’il est fourni lors de la création, la recherche sera effectuée
            uniquement dans les sources indiquées.
          type: array
        progress:
          properties:
            found:
              description: Le nombre de résultats trouvés jusqu’à présent
              type: number
            analyzed:
              description: Le nombre de résultats analysés jusqu’à présent
              type: number
            completion:
              minimum: 0
              maximum: 100
              description: Le pourcentage d’avancement de la recherche
              type: number
            timeLeft:
              type: number
              description: Le temps restant estimé en secondes, ou null s’il est inconnu
              nullable: true
          required:
            - found
            - analyzed
            - completion
            - timeLeft
          description: La progression de la recherche
          type: object
        recall:
          properties:
            expected:
              properties:
                total:
                  description: Le nombre total estimé de correspondances potentielles
                  type: number
                confidence:
                  enum:
                    - high
                    - medium
                    - low
                  description: Le niveau de confiance de l’estimation
                  type: string
                bounds:
                  properties:
                    min:
                      description: Le nombre total minimal estimé de correspondances potentielles
                      type: number
                    max:
                      description: Le nombre total maximal estimé de correspondances potentielles
                      type: number
                  required:
                    - min
                    - max
                  type: object
              required:
                - total
                - confidence
                - bounds
              type: object
            reasoning:
              description: Le raisonnement à l’origine de l’estimation
              type: string
          required:
            - expected
            - reasoning
          type: object
          description: Métriques de rappel de la recherche, ou null si elles n’ont pas
            encore été calculées ou demandées.
          nullable: true
        metadata:
          default: {}
          description: Ensemble de paires clé-valeur à associer à cet objet.
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
        canceledAt:
          format: date-time
          type: string
          description: La date et l’heure d’annulation de la recherche
          nullable: true
        canceledReason:
          $ref: "#/components/schemas/WebsetSearchCanceledReason"
          description: La raison de l’annulation de la recherche
          nullable: true
        createdAt:
          format: date-time
          description: La date et l’heure de création de la recherche
          type: string
        updatedAt:
          format: date-time
          description: La date et l’heure de mise à jour de la recherche
          type: string
      required:
        - id
        - object
        - websetId
        - status
        - query
        - entity
        - criteria
        - count
        - maxPeoplePerCompany
        - exclude
        - scope
        - progress
        - recall
        - canceledAt
        - canceledReason
        - createdAt
        - updatedAt
      type: object
