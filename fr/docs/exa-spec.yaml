            - type: boolean
            - $ref: "#/components/schemas/SummaryWithMaxTokensOptionsOutput"
        extras:
          type: object
          properties:
            links:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Nombre d’URL à renvoyer pour chaque page web.
                  example: 1
                  default: 0
                - type: "null"
            imageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Nombre d’images à renvoyer pour chaque résultat.
                  example: 1
                  default: 0
                - type: "null"
            richImageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Nombre de liens d’images enrichis à renvoyer pour chaque résultat.
                  default: 0
                - type: "null"
            richLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Nombre de liens enrichis à renvoyer pour chaque résultat.
                  default: 0
                - type: "null"
            codeBlocks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Nombre de blocs de code à renvoyer pour chaque résultat.
                  default: 0
                - type: "null"
          additionalProperties: false
          description: Paramètres supplémentaires à transmettre.
        context:
          description: "Obsolète : utilisez plutôt highlights ou text. Renvoie le contenu
            des pages sous forme d’une chaîne de contexte combinée."
          deprecated: true
          oneOf:
            - type: boolean
              description: "Obsolète : utilisez plutôt highlights ou text. Renvoie le contenu
                des pages sous forme d’une chaîne de contexte combinée."
              example: true
              deprecated: true
            - type: object
              properties:
                maxCharacters:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: Obsolète. Nombre maximal de caractères pour la chaîne de contexte.
                    La valeur maximale prise en charge est 10000.
                  example: 10000
              additionalProperties: false
              description: "Obsolète : utilisez plutôt highlights ou text. Renvoie le contenu
                des pages sous forme d’une chaîne de contexte combinée."
              deprecated: true
        livecrawl:
          description: Stratégie d’exploration pour récupérer le contenu de la page
          oneOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
            - type: string
              const: auto
        livecrawlTimeout:
          type: integer
          exclusiveMinimum: 0
          maximum: 90000
          description: Délai d’expiration de l’exploration en direct, en millisecondes.
          example: 1000
          default: 10000
        maxAgeHours:
          type: integer
          minimum: -1
          maximum: 720
          description: Âge maximal du contenu mis en cache, en heures. Les valeurs
            positives utilisent le contenu mis en cache s’il date de moins de ce
            nombre d’heures ; 0 récupère du contenu récent et constitue la
            méthode prise en charge pour appliquer des options de rendu de texte
            aux pages fraîchement récupérées ; -1 utilise toujours le cache ; si
            omis, une récupération de secours est utilisée lorsque le contenu
            mis en cache est indisponible. La valeur maximale prise en charge
            est 720 heures.
          example: 24
        filterEmptyResults:
          type: boolean
          description: Filtrer les résultats sans contenu
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: Nombre de sous-pages à explorer. Le nombre réel de pages explorées
            peut être limité par les contraintes du système.
          example: 1
          default: 0
        subpageTarget:
          description: Terme permettant de trouver des sous-pages spécifiques parmi les
            résultats de recherche. Peut être une chaîne unique ou un tableau de
            chaînes.
          example: sources
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
      additionalProperties: false
      description: Options d’extraction de contenu appliquées à chaque résultat de
