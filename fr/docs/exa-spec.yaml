                            allouent des budgets de jetons progressivement plus
                            élevés aux highlights renvoyés. Avec
                            highlights.dynamic, la valeur prédéfinie définit un
                            budget partagé unique pour l’ensemble des résultats,
                            au lieu d’un budget par URL. Les budgets exacts sont
                            ajustés par Exa et peuvent changer. Non compatible
