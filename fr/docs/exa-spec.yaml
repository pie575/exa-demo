                depuis le cache uniquement avec des paramètres pris en charge.
                Consultez la documentation HIPAA pour plus de détails.
              example: hipaa
            - type: "null"
        outputSchema:
          anyOf:
            - oneOf:
                - $ref: "#/components/schemas/OutputSchemaText"
                - $ref: "#/components/schemas/OutputSchemaObject"
              description: Schéma JSON pour l'output synthétisé. Les types racines pris en
                charge sont « text » et « object ». Lorsqu'il est fourni, la
                réponse inclut un objet output dont le contenu correspond à ce
                schéma. Fonctionne avec tous les types de recherche et ajoute
                environ 2 secondes de latence de synthèse au type de recherche
                sélectionné.
              type: object
              discriminator:
                propertyName: type
                mapping:
                  text: "#/components/schemas/OutputSchemaText"
                  object: "#/components/schemas/OutputSchemaObject"
            - type: "null"
