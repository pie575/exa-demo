                          description: Número máximo de caracteres que se devolverán para los fragmentos
                            destacados. Controla la longitud total del texto de
                            los fragmentos destacados devuelto por URL. El valor
                            máximo admitido es 10000. No es compatible con
                            highlights.dynamic.
                          example: 2000
                        - type: "null"
                    numSentences:
                      anyOf:
                        - type: integer
                          minimum: 1
                          description: "Deprecado y se eliminará en una versión futura. Actualmente
                            equivale a un presupuesto de aproximadamente 1333
                            caracteres por oración. Pase highlights: true para
                            obtener highlights predeterminados, o { query } para
                            guiar la selección con su propia consulta."
                          example: 1
                          deprecated: true
                        - type: "null"
                    highlightsPerUrl:
                      anyOf:
                        - type: integer
                          minimum: 1
                          description: "Deprecado y se eliminará en una versión futura. Actualmente se
                            ignora. Pase highlights: true para obtener
                            highlights predeterminados, o { query } para guiar
                            la selección con su propia consulta."
                          example: 1
                          deprecated: true
                        - type: "null"
                  title: Advanced highlights options
                  description: "Opciones avanzadas para guiar la extracción de fragmentos
                    destacados. Pase highlights: true para obtener la
                    configuración predeterminada de mayor calidad; proporcione
                    este objeto solo cuando necesite guiar la selección con su
                    propia consulta."
            - type: "null"
        summary:
          anyOf:
            - type: object
              properties:
                query:
                  anyOf:
                    - type: string
                      description: Consulta personalizada para el resumen generado por el LLM.
                      example: Main developments
                    - type: "null"
                schema:
                  anyOf:
                    - type: object
                      propertyNames:
                        type: string
                      additionalProperties:
                        $ref: "#/components/schemas/JsonValue"
                      description: Esquema JSON para la salida estructurada del resumen. Consulte
                        https://json-schema.org/overview/what-is-jsonschema para
                        ver la documentación de JSON Schema.
                      example:
                        $schema: http://json-schema.org/draft-07/schema#
                        title: Title
                        type: object
                        properties:
                          Property 1:
                            type: string
                            description: Descripción
                          Property 2:
                            type: string
                            enum:
                              - option 1
                              - option 2
                              - option 3
                            description: Descripción
                        required:
                          - Property 1
                    - type: "null"
              description: Resumen de la página web.
            - type: "null"
        extras:
          anyOf:
            - type: object
              properties:
                links:
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 1000
                      description: Número de URL que se devolverán de cada página web.
                      example: 1
                      default: 0
                    - type: "null"
                imageLinks:
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 1000
                      description: Número de imágenes que se devolverán para cada resultado.
                      example: 1
                      default: 0
                    - type: "null"
                richImageLinks:
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 1000
                      description: Número de enlaces enriquecidos de imágenes que se devolverán para
                        cada resultado.
                      default: 0
                    - type: "null"
                richLinks:
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 1000
                      description: Número de enlaces enriquecidos que se devolverán para cada
                        resultado.
                      default: 0
                    - type: "null"
                codeBlocks:
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 1000
                      description: Número de bloques de código que se devolverán para cada resultado.
                      default: 0
                    - type: "null"
              description: Parámetros adicionales que se deben pasar.
            - type: "null"
        context:
          anyOf:
            - description: "Deprecado: use highlights o text en su lugar. Devuelve el
                contenido de la página como una única cadena de contexto."
              deprecated: true
              oneOf:
                - type: boolean
                  description: "Deprecado: use highlights o text en su lugar. Devuelve el
                    contenido de la página como una única cadena de contexto."
                  example: true
                  deprecated: true
                - type: object
                  properties:
                    maxCharacters:
                      type: integer
                      minimum: 1
                      maximum: 10000
                      description: Deprecado. Límite máximo de caracteres para la cadena de contexto.
                        El valor máximo admitido es 10000.
                      example: 10000
                  description: "Deprecado: use highlights o text en su lugar. Devuelve el
                    contenido de la página como una única cadena de contexto."
                  deprecated: true
            - type: "null"
        livecrawl:
          anyOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
              description: "Deprecado: use maxAgeHours en su lugar para controlar la frescura
                del contenido. livecrawl no garantiza una salida reciente del
                analizador y puede proporcionarse según la política de frescura
                del server. No envíe livecrawl y maxAgeHours juntos."
              example: preferred
              deprecated: true
            - type: "null"
        livecrawlTimeout:
          anyOf:
            - type: integer
              exclusiveMinimum: 0
              maximum: 90000
              description: El tiempo de espera de livecrawling en milisegundos.
              example: 1000
              default: 10000
            - type: "null"
        maxAgeHours:
          anyOf:
            - type: integer
              minimum: -1
              maximum: 720
              description: Antigüedad máxima del contenido en caché en horas. Los valores
                positivos usan contenido en caché si tiene menos de esta
                cantidad de horas; 0 obtiene contenido reciente y es la forma
                admitida de aplicar opciones de renderizado de texto a páginas
                recién obtenidas; -1 siempre usa la caché; si se omite, se
                recurre a la obtención alternativa cuando el contenido en caché
                no está disponible. El valor máximo admitido es 720 horas.
              example: 24
            - type: "null"
        snapshotAsOf:
          anyOf:
            - type: string
              description: Devuelve la versión almacenada más reciente de cada página en este
                instante (fecha y hora ISO 8601). Las solicitudes históricas se
                sirven únicamente a partir de versiones almacenadas y nunca
                obtienen la página en vivo.
              example: 2026-01-15T00:00:00Z
              format: date-time
            - type: "null"
        subpages:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 100
              description: El número de subpáginas que se rastrearán. El número real de
                subpáginas rastreadas puede estar limitado por restricciones del
                sistema.
              example: 1
              default: 0
            - type: "null"
        subpageTarget:
          anyOf:
            - description: Término para encontrar subpáginas específicas en los resultados de
                búsqueda. Puede ser una sola cadena o un arreglo de cadenas.
              example: sources
              oneOf:
                - type: string
                  minLength: 1
                  maxLength: 100
                - minItems: 0
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
            - type: "null"
      description: Proporcione `ids` o `urls`, pero no ambos.
      oneOf:
        - required:
            - ids
        - required:
            - urls
    AnswerRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Pregunta o instrucciones en lenguaje natural para la solicitud.
          example: What is the latest valuation of SpaceX?
        stream:
          type: boolean
          description: Si es true, la respuesta se devuelve como un stream de eventos
            enviados por el servidor (SSE).
          default: false
        text:
          type: boolean
          title: Simple text retrieval
          description: Si es true, devuelve el texto completo de la página con la
            configuración predeterminada. Si es false, desactiva la devolución
            de texto.
          default: false
        model:
          description: El modelo utilizado para generar la respuesta.
          default: exa
          type: string
          enum:
            - exa
            - exa-pro
            - exa-research
            - exa-fast
        systemPrompt:
          type: string
          description: Instrucciones adicionales que guían la salida generada o el
            comportamiento del agente. Úselo para indicar preferencias de
            fuentes, restricciones de novedad o duplicación, u otras pautas de
            comportamiento.
          example: Prefer official sources and avoid duplicate results.
        userLocation:
          anyOf:
            - type: string
              description: El código de país ISO de dos letras del usuario, por ejemplo, US.
              example: US
            - type: "null"
        outputSchema:
          type: object
          properties:
            type:
              type: string
              description: El tipo de esquema raíz (normalmente "object").
              example: object
            properties:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: Un objeto en el que cada clave es un nombre de propiedad y cada
                valor es un esquema JSON que describe esa propiedad (con `type`,
                `description`, etc.).
            required:
              type: array
              items:
                type: string
              description: Lista de nombres de propiedades obligatorias.
            description:
              type: string
              description: Una descripción del esquema.
            additionalProperties:
              type: boolean
              description: Si se permiten propiedades que no figuran en `properties`.
              default: false
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: Una especificación de [JSON Schema Draft
            7](https://json-schema.org/draft-07) para la estructura de respuesta
            deseada. Cuando se proporciona, la respuesta se devuelve como un
            objeto estructurado que se ajusta al esquema en lugar de una cadena
            simple.
      required:
        - query
    FindSimilarRequest:
      type: object
      properties:
        includeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: Lista de dominios o rutas de dominio que se incluirán en la
                búsqueda. Cada entrada puede ser un nombre de host (por ejemplo,
                `example.com`), un nombre de host con un prefijo de ruta (por
                ejemplo, `example.com/docs`) o un subdominio comodín (por
                ejemplo, `*.example.com`). Si se especifica, los resultados solo
                procederán de los dominios o rutas coincidentes. Use este
                parámetro para filtrar por dominio o ruta en lugar de añadir un
                operador `site:` a la consulta.
              example:
                - arxiv.org
                - exa.ai/blog
            - type: "null"
        excludeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: Lista de dominios o rutas de dominio que se excluirán de los
                resultados de búsqueda. Cada entrada puede ser un nombre de host
                (por ejemplo, `example.com`), un nombre de host con un prefijo
                de ruta (por ejemplo, `example.com/docs`) o un subdominio
                comodín (por ejemplo, `*.example.com`). Si se especifica, no se
                devolverán resultados de los dominios o rutas coincidentes. Use
                este parámetro para filtrar por dominio o ruta en lugar de
                añadir un operador `site:` a la consulta.
              example:
                - docs.python.org/3
            - type: "null"
        startCrawlDate:
          anyOf:
            - type: string
              description: Deprecado y sin efecto; la API lo ignora. Debe especificarse en
                formato ISO 8601.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        endCrawlDate:
          anyOf:
            - type: string
              description: Deprecado y sin efecto; la API lo ignora. Debe especificarse en
                formato ISO 8601.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        startPublishedDate:
          anyOf:
            - type: string
              description: Solo se devolverán enlaces con una fecha de publicación posterior a
                esta. Debe especificarse en formato ISO 8601.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
            - type: "null"
        endPublishedDate:
          anyOf:
            - type: string
              description: Solo se devolverán enlaces con una fecha de publicación anterior a
                esta. Debe especificarse en formato ISO 8601.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
            - type: "null"
        numResults:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 100
              description: Número de resultados que se devolverán. Los límites varían según el
                tipo de búsqueda. El límite público máximo es de 100 resultados.
                Contacte con ventas (hello@exa.ai) para consultar límites más
                altos.
              example: 10
              default: 10
            - type: "null"
        contents:
          anyOf:
            - description: Opciones de contenido para texto, highlights, resumen, extras y
                controles de frescura.
              $ref: "#/components/schemas/ContentsOptions"
            - type: "null"
        url:
          type: string
          minLength: 3
          description: La URL para la que desea encontrar enlaces similares.
          example: https://arxiv.org/abs/2307.06435
        category:
          anyOf:
            - type: string
              enum:
                - company
                - publication
                - news
                - personal site
                - financial report
                - people
              description: "Una categoría de datos en la que centrarse. Las categorías
                conocidas incluyen `company`, `publication`, `news`, `personal
                site`, `financial report` y `people`. También se aceptan otras
                cadenas y se utilizan como pistas de categoría para la búsqueda.
                Las categorías `people` y `company` ofrecen mayor calidad para
                encontrar perfiles de personas y páginas de empresas. La
                categoría `publication` muestra publicaciones académicas, como
                artículos de investigación, preprints y artículos de revistas,
                con metadatos estructurados como autores, publicación y citas.
                Nota: Las categorías `company` y `people` solo admiten un
                conjunto limitado de filtros. Los siguientes parámetros NO son
                compatibles con estas categorías: `startPublishedDate`,
                `endPublishedDate`, `excludeDomains`. El uso de parámetros no
                compatibles generará un error 400."
              example: publication
            - type: "null"
        excludeSourceDomain:
          anyOf:
            - type: boolean
              description: Si es verdadero, se excluyen los resultados del mismo dominio que
                la URL de origen.
              example: true
            - type: "null"
      required:
        - url
    CreateSearchMonitorParameters:
      type: object
      properties:
        name:
          type: string
          description: Un nombre opcional para el monitor
        search:
          $ref: "#/components/schemas/SearchMonitorSearch"
        trigger:
          $ref: "#/components/schemas/SearchMonitorTrigger"
        outputSchema:
          $ref: "#/components/schemas/SearchMonitorOutputSchema"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Metadatos opcionales de clave-valor. Se incluyen de vuelta en las
            entregas de webhooks para que puedas enrutar actualizaciones a
            sistemas como Slack.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        webhook:
          $ref: "#/components/schemas/SearchMonitorWebhook"
      required:
        - search
        - webhook
    SearchMonitorSearch:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: La cadena de consulta para la búsqueda.
          example: Latest developments in LLM capabilities
        numResults:
          type: integer
          minimum: 1
          maximum: 100
          description: Número de resultados que se devolverán. Los límites varían según el
            tipo de búsqueda. El límite público máximo es de 100 resultados.
            Contacta con ventas (hello@exa.ai) para consultar límites
            superiores.
          example: 10
          default: 10
        includeDomains:
          description: Restringe los resultados de búsqueda a estos dominios.
          type: array
          items:
            type: string
        excludeDomains:
          description: Excluye estos dominios de los resultados de búsqueda.
          type: array
          items:
            type: string
        contents:
          $ref: "#/components/schemas/SearchMonitorContents"
      required:
        - query
    SearchMonitorContents:
      type: object
      properties:
        text:
          description: Opciones de extracción de texto para cada resultado.
          oneOf:
            - type: boolean
              title: Simple text retrieval
              description: Si es verdadero, devuelve el texto completo de la página con la
                configuración predeterminada. Si es falso, desactiva la
                devolución de texto.
              default: false
            - type: object
              properties:
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: Límite máximo de caracteres para el texto completo de la página.
                        Útil para controlar el tamaño de la respuesta y los
                        costos de la API. El valor máximo admitido es 10000.
                      example: 1000
                    - type: "null"
                includeHtmlTags:
                  anyOf:
                    - type: boolean
                      description: "Si es verdadero, incluye etiquetas HTML ligeras en el texto
                        devuelto en lugar de texto sin formato de estilo
                        Markdown. Usa maxAgeHours: 0 cuando necesites aplicar
                        esto a contenido obtenido recientemente."
                      example: false
                      default: false
                    - type: "null"
                verbosity:
                  anyOf:
                    - type: string
                      enum:
                        - compact
                        - standard
                        - full
                      description: "Controla el nivel de detalle del texto renderizado. compact se
                        centra en el contenido principal, standard incluye más
                        contexto de la página circundante y full solicita el
                        texto renderizado más completo. Algunas páginas pueden
                        generar el mismo output para standard y full. Usa
                        maxAgeHours: 0 cuando necesites aplicar esto a contenido
                        obtenido recientemente."
                      example: standard
                      default: compact
                    - type: "null"
                includeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "En la medida de lo posible, incluye solo contenido clasificado en
                        estas secciones semánticas de la página. La
                        clasificación de secciones puede no estar disponible o
                        estar incompleta para algunas páginas; valida el output
                        si se requiere un filtrado estricto. Usa maxAgeHours: 0
                        cuando necesites aplicar esto a contenido obtenido
                        recientemente."
                      example:
                        - body
                        - header
                    - type: "null"
                excludeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "Excluye contenido clasificado en estas secciones semánticas de la
                        página. La clasificación de secciones se realiza en la
                        medida de lo posible. Usa maxAgeHours: 0 cuando
                        necesites aplicar esto a contenido obtenido
                        recientemente."
                      example:
                        - navigation
                        - footer
                        - sidebar
                    - type: "null"
              title: Advanced text options
              description: Opciones avanzadas para controlar la extracción de texto. Úsalo
                cuando necesites limitar la longitud del texto o incluir la
                estructura HTML.
        highlights:
          description: Fragmentos de texto que el LLM identifica como los más relevantes
            de cada página.
          oneOf:
            - type: boolean
              title: Simple highlights retrieval
              description: Si es verdadero, devuelve highlights con la configuración
                predeterminada. Si es falso, desactiva los highlights.
              default: false
            - type: object
              properties:
                query:
                  anyOf:
                    - type: string
                      description: Consulta personalizada que guía los highlights que selecciona el
                        LLM.
                      example: Key advancements
                    - type: "null"
                verbosity:
                  anyOf:
                    - type: string
                      enum:
                        - low
                        - medium
                        - high
                      description: "Longitud preestablecida de highlights: `low`, `medium` y `high`
                        asignan presupuestos de tokens progresivamente mayores a
                        los highlights devueltos. Con highlights.dynamic, el
                        valor preestablecido establece un único presupuesto
                        compartido para todo el conjunto de resultados en lugar
                        de un presupuesto por URL. Exa ajusta los presupuestos
                        exactos, que pueden cambiar. No es compatible con
                        maxCharacters ni numSentences. Beta: requiere el
                        encabezado de solicitud `Exa-Beta:
                        dynamic-highlights-2026-08-28`; se rechazan las
                        solicitudes que establezcan `verbosity` sin él."
                      example: medium
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                dynamic:
                  anyOf:
                    - type: boolean
                      description: "Habilita Dynamic Highlights (vista previa de investigación):
                        considera todos los resultados en conjunto y asigna un
                        único presupuesto de contexto compartido para el
                        conjunto de resultados en lugar de un presupuesto por
                        documento. No es compatible con maxCharacters. Beta:
                        requiere el encabezado de solicitud `Exa-Beta:
                        dynamic-highlights-2026-08-28`; se rechazan las
                        solicitudes que establezcan `dynamic` sin él."
                      example: true
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: Número máximo de caracteres que se devolverán para los highlights.
                        Controla la longitud total del texto de highlights
                        devuelto por URL. El valor máximo admitido es 10000. No
                        es compatible con highlights.dynamic.
                      example: 2000
                    - type: "null"
                numSentences:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "Deprecado y se eliminará en una versión futura. Actualmente se
                        asigna a un presupuesto de caracteres de aproximadamente
                        1333 caracteres por oración. Pasa highlights: true para
                        los highlights predeterminados o { query } para orientar
                        la selección con tu propia consulta."
                      example: 1
                      deprecated: true
                    - type: "null"
                highlightsPerUrl:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "Deprecado y se eliminará en una versión futura. Actualmente se
                        ignora. Pasa highlights: true para los highlights
                        predeterminados o { query } para orientar la selección
                        con tu propia consulta."
                      example: 1
                      deprecated: true
                    - type: "null"
              title: Advanced highlights options
              description: "Opciones avanzadas para orientar la extracción de highlights. Pasa
                highlights: true para obtener la configuración predeterminada de
                mayor calidad; proporciona este objeto solo cuando necesites
                orientar la selección con tu propia consulta."
        summary:
          description: Devuelve un resumen generado por un LLM. Pasa `true` para usar los
            valores predeterminados o un objeto con `query` y `maxTokens`.
          oneOf:
            - type: boolean
            - $ref: "#/components/schemas/SummaryWithMaxTokensOptions"
        extras:
          type: object
          properties:
            links:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Número de URL que se devolverán de cada página web.
                  example: 1
                  default: 0
                - type: "null"
            imageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Número de imágenes que se devolverán para cada resultado.
                  example: 1
                  default: 0
                - type: "null"
            richImageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Número de enlaces enriquecidos de imágenes que se devolverán para
                    cada resultado.
                  default: 0
                - type: "null"
            richLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Número de enlaces enriquecidos que se devolverán para cada
                    resultado.
                  default: 0
                - type: "null"
            codeBlocks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Número de bloques de código que se devolverán para cada resultado.
                  default: 0
                - type: "null"
          description: Parámetros adicionales que se pasarán.
        context:
          description: "Deprecado: usa highlights o texto en su lugar. Devuelve el
            contenido de la página como una sola cadena de contexto."
          deprecated: true
          oneOf:
            - type: boolean
              description: "Deprecado: usa highlights o texto en su lugar. Devuelve el
                contenido de la página como una sola cadena de contexto."
              example: true
              deprecated: true
            - type: object
              properties:
                maxCharacters:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: Deprecado. Límite máximo de caracteres para la cadena de contexto.
                    El valor máximo admitido es 10000.
                  example: 10000
              description: "Deprecado: usa highlights o texto en su lugar. Devuelve el
                contenido de la página como una sola cadena de contexto."
              deprecated: true
        livecrawl:
          description: Estrategia de rastreo para obtener contenido de la página
          oneOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
            - type: string
              const: auto
        livecrawlTimeout:
          type: integer
          exclusiveMinimum: 0
          maximum: 90000
          description: El tiempo de espera para el rastreo en tiempo real, en milisegundos.
          example: 1000
          default: 10000
        maxAgeHours:
          type: integer
          minimum: -1
          maximum: 720
          description: Antigüedad máxima del contenido almacenado en caché, en horas. Los
            valores positivos usan contenido almacenado en caché si tiene menos
            de esta cantidad de horas; 0 obtiene contenido nuevo y es la forma
            compatible de aplicar opciones de representación de texto a páginas
            recién obtenidas; -1 siempre usa la caché; si se omite, usa una
            obtención alternativa cuando el contenido almacenado en caché no
            está disponible. El valor máximo admitido es 720 horas.
          example: 24
        filterEmptyResults:
          type: boolean
          description: Filtrar resultados sin contenido
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: El número de subpáginas que se rastrearán. El número real de
            subpáginas rastreadas puede estar limitado por restricciones del
            sistema.
          example: 1
          default: 0
        subpageTarget:
          description: Término para encontrar subpáginas específicas en los resultados de
            búsqueda. Puede ser una sola cadena o un arreglo de cadenas.
          example: sources
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
      description: Opciones de extracción de contenido aplicadas a cada resultado de
        búsqueda. Todos los campos son opcionales.
    SummaryWithMaxTokensOptions:
      type: object
      properties:
        query:
          anyOf:
            - type: string
              description: Consulta personalizada para el resumen generado por el LLM.
              example: Main developments
            - type: "null"
        maxTokens:
          type: integer
          minimum: 1
          description: Número máximo de tokens para el resumen generado.
    SearchMonitorTrigger:
      type: object
      properties:
        type:
          type: string
          const: interval
          description: El tipo de desencadenador. Actualmente, solo se admite `interval`.
          default: interval
        period:
          type: string
          description: Una cadena de duración que especifica la frecuencia con la que se
            ejecuta el monitor (p. ej., "1h", "6h", "1d", "7d"). Solo se admite
            una unidad. El intervalo mínimo es de 1 hora. La programación se
            ancla a la hora de creación del monitor (p. ej., un monitor diario
            creado a las 2:30 p. m. se ejecuta cada día alrededor de las 2:30 p.
            m.).
          example: 6h
      required:
        - type
        - period
    SearchMonitorOutputSchema:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaText"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: Esquema JSON para el output sintetizado. Los tipos raíz admitidos
            son "text" y "object". Cuando se proporciona, la respuesta incluye
            un objeto de output cuyo contenido coincide con este esquema.
            Funciona con todos los tipos de búsqueda y añade unos 2 segundos de
            latencia de síntesis al tipo de búsqueda seleccionado.
          type: object
          discriminator:
            propertyName: type
            mapping:
              text: "#/components/schemas/OutputSchemaText"
              object: "#/components/schemas/OutputSchemaObject"
        - type: "null"
      description: 'Controla el formato del output del run. De forma predeterminada,
        es `{ "type": "text" }` si no se especifica. Cuando `type` es `"text"`,
        el output es un resumen de texto sin formato. Cuando `type` es
        `"object"`, el output es JSON estructurado. Si no se especifican
        `properties` con el tipo `"object"`, se infiere automáticamente un
        esquema; de lo contrario, el output se ajusta al esquema proporcionado.'
    SearchMonitorWebhook:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: La URL HTTPS que recibirá eventos de webhook. No debe apuntar a
            localhost ni a rangos de IP privadas.
        events:
          type: array
          items:
            type: string
            enum:
              - monitor.created
              - monitor.updated
              - monitor.deleted
              - monitor.run.created
              - monitor.run.completed
          description: Los eventos a los que suscribirse. De forma predeterminada, se
            incluyen todos los eventos si no se especifica.
      required:
        - url
    BatchMonitorsRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - delete
            - pause
            - unpause
          description: La acción que se realizará en los monitores coincidentes. `delete`
            los elimina permanentemente, `pause` cambia su estado a pausado y
            `unpause` cambia su estado a activo.
        filter:
          type: object
          properties:
            name:
              type: string
              maxLength: 250
              description: Filtrar por nombre (coincidencia de subcadena sin distinguir
                mayúsculas de minúsculas)
            status:
              type: string
              enum:
                - active
                - paused
                - disabled
              description: Filtrar por estado del monitor
            metadata:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
                maxLength: 1000
              description: Filtrar por pares clave-valor de metadatos (coincidencia exacta,
                semántica AND)
          description: Se debe proporcionar al menos un campo de filtro para evitar
            operaciones masivas accidentales.
        dry_run:
          type: boolean
          description: Cuando es `true`, devuelve los monitores que se verían afectados
            sin realizar la acción. De forma predeterminada, es `true`.
          default: true
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: Número máximo de monitores que se procesarán en una sola solicitud.
            De forma predeterminada, 50; máximo, 500.
          default: 50
      required:
        - action
        - filter
    UpdateSearchMonitorParameters:
      type: object
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
          description: Actualizar el nombre del monitor
        status:
          type: string
          enum:
            - active
            - paused
          description: Actualizar el estado del monitor (solo se puede establecer en
            `active` o `paused`)
        search:
          type: object
          properties:
            query:
              type: string
              minLength: 1
              description: La cadena de consulta para la búsqueda.
              example: Latest developments in LLM capabilities
            numResults:
              type: integer
              minimum: 1
              maximum: 100
              description: Número de resultados que se devolverán. Los límites varían según el
                tipo de búsqueda. El límite público máximo es de 100 resultados.
                Contacta con ventas (hello@exa.ai) para analizar límites más
                altos.
              example: 10
              default: 10
            includeDomains:
              description: Restringir los resultados de búsqueda a estos dominios.
              type: array
              items:
                type: string
            excludeDomains:
              description: Excluir estos dominios de los resultados de búsqueda.
              type: array
              items:
                type: string
            contents:
              $ref: "#/components/schemas/SearchMonitorContents"
          description: Parámetros parciales de búsqueda que se combinarán. Todos los
            campos son opcionales para las actualizaciones.
        trigger:
          anyOf:
            - type: object
              properties:
                type:
                  type: string
                  const: interval
                  description: El tipo de desencadenador. Actualmente, solo se admite `interval`.
                  default: interval
                period:
                  type: string
                  description: Una cadena de duración que especifica la frecuencia con la que se
                    ejecuta el monitor (p. ej., "1h", "6h", "1d", "7d"). Solo se
                    admite una unidad. El intervalo mínimo es de 1 hora.
            - type: "null"
          description: Actualizar la programación. Establécela en null para eliminarla.
        outputSchema:
          $ref: "#/components/schemas/SearchMonitorOutputSchema"
        metadata:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
              description: Metadatos de clave-valor proporcionados por el cliente para su
                propio seguimiento.
              example:
                slack_channel_id: C123ABC
                slack_thread_id: "1745444400.123456"
                user_id: U123ABC
            - type: "null"
          description: Actualizar los metadatos. Establécelos en null para eliminarlos. Se
            incluyen en las entregas de webhook para que puedas enrutar las
            actualizaciones a sistemas como Slack.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        webhook:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: La URL HTTPS que recibirá eventos de webhook. No debe apuntar a
                localhost ni a rangos de IP privadas.
            events:
              type: array
              items:
                type: string
                enum:
                  - monitor.created
                  - monitor.updated
                  - monitor.deleted
                  - monitor.run.created
                  - monitor.run.completed
              description: Los eventos a los que suscribirse. De forma predeterminada, se
                incluyen todos los eventos si no se especifica.
          description: Parámetros parciales de webhook que se combinarán. Todos los campos
            son opcionales para las actualizaciones.
    CreateAgentRunRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Pregunta o instrucciones en lenguaje natural para la solicitud.
          example: What are the most important AI infrastructure funding rounds announced
            this week?
        systemPrompt:
          type: string
          description: Instrucciones adicionales que guían el output generado o el
            comportamiento del agente. Úsalas para indicar preferencias de
            fuentes, restricciones de novedad, restricciones de duplicación u
            otras pautas de comportamiento.
          example: Prefer official sources and avoid duplicate results.
        effort:
          $ref: "#/components/schemas/AgentEffort"
        input:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Un registro de objeto JSON.
              description: Registros que el agente debe procesar o enriquecer.
            exclusion:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Un registro de objeto JSON.
              description: Registros o entidades que el agente debe evitar devolver.
          description: Registros que se procesarán y registros o entidades que se
            excluirán de la respuesta.
        outputSchema:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: Esquema JSON para salida estructurada validada en
                `output.structured`. Los campos que no estén respaldados por
                evidencia pueden devolverse como `null`. Admite draft-07,
                2019-09 y 2020-12 mediante `$schema`.
            - type: "null"
        previousRunId:
          description: ID de un run completado desde el que se continuará. Debe pertenecer
            al mismo equipo.
          $ref: "#/components/schemas/AgentRunId"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Metadatos proporcionados por el cliente y almacenados con el run.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        dataSources:
          maxItems: 5
          type: array
          items:
            $ref: "#/components/schemas/AgentDataSource"
          description: Proveedores de datos de Exa Connect que se habilitarán para el run.
            Cada entrada habilita todas las herramientas de ese proveedor.
        budget:
          $ref: "#/components/schemas/AgentBudget"
      required:
        - query
    AgentEffort:
      type: string
      enum:
        - minimal
        - low
        - medium
        - high
        - xhigh
        - auto
        - max
      description: Preferencia de costo y esfuerzo de razonamiento para el run. `auto`
        permite que Exa elija el esfuerzo adecuado. `max` es el nivel de beta
        pública de mayor esfuerzo para trabajos en los que la integridad y la
        exhaustividad importan más que la latencia o el costo, incluida la
        creación de listas grandes, la investigación deep con múltiples fuentes
        y los criterios difíciles de verificar.
      default: auto
    AgentRunId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[A-Za-z0-9_.:-]+$
      description: ID del run del agente. Los nuevos ID de run se devuelven con el
        prefijo `agent_run_`.
      example: agent_run_01j7x9v0m2n4p6q8r0s2t4v6w8
    AgentDataSource:
      type: object
      properties:
        provider:
          description: Proveedor de datos de Exa Connect que se habilitará para el run.
            Todas las herramientas del proveedor están disponibles de forma
            predeterminada.
          example: fiber
          $ref: "#/components/schemas/AgentDataSourceProvider"
      required:
        - provider
    AgentDataSourceProvider:
      type: string
      enum:
        - fiber
        - financial_datasets
        - similarweb
        - baselayer
        - affiliate
        - particle
        - jinko
        - polymarket
      description: Identificador de un proveedor de datos de Exa Connect.
    AgentBudget:
      type: object
      properties:
        maxCostDollars:
          type: number
          description: Importe máximo que este run puede gastar en dólares
            estadounidenses. Acepta entre $1 y $100 y se aplica solo a `auto` y
            `max`; si se omite, el límite predeterminado es de $5 para `auto` y
            de $20 para `max`.
          example: 10
      description: Límite de gasto opcional por run para los niveles de esfuerzo
        medidos `auto` y `max`. Los runs que finalizan antes pueden costar menos
        que el límite.
    CreateBatchRequest:
      type: object
      properties:
        requests:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/BatchRequestItem"
          description: Las solicitudes que se pondrán en cola. Cada `customId` debe ser
            único dentro del batch.
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Metadatos proporcionados por quien realiza la llamada y almacenados
            con el batch.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
      required:
        - requests
    BatchRequestItem:
      type: object
      properties:
        customId:
          type: string
          minLength: 1
          maxLength: 64
          description: Tu identificador único para esta solicitud; identifica el resultado
            y debe ser único dentro del batch.
          example: row-1
        method:
          type: string
          const: POST
          description: Método HTTP de la solicitud incluida en el batch. Solo admite POST
            en v1.
        url:
          type: string
          enum:
            - /search
            - /agent/runs
          description: Ruta de la API de destino para la solicitud. En v1, puede ser
            `/search` o `/agent/runs`.
          example: /search
        body:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: "Cuerpo de la solicitud para la ruta de destino. Debe ser un objeto
            JSON; no se permite `stream: true`."
      required:
        - customId
        - method
        - url
        - body
    AnswerStreamTextDeltaChunk:
      type: object
      properties:
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                minimum: 0
                description: Índice de esta opción en streaming.
              delta:
                type: object
                properties:
                  role:
                    type: string
                    const: assistant
                  content:
                    type: string
                  refusal:
                    anyOf:
                      - type: string
                      - type: "null"
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Contenido incremental de la respuesta emitido por el modelo.
              finish_reason:
                description: Motivo por el que finalizó esta opción en streaming, si está
                  presente.
                oneOf:
                  - type: string
                  - type: "null"
            required:
              - index
              - delta
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
          description: Opciones de finalización en streaming compatibles con OpenAI, sin
            los campos internos del proveedor.
      required:
        - choices
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    SearchResponse:
      oneOf:
        - $ref: "#/components/schemas/SearchSynthesisResponse"
        - $ref: "#/components/schemas/SearchResultsResponse"
    SearchSynthesisResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Identificador único de la solicitud.
          example: b5947044c4b78efa9552a7c89b306d95
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultOutput"
          description: Lista de resultados de búsqueda que contiene título, URL, fecha de
            publicación y autor.
        resolvedSearchType:
          description: Campo heredado deprecado. Las respuestas actuales de producción
            pueden devolver una cadena vacía; los clientes no deben basar
            decisiones en este valor.
          example: ""
          deprecated: true
          type: string
        context:
          type: string
          description: Deprecado. Cadena de contexto combinada de los resultados de
            búsqueda. Usa highlights o texto en su lugar.
          deprecated: true
        costDollars:
          $ref: "#/components/schemas/CostDollarsOutput"
        searchTime:
          type: number
          description: Tiempo de procesamiento en el server, en milisegundos, medido en el
            gateway. Incluye la recuperación, pero puede excluir fases
            posteriores, como la síntesis de salida estructurada, por lo que
            puede ser menor que la latencia total de la solicitud.
          example: 312.4
        output:
          $ref: "#/components/schemas/SearchSynthesisOutputOutput"
      required:
        - results
        - output
      additionalProperties: false
    SearchResultsResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Identificador único de la solicitud.
          example: b5947044c4b78efa9552a7c89b306d95
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultOutput"
          description: Lista de resultados de búsqueda que contiene título, URL, fecha de
            publicación y autor.
        resolvedSearchType:
          description: Campo heredado deprecado. Las respuestas actuales de producción
            pueden devolver una cadena vacía; los clientes no deben basar
            decisiones en este valor.
          example: ""
          deprecated: true
          type: string
        context:
          type: string
          description: Deprecado. Cadena de contexto combinada de los resultados de
            búsqueda. Usa highlights o texto en su lugar.
          deprecated: true
        costDollars:
          $ref: "#/components/schemas/CostDollarsOutput"
        searchTime:
          type: number
          description: Tiempo de procesamiento en el server, en milisegundos, medido en el
            gateway. Incluye la recuperación, pero puede excluir fases
            posteriores, como la síntesis de salida estructurada, por lo que
            puede ser menor que la latencia total de la solicitud.
          example: 312.4
      required:
        - results
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Identificador único de la solicitud.
          example: b5947044c4b78efa9552a7c89b306d95
        error:
          type: string
          description: Mensaje legible que describe el error.
          example: Invalid API key
        tag:
          type: string
          description: "Tag de error legible por máquinas que identifica el fallo. El
            conjunto de tags es abierto: pueden añadirse nuevos tags en
            cualquier momento, por lo que los tags no reconocidos deben tratarse
            como un error genérico correspondiente al estado HTTP de la
            respuesta. Los tags conocidos se enumeran como ejemplos."
          examples:
            - DEFAULT_ERROR
            - INTERNAL_ERROR
            - INVALID_API_KEY
            - INVALID_REQUEST
            - INVALID_REQUEST_BODY
            - INVALID_REQUEST_QUERY
            - INVALID_JSON_SCHEMA
            - INVALID_NUM_RESULTS
            - NUM_RESULTS_EXCEEDED
            - NO_MORE_CREDITS
            - API_KEY_BUDGET_EXCEEDED
            - TEAM_BUDGET_EXCEEDED
            - NO_CONTENT_FOUND
            - PROHIBITED_CONTENT
            - INSUFFICIENT_SCOPE
            - UNABLE_TO_GENERATE_RESPONSE
            - UNSUPPORTED_PUBLICATION_INCLUDE_FILTER
            - SUBPAGES_LIMIT_EXCEEDED
            - FEATURE_DISABLED
            - INVALID_URLS
            - FETCH_DOCUMENT_ERROR
            - TEAM_BLOCKED
            - NOT_FOUND
            - RATE_LIMIT_EXCEEDED
            - SNAPSHOT_RATE_LIMIT_EXCEEDED
            - SNAPSHOT_NOT_ON_PLAN
            - SNAPSHOT_NOT_IN_CONTRACT
            - SNAPSHOT_TRIAL_EXHAUSTED
            - SNAPSHOT_TRIAL_CAP_EXCEEDED
      required:
        - requestId
        - error
        - tag
      additionalProperties: false
      description: Estructura de error estándar devuelta por la API de Exa para
        solicitudes fallidas.
    X402PaymentChallenge:
      type: object
      properties:
        requestId:
          type: string
          description: Identificador único de la solicitud.
          example: b5947044c4b78efa9552a7c89b306d95
        error:
          type: string
          description: Mensaje legible que describe el error.
          example: Payment required to access this resource
        tag:
          type: string
          description: "Tag de error legible por máquinas que identifica el fallo. El
            conjunto de tags es abierto: pueden añadirse nuevos tags en
            cualquier momento, por lo que los tags no reconocidos deben tratarse
            como un error genérico correspondiente al estado HTTP de la
            respuesta. Los tags conocidos se enumeran como ejemplos."
          examples:
            - DEFAULT_ERROR
            - INTERNAL_ERROR
            - INVALID_API_KEY
            - INVALID_REQUEST
            - INVALID_REQUEST_BODY
            - INVALID_REQUEST_QUERY
            - INVALID_JSON_SCHEMA
            - INVALID_NUM_RESULTS
            - NUM_RESULTS_EXCEEDED
            - NO_MORE_CREDITS
            - API_KEY_BUDGET_EXCEEDED
            - TEAM_BUDGET_EXCEEDED
            - NO_CONTENT_FOUND
            - PROHIBITED_CONTENT
            - INSUFFICIENT_SCOPE
            - UNABLE_TO_GENERATE_RESPONSE
            - UNSUPPORTED_PUBLICATION_INCLUDE_FILTER
            - SUBPAGES_LIMIT_EXCEEDED
            - FEATURE_DISABLED
            - INVALID_URLS
            - FETCH_DOCUMENT_ERROR
            - TEAM_BLOCKED
            - NOT_FOUND
            - RATE_LIMIT_EXCEEDED
            - SNAPSHOT_RATE_LIMIT_EXCEEDED
            - SNAPSHOT_NOT_ON_PLAN
            - SNAPSHOT_NOT_IN_CONTRACT
            - SNAPSHOT_TRIAL_EXHAUSTED
            - SNAPSHOT_TRIAL_CAP_EXCEEDED
        x402Version:
          type: number
          description: Versión del protocolo x402 utilizada para crear este desafío.
          example: 2
        resource:
          type: object
          properties:
            url:
              type: string
