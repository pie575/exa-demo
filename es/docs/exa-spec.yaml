                            - medium
                            - high
                          description: "Longitud preestablecida de los fragmentos destacados: `low`,
                            `medium` y `high` asignan presupuestos de tokens
                            progresivamente mayores para los fragmentos
                            destacados devueltos. Con highlights.dynamic, el
