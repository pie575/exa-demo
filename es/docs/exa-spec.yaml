components:
  schemas:
    SearchRequest:
      type: object
      properties:
        includeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: Lista de dominios o rutas de dominio que se incluirán en la
                búsqueda. Cada entrada puede ser un nombre de host (por ejemplo,
                `example.com`), un nombre de host con un prefijo de ruta (por
                ejemplo, `example.com/docs`) o un subdominio comodín (por
                ejemplo, `*.example.com`). Si se especifica, los resultados solo
                procederán de los dominios o rutas coincidentes. Usa este
                parámetro para filtrar por dominio o ruta en lugar de añadir un
                operador `site:` a la consulta.
              example:
                - arxiv.org
                - exa.ai/blog
            - type: "null"
        excludeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: Lista de dominios o rutas de dominio que se excluirán de los
                resultados de búsqueda. Cada entrada puede ser un nombre de host
                (por ejemplo, `example.com`), un nombre de host con un prefijo
                de ruta (por ejemplo, `example.com/docs`) o un subdominio
                comodín (por ejemplo, `*.example.com`). Si se especifica, no se
                devolverán resultados de los dominios o rutas coincidentes. Usa
                este parámetro para filtrar por dominio o ruta en lugar de
                añadir un operador `site:` a la consulta.
              example:
                - docs.python.org/3
            - type: "null"
        startCrawlDate:
          anyOf:
            - type: string
              description: Deprecado y sin efecto; la API lo ignora. Debe especificarse en
                formato ISO 8601.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        endCrawlDate:
          anyOf:
            - type: string
              description: Deprecado y sin efecto; la API lo ignora. Debe especificarse en
                formato ISO 8601.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        startPublishedDate:
          anyOf:
            - type: string
              description: Solo se devolverán enlaces con una fecha de publicación posterior a
                esta. Debe especificarse en formato ISO 8601.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
            - type: "null"
        endPublishedDate:
          anyOf:
            - type: string
              description: Solo se devolverán enlaces con una fecha de publicación anterior a
                esta. Debe especificarse en formato ISO 8601.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
            - type: "null"
        numResults:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 100
              description: Número de resultados que se devolverán. Los límites varían según el
                tipo de búsqueda. El límite público máximo es de 100 resultados.
                Ponte en contacto con ventas (hello@exa.ai) para consultar
                límites superiores.
              example: 10
              default: 10
            - type: "null"
        context:
          anyOf:
            - description: "Deprecado: usa highlights o texto en su lugar. Devuelve el
                contenido de la página como una única cadena de contexto."
              deprecated: true
              oneOf:
                - type: boolean
                  description: "Deprecado: usa highlights o texto en su lugar. Devuelve el
                    contenido de la página como una única cadena de contexto."
                  example: true
                  deprecated: true
                - type: object
                  properties:
                    maxCharacters:
                      type: integer
                      minimum: 1
                      maximum: 10000
                      description: Deprecado. Límite máximo de caracteres de la cadena de contexto. El
                        valor máximo admitido es 10000.
                      example: 10000
                  description: "Deprecado: usa highlights o texto en su lugar. Devuelve el
                    contenido de la página como una única cadena de contexto."
                  deprecated: true
            - type: "null"
        moderation:
          anyOf:
            - type: boolean
              description: Habilita la moderación de contenido para filtrar contenido no
                seguro de los resultados de búsqueda.
              example: true
              default: false
            - type: "null"
        contents:
          anyOf:
            - description: Opciones de contenido para texto, highlights, resumen, extras y
                controles de frescura.
              $ref: "#/components/schemas/ContentsOptions"
            - type: "null"
        query:
          type: string
          minLength: 1
          description: La cadena de consulta de la búsqueda.
          example: Latest developments in LLM capabilities
        additionalQueries:
          anyOf:
            - minItems: 1
              maxItems: 10
              type: array
              items:
                type: string
              description: Variaciones de consulta adicionales para variantes de búsqueda
                deep. Solo funciona con un tipo de búsqueda deep. Cuando se
                proporcionan, estas consultas se usan junto con la consulta
                principal para obtener resultados más amplios.
              example:
                - LLM advancements
                - large language model progress
            - type: "null"
        type:
          anyOf:
            - type: string
              enum:
                - instant
                - fast
                - auto
                - deep-lite
                - deep
                - deep-reasoning
              description: El modo de búsqueda que se usará. `auto` (predeterminado) es un
                modo equilibrado que optimiza la calidad y la velocidad, y se
                recomienda para la mayoría de las aplicaciones. `fast` devuelve
                resultados de alta calidad con menor latencia, por lo que es
                adecuado para búsquedas de cara al usuario y flujos de trabajo
                interactivos. `instant` está optimizado para minimizar el tiempo
                de respuesta y sacrifica cierta profundidad de búsqueda en favor
                de la velocidad en experiencias en tiempo real, como el chat,
                los agentes de voz y el autocompletado. `deep-lite` realiza una
                investigación ligera con resultados sintetizados y una latencia
                constante de 4 segundos, inferior a la de la búsqueda deep
                completa. `deep` realiza una investigación exhaustiva de varios
                pasos con síntesis, mientras que `deep-reasoning` añade un
                razonamiento más sólido para tareas complejas de análisis y toma
                de decisiones.
              example: auto
              default: auto
            - type: "null"
        category:
          anyOf:
            - type: string
              enum:
                - company
                - publication
                - news
                - personal site
                - financial report
                - people
              description: "Una categoría de datos en la que centrarse. Las categorías
                conocidas incluyen `company`, `publication`, `news`, `personal
                site`, `financial report` y `people`. Se aceptan otras cadenas y
                se usan como indicaciones de categoría para la búsqueda. Las
                categorías `people` y `company` ofrecen mejor calidad para
                encontrar perfiles de personas y páginas de empresas. La
                categoría `publication` muestra publicaciones académicas, como
                artículos de investigación, preprints y artículos de revistas,
                con metadatos estructurados como autores, medio de publicación y
                citas. Nota: Las categorías `company` y `people` solo admiten un
                conjunto limitado de filtros. Los siguientes parámetros NO son
                compatibles con estas categorías: `startPublishedDate`,
                `endPublishedDate`, `excludeDomains`. El uso de parámetros no
                compatibles generará un error 400."
              example: publication
            - type: "null"
        userLocation:
          anyOf:
            - type: string
              description: El código ISO de país de dos letras del usuario, por ejemplo, US.
              example: US
            - type: "null"
        compliance:
          anyOf:
            - type: string
              enum:
                - hipaa
              description: Modo de cumplimiento normativo exclusivo de Enterprise.
                Establézcalo en `hipaa` para el modo HIPAA. Requiere
                recuperación solo desde caché con parámetros compatibles.
                Consulte la documentación de HIPAA para obtener más información.
              example: hipaa
            - type: "null"
        outputSchema:
          anyOf:
            - oneOf:
                - $ref: "#/components/schemas/OutputSchemaText"
                - $ref: "#/components/schemas/OutputSchemaObject"
              description: Esquema JSON para el output sintetizado. Los tipos raíz compatibles
                son "text" y "object". Cuando se proporciona, la respuesta
                incluye un objeto output cuyo contenido coincide con este
                esquema. Funciona con todos los tipos de búsqueda y añade
                aproximadamente 2 segundos de latencia de síntesis al tipo de
                búsqueda seleccionado.
              type: object
              discriminator:
                propertyName: type
                mapping:
                  text: "#/components/schemas/OutputSchemaText"
                  object: "#/components/schemas/OutputSchemaObject"
            - type: "null"
        systemPrompt:
          anyOf:
            - type: string
              description: Instrucciones adicionales que guían el output generado o el
                comportamiento del agente. Úselo para indicar preferencias de
                fuentes, restricciones de novedad o duplicación, u otras pautas
                de comportamiento.
              example: Prefer official sources and avoid duplicate results.
            - type: "null"
        stream:
          anyOf:
            - type: boolean
              description: Solicita eventos enviados por el servidor para el streaming del
                output sintetizado. Actualmente, el streaming solo se usa cuando
                se proporciona outputSchema; de lo contrario, el endpoint
                devuelve la respuesta JSON de búsqueda normal.
              default: false
            - type: "null"
      required:
        - query
