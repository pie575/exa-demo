            - type: "null"
          description: Por qué se detuvo el run. `null` mientras el run está en cola o en
            ejecución.
        createdAt:
          type: string
          format: date-time
          description: Cuándo se creó el run
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          format: date-time
        request:
          anyOf:
            - $ref: "#/components/schemas/AgentRunRequest"
            - type: "null"
        output:
          $ref: "#/components/schemas/AgentRunOutput"
        usage:
          $ref: "#/components/schemas/AgentUsage"
        costDollars:
          $ref: "#/components/schemas/AgentCostDollars"
      required:
        - id
        - object
        - status
        - stopReason
        - createdAt
        - completedAt
        - request
        - output
        - usage
        - costDollars
      additionalProperties: false
    AgentRunStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
        - cancelled
    AgentStopReason:
      type: string
      enum:
        - schema_satisfied
        - budget_reached
        - stopped
        - error
        - cancelled
    AgentRunRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: Pregunta o instrucciones en lenguaje natural para la solicitud.
          example: What are the most important AI infrastructure funding rounds announced
            this week?
        systemPrompt:
          type: string
          description: Instrucciones adicionales que guían el output generado o el
            comportamiento del agente. Úselas para preferencias de origen,
            restricciones de novedad, restricciones de duplicación u otras
            indicaciones de comportamiento.
          example: Prefer official sources and avoid duplicate results.
        effort:
          $ref: "#/components/schemas/AgentEffort"
        input:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Un registro de objeto JSON.
              description: Registros que el agente debe procesar o enriquecer.
            exclusion:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: Un registro de objeto JSON.
              description: Registros o entidades que el agente debe evitar devolver.
          additionalProperties: false
        outputSchema:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: Esquema JSON para salida estructurada validada en
                `output.structured`. Los campos que no sean compatibles con la
                evidencia pueden devolverse como `null`. Admite los borradores
                07, 2019-09 y 2020-12 mediante `$schema`.
            - type: "null"
        previousRunId:
          $ref: "#/components/schemas/AgentRunId"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Metadatos de clave-valor proporcionados por quien realiza la
            llamada para su propio seguimiento.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        dataSources:
          type: array
          items:
            $ref: "#/components/schemas/AgentDataSourceOutput"
          description: Proveedores de datos de Exa Connect configurados para el run.
        budget:
          $ref: "#/components/schemas/AgentBudgetOutput"
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
      description: Campos de solicitud canonicalizados almacenados con el run.
    AgentRunOutput:
      type: object
      properties:
        text:
          type: string
          description: Respuesta o resumen en lenguaje natural.
        structured:
          anyOf:
            - $ref: "#/components/schemas/JsonValue"
            - type: "null"
          description: JSON definido por `outputSchema`; los campos sin respaldo en la
            evidencia pueden ser `null`. `null` si no se proporcionó ningún
            esquema.
        grounding:
          type: array
          items:
            $ref: "#/components/schemas/AgentGrounding"
          description: Citas a nivel de campo emitidas por el run.
      required:
        - text
        - structured
        - grounding
      additionalProperties: false
    AgentGrounding:
      type: object
      properties:
        field:
          type: string
          description: Campo de output respaldado por las citas.
          example: structured.companies[0].sourceUrl
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AgentCitation"
        confidence:
          anyOf:
            - type: string
              enum:
                - low
                - medium
                - high
              description: Fiabilidad indicada por el modelo para este campo.
            - type: "null"
      required:
        - field
        - citations
      additionalProperties: false
    AgentCitation:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL de origen.
        title:
          type: string
          description: Título de origen.
      required:
        - url
      additionalProperties: false
    AgentUsage:
      type: object
      properties:
        agentComputeUnits:
          type: number
          minimum: 0
        searches:
          type: integer
          minimum: 0
        emails:
          type: integer
          minimum: 0
        phoneNumbers:
          type: integer
          minimum: 0
        dataSources:
          $ref: "#/components/schemas/AgentDataSourceUsage"
      required:
        - agentComputeUnits
        - searches
        - emails
        - phoneNumbers
      additionalProperties: false
    AgentDataSourceUsage:
      type: object
      propertyNames:
        type: string
      additionalProperties:
        type: integer
        minimum: 0
      description: Número de llamadas a herramientas por proveedor para las fuentes de
        datos de Exa Connect utilizadas durante el run. Las claves son nombres
        de proveedores (p. ej., `fiber`, `similarweb`). Solo se incluyen
        proveedores con uso distinto de cero.
    AgentCostDollars:
      type: object
      properties:
        total:
          type: number
          minimum: 0
        agentCompute:
          type: number
          minimum: 0
        search:
          type: number
          minimum: 0
        emails:
          type: number
          minimum: 0
        phoneNumbers:
          type: number
          minimum: 0
        dataSources:
          $ref: "#/components/schemas/AgentDataSourceCost"
      required:
        - total
        - agentCompute
        - search
        - emails
        - phoneNumbers
      additionalProperties: false
    AgentDataSourceCost:
      type: object
      propertyNames:
        type: string
      additionalProperties:
        type: number
        minimum: 0
      description: Costo en dólares por proveedor para las fuentes de datos de Exa
        Connect utilizadas durante el run. Las claves son nombres de proveedores
        (p. ej., `fiber`, `similarweb`). Solo se incluyen proveedores con uso
        distinto de cero.
    AgentErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/AgentError"
      required:
        - error
      additionalProperties: false
    AgentError:
      type: object
      properties:
        type:
          type: string
          enum:
            - INVALID_REQUEST
            - AUTHENTICATION_ERROR
            - RATE_LIMIT_ERROR
            - NOT_FOUND
            - SERVER_ERROR
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - TEAM_NOT_FOUND
            - RUN_NOT_FOUND
            - PREVIOUS_RUN_NOT_FOUND
            - PREVIOUS_RUN_NOT_COMPLETED
            - CONCURRENCY_LIMIT_REACHED
            - INVALID_OUTPUT_SCHEMA
            - INVALID_DATA_SOURCE
            - TIMEOUT
            - SERVER_ERROR
        message:
          type: string
      required:
        - type
        - code
        - message
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    AgentRunList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
        hasMore:
          type: boolean
          description: Si hay más resultados
        nextCursor:
          anyOf:
            - $ref: "#/components/schemas/AgentRunId"
            - type: "null"
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    DeleteAgentRunResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/AgentRunId"
        object:
          type: string
          const: agent_run.deleted
        deleted:
          type: boolean
          const: true
      required:
        - id
        - object
        - deleted
      additionalProperties: false
    AgentRunEventList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentRunEvent"
        hasMore:
          type: boolean
          description: Si hay más resultados
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    Batch:
      type: object
      properties:
        id:
          type: string
          description: ID del batch. Los nuevos ID de batch se devuelven con el prefijo
            `batch_`.
          example: batch_01j7x9v0m2n4p6q8r0s2t4v6w8
        object:
          type: string
          const: batch
          description: El tipo de objeto, siempre `batch`.
        status:
          $ref: "#/components/schemas/BatchStatus"
        requestCounts:
          $ref: "#/components/schemas/BatchRequestCounts"
        createdAt:
          type: string
          format: date-time
          description: Cuándo se creó el batch.
        expiresAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Cuándo expira el batch o `null` si no expira.
          format: date-time
        endedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: Cuándo el batch alcanzó un estado terminal o `null` mientras aún
            está en ejecución.
          format: date-time
        resultsUrl:
          anyOf:
            - type: string
            - type: "null"
          description: URL de descarga prefirmada de corta duración para el archivo de
            resultados del batch (JSONL), o `null` hasta que se complete el
            batch. Es un enlace de descarga directa del almacén de objetos, no
            una ruta de API; obténgalo tal cual y vuelva a recuperar el batch
            para generar una URL nueva cuando expire.
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Metadatos de clave-valor proporcionados por el llamador para su
            propio seguimiento.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
      required:
        - id
        - object
        - status
        - requestCounts
        - createdAt
        - expiresAt
        - endedAt
        - resultsUrl
        - metadata
      additionalProperties: false
    BatchStatus:
      type: string
      enum:
        - in_progress
        - completed
        - cancelling
        - cancelled
        - expired
      description: Estado del ciclo de vida del batch.
    BatchRequestCounts:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
          description: Total de solicitudes en el batch.
        completed:
          type: integer
          minimum: 0
          description: Solicitudes completadas correctamente.
        failed:
          type: integer
          minimum: 0
          description: Solicitudes que fallaron.
      required:
        - total
        - completed
        - failed
      additionalProperties: false
    BatchList:
      type: object
      properties:
        object:
          type: string
          const: list
          description: El tipo de objeto, siempre `list`.
        data:
          type: array
          items:
            $ref: "#/components/schemas/Batch"
          description: La página de batches, del más reciente al más antiguo.
        hasMore:
          type: boolean
          description: Si hay más resultados
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
          description: Cursor para la página siguiente
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    DeletedBatch:
      type: object
      properties:
        id:
          type: string
          description: ID del batch eliminado.
        object:
          type: string
          const: batch.deleted
          description: El tipo de objeto, siempre `batch.deleted`.
        deleted:
          type: boolean
          const: true
          description: Siempre `true` si la eliminación se realizó correctamente.
      required:
        - id
        - object
        - deleted
      additionalProperties: false
    WebsetsTeamInfo:
      type: object
      properties:
        object:
          type: string
          const: team
          description: El tipo de objeto, siempre `"team"`.
        id:
          type: string
          description: Identificador único del equipo.
        name:
          type: string
          description: Nombre del equipo.
        concurrency:
          type: object
          properties:
            active:
              type: integer
              description: Número de solicitudes que se están procesando actualmente.
            queued:
              type: integer
              description: Número de solicitudes actualmente en cola.
          required:
            - active
            - queued
          additionalProperties: false
          description: Uso actual de concurrencia.
        limits:
          type: object
          properties:
            maxConcurrent:
              anyOf:
                - type: integer
                - type: "null"
              description: Número máximo de solicitudes simultáneas permitidas. `null` indica
                que no hay límite.
            maxQueued:
              anyOf:
                - type: integer
                - type: "null"
              description: Número máximo de solicitudes en cola permitidas. `null` indica que
                no hay límite.
          required:
            - maxConcurrent
            - maxQueued
          additionalProperties: false
          description: Límites de concurrencia del equipo.
      required:
        - object
        - id
        - name
        - concurrency
        - limits
      additionalProperties: false
    AnswerStreamChunk:
      description: "Esquema para cada payload JSON emitido en un flujo de eventos
        enviados por el servidor de `/answer`. Cada evento se emite como `data:
        <json>`."
      oneOf:
        - $ref: "#/components/schemas/AnswerStreamTextDeltaChunk"
        - $ref: "#/components/schemas/AnswerStreamCitationsChunkOutput"
        - $ref: "#/components/schemas/AnswerStreamCostChunkOutput"
        - $ref: "#/components/schemas/AnswerStreamErrorChunkOutput"
    SearchStreamChunk:
      oneOf:
        - $ref: "#/components/schemas/SearchStreamTextDeltaChunkOutput"
        - $ref: "#/components/schemas/SearchStreamGroundingChunkOutput"
        - $ref: "#/components/schemas/SearchStreamResultsChunkOutput"
        - $ref: "#/components/schemas/SearchStreamResetChunkOutput"
        - $ref: "#/components/schemas/SearchStreamDoneChunkOutput"
        - $ref: "#/components/schemas/SearchStreamErrorChunkOutput"
      description: "Esquema para cada payload JSON emitido en un flujo de eventos
        enviados por el servidor de `/search`. Cada evento se emite como `data:
        <json>` y el flujo termina con `data: [DONE]`, que no está representado
        en este esquema JSON."
      type: object
      discriminator:
        propertyName: type
        mapping:
          text-delta: "#/components/schemas/SearchStreamTextDeltaChunkOutput"
          grounding: "#/components/schemas/SearchStreamGroundingChunkOutput"
          results: "#/components/schemas/SearchStreamResultsChunkOutput"
          stream-reset: "#/components/schemas/SearchStreamResetChunkOutput"
          done: "#/components/schemas/SearchStreamDoneChunkOutput"
          error: "#/components/schemas/SearchStreamErrorChunkOutput"
    AgentRunEvent:
      type: object
      properties:
        id:
          type: string
          description: ID del evento dentro del run.
        event:
          type: string
          enum:
            - agent_run.created
            - agent_run.started
            - agent_run.completed
            - agent_run.failed
            - agent_run.cancelled
        data:
          $ref: "#/components/schemas/JsonValue"
        createdAt:
          type: string
          format: date-time
          description: Cuándo se creó el evento
      required:
        - id
        - event
        - data
        - createdAt
      additionalProperties: false
    SearchResultOutput:
      type: object
      properties:
        title:
          type: string
          description: El título del resultado de búsqueda.
          example: A Comprehensive Overview of Large Language Models
        url:
          type: string
          description: La URL del resultado de búsqueda.
          example: https://arxiv.org/pdf/2307.06435.pdf
          format: uri
        publishedDate:
          description: Una estimación de la fecha de creación obtenida al analizar el
            contenido HTML. El formato es AAAA-MM-DD.
          example: 2023-11-16T01:36:32.547Z
          format: date-time
          type: string
        author:
          description: El autor del contenido, si está disponible.
          example: Humza Naveed
          anyOf:
            - type: string
            - type: "null"
        id:
          description: El ID temporal del documento. Útil para el endpoint /contents.
          example: https://arxiv.org/abs/2307.06435
          type: string
        image:
          description: La URL de una imagen asociada con el resultado de búsqueda, si está
            disponible.
          example: https://arxiv.org/pdf/2307.06435.pdf/page_1.png
          format: uri
          type: string
        favicon:
          description: La URL del favicon del dominio del resultado de búsqueda.
          example: https://arxiv.org/favicon.ico
          format: uri
          type: string
        text:
          description: El texto completo del contenido del resultado de búsqueda.
          example: Abstract Large Language Models (LLMs) have recently demonstrated
            remarkable capabilities...
          type: string
        highlights:
          description: Arreglo de destacados extraídos del contenido del resultado de
            búsqueda.
          example:
            - Such requirements have limited their adoption...
          type: array
          items:
            type: string
        highlightScores:
          description: Arreglo de puntuaciones de similitud del coseno para cada fragmento
            destacado.
          example:
            - 0.4600165784358978
          type: array
          items:
            type: number
            format: float
        summary:
          description: Resumen de la página web.
          example: This overview paper on Large Language Models (LLMs) highlights key
            developments...
          type: string
        subpages:
          description: Arreglo de subpáginas del resultado de búsqueda.
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                description: El título del resultado de búsqueda.
                example: A Comprehensive Overview of Large Language Models
              url:
                type: string
                description: La URL del resultado de búsqueda.
                example: https://arxiv.org/pdf/2307.06435.pdf
                format: uri
              publishedDate:
                description: Una estimación de la fecha de creación obtenida al analizar el
                  contenido HTML. El formato es AAAA-MM-DD.
                example: 2023-11-16T01:36:32.547Z
                format: date-time
                type: string
              author:
                description: El autor del contenido, si está disponible.
                example: Humza Naveed
                anyOf:
                  - type: string
                  - type: "null"
              id:
                description: El ID temporal del documento. Útil para el endpoint /contents.
                example: https://arxiv.org/abs/2307.06435
                type: string
              image:
                description: La URL de una imagen asociada con el resultado de búsqueda, si está
                  disponible.
                example: https://arxiv.org/pdf/2307.06435.pdf/page_1.png
                format: uri
                type: string
              favicon:
                description: La URL del favicon del dominio del resultado de búsqueda.
                example: https://arxiv.org/favicon.ico
                format: uri
                type: string
            required:
              - title
              - url
            additionalProperties: false
        entities:
          description: Datos de entidad estructurados para resultados de búsqueda de
            empresas, personas o publicaciones. Se devuelven para categorías
            compatibles respaldadas por entidades.
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/SearchCompanyEntityOutput"
              - $ref: "#/components/schemas/SearchPersonEntityOutput"
              - $ref: "#/components/schemas/SearchPublicationEntityOutput"
            type: object
            discriminator:
              propertyName: type
              mapping:
                company: "#/components/schemas/SearchCompanyEntityOutput"
                person: "#/components/schemas/SearchPersonEntityOutput"
                publication: "#/components/schemas/SearchPublicationEntityOutput"
        extras:
          description: Resultados de extras. Cada campo se devuelve solo si se solicita
            mediante contents.extras.
          example:
            links: []
          type: object
          properties:
            links:
              description: Arreglo de enlaces del resultado de búsqueda.
              example: []
              type: array
              items:
                type: string
            imageLinks:
              description: Arreglo de URL de imágenes del resultado de búsqueda.
              example: []
              type: array
              items:
                type: string
            richImageLinks:
              description: Arreglo de imágenes con su texto alternativo, en el orden en que
                aparecen en la página.
              example:
                - url: https://exa.ai/images/illustrations/api_illustration4.webp
                  alt: High rate limits, low latency and high reliability.
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: La URL de la imagen.
                  alt:
                    description: El texto alternativo de la imagen, cuando la página lo proporciona.
                    type: string
                required:
                  - url
                additionalProperties: false
            richLinks:
              description: Arreglo de enlaces con su texto de anclaje, en el orden en que
                aparecen en la página.
              example:
                - url: https://dashboard.exa.ai
                  anchor: API Dashboard
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: La URL del enlace.
                  anchor:
                    description: El texto de anclaje del enlace, cuando la página lo proporciona.
                    type: string
                required:
                  - url
                additionalProperties: false
            codeBlocks:
              description: Arreglo de bloques de código del resultado de búsqueda.
              example:
                - text: pip install exa-py
                  source: bash
              type: array
              items:
                type: object
                properties:
                  text:
                    type: string
                    description: El contenido del bloque de código.
                  source:
                    type: string
                    description: El lenguaje con el que está anotado el bloque de código, si lo hay.
                required:
                  - text
                  - source
                additionalProperties: false
          additionalProperties: false
      required:
        - title
        - url
      additionalProperties: false
    SearchCompanyEntityOutput:
      type: object
      properties:
        id:
          type: string
          description: Identificador estable de la entidad de empresa.
        type:
          type: string
          const: company
          description: Discriminador de entidad.
        version:
          type: integer
          minimum: 1
          description: Versión del esquema de entidad.
        properties:
          type: object
          properties:
            name:
              anyOf:
                - type: string
                - type: "null"
              description: Nombre de la empresa.
            foundedYear:
              anyOf:
                - type: integer
                - type: "null"
              description: Año de fundación de la empresa.
            description:
              anyOf:
                - type: string
                - type: "null"
              description: Descripción breve de la empresa.
            workforce:
              anyOf:
                - type: object
                  properties:
                    total:
                      anyOf:
                        - type: number
                        - type: "null"
                      description: Número total estimado de empleados.
                  required:
                    - total
                  additionalProperties: false
                - type: "null"
              description: Información sobre la plantilla de la empresa.
            headquarters:
              anyOf:
                - type: object
                  properties:
                    address:
                      anyOf:
                        - type: string
                        - type: "null"
                      description: Dirección de la sede de la empresa.
                    city:
                      anyOf:
                        - type: string
                        - type: "null"
                      description: Ciudad de la sede de la empresa.
                    postalCode:
                      anyOf:
                        - type: string
                        - type: "null"
                      description: Código postal de la sede de la empresa.
                    country:
                      anyOf:
                        - type: string
                        - type: "null"
                      description: País de la sede de la empresa.
                  required:
                    - address
                    - city
                    - postalCode
                    - country
                  additionalProperties: false
                - type: "null"
              description: Información sobre la sede de la empresa.
            financials:
              anyOf:
                - type: object
                  properties:
                    revenueAnnual:
                      anyOf:
                        - type: number
                        - type: "null"
                      description: Ingresos anuales estimados en USD.
                    fundingTotal:
                      anyOf:
                        - type: number
                        - type: "null"
                      description: Financiación total recaudada en USD.
                    fundingLatestRound:
                      anyOf:
                        - type: object
                          properties:
