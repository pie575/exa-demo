          format: float
          type: number
        search:
          description: Desglose estimado del costo de búsqueda según el endpoint y el modo
            de recuperación. Las respuestas de búsqueda instant, fast y auto
            pueden incluir el costo de search neuronal. Los modos de deep search
            podrían reflejarse solo en el total.
