                            presupuestos exactos, que pueden cambiar. No es
                            compatible con maxCharacters ni numSentences. Beta:
                            requiere el encabezado de solicitud `Exa-Beta:
                            dynamic-highlights-2026-08-28`; se rechazan las
                            solicitudes que establecen `verbosity` sin él."
                          example: medium
                          x-exa-lifecycle: beta
                          x-exa-beta-flag: dynamic-highlights-2026-08-28
                          x-mint:
                            post:
                              - Beta
                        - type: "null"
                    dynamic:
                      anyOf:
                        - type: boolean
                          description: "Habilite Dynamic Highlights (vista previa de investigación):
                            considera todos los resultados en conjunto y asigna
                            un único presupuesto de contexto compartido para
