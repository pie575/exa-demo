            Consulta de búsqueda en lenguaje natural que describe lo que buscas.


            Sé específico y descriptivo sobre tus requisitos, características y
            cualquier restricción que ayude a acotar los resultados.


            Todas las URL proporcionadas se rastrearán y usarán como contexto
