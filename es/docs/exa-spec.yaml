              description: Costo de las operaciones de búsqueda por palabras clave.
              example: 0.0025
              format: float
              type: number
          additionalProperties: false
        summary:
          description: Costo de generar resúmenes sintetizados para solicitudes de búsqueda.
          example: 0.005
          format: float
          type: number
        contents:
          description: Desglose estimado del costo de la recuperación de contenido
            independiente (el texto, los highlights y los resúmenes se facturan
            fuera del precio de búsqueda incluido).
          type: object
          properties:
            text:
              description: Costo de extracción de texto.
              example: 0.001
              format: float
              type: number
            highlights:
              description: Costo de extracción de highlights.
              example: 0.001
              format: float
              type: number
            summary:
              description: Costo de generar resúmenes por resultado.
              example: 0.001
              format: float
              type: number
          additionalProperties: false
      additionalProperties: false
      description: Desglose estimado del costo en dólares de la solicitud completada,
        según el endpoint. La facturación se calcula a partir de contadores de
        uso, no de este objeto de respuesta.
