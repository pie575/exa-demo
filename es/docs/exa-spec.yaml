            type: object
            properties:
              title:
                type: string
                description: El título del resultado de búsqueda.
                example: SpaceX valued at $350bn as company agrees to buy shares from ...
              url:
                type: string
                description: La URL del resultado de búsqueda.
                example: https://www.theguardian.com/science/2024/dec/11/spacex-valued-at-350bn-as-company-agrees-to-buy-shares-from-employees
                format: uri
              publishedDate:
                description: Estimación de la fecha de creación obtenida al analizar el
                  contenido HTML. El formato es YYYY-MM-DD.
                example: 2023-11-16T01:36:32.547Z
                format: date-time
                type: string
              author:
                description: El autor del contenido, si está disponible.
                example: Humza Naveed
                anyOf:
                  - type: string
                  - type: "null"
              id:
                description: ID temporal del documento. Útil para el endpoint /contents.
                example: https://arxiv.org/abs/2307.06435
                type: string
              image:
                description: La URL de una imagen asociada al resultado de búsqueda, si está
                  disponible.
                example: https://arxiv.org/pdf/2307.06435.pdf/page_1.png
                format: uri
                type: string
              favicon:
                description: La URL del favicon del dominio del resultado de búsqueda.
                example: https://arxiv.org/favicon.ico
                format: uri
                type: string
              text:
                description: El contenido de texto completo de cada fuente. Solo se incluye
                  cuando se solicita contenido de texto.
                example: SpaceX valued at $350bn as company agrees to buy shares from ...
                type: string
            required:
              - title
              - url
            additionalProperties: false
          description: Resultados de búsqueda citados por la respuesta final transmitida
            en streaming.
      required:
        - citations
      additionalProperties: false
    AnswerStreamCostChunkOutput:
      type: object
      properties:
        costDollars:
          $ref: "#/components/schemas/CostDollarsOutput"
        requestId:
          type: string
          description: Identificador único de la solicitud.
          example: b5947044c4b78efa9552a7c89b306d95
      required:
        - costDollars
      additionalProperties: false
    AnswerStreamErrorChunkOutput:
      type: object
      properties:
        tag:
          type: string
          const: ERROR
        payload:
          type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            requestId:
              type: string
              description: Identificador único de la solicitud.
              example: b5947044c4b78efa9552a7c89b306d95
          required:
            - error
          additionalProperties: false
      required:
        - tag
        - payload
      additionalProperties: false
    SearchMonitorSearchOutput:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: La cadena de consulta de la búsqueda.
          example: Latest developments in LLM capabilities
        numResults:
          type: integer
          minimum: 1
          maximum: 100
          description: Número de resultados que se devolverán. Los límites varían según el
            tipo de búsqueda. El límite público máximo es de 100 resultados.
            Contacta con ventas (hello@exa.ai) para consultar límites
            superiores.
          example: 10
          default: 10
        includeDomains:
          description: Restringe los resultados de búsqueda a estos dominios.
          type: array
          items:
            type: string
        excludeDomains:
          description: Excluye estos dominios de los resultados de búsqueda.
          type: array
          items:
            type: string
        contents:
          $ref: "#/components/schemas/SearchMonitorContentsOutput"
      required:
        - query
      additionalProperties: false
    SearchMonitorContentsOutput:
      type: object
      properties:
        text:
          description: Opciones de extracción de texto para cada resultado.
          oneOf:
            - type: boolean
              title: Simple text retrieval
              description: Si es true, devuelve el texto completo de la página con la
                configuración predeterminada. Si es false, desactiva la
                devolución de texto.
              default: false
            - type: object
              properties:
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: Límite máximo de caracteres para el texto completo de la página.
                        Útil para controlar el tamaño de la respuesta y los
                        costos de la API. El valor máximo admitido es 10000.
                      example: 1000
                    - type: "null"
                includeHtmlTags:
                  anyOf:
                    - type: boolean
                      description: "Si es true, incluye etiquetas HTML ligeras en el texto devuelto en
                        lugar de texto sin formato estilo Markdown. Usa
                        maxAgeHours: 0 cuando necesites aplicarlo al contenido
                        recién obtenido."
                      example: false
                      default: false
                    - type: "null"
                verbosity:
                  anyOf:
                    - type: string
                      enum:
                        - compact
                        - standard
                        - full
                      description: "Controla el nivel de detalle del renderizado de texto. compact se
                        centra en el contenido principal, standard incluye más
                        contexto de la página circundante y full solicita el
                        texto renderizado más completo. Algunas páginas pueden
                        producir una salida idéntica con standard y full. Usa
                        maxAgeHours: 0 cuando necesites aplicarlo al contenido
                        recién obtenido."
                      example: standard
                      default: compact
                    - type: "null"
                includeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "Mejor esfuerzo. Incluye solo contenido clasificado en estas
                        secciones semánticas de la página. La clasificación de
                        secciones puede no estar disponible o ser incompleta
                        para algunas páginas; valida el output si necesitas un
                        filtrado estricto. Usa maxAgeHours: 0 cuando necesites
                        aplicarlo al contenido recién obtenido."
                      example:
                        - body
                        - header
                    - type: "null"
                excludeSections:
                  anyOf:
                    - type: array
                      items:
                        type: string
                        enum:
                          - header
                          - navigation
                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "Excluye contenido clasificado en estas secciones semánticas de la
                        página. La clasificación de secciones se realiza según
                        el mejor esfuerzo. Usa maxAgeHours: 0 cuando necesites
                        aplicarlo al contenido recién obtenido."
                      example:
                        - navigation
                        - footer
                        - sidebar
                    - type: "null"
              additionalProperties: false
              title: Advanced text options
              description: Opciones avanzadas para controlar la extracción de texto. Úsalas
                cuando necesites limitar la longitud del texto o incluir
                estructura HTML.
        highlights:
          description: Fragmentos de texto que el LLM identifica como los más relevantes
            de cada página.
          oneOf:
            - type: boolean
              title: Simple highlights retrieval
              description: Si es true, devuelve highlights con la configuración
                predeterminada. Si es false, desactiva los highlights.
              default: false
            - type: object
              properties:
                query:
                  anyOf:
                    - type: string
                      description: Consulta personalizada que orienta los highlights que selecciona el
                        LLM.
                      example: Key advancements
                    - type: "null"
                verbosity:
                  anyOf:
                    - type: string
                      enum:
                        - low
                        - medium
                        - high
                      description: "Longitud preestablecida de highlights: `low`, `medium` y `high`
                        asignan presupuestos de tokens progresivamente mayores a
                        los highlights devueltos. Con highlights.dynamic, el
                        valor preestablecido establece un único presupuesto
                        compartido para todo el conjunto de resultados en lugar
                        de uno por URL. Exa ajusta los presupuestos exactos y
                        pueden cambiar. No es compatible con maxCharacters ni
                        numSentences. Beta: requiere el encabezado de solicitud
                        `Exa-Beta: dynamic-highlights-2026-08-28`; se rechazan
                        las solicitudes que establecen `verbosity` sin él."
                      example: medium
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                dynamic:
                  anyOf:
                    - type: boolean
                      description: "Habilita Dynamic Highlights (vista previa de investigación):
                        considera todos los resultados en conjunto y asigna un
                        único presupuesto de contexto compartido para el
                        conjunto de resultados en lugar de uno por documento. No
                        es compatible con maxCharacters. Beta: requiere el
                        encabezado de solicitud `Exa-Beta:
                        dynamic-highlights-2026-08-28`; se rechazan las
                        solicitudes que establecen `dynamic` sin él."
                      example: true
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: Número máximo de caracteres que se devolverán para los highlights.
                        Controla la longitud total del texto de highlights
                        devuelto por URL. El valor máximo admitido es 10000. No
                        es compatible con highlights.dynamic.
                      example: 2000
                    - type: "null"
                numSentences:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "Deprecado y se eliminará en una versión futura. Actualmente se
                        asigna a un presupuesto de caracteres de aproximadamente
                        1333 caracteres por oración. Pasa highlights: true para
                        los highlights predeterminados o { query } para orientar
                        la selección con tu propia consulta."
                      example: 1
                      deprecated: true
                    - type: "null"
                highlightsPerUrl:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "Deprecado y se eliminará en una versión futura. Actualmente se
                        ignora. Pasa highlights: true para los highlights
                        predeterminados o { query } para orientar la selección
                        con tu propia consulta."
                      example: 1
                      deprecated: true
                    - type: "null"
              additionalProperties: false
              title: Advanced highlights options
              description: "Opciones avanzadas para orientar la extracción de highlights. Pasa
                highlights: true para obtener la configuración predeterminada de
                mayor calidad; proporciona este objeto solo cuando necesites
                orientar la selección con tu propia consulta."
        summary:
          description: Devuelve un resumen generado por un LLM. Pasa `true` para usar los
            valores predeterminados o un objeto con `query` y `maxTokens`.
          oneOf:
            - type: boolean
            - $ref: "#/components/schemas/SummaryWithMaxTokensOptionsOutput"
        extras:
          type: object
          properties:
            links:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Número de URL que se devolverán de cada página web.
                  example: 1
                  default: 0
                - type: "null"
            imageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Número de imágenes que se devolverán para cada resultado.
                  example: 1
                  default: 0
                - type: "null"
            richImageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Número de enlaces enriquecidos a imágenes que se devolverán para
                    cada resultado.
                  default: 0
                - type: "null"
            richLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Número de enlaces enriquecidos que se devolverán para cada
                    resultado.
                  default: 0
                - type: "null"
            codeBlocks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Número de bloques de código que se devolverán para cada resultado.
                  default: 0
                - type: "null"
          additionalProperties: false
          description: Parámetros adicionales que se deben pasar.
        context:
          description: "Deprecado: usa highlights o texto en su lugar. Devuelve el
            contenido de la página como una cadena de contexto combinada."
          deprecated: true
          oneOf:
            - type: boolean
              description: "Deprecado: usa highlights o texto en su lugar. Devuelve el
                contenido de la página como una cadena de contexto combinada."
              example: true
              deprecated: true
            - type: object
              properties:
                maxCharacters:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: Deprecado. Límite máximo de caracteres para la cadena de contexto.
                    El valor máximo admitido es 10000.
                  example: 10000
              additionalProperties: false
              description: "Deprecado: usa highlights o texto en su lugar. Devuelve el
                contenido de la página como una cadena de contexto combinada."
              deprecated: true
        livecrawl:
          description: Estrategia de rastreo para obtener contenido de la página
          oneOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
            - type: string
              const: auto
        livecrawlTimeout:
          type: integer
          exclusiveMinimum: 0
          maximum: 90000
          description: El tiempo de espera para livecrawling en milisegundos.
          example: 1000
          default: 10000
        maxAgeHours:
          type: integer
          minimum: -1
          maximum: 720
          description: Antigüedad máxima del contenido en caché, en horas. Los valores
            positivos usan contenido en caché si tiene menos de esta cantidad de
            horas; 0 obtiene contenido nuevo y es la forma admitida de aplicar
            opciones de renderizado de texto a páginas recién obtenidas; -1
            siempre usa la caché; si se omite, usa una obtención alternativa
            cuando el contenido en caché no está disponible. El valor máximo
            admitido es 720 horas.
          example: 24
        filterEmptyResults:
          type: boolean
          description: Filtra los resultados sin contenido
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: Número de subpáginas que se rastrearán. El número real de
            subpáginas rastreadas puede estar limitado por restricciones del
            sistema.
          example: 1
          default: 0
        subpageTarget:
          description: Término para encontrar subpáginas específicas de los resultados de
            búsqueda. Puede ser una sola cadena o un arreglo de cadenas.
          example: sources
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
      additionalProperties: false
      description: Opciones de extracción de contenido aplicadas a cada resultado de
        búsqueda. Todos los campos son opcionales.
    SummaryWithMaxTokensOptionsOutput:
      type: object
      properties:
        query:
          anyOf:
            - type: string
              description: Consulta personalizada para el resumen generado por el LLM.
              example: Main developments
            - type: "null"
        maxTokens:
          type: integer
          minimum: 1
          description: Máximo de tokens para el resumen generado.
      additionalProperties: false
    SearchMonitorTriggerOutput:
      type: object
      properties:
        type:
          type: string
          const: interval
          description: El tipo de activador. Actualmente solo se admite `interval`.
          default: interval
        period:
          type: string
          description: Una cadena de duración que especifica la frecuencia con la que se
            ejecuta el monitor (por ejemplo, "1h", "6h", "1d", "7d"). Solo se
            admite una unidad. El intervalo mínimo es de 1 hora. La programación
            está anclada a la hora de creación del monitor (por ejemplo, un
            monitor diario creado a las 2:30 p. m. se ejecuta diariamente
            alrededor de las 2:30 p. m.).
          example: 6h
      required:
        - type
        - period
      additionalProperties: false
    SearchMonitorOutputSchemaOutput:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaTextOutput"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: Esquema JSON para el output sintetizado. Los tipos raíz compatibles
            son "text" y "object". Cuando se proporciona, la respuesta incluye
            un objeto output cuyo contenido coincide con este esquema. Funciona
            con todos los tipos de búsqueda y añade unos 2 segundos de latencia
            de síntesis al tipo de búsqueda seleccionado.
          type: object
          discriminator:
            propertyName: type
            mapping:
              text: "#/components/schemas/OutputSchemaTextOutput"
              object: "#/components/schemas/OutputSchemaObject"
        - type: "null"
      description: 'Controla el formato del output del run. De forma predeterminada,
        es `{ "type": "text" }` si no se especifica. Cuando `type` es `"text"`,
        el output es un resumen de texto sin formato. Cuando `type` es
        `"object"`, el output es JSON estructurado. Si no se especifican
        `properties` con el tipo `"object"`, se infiere automáticamente un
        esquema; de lo contrario, el output se ajusta al esquema proporcionado.'
    OutputSchemaTextOutput:
      type: object
      properties:
        type:
          type: string
          const: text
        description:
          type: string
      required:
        - type
      additionalProperties: false
    SearchMonitorWebhookOutput:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: La URL HTTPS para recibir eventos de webhook. No debe apuntar a
            localhost ni a rangos de IP privadas.
        events:
          type: array
          items:
            type: string
            enum:
              - monitor.created
              - monitor.updated
              - monitor.deleted
              - monitor.run.created
              - monitor.run.completed
          description: Eventos a los que suscribirse. De forma predeterminada, se incluyen
            todos los eventos si no se especifica.
      required:
        - url
      additionalProperties: false
    AgentDataSourceOutput:
      type: object
      properties:
        provider:
          description: Proveedor de datos de Exa Connect que se habilitará para el run.
            Todas las herramientas del proveedor están disponibles de forma
            predeterminada.
          example: fiber
          $ref: "#/components/schemas/AgentDataSourceProvider"
      required:
        - provider
      additionalProperties: false
    AgentBudgetOutput:
      type: object
      properties:
        maxCostDollars:
          type: number
          description: Importe máximo que este run puede gastar en dólares
            estadounidenses. Acepta de $1 a $100 y se aplica solo a `auto` y
            `max`; si se omite, el límite predeterminado es de $5 para `auto` y
            de $20 para `max`.
          example: 10
      additionalProperties: false
      description: Límite de gasto opcional por run para los niveles de effort con
        cobro por uso `auto` y `max`. Los runs que finalicen antes podrían
        costar menos que el límite.
    CreateWebsetParameters:
      properties:
        title:
          minLength: 1
          type: string
          description: Nombre opcional que aparece dondequiera que se muestre el Webset.
            Déjalo vacío para que Exa genere uno automáticamente.
          examples:
            - Leading climate tech startups
          nullable: true
        search:
          properties:
            query:
              minLength: 1
              maxLength: 5000
              description: >-
                Consulta de búsqueda en lenguaje natural que describe lo que
                buscas.


                Sé específico y descriptivo sobre tus requisitos,
                características y cualquier restricción que ayude a acotar los
                resultados.


                Todas las URL proporcionadas se rastrearán y usarán como
                contexto adicional para la búsqueda.
              examples:
                - Marketing agencies based in the US, that focus on consumer
                  products.
                - AI startups in Europe that raised Series A funding in 2024
                - SaaS companies with 50-200 employees in the fintech space
              type: string
            count:
              default: 10
              description: >-
                Número de Items que el Webset intentará encontrar.


                El número real de Items encontrados puede ser menor que este
                número según la complejidad de la búsqueda.
              minimum: 1
              type: number
            entity:
              description: >-
                Entidad para la que el Webset devolverá resultados.


                No es necesario proporcionarla; detectamos automáticamente la
                entidad a partir de toda la información proporcionada en la
                consulta. Úsalo solo cuando necesites un control más preciso.
              $ref: "#/components/schemas/Entity"
            criteria:
              description: >-
                Criterios con los que se evalúa cada Item.


                No es necesario que proporciones tus propios criterios;
                detectamos automáticamente los criterios a partir de toda la
                información proporcionada en la consulta. Úsalo solo cuando
                necesites un control más preciso.
              minItems: 1
              maxItems: 5
              items:
                title: CreateCriterionParameters
                $ref: "#/components/schemas/CreateCriterionParameters"
              type: array
            maxPeoplePerCompany:
              description: Límite flexible opcional para búsquedas de personas. Cuando se
                establece, la búsqueda intentará incluir como máximo esta
                cantidad de personas coincidentes de la misma empresa empleadora
                actual.
              minimum: 1
              type: integer
            recall:
              description: >-
                Indica si se debe proporcionar una estimación de cuántos
                resultados relevantes podrían existir en total para esta
                búsqueda.

                El resultado del análisis estará disponible en el campo `recall`
                de la solicitud de búsqueda.
              type: boolean
            exclude:
              description: Fuentes (imports o Websets existentes) que se excluirán de los
                resultados de búsqueda. Se omitirán todos los resultados
                encontrados en estas fuentes para evitar que aparezcan en la
                búsqueda.
              items:
                properties:
                  source:
                    enum:
                      - import
                      - webset
                    type: string
                  id:
                    minLength: 1
                    description: El ID de la fuente que se excluirá.
                    type: string
                required:
                  - source
                  - id
                type: object
              type: array
            scope:
              description: Limita la búsqueda a fuentes específicas (imports o Websets
                existentes). Todos los resultados encontrados en estas fuentes
                que coincidan con los criterios de búsqueda se incluirán en el
                Webset.
              items:
                properties:
                  source:
                    enum:
                      - import
                      - webset
                    type: string
                  id:
                    minLength: 1
                    description: El ID de la fuente en la que se buscará.
                    type: string
                  relationship:
                    properties:
                      definition:
                        description: La relación entre las entidades que esperas encontrar y las
                          entidades contenidas en la fuente proporcionada.
                        type: string
                      limit:
                        minimum: 1
                        maximum: 10
                        type: number
                    required:
                      - definition
                      - limit
                    type: object
                required:
                  - source
                  - id
                type: object
              type: array
          required:
            - query
          description: Crea una búsqueda inicial para el Webset.
          type: object
        import:
          description: Importa datos de Websets e Imports existentes a este Webset.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: El ID de la fuente que se importará.
                type: string
              evaluate:
                description: Cuando es verdadero, los Items de este import se evaluarán según
                  los criterios de búsqueda. Requiere que se proporcione una
                  búsqueda.
                type: boolean
            required:
              - source
              - id
            type: object
          type: array
        enrichments:
          description: >-
            Añade enrichments para extraer datos adicionales de los Items
            encontrados.


            Los enrichments buscan y extraen automáticamente información
            específica, como datos de contacto, datos de financiación o número
            de empleados, de cada Item añadido a tu Webset.
          items:
            title: CreateEnrichmentParameters
            $ref: "#/components/schemas/CreateEnrichmentParameters"
          type: array
        exclude:
          description: Fuentes de exclusión globales (imports o Websets existentes) que se
            aplican a todas las operaciones de este Webset. Todos los resultados
            encontrados en estas fuentes se omitirán en todas las operaciones de
            búsqueda e importación.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: El ID de la fuente que se excluirá.
                type: string
            required:
              - source
              - id
            type: object
          type: array
        externalId:
          description: >-
            El identificador externo del webset.


            Puedes usarlo para hacer referencia al Webset mediante tus propios
            identificadores internos.
          maxLength: 300
          type: string
        metadata:
          description: Conjunto de pares clave-valor que deseas asociar con este objeto.
          propertyNames:
            type: string
