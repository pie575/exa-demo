    ContentsResponse:
      type: object
      properties:
        requestId:
          type: string
          description: Identificador único de la solicitud.
          example: b5947044c4b78efa9552a7c89b306d95
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultOutput"
        context:
          type: string
          description: Deprecado. Cadena de contexto combinada de los resultados de
            búsqueda. Usa highlights o texto en su lugar.
          deprecated: true
        statuses:
          description: Información de estado de cada URL o ID de documento solicitado.
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: La URL o el ID de documento solicitado.
                example: https://example.com
              status:
                type: string
                enum:
                  - success
                  - error
                description: Estado de la operación de obtención de contenido.
                example: success
              source:
                description: Origen del contenido devuelto.
                type: string
                enum:
                  - cached
                  - crawled
              error:
                anyOf:
                  - type: object
                    properties:
                      tag:
                        description: Tipo de error específico.
                        example: CRAWL_NOT_FOUND
                        type: string
                      httpStatusCode:
                        anyOf:
                          - type: integer
                            minimum: 100
                            maximum: 599
                          - type: "null"
                        description: El código de estado HTTP correspondiente.
                        example: 404
                    additionalProperties: false
                  - type: "null"
                description: Detalles del error, presentes solo cuando el estado es "error".
            required:
              - id
              - status
            additionalProperties: false
        costDollars:
          $ref: "#/components/schemas/CostDollarsOutput"
