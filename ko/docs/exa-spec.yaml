              propertyNames:
                type: string
              additionalProperties:
                type: string
              description: 자체 추적을 위해 호출자가 제공하는 키-값 metadata입니다.
              example:
                slack_channel_id: C123ABC
                slack_thread_id: "1745444400.123456"
                user_id: U123ABC
            - type: "null"
          description: metadata를 업데이트합니다. 제거하려면 null로 설정하세요. 웹훅 deliveries에 그대로 반환되므로
