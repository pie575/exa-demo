                      example: 2000
                    - type: "null"
                numSentences:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "지원 중단되었으며 향후 릴리스에서 제거됩니다. 현재 문장당 약 1333자의 character budget으로
                        매핑됩니다. 기본 highlights를 사용하려면 highlights: true를 전달하고, 자체
                        질의로 선택을 유도하려면 { query }를 전달하세요."
                      example: 1
                      deprecated: true
                    - type: "null"
                highlightsPerUrl:
                  anyOf:
                    - type: integer
                      minimum: 1
                      description: "지원 중단되었으며 향후 릴리스에서 제거됩니다. 현재 무시됩니다. 기본 highlights를 사용하려면
                        highlights: true를 전달하고, 자체 질의로 선택을 유도하려면 { query }를
                        전달하세요."
                      example: 1
                      deprecated: true
                    - type: "null"
              title: Advanced highlights options
              description: "highlight extraction을 조정하는 고급 옵션입니다. 최고 품질의 기본값을 사용하려면 highlights:
                true를 전달하고, 자체 질의로 선택을 유도해야 할 때만 이 객체를 제공하세요."
        summary:
          description: LLM이 생성한 summary를 반환합니다. 기본값을 사용하려면 `true`를 전달하고, 그렇지 않으면 `query` 및
