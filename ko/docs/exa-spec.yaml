                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: JSON 객체 레코드입니다.
              description: agent가 반환하지 않아야 하는 레코드 또는 엔터티입니다.
          description: 처리할 레코드와 답변에서 제외할 레코드 또는 엔터티입니다.
        outputSchema:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: "`output.structured`에서 검증되는 structured output용 JSON Schema입니다.
                evidence로 뒷받침되지 않는 fields는 `null`로 반환될 수 있습니다. `$schema`를 통해
                draft-07, 2019-09, 2020-12를 지원합니다."
            - type: "null"
        previousRunId:
          description: 이어서 진행할 완료된 실행 ID입니다. 동일한 team에 속해야 합니다.
          $ref: "#/components/schemas/AgentRunId"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: 실행과 함께 저장되는 호출자 제공 metadata입니다.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        dataSources:
          maxItems: 5
          type: array
          items:
            $ref: "#/components/schemas/AgentDataSource"
          description: 실행에 사용할 Exa Connect data providers입니다. 각 항목은 해당 제공업체의 모든 도구를 활성화합니다.
        budget:
          $ref: "#/components/schemas/AgentBudget"
      required:
        - query
    AgentEffort:
      type: string
      enum:
        - minimal
        - low
        - medium
        - high
        - xhigh
        - auto
        - max
      description: 실행의 비용 및 리서치 effort 선호도입니다. `auto`는 Exa가 적절한 effort를 선택하도록 합니다.
        `max`는 latency나 비용보다 완전성과 철저함이 중요한 작업을 위한 최고 effort의 공개 베타 등급이며, 대규모 리스트
        구축, 심층 다중 소스 리서치, 검증하기 어려운 criteria 등이 포함됩니다.
      default: auto
    AgentRunId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^[A-Za-z0-9_.:-]+$
      description: Agent 실행 ID입니다. 새 실행 ID는 `agent_run_` 접두사와 함께 반환됩니다.
      example: agent_run_01j7x9v0m2n4p6q8r0s2t4v6w8
    AgentDataSource:
      type: object
      properties:
        provider:
          description: 실행에 사용할 Exa Connect data provider입니다. 기본적으로 해당 제공업체의 모든 도구를 사용할 수
            있습니다.
          example: fiber
          $ref: "#/components/schemas/AgentDataSourceProvider"
      required:
        - provider
    AgentDataSourceProvider:
      type: string
      enum:
        - fiber
        - financial_datasets
        - similarweb
        - baselayer
        - affiliate
        - particle
        - jinko
        - polymarket
      description: Exa Connect data provider의 identifier입니다.
    AgentBudget:
      type: object
      properties:
        maxCostDollars:
          type: number
          description: 이 실행에서 지출할 수 있는 최대 미국 달러 금액입니다. $1–$100 범위이며 `auto` 및 `max`에만
            적용됩니다. 생략하면 기본 상한은 `auto`의 경우 $5, `max`의 경우 $20입니다.
          example: 10
      description: 계량형 `auto` 및 `max` effort에 대한 실행별 선택적 지출 limit입니다. 조기에 완료되는 실행은
        limit보다 비용이 적게 들 수 있습니다.
    CreateBatchRequest:
      type: object
      properties:
        requests:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/BatchRequestItem"
          description: 대기열에 추가할 요청입니다. 각 `customId`는 batch 내에서 고유해야 합니다.
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: 호출자가 제공하여 batch와 함께 저장되는 metadata입니다.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
      required:
        - requests
    BatchRequestItem:
      type: object
      properties:
        customId:
          type: string
          minLength: 1
          maxLength: 64
          description: 이 요청의 고유 핸들입니다. 결과의 키로 사용되며 batch 내에서 고유해야 합니다.
          example: row-1
        method:
          type: string
          const: POST
          description: batch 요청의 HTTP 메서드입니다. v1에서는 POST만 지원합니다.
        url:
          type: string
          enum:
            - /search
            - /agent/runs
          description: 요청의 대상 API 경로입니다. v1에서는 `/search` 또는 `/agent/runs` 중 하나입니다.
          example: /search
        body:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: "대상 경로의 요청 body입니다. JSON 객체여야 하며 `stream: true`는 허용되지 않습니다."
      required:
        - customId
        - method
        - url
        - body
    AnswerStreamTextDeltaChunk:
      type: object
      properties:
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                minimum: 0
                description: 이 스트리밍 선택 항목의 인덱스입니다.
