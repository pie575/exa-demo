          $ref: "#/components/schemas/SearchMonitorSearchOutput"
        trigger:
          anyOf:
            - $ref: "#/components/schemas/SearchMonitorTriggerOutput"
            - type: "null"
          description: 자동 실행을 위한 실행 주기 기반 일정입니다. 일정이 설정되지 않은 경우 null입니다.
        outputSchema:
          $ref: "#/components/schemas/SearchMonitorOutputSchemaOutput"
        metadata:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
              description: 자체 추적을 위해 호출자가 제공한 키-값 metadata입니다.
              example:
