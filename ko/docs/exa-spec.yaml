            metadata:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
                maxLength: 1000
              description: metadata 키-값 쌍으로 필터링(정확 일치, AND 조건)
          description: 실수로 대량 작업을 수행하지 않도록 필터 field를 하나 이상 제공해야 합니다.
        dry_run:
          type: boolean
