                - type: "null"
            codeBlocks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 각 result에 대해 반환할 코드 블록 수입니다.
                  default: 0
                - type: "null"
          description: 전달할 추가 parameters입니다.
        context:
          description: "지원 중단: 대신 highlights 또는 text를 사용하세요. page contents를 결합된 컨텍스트 문자열로
            반환합니다."
          deprecated: true
          oneOf:
            - type: boolean
              description: "지원 중단: 대신 highlights 또는 text를 사용하세요. page contents를 결합된 컨텍스트 문자열로
                반환합니다."
              example: true
              deprecated: true
            - type: object
              properties:
                maxCharacters:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: 지원 중단됨. 컨텍스트 문자열의 최대 문자 limit입니다. 지원되는 최댓값은 10000입니다.
                  example: 10000
              description: "지원 중단: 대신 highlights 또는 text를 사용하세요. page contents를 결합된 컨텍스트 문자열로
                반환합니다."
              deprecated: true
        livecrawl:
          description: 페이지 콘텐츠를 가져오기 위한 크롤링 전략
          oneOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
            - type: string
              const: auto
        livecrawlTimeout:
          type: integer
          exclusiveMinimum: 0
          maximum: 90000
          description: 라이브 크롤링 제한 시간(밀리초)입니다.
          example: 1000
          default: 10000
        maxAgeHours:
          type: integer
          minimum: -1
          maximum: 720
          description: 캐시된 콘텐츠의 최대 보관 기간(시간)입니다. 양수 값이면 캐시된 콘텐츠가 지정된 시간보다 오래되지 않은 경우 이를
            사용합니다. 0은 새 콘텐츠를 가져오며, 새로 가져온 페이지에 텍스트 렌더링 옵션을 적용하는 지원되는 방법입니다. -1은
            항상 캐시를 사용합니다. 생략하면 캐시된 콘텐츠를 사용할 수 없을 때 대체 가져오기를 사용합니다. 지원되는 최대값은
            720시간입니다.
          example: 24
        filterEmptyResults:
          type: boolean
          description: 콘텐츠가 없는 결과 제외
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: 크롤링할 하위 페이지 수입니다. 실제 크롤링 수는 시스템 제약으로 제한될 수 있습니다.
          example: 1
          default: 0
        subpageTarget:
          description: search 결과에서 특정 하위 페이지를 찾기 위한 용어입니다. 단일 문자열 또는 문자열 array일 수 있습니다.
          example: sources
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
      description: 각 search result에 적용할 콘텐츠 extraction 옵션입니다. 모든 field는 선택 사항입니다.
    SummaryWithMaxTokensOptions:
      type: object
      properties:
        query:
          anyOf:
            - type: string
              description: LLM이 생성하는 summary용 맞춤 질의입니다.
              example: Main developments
            - type: "null"
        maxTokens:
          type: integer
          minimum: 1
          description: 생성된 summary의 최대 토큰 수입니다.
    SearchMonitorTrigger:
      type: object
      properties:
        type:
          type: string
          const: interval
          description: 트리거 유형입니다. 현재는 `interval`만 지원됩니다.
          default: interval
        period:
          type: string
          description: 'monitor의 실행 빈도를 지정하는 기간 문자열입니다(예: "1h", "6h", "1d", "7d"). 단일 단위만
            사용할 수 있습니다. 최소 실행 주기는 1시간입니다. 일정은 monitor 생성 시간을 기준으로 설정됩니다(예: 오후
            2:30에 생성된 일일 monitor는 매일 오후 2:30경에 실행됨).'
          example: 6h
      required:
        - type
        - period
    SearchMonitorOutputSchema:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaText"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: synthesis된 output의 JSON schema입니다. 지원되는 루트 유형은 "text"와 "object"입니다.
            제공하면 response에 콘텐츠가 이 schema와 일치하는 output 객체가 포함됩니다. 모든 search
            type에서 작동하며, 선택한 search type에 약 2초의 synthesis latency가 추가됩니다.
          type: object
          discriminator:
            propertyName: type
            mapping:
              text: "#/components/schemas/OutputSchemaText"
              object: "#/components/schemas/OutputSchemaObject"
        - type: "null"
      description: '실행 output의 형식을 제어합니다. 지정하지 않으면 기본값은 `{ "type": "text" }`입니다.
        `type`이 `"text"`이면 output은 일반 텍스트 summary입니다. `type`이 `"object"`이면
        output은 구조화된 JSON입니다. `"object"` 유형에서 `properties`를 지정하지 않으면 schema가
        자동으로 추론되고, 그렇지 않으면 output은 제공된 schema를 따릅니다.'
    SearchMonitorWebhook:
      type: object
      properties:
        url:
          type: string
          format: uri
