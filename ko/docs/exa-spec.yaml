          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: 실행이 시작된 시점입니다.
          format: date-time
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: 실행이 성공적으로 완료된 시점입니다.
          format: date-time
        failedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: 실행이 실패한 시점입니다.
          format: date-time
        cancelledAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: 실행이 취소된 시점입니다.
          format: date-time
        durationMs:
          anyOf:
            - type: integer
            - type: "null"
          description: 밀리초 단위의 총 실행 시간입니다.
        createdAt:
          type: string
          format: date-time
          description: 실행이 생성된 시점입니다.
        updatedAt:
          type: string
          format: date-time
          description: 실행이 마지막으로 업데이트된 시점입니다.
