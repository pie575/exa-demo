        events:
          type: array
          items:
            type: string
            enum:
              - monitor.created
              - monitor.updated
              - monitor.deleted
              - monitor.run.created
              - monitor.run.completed
          description: 구독할 events를 지정합니다. 지정하지 않으면 기본적으로 모든 events를 구독합니다.
