            $ref: "#/components/schemas/SearchResultOutput"
          description: 제목, URL, 게시 날짜, 작성자를 포함하는 검색 결과 목록입니다.
        resolvedSearchType:
          description: 지원 중단된 레거시 field입니다. 현재 프로덕션 response는 빈 문자열을 반환할 수 있으므로 client는 이
            값을 기준으로 분기해서는 안 됩니다.
          example: ""
          deprecated: true
          type: string
        context:
          type: string
          description: 지원 중단되었습니다. 검색 결과를 결합한 컨텍스트 문자열입니다. 대신 highlights 또는 텍스트를 사용하세요.
          deprecated: true
