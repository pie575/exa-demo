                company: "#/components/schemas/SearchCompanyEntityOutput"
                person: "#/components/schemas/SearchPersonEntityOutput"
                publication: "#/components/schemas/SearchPublicationEntityOutput"
        extras:
          description: extras의 결과입니다. 각 field는 contents.extras를 통해 요청된 경우에만 반환됩니다.
          example:
            links: []
          type: object
          properties:
            links:
              description: 검색 결과의 링크 배열입니다.
              example: []
              type: array
              items:
                type: string
            imageLinks:
              description: 검색 결과의 이미지 URL 배열입니다.
              example: []
              type: array
              items:
                type: string
            richImageLinks:
              description: 페이지에 표시되는 순서대로 이미지와 alt 텍스트를 포함하는 배열입니다.
              example:
                - url: https://exa.ai/images/illustrations/api_illustration4.webp
