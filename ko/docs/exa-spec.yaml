                        점진적으로 더 큰 토큰 budget을 할당합니다. highlights.dynamic를 사용하면 사전
                        설정은 URL별 budget 대신 전체 result 집합에 하나의 공유 budget을 설정합니다.
                        정확한 budget은 Exa에서 조정하며 변경될 수 있습니다. maxCharacters 또는
                        numSentences와 호환되지 않습니다. 베타: `Exa-Beta:
                        dynamic-highlights-2026-08-28` 요청 header가 필요합니다. 이
                        header 없이 `verbosity`를 설정한 요청은 거부됩니다."
                      example: medium
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                dynamic:
                  anyOf:
                    - type: boolean
                      description: "Dynamic Highlights(리서치 미리보기)를 활성화합니다. 모든 결과를 함께 고려하고 문서별 budget 대신
                        result 집합 전체에 하나의 공유 컨텍스트 budget을 할당합니다. maxCharacters와
                        호환되지 않습니다. 베타: `Exa-Beta: dynamic-highlights-2026-08-28`
                        요청 header가 필요합니다. 이 header 없이 `dynamic`을 설정한 요청은 거부됩니다."
                      example: true
                      x-exa-lifecycle: beta
                      x-exa-beta-flag: dynamic-highlights-2026-08-28
                      x-mint:
                        post:
                          - Beta
                    - type: "null"
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: highlights에 대해 반환할 최대 문자 수입니다. URL별로 반환되는 highlight 텍스트의 총길이를
                        제어합니다. 지원되는 최댓값은 10000입니다. highlights.dynamic와 호환되지
