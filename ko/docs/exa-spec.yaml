          type: string
        status:
          enum:
            - idle
            - pending
            - running
            - paused
          description: Webset의 상태입니다.
          title: WebsetStatus
          type: string
        externalId:
          type: string
          description: Webset의 외부 식별자입니다.
          nullable: true
        title:
          type: string
          description: Webset의 제목입니다.
          nullable: true
        searches:
          items:
            $ref: "#/components/schemas/WebsetSearch"
          description: Webset에서 수행된 searches입니다.
          type: array
        imports:
          items:
            $ref: "#/components/schemas/Import"
          description: Webset에서 수행된 import입니다.
          type: array
        enrichments:
          items:
            $ref: "#/components/schemas/WebsetEnrichment"
          description: Webset Items에 적용할 Enrichments입니다.
          type: array
        monitors:
          items:
            $ref: "#/components/schemas/Monitor"
          description: Webset의 Monitors입니다.
          type: array
        excludes:
          description: 이 Webset 내 모든 작업에 적용되는 제외 소스(기존 import 또는 webset)입니다. 이 소스에서 발견된
            결과는 모든 search 및 import 작업에서 제외됩니다.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                type: string
            required:
              - source
              - id
            type: object
          type: array
        metadata:
          default: {}
          description: 이 객체에 연결할 키-값 쌍 집합입니다.
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
        dashboardUrl:
          format: uri
          description: Exa dashboard에서 webset을 볼 수 있는 URL
          type: string
        createdAt:
          format: date-time
          description: webset이 생성된 날짜 및 시간
          type: string
        updatedAt:
          format: date-time
          description: webset이 업데이트된 날짜 및 시간
          type: string
      required:
        - id
        - object
        - status
        - externalId
        - title
        - searches
        - imports
        - enrichments
        - monitors
        - dashboardUrl
        - createdAt
        - updatedAt
      type: object
    WebsetSearch:
      properties:
        id:
          description: search의 고유 식별자
          type: string
        object:
          const: webset_search
          default: webset_search
          type: string
        websetId:
          description: 이 search가 속한 Webset의 고유 식별자
          type: string
        status:
          enum:
            - created
            - pending
            - running
            - completed
            - canceled
          description: search의 상태
          title: WebsetSearchStatus
          type: string
        query:
          minLength: 1
          maxLength: 5000
          description: search를 생성하는 데 사용된 질의.
          type: string
        entity:
          $ref: "#/components/schemas/Entity"
          description: |-
            search가 결과를 반환할 엔터티입니다.

            생성 시 엔터티를 제공하지 않으면 질의를 기반으로 가장 적합한 엔터티를 자동으로 선택합니다.
          nullable: true
        criteria:
          items:
            properties:
              description:
                minLength: 1
                maxLength: 1000
                description: criterion에 대한 설명
                type: string
              successRate:
                minimum: 0
                maximum: 100
                description: criterion을 충족하는 결과의 비율을 나타내는 0에서 100 사이의 값입니다.
                type: number
            required:
              - description
              - successRate
            type: object
          description: search가 결과를 평가하는 데 사용할 criteria입니다. 제공하지 않으면 자동으로 생성합니다.
          type: array
        count:
          minimum: 1
          description: search가 찾으려는 결과 수입니다. 실제 결과 수는 search의 복잡성에 따라 이보다 적을 수 있습니다.
          type: number
        maxPeoplePerCompany:
          minimum: 1
          type: integer
          description: 동일한 현재 고용주 회사에 속한 일치 인원에 대해 요청된 소프트 상한이며, 상한이 요청되지 않은 경우 null입니다.
          nullable: true
        behavior:
          default: override
          description: >-
            search가 Webset에 추가될 때의 동작입니다.


            - `override`: search가 Webset에서 발견된 기존 항목을 대체하고 새 criteria에 따라 평가합니다.
            새 criteria와 일치하지 않는 항목은 삭제됩니다.

            - `append`: search가 발견된 새 항목을 기존 Webset에 추가합니다. 새 criteria와 일치하지 않는
            항목은 삭제됩니다.
          $ref: "#/components/schemas/WebsetSearchBehavior"
        exclude:
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                type: string
            required:
              - source
              - id
            type: object
          description: search 중 발견되는 특정 결과를 제외하는 데 사용되는 소스(기존 import 또는 webset)입니다.
          type: array
        scope:
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                type: string
              relationship:
                properties:
                  definition:
                    description: 제공된 소스에 포함된 엔터티와 찾고자 하는 엔터티 간의 관계입니다.
                    type: string
                  limit:
                    minimum: 1
                    maximum: 10
                    type: number
                required:
                  - definition
                  - limit
                type: object
            required:
              - source
              - id
            type: object
          description: |-
            search의 scope입니다. 기본적으로 scope가 없으므로 웹 전체를 검색합니다.

            생성 시 제공하면 제공된 소스에서만 search가 수행됩니다.
          type: array
        progress:
          properties:
            found:
              description: 현재까지 발견된 결과 수
              type: number
            analyzed:
              description: 현재까지 분석된 결과 수
              type: number
            completion:
              minimum: 0
              maximum: 100
              description: search의 완료율
              type: number
            timeLeft:
              type: number
              description: 예상 남은 시간(초)이며, 알 수 없는 경우 null
              nullable: true
          required:
            - found
            - analyzed
            - completion
            - timeLeft
          description: search의 진행 상황
          type: object
        recall:
          properties:
            expected:
              properties:
                total:
                  description: 잠재적 일치 항목의 예상 총수
                  type: number
                confidence:
                  enum:
                    - high
                    - medium
                    - low
                  description: 추정값의 신뢰도
                  type: string
                bounds:
                  properties:
                    min:
                      description: 잠재적 일치 항목의 예상 최소 총수
                      type: number
                    max:
                      description: 잠재적 일치 항목의 예상 최대 총수
                      type: number
                  required:
                    - min
                    - max
                  type: object
              required:
                - total
                - confidence
                - bounds
              type: object
            reasoning:
              description: 추정 근거
              type: string
          required:
            - expected
            - reasoning
          type: object
          description: search의 재현율 지표이며, 아직 계산되지 않았거나 요청되지 않은 경우 null입니다.
          nullable: true
        metadata:
          default: {}
          description: 이 객체에 연결할 키-값 쌍 집합입니다.
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
        canceledAt:
          format: date-time
          type: string
          description: search가 취소된 날짜 및 시간
          nullable: true
        canceledReason:
          $ref: "#/components/schemas/WebsetSearchCanceledReason"
          description: search가 취소된 이유
          nullable: true
        createdAt:
          format: date-time
          description: search가 생성된 날짜 및 시간
          type: string
        updatedAt:
          format: date-time
          description: search가 업데이트된 날짜 및 시간
          type: string
      required:
        - id
        - object
        - websetId
        - status
        - query
        - entity
        - criteria
        - count
        - maxPeoplePerCompany
        - exclude
        - scope
        - progress
        - recall
        - canceledAt
        - canceledReason
        - createdAt
        - updatedAt
      type: object
    WebsetSearchCanceledReason:
      enum:
        - webset_deleted
        - webset_canceled
        - out_of_credits
      type: string
    Import:
      properties:
