                user_id: U123ABC
            - type: "null"
          description: 자체 추적을 위한 선택적 키-값 metadata입니다. 웹훅 delivery에 그대로 포함되므로 업데이트를 Slack과
            같은 시스템으로 라우팅할 수 있습니다.
