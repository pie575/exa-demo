                      anyOf:
                        - type: boolean
                          description: "Dynamic Highlights(리서치 미리 보기)를 활성화합니다. 모든 result를 함께 고려하고 문서별 예산
                            대신 전체 result 집합에 하나의 공유 컨텍스트 예산을 할당합니다.
                            maxCharacters와 호환되지 않습니다. 베타: `Exa-Beta:
                            dynamic-highlights-2026-08-28` 요청 header가 필요하며, 이
                            header 없이 `dynamic`을 설정하는 요청은 거부됩니다."
                          example: true
                          x-exa-lifecycle: beta
                          x-exa-beta-flag: dynamic-highlights-2026-08-28
                          x-mint:
                            post:
                              - Beta
                        - type: "null"
                    maxCharacters:
                      anyOf:
                        - type: integer
                          minimum: 1
                          maximum: 10000
                          description: highlights에 대해 반환할 최대 문자 수입니다. URL별로 반환되는 highlight 텍스트의 총길이를
                            제어합니다. 지원되는 최대값은 10000입니다. highlights.dynamic와 호환되지
                            않습니다.
                          example: 2000
                        - type: "null"
                    numSentences:
                      anyOf:
                        - type: integer
                          minimum: 1
                          description: "지원 중단되었으며 향후 릴리스에서 제거됩니다. 현재 문장당 약 1333자의 character budget에 매핑됩니다.
                            기본 highlights를 사용하려면 highlights: true를 전달하고, 자체 질의로
                            선택을 안내하려면 { query }를 전달하세요."
                          example: 1
                          deprecated: true
                        - type: "null"
                    highlightsPerUrl:
                      anyOf:
                        - type: integer
                          minimum: 1
                          description: "지원 중단되었으며 향후 릴리스에서 제거됩니다. 현재는 무시됩니다. 기본 highlights를 사용하려면
                            highlights: true를 전달하고, 자체 질의로 선택을 안내하려면 { query }를
                            전달하세요."
                          example: 1
                          deprecated: true
                        - type: "null"
                  title: Advanced highlights options
                  description: "highlight extraction을 조정하기 위한 고급 옵션입니다. 최고 품질의 기본값을 사용하려면
                    highlights: true를 전달하세요. 자체 질의로 선택을 지정해야 할 때만 이 객체를 제공하세요."
            - type: "null"
        summary:
          anyOf:
            - type: object
              properties:
                query:
                  anyOf:
                    - type: string
                      description: LLM이 생성하는 summary를 위한 사용자 지정 질의입니다.
                      example: Main developments
                    - type: "null"
                schema:
                  anyOf:
                    - type: object
                      propertyNames:
                        type: string
                      additionalProperties:
                        $ref: "#/components/schemas/JsonValue"
                      description: summary의 structured output을 위한 JSON schema입니다. JSON Schema 문서는
                        https://json-schema.org/overview/what-is-jsonschema를
                        참조하세요.
                      example:
                        $schema: http://json-schema.org/draft-07/schema#
                        title: Title
                        type: object
                        properties:
                          Property 1:
                            type: string
                            description: 설명
                          Property 2:
                            type: string
                            enum:
                              - option 1
                              - option 2
                              - option 3
                            description: 설명
                        required:
                          - Property 1
                    - type: "null"
              description: 웹페이지의 summary입니다.
            - type: "null"
        extras:
          anyOf:
            - type: object
              properties:
                links:
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 1000
                      description: 각 웹페이지에서 반환할 URL 수입니다.
                      example: 1
                      default: 0
                    - type: "null"
                imageLinks:
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 1000
                      description: 각 결과에 대해 반환할 이미지 수입니다.
                      example: 1
                      default: 0
                    - type: "null"
                richImageLinks:
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 1000
                      description: 각 결과에 대해 반환할 리치 이미지 링크 수입니다.
                      default: 0
                    - type: "null"
                richLinks:
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 1000
                      description: 각 결과에 대해 반환할 리치 링크 수입니다.
                      default: 0
                    - type: "null"
                codeBlocks:
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 1000
                      description: 각 결과에 대해 반환할 코드 블록 수입니다.
                      default: 0
                    - type: "null"
              description: 전달할 추가 parameters입니다.
            - type: "null"
        context:
          anyOf:
            - description: "지원 중단: 대신 highlights 또는 text를 사용하세요. page contents를 하나의 컨텍스트 문자열로
                반환합니다."
              deprecated: true
              oneOf:
                - type: boolean
                  description: "지원 중단: 대신 highlights 또는 text를 사용하세요. page contents를 하나의 컨텍스트 문자열로
                    반환합니다."
                  example: true
                  deprecated: true
                - type: object
                  properties:
                    maxCharacters:
                      type: integer
                      minimum: 1
                      maximum: 10000
                      description: 지원 중단되었습니다. 컨텍스트 문자열의 최대 문자 limit입니다. 지원되는 최댓값은 10000입니다.
                      example: 10000
                  description: "지원 중단: 대신 highlights 또는 text를 사용하세요. page contents를 하나의 컨텍스트 문자열로
                    반환합니다."
                  deprecated: true
            - type: "null"
        livecrawl:
          anyOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
              description: "지원 중단: 콘텐츠 최신성을 제어하려면 대신 maxAgeHours를 사용하세요. livecrawl은 새로 가져온 파서
                output을 보장하지 않으며, 서버 freshness 정책에 따라 제공될 수 있습니다. livecrawl과
                maxAgeHours를 함께 전송하지 마세요."
              example: preferred
              deprecated: true
            - type: "null"
        livecrawlTimeout:
          anyOf:
            - type: integer
              exclusiveMinimum: 0
              maximum: 90000
              description: livecrawling의 제한 시간(밀리초)입니다.
              example: 1000
              default: 10000
            - type: "null"
        maxAgeHours:
          anyOf:
            - type: integer
              minimum: -1
              maximum: 720
              description: 캐시된 content의 최대 보관 시간(시간)입니다. 양수 값은 캐시된 content가 지정한 시간보다 오래되지 않은
                경우 사용합니다. 0은 새 content를 가져오며, 새로 가져온 페이지에 text 렌더링 옵션을 적용하는 지원되는
                방법입니다. -1은 항상 캐시를 사용합니다. 생략하면 캐시된 content를 사용할 수 없을 때 대체 가져오기를
                사용합니다. 지원되는 최댓값은 720시간입니다.
              example: 24
            - type: "null"
        snapshotAsOf:
          anyOf:
            - type: string
              description: 이 시점(ISO 8601 날짜-시간)을 기준으로 각 페이지의 최신 stored version을 반환합니다. 과거 요청은
                stored version에서만 제공되며 라이브 페이지를 가져오지 않습니다.
              example: 2026-01-15T00:00:00Z
              format: date-time
            - type: "null"
        subpages:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 100
              description: 크롤링할 하위 페이지 수입니다. 실제 크롤링되는 수는 시스템 제약으로 제한될 수 있습니다.
              example: 1
              default: 0
            - type: "null"
        subpageTarget:
          anyOf:
            - description: search 결과에서 특정 하위 페이지를 찾기 위한 용어입니다. 단일 문자열 또는 문자열 array일 수 있습니다.
              example: sources
              oneOf:
                - type: string
                  minLength: 1
                  maxLength: 100
                - minItems: 0
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
            - type: "null"
      description: "`ids` 또는 `urls` 중 하나만 제공하고, 둘 다 제공하지 마세요."
      oneOf:
        - required:
            - ids
        - required:
            - urls
    AnswerRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: 요청을 위한 자연어 질문 또는 지침입니다.
          example: What is the latest valuation of SpaceX?
        stream:
          type: boolean
          description: true이면 response가 server-sent events (SSE) 스트림으로 반환됩니다.
          default: false
        text:
          type: boolean
          title: Simple text retrieval
          description: true이면 기본 설정으로 전체 페이지 텍스트를 반환합니다. false이면 텍스트 반환을 비활성화합니다.
          default: false
        model:
          description: 답변 생성에 사용되는 모델입니다.
          default: exa
          type: string
          enum:
            - exa
            - exa-pro
            - exa-research
            - exa-fast
        systemPrompt:
          type: string
          description: 생성된 output 또는 agent 동작을 안내하는 추가 지침입니다. 소스 선호도, 신규성 제약, 중복 제약 또는 기타
            동작 guidance에 사용하세요.
          example: Prefer official sources and avoid duplicate results.
        userLocation:
          anyOf:
            - type: string
              description: "사용자의 두 글자 ISO 국가 코드입니다. 예: US."
              example: US
            - type: "null"
        outputSchema:
          type: object
          properties:
            type:
              type: string
              description: 루트 schema 유형입니다(일반적으로 "object").
              example: object
            properties:
              type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: 각 키가 속성 이름이고 각 값이 해당 속성을 설명하는 JSON Schema(`type`, `description` 등)인
                객체입니다.
            required:
              type: array
              items:
                type: string
              description: 필수 속성 이름 목록입니다.
            description:
              type: string
              description: schema에 대한 설명입니다.
            additionalProperties:
              type: boolean
              description: "`properties`에 나열되지 않은 속성을 허용할지 여부입니다."
              default: false
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
          description: 원하는 답변 구조를 위한 [JSON Schema Draft
            7](https://json-schema.org/draft-07) 사양입니다. 제공하면 답변은 일반 문자열 대신
            schema에 맞는 구조화된 객체로 반환됩니다.
      required:
        - query
    FindSimilarRequest:
      type: object
      properties:
        includeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: "search에 포함할 도메인 또는 도메인 경로 목록입니다. 각 항목은 호스트 이름(예: `example.com`),
                경로 접두사가 있는 호스트 이름(예: `example.com/docs`) 또는 와일드카드 하위 도메인(예:
                `*.example.com`)일 수 있습니다. 지정하면 일치하는 도메인 또는 경로의 결과만 반환됩니다. 질의에
                `site:` 연산자를 추가하는 대신 이 매개변수를 사용해 도메인 또는 경로를 filtering하세요."
              example:
                - arxiv.org
                - exa.ai/blog
            - type: "null"
        excludeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: "search 결과에서 제외할 도메인 또는 도메인 경로 목록입니다. 각 항목은 호스트 이름(예:
                `example.com`), 경로 접두사가 있는 호스트 이름(예: `example.com/docs`) 또는
                와일드카드 하위 도메인(예: `*.example.com`)일 수 있습니다. 지정하면 일치하는 도메인 또는 경로에서는
                결과가 반환되지 않습니다. 질의에 `site:` 연산자를 추가하는 대신 이 매개변수를 사용해 도메인 또는 경로를
                filtering하세요."
              example:
                - docs.python.org/3
            - type: "null"
        startCrawlDate:
          anyOf:
            - type: string
              description: 지원 중단되었으며 효과가 없습니다. API에서 무시됩니다. ISO 8601 형식으로 지정해야 합니다.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        endCrawlDate:
          anyOf:
            - type: string
              description: 지원 중단되었으며 효과가 없습니다. API에서 무시됩니다. ISO 8601 형식으로 지정해야 합니다.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        startPublishedDate:
          anyOf:
            - type: string
              description: 이 날짜 이후에 게시된 링크만 반환됩니다. ISO 8601 형식으로 지정해야 합니다.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
            - type: "null"
        endPublishedDate:
          anyOf:
            - type: string
              description: 이 날짜 이전에 게시된 링크만 반환됩니다. ISO 8601 형식으로 지정해야 합니다.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
            - type: "null"
        numResults:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 100
              description: 반환할 결과 수입니다. limits는 search type에 따라 달라집니다. 공개 limit의 최댓값은 결과
                100개입니다. 더 높은 limits에 관해 논의하려면 영업팀(hello@exa.ai)에 문의하세요.
              example: 10
              default: 10
            - type: "null"
        contents:
          anyOf:
            - description: text, highlights, summary, extras 및 freshness 제어를 위한 content
                options입니다.
              $ref: "#/components/schemas/ContentsOptions"
            - type: "null"
        url:
          type: string
          minLength: 3
          description: 유사한 링크를 찾으려는 URL입니다.
          example: https://arxiv.org/abs/2307.06435
        category:
          anyOf:
            - type: string
              enum:
                - company
                - publication
                - news
                - personal site
                - financial report
                - people
              description: "중점적으로 사용할 데이터 카테고리입니다. 알려진 카테고리에는 `company`, `publication`,
                `news`, `personal site`, `financial report`, `people`가 있습니다. 다른
                문자열도 허용되며 search의 카테고리 힌트로 사용됩니다. `people` 및 `company` 카테고리는 인물
                프로필과 회사 페이지를 더 정확하게 찾을 수 있도록 개선되었습니다. `publication` 카테고리는 연구 논문,
                프리프린트, 학술지 논문 등의 학술 출판물을 표시하며, 저자, 게재처, citations 등의 구조화된
                metadata를 제공합니다. 참고: `company` 및 `people` 카테고리는 제한된 필터 집합만
                지원합니다. 다음 매개변수는 이 카테고리에서 지원되지 않습니다: `startPublishedDate`,
                `endPublishedDate`, `excludeDomains`. 지원되지 않는 매개변수를 사용하면 400 오류가
                발생합니다."
              example: publication
            - type: "null"
        excludeSourceDomain:
          anyOf:
            - type: boolean
              description: true이면 소스 URL과 동일한 도메인의 결과를 제외합니다.
              example: true
            - type: "null"
      required:
        - url
    CreateSearchMonitorParameters:
      type: object
      properties:
        name:
          type: string
          description: monitor의 선택적 이름
        search:
          $ref: "#/components/schemas/SearchMonitorSearch"
        trigger:
          $ref: "#/components/schemas/SearchMonitorTrigger"
        outputSchema:
          $ref: "#/components/schemas/SearchMonitorOutputSchema"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: 선택적 키-값 metadata입니다. 웹훅 deliveries에 그대로 반환되므로 Slack과 같은 시스템으로 업데이트를
            라우팅할 수 있습니다.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        webhook:
          $ref: "#/components/schemas/SearchMonitorWebhook"
      required:
        - search
        - webhook
    SearchMonitorSearch:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          description: search에 사용할 질의 문자열입니다.
          example: Latest developments in LLM capabilities
        numResults:
          type: integer
          minimum: 1
          maximum: 100
          description: 반환할 결과 수입니다. limits는 search type에 따라 다릅니다. 공개 limit의 최댓값은 결과
            100개입니다. 더 높은 limits에 대해서는 영업팀(hello@exa.ai)에 문의하세요.
          example: 10
          default: 10
        includeDomains:
          description: search 결과를 지정한 도메인으로 제한합니다.
          type: array
          items:
            type: string
        excludeDomains:
          description: search 결과에서 지정한 도메인을 제외합니다.
          type: array
          items:
            type: string
        contents:
          $ref: "#/components/schemas/SearchMonitorContents"
      required:
        - query
    SearchMonitorContents:
      type: object
      properties:
        text:
          description: 각 result의 텍스트 extraction 옵션입니다.
          oneOf:
            - type: boolean
              title: Simple text retrieval
              description: true이면 기본 설정으로 전체 페이지 텍스트를 반환합니다. false이면 텍스트 반환을 비활성화합니다.
              default: false
            - type: object
              properties:
                maxCharacters:
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 10000
                      description: 전체 페이지 텍스트의 최대 문자 limit입니다. response 크기와 API 비용을 제어하는 데 유용합니다. 지원되는
                        최댓값은 10000입니다.
                      example: 1000
                    - type: "null"
                includeHtmlTags:
                  anyOf:
                    - type: boolean
                      description: "true이면 일반 마크다운 스타일 텍스트 대신 반환되는 텍스트에 경량 HTML 태그를 포함합니다. 새로 가져온 콘텐츠에
                        적용하려면 maxAgeHours: 0을 사용하세요."
                      example: false
                      default: false
                    - type: "null"
                verbosity:
                  anyOf:
                    - type: string
                      enum:
                        - compact
                        - standard
                        - full
                      description: "텍스트 렌더링의 상세 수준을 제어합니다. compact는 주요 콘텐츠에 집중하고, standard는 주변 페이지
                        컨텍스트를 더 포함하며, full은 가장 완전한 렌더링 텍스트를 요청합니다. 일부 페이지에서는
                        standard와 full output이 동일할 수 있습니다. 새로 가져온 콘텐츠에 적용하려면
                        maxAgeHours: 0을 사용하세요."
                      example: standard
                      default: compact
