            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        webhook:
          $ref: "#/components/schemas/SearchMonitorWebhookOutput"
        nextRunAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
