                엔터티, criteria)가 사용됩니다.
              type: object
            type:
              type: string
              const: search
              default: search
          required:
            - type
            - config
          description: Monitor 실행 시 수행할 동작입니다.
          type: object
        metadata:
          propertyNames:
            type: string
          additionalProperties:
            type: string
          type: object
      required:
        - websetId
        - cadence
        - behavior
      type: object
    UpdateMonitor:
      properties:
        metadata:
          propertyNames:
            type: string
          additionalProperties:
            type: string
          type: object
        status:
