    SearchMonitorRun:
      type: object
      properties:
        id:
          type: string
          description: 실행의 고유 식별자입니다.
        monitorId:
          type: string
          description: 이 실행이 속한 monitor입니다.
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
            - cancelled
          description: 실행의 상태입니다.
        output:
          anyOf:
            - $ref: "#/components/schemas/SearchMonitorRunOutput"
            - type: "null"
          description: 실행의 output입니다. 실행이 완료될 때까지 null입니다.
        failReason:
          anyOf:
            - type: string
              enum:
                - api_key_invalid
                - insufficient_credits
                - invalid_params
                - rate_limited
                - source_not_available
                - forbidden
                - search_unavailable
                - search_failed
                - internal_error
            - type: "null"
          description: 실행 실패 이유입니다. 상태가 `failed`가 아닌 경우 null입니다. `source_not_available`은
            검색에서 Exa가 반환할 수 없는 도메인을 요청했음을 의미하며(검색에서 제거하세요), `forbidden`은 요청이 다른
            이유로 허용되지 않았음을 의미합니다.
