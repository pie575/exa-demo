              description: 검색할 질의입니다. 기본적으로 마지막 search의 질의가 사용됩니다.
              minLength: 2
              maxLength: 10000
              type: string
            criteria:
              description: 검색할 criteria입니다. 기본적으로 마지막 search의 criteria가 사용됩니다.
              maxItems: 5
              items:
                properties:
                  description:
                    minLength: 2
                    maxLength: 1000
                    type: string
                required:
                  - description
                type: object
              type: array
            entity:
              title: Entity
              description: 검색할 엔터티입니다. 기본적으로 마지막 search/import의 엔터티가 사용됩니다.
              $ref: "#/components/schemas/Entity"
            count:
              exclusiveMinimum: 0
              description: 찾을 최대 결과 수입니다.
              type: number
            behavior:
              default: append
              description: Search가 Webset에 추가될 때의 동작입니다.
              enum:
                - override
                - append
              type: string
          required:
            - count
          description: >-
            Monitor의 search parameters를 지정합니다.


            기본적으로 parameters를 제공하지 않으면 마지막 search의 search parameters(질의, 엔터티,
            criteria)가 사용됩니다.
          type: object
        type:
