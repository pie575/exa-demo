          description: 병합할 부분 search params입니다. 업데이트 시 모든 field는 선택 사항입니다.
        trigger:
          anyOf:
            - type: object
              properties:
                type:
                  type: string
                  const: interval
                  description: 트리거 유형입니다. 현재는 `interval`만 지원됩니다.
                  default: interval
                period:
                  type: string
                  description: 'monitor의 실행 빈도를 지정하는 기간 문자열입니다(예: "1h", "6h", "1d", "7d"). 단일 단위만
                    사용할 수 있습니다. 최소 실행 주기는 1시간입니다.'
            - type: "null"
          description: 일정을 업데이트합니다. 일정을 제거하려면 null로 설정하세요.
        outputSchema:
          $ref: "#/components/schemas/SearchMonitorOutputSchema"
        metadata:
          anyOf:
