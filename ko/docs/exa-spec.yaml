                          - banner
                          - body
                          - sidebar
                          - footer
                          - metadata
                      description: "지정한 의미론적 페이지 섹션으로 분류된 콘텐츠를 제외합니다. 섹션 분류는 최선의 노력으로 처리됩니다. 새로 가져온
                        콘텐츠에 적용하려면 maxAgeHours: 0을 사용하세요."
                      example:
                        - navigation
                        - footer
                        - sidebar
                    - type: "null"
              title: Advanced text options
              description: 텍스트 extraction을 제어하는 고급 옵션입니다. 텍스트 길이를 제한하거나 HTML 구조를 포함해야 할 때
                사용하세요.
