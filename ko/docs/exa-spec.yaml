            imageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 각 result에 대해 반환할 이미지 수입니다.
                  example: 1
                  default: 0
                - type: "null"
            richImageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 각 result에 대해 반환할 리치 이미지 링크 수입니다.
                  default: 0
                - type: "null"
            richLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: 각 result에 대해 반환할 리치 링크 수입니다.
