        systemPrompt:
          type: string
          description: 생성된 output 또는 agent 동작을 안내하는 추가 지침입니다. 소스 선호도, 새로움 제약, 중복 제약 또는 기타
            동작 지침에 사용하세요.
          example: Prefer official sources and avoid duplicate results.
        effort:
          $ref: "#/components/schemas/AgentEffort"
        input:
          type: object
          properties:
            data:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: JSON 객체 레코드입니다.
              description: agent가 처리하거나 enrich해야 하는 레코드입니다.
            exclusion:
              type: array
              items:
                type: object
                propertyNames:
                  type: string
                additionalProperties:
                  $ref: "#/components/schemas/JsonValue"
                description: JSON 객체 레코드입니다.
              description: agent가 반환하지 않아야 하는 레코드 또는 엔터티입니다.
          additionalProperties: false
        outputSchema:
          anyOf:
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/JsonValue"
              description: "`output.structured`에서 검증되는 structured output용 JSON Schema입니다.
                evidence로 뒷받침되지 않는 field는 `null`로 반환될 수 있습니다. `$schema`를 통해
                draft-07, 2019-09 및 2020-12를 지원합니다."
            - type: "null"
        previousRunId:
          $ref: "#/components/schemas/AgentRunId"
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: 자체 추적을 위해 호출자가 제공한 키-값 metadata입니다.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
        dataSources:
          type: array
          items:
            $ref: "#/components/schemas/AgentDataSourceOutput"
          description: 실행에 설정된 Exa Connect 데이터 제공업체.
        budget:
          $ref: "#/components/schemas/AgentBudgetOutput"
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
      description: 실행과 함께 저장된 정규화된 요청 field입니다.
    AgentRunOutput:
      type: object
      properties:
        text:
          type: string
          description: 자연어 답변 또는 summary.
        structured:
          anyOf:
            - $ref: "#/components/schemas/JsonValue"
            - type: "null"
          description: "`outputSchema`로 형성된 JSON입니다. evidence로 뒷받침되지 않는 field는 `null`일 수
            있습니다. schema가 제공되지 않은 경우에는 `null`입니다."
        grounding:
          type: array
          items:
            $ref: "#/components/schemas/AgentGrounding"
          description: 실행에서 생성된 field 수준 citations.
      required:
        - text
        - structured
        - grounding
      additionalProperties: false
    AgentGrounding:
      type: object
      properties:
        field:
          type: string
          description: citations이 뒷받침하는 output field.
          example: structured.companies[0].sourceUrl
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AgentCitation"
        confidence:
          anyOf:
            - type: string
              enum:
                - low
                - medium
                - high
              description: 이 field에 대해 모델이 보고한 신뢰도.
            - type: "null"
      required:
        - field
        - citations
      additionalProperties: false
    AgentCitation:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: 소스 URL.
        title:
          type: string
          description: 소스 제목.
      required:
        - url
      additionalProperties: false
    AgentUsage:
      type: object
      properties:
        agentComputeUnits:
          type: number
          minimum: 0
        searches:
          type: integer
          minimum: 0
        emails:
          type: integer
          minimum: 0
        phoneNumbers:
          type: integer
          minimum: 0
        dataSources:
          $ref: "#/components/schemas/AgentDataSourceUsage"
      required:
        - agentComputeUnits
        - searches
        - emails
        - phoneNumbers
      additionalProperties: false
    AgentDataSourceUsage:
      type: object
      propertyNames:
        type: string
      additionalProperties:
        type: integer
        minimum: 0
      description: "실행 중 사용된 Exa Connect 데이터 소스의 제공업체별 도구 호출 수입니다. 키는 제공업체 이름(예:
        `fiber`, `similarweb`)입니다. 사용량이 0이 아닌 제공업체만 포함됩니다."
    AgentCostDollars:
      type: object
      properties:
        total:
          type: number
          minimum: 0
        agentCompute:
          type: number
          minimum: 0
        search:
          type: number
          minimum: 0
        emails:
          type: number
          minimum: 0
        phoneNumbers:
          type: number
          minimum: 0
        dataSources:
          $ref: "#/components/schemas/AgentDataSourceCost"
      required:
        - total
        - agentCompute
        - search
        - emails
        - phoneNumbers
      additionalProperties: false
    AgentDataSourceCost:
      type: object
      propertyNames:
        type: string
      additionalProperties:
        type: number
        minimum: 0
      description: "실행 중 사용된 Exa Connect 데이터 소스의 제공업체별 달러 기준 비용입니다. 키는 제공업체 이름(예:
        `fiber`, `similarweb`)입니다. 사용량이 0이 아닌 제공업체만 포함됩니다."
    AgentErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/AgentError"
      required:
        - error
      additionalProperties: false
    AgentError:
      type: object
      properties:
        type:
          type: string
          enum:
            - INVALID_REQUEST
            - AUTHENTICATION_ERROR
            - RATE_LIMIT_ERROR
            - NOT_FOUND
            - SERVER_ERROR
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - TEAM_NOT_FOUND
            - RUN_NOT_FOUND
            - PREVIOUS_RUN_NOT_FOUND
            - PREVIOUS_RUN_NOT_COMPLETED
            - CONCURRENCY_LIMIT_REACHED
            - INVALID_OUTPUT_SCHEMA
            - INVALID_DATA_SOURCE
            - TIMEOUT
            - SERVER_ERROR
        message:
          type: string
      required:
        - type
        - code
        - message
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    AgentRunList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
        hasMore:
          type: boolean
          description: 추가 result 존재 여부
        nextCursor:
          anyOf:
            - $ref: "#/components/schemas/AgentRunId"
            - type: "null"
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    DeleteAgentRunResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/AgentRunId"
        object:
          type: string
          const: agent_run.deleted
        deleted:
          type: boolean
          const: true
      required:
        - id
        - object
        - deleted
      additionalProperties: false
    AgentRunEventList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentRunEvent"
        hasMore:
          type: boolean
          description: 추가 result 존재 여부
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    Batch:
      type: object
      properties:
        id:
          type: string
          description: batch ID. 새 batch ID는 `batch_` 접두사와 함께 반환됩니다.
          example: batch_01j7x9v0m2n4p6q8r0s2t4v6w8
        object:
          type: string
          const: batch
          description: 객체 유형이며 항상 `batch`입니다.
        status:
          $ref: "#/components/schemas/BatchStatus"
        requestCounts:
          $ref: "#/components/schemas/BatchRequestCounts"
        createdAt:
          type: string
          format: date-time
          description: batch가 생성된 시점.
        expiresAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: batch가 만료되는 시점이며, 만료되지 않는 경우 `null`입니다.
          format: date-time
        endedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: batch가 종료 상태에 도달한 시점이며, 아직 실행 중인 경우 `null`입니다.
          format: date-time
        resultsUrl:
          anyOf:
            - type: string
            - type: "null"
          description: batch 결과 파일(JSONL)의 단기 사전 서명된 다운로드 URL이며, batch가 완료될 때까지는
            `null`입니다. 이는 API 경로가 아닌 객체 스토어의 직접 다운로드 링크입니다. 있는 그대로 가져오고, 만료된 후에는
            batch를 다시 가져와 새 URL을 mint하세요.
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: 자체 추적을 위해 호출자가 제공하는 키-값 metadata.
          example:
            slack_channel_id: C123ABC
            slack_thread_id: "1745444400.123456"
            user_id: U123ABC
      required:
        - id
        - object
        - status
        - requestCounts
        - createdAt
        - expiresAt
        - endedAt
        - resultsUrl
        - metadata
      additionalProperties: false
    BatchStatus:
      type: string
      enum:
        - in_progress
        - completed
        - cancelling
        - cancelled
        - expired
      description: batch의 수명 주기 상태.
    BatchRequestCounts:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
          description: batch의 총 요청 수.
        completed:
          type: integer
          minimum: 0
          description: 성공적으로 완료된 요청.
        failed:
          type: integer
          minimum: 0
          description: 실패한 요청.
      required:
        - total
        - completed
        - failed
      additionalProperties: false
    BatchList:
      type: object
      properties:
        object:
          type: string
          const: list
          description: 객체 유형이며 항상 `list`입니다.
        data:
          type: array
          items:
            $ref: "#/components/schemas/Batch"
          description: 최신순으로 정렬된 batch 페이지.
        hasMore:
          type: boolean
          description: 추가 result 존재 여부
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
          description: 다음 페이지의 cursor
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    DeletedBatch:
      type: object
      properties:
        id:
          type: string
          description: 삭제된 batch의 ID.
        object:
          type: string
          const: batch.deleted
          description: 객체 유형이며 항상 `batch.deleted`입니다.
        deleted:
          type: boolean
          const: true
          description: 삭제에 성공한 경우 항상 `true`입니다.
      required:
        - id
        - object
        - deleted
      additionalProperties: false
    WebsetsTeamInfo:
      type: object
      properties:
        object:
          type: string
          const: team
          description: 객체 유형이며 항상 `"team"`입니다.
        id:
          type: string
          description: team의 고유 identifier.
        name:
          type: string
          description: team의 이름.
        concurrency:
          type: object
          properties:
            active:
              type: integer
              description: 현재 처리 중인 요청 수.
            queued:
              type: integer
              description: 현재 queued 상태인 요청 수.
          required:
            - active
            - queued
          additionalProperties: false
          description: 현재 concurrency 사용량.
        limits:
          type: object
          properties:
            maxConcurrent:
              anyOf:
                - type: integer
                - type: "null"
              description: 허용되는 동시 요청의 최대 수입니다. Null은 무제한을 의미합니다.
            maxQueued:
              anyOf:
                - type: integer
                - type: "null"
              description: 허용되는 queued 요청의 최대 수입니다. Null은 무제한을 의미합니다.
          required:
            - maxConcurrent
            - maxQueued
          additionalProperties: false
          description: team의 concurrency limits.
      required:
        - object
        - id
        - name
        - concurrency
        - limits
      additionalProperties: false
    AnswerStreamChunk:
      description: "`/answer` 서버 전송 이벤트 스트리밍에서 생성되는 각 JSON payload의 schema입니다. 각 이벤트는
        `data: <json>`으로 생성됩니다."
      oneOf:
        - $ref: "#/components/schemas/AnswerStreamTextDeltaChunk"
        - $ref: "#/components/schemas/AnswerStreamCitationsChunkOutput"
        - $ref: "#/components/schemas/AnswerStreamCostChunkOutput"
        - $ref: "#/components/schemas/AnswerStreamErrorChunkOutput"
    SearchStreamChunk:
      oneOf:
        - $ref: "#/components/schemas/SearchStreamTextDeltaChunkOutput"
        - $ref: "#/components/schemas/SearchStreamGroundingChunkOutput"
        - $ref: "#/components/schemas/SearchStreamResultsChunkOutput"
        - $ref: "#/components/schemas/SearchStreamResetChunkOutput"
        - $ref: "#/components/schemas/SearchStreamDoneChunkOutput"
        - $ref: "#/components/schemas/SearchStreamErrorChunkOutput"
      description: "`/search` 서버 전송 이벤트 스트리밍에서 생성되는 각 JSON payload의 schema입니다. 각 이벤트는
        `data: <json>`으로 생성되며, 스트리밍은 이 JSON schema에 표현되지 않는 `data: [DONE]`으로
        종료됩니다."
      type: object
      discriminator:
        propertyName: type
        mapping:
          text-delta: "#/components/schemas/SearchStreamTextDeltaChunkOutput"
          grounding: "#/components/schemas/SearchStreamGroundingChunkOutput"
          results: "#/components/schemas/SearchStreamResultsChunkOutput"
          stream-reset: "#/components/schemas/SearchStreamResetChunkOutput"
          done: "#/components/schemas/SearchStreamDoneChunkOutput"
          error: "#/components/schemas/SearchStreamErrorChunkOutput"
    AgentRunEvent:
      type: object
      properties:
        id:
          type: string
          description: 실행 내 이벤트 ID.
        event:
          type: string
          enum:
            - agent_run.created
            - agent_run.started
            - agent_run.completed
            - agent_run.failed
            - agent_run.cancelled
        data:
          $ref: "#/components/schemas/JsonValue"
        createdAt:
          type: string
          format: date-time
          description: 이벤트가 생성된 시점.
      required:
        - id
        - event
        - data
        - createdAt
      additionalProperties: false
    SearchResultOutput:
      type: object
      properties:
        title:
          type: string
          description: search result의 제목.
          example: A Comprehensive Overview of Large Language Models
        url:
          type: string
          description: search result의 URL.
          example: https://arxiv.org/pdf/2307.06435.pdf
          format: uri
        publishedDate:
          description: HTML content 파싱을 기반으로 한 생성일 추정치입니다. 형식은 YYYY-MM-DD입니다.
          example: 2023-11-16T01:36:32.547Z
          format: date-time
          type: string
        author:
          description: 사용 가능한 경우 content의 작성자.
          example: Humza Naveed
          anyOf:
            - type: string
            - type: "null"
        id:
          description: 문서의 임시 ID입니다. /contents 엔드포인트에 유용합니다.
          example: https://arxiv.org/abs/2307.06435
          type: string
        image:
          description: 사용 가능한 경우 search result와 연결된 이미지의 URL.
          example: https://arxiv.org/pdf/2307.06435.pdf/page_1.png
          format: uri
          type: string
        favicon:
          description: search result 도메인의 파비콘 URL.
          example: https://arxiv.org/favicon.ico
          format: uri
          type: string
        text:
          description: search result의 전체 content 텍스트.
          example: Abstract Large Language Models (LLMs) have recently demonstrated
            remarkable capabilities...
          type: string
        highlights:
          description: search result content에서 추출한 highlights 배열.
          example:
            - Such requirements have limited their adoption...
          type: array
          items:
            type: string
        highlightScores:
          description: 각 highlights 스니펫의 코사인 유사도 점수 배열.
          example:
            - 0.4600165784358978
          type: array
          items:
            type: number
            format: float
        summary:
          description: 웹페이지의 summary.
          example: This overview paper on Large Language Models (LLMs) highlights key
            developments...
          type: string
        subpages:
          description: search result의 하위 페이지 배열.
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                description: search result의 제목.
                example: A Comprehensive Overview of Large Language Models
              url:
                type: string
                description: search result의 URL.
                example: https://arxiv.org/pdf/2307.06435.pdf
                format: uri
              publishedDate:
                description: HTML content 파싱을 기반으로 한 생성일 추정치입니다. 형식은 YYYY-MM-DD입니다.
                example: 2023-11-16T01:36:32.547Z
                format: date-time
                type: string
              author:
                description: 사용 가능한 경우 content의 작성자.
                example: Humza Naveed
                anyOf:
                  - type: string
                  - type: "null"
              id:
                description: 문서의 임시 ID입니다. /contents 엔드포인트에 유용합니다.
                example: https://arxiv.org/abs/2307.06435
                type: string
              image:
                description: 사용 가능한 경우 search result와 연결된 이미지의 URL.
                example: https://arxiv.org/pdf/2307.06435.pdf/page_1.png
                format: uri
                type: string
              favicon:
                description: search result 도메인의 파비콘 URL.
                example: https://arxiv.org/favicon.ico
                format: uri
                type: string
            required:
              - title
              - url
            additionalProperties: false
        entities:
          description: 회사, 개인 또는 출판물 search result의 구조화된 엔터티 데이터입니다. 지원되는 엔터티 기반 카테고리에 대해
            반환됩니다.
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/SearchCompanyEntityOutput"
              - $ref: "#/components/schemas/SearchPersonEntityOutput"
              - $ref: "#/components/schemas/SearchPublicationEntityOutput"
            type: object
            discriminator:
              propertyName: type
              mapping:
                company: "#/components/schemas/SearchCompanyEntityOutput"
                person: "#/components/schemas/SearchPersonEntityOutput"
                publication: "#/components/schemas/SearchPublicationEntityOutput"
        extras:
          description: extras의 result입니다. 각 field는 contents.extras를 통해 요청된 경우에만 반환됩니다.
          example:
            links: []
          type: object
          properties:
            links:
              description: search result의 링크 배열.
              example: []
              type: array
              items:
                type: string
            imageLinks:
              description: search result의 이미지 URL 배열.
              example: []
              type: array
              items:
                type: string
            richImageLinks:
              description: 페이지에 표시되는 순서대로 alt 텍스트를 포함한 이미지 배열.
              example:
                - url: https://exa.ai/images/illustrations/api_illustration4.webp
                  alt: High rate limits, low latency and high reliability.
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: 이미지의 URL.
                  alt:
                    description: 페이지에서 제공하는 경우 이미지의 alt 텍스트.
                    type: string
                required:
                  - url
                additionalProperties: false
            richLinks:
              description: 페이지에 표시되는 순서대로 앵커 텍스트를 포함한 링크 배열.
              example:
                - url: https://dashboard.exa.ai
                  anchor: API Dashboard
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: 링크의 URL.
                  anchor:
                    description: 페이지에서 제공하는 경우 링크의 앵커 텍스트.
                    type: string
                required:
                  - url
                additionalProperties: false
            codeBlocks:
              description: search result의 코드 블록 배열.
              example:
                - text: pip install exa-py
                  source: bash
              type: array
              items:
                type: object
                properties:
                  text:
                    type: string
                    description: 코드 블록의 contents.
                  source:
                    type: string
                    description: 있는 경우 코드 블록에 지정된 언어.
                required:
                  - text
                  - source
                additionalProperties: false
          additionalProperties: false
      required:
        - title
        - url
      additionalProperties: false
    SearchCompanyEntityOutput:
      type: object
      properties:
        id:
          type: string
          description: 안정적인 회사 엔터티 identifier.
        type:
          type: string
          const: company
          description: 엔터티 구분자.
        version:
          type: integer
          minimum: 1
