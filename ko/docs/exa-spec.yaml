components:
  schemas:
    SearchRequest:
      type: object
      properties:
        includeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: "search에 포함할 도메인 또는 도메인 경로 목록입니다. 각 항목은 호스트 이름(예: `example.com`),
                경로 접두사가 포함된 호스트 이름(예: `example.com/docs`) 또는 와일드카드 하위 도메인(예:
                `*.example.com`)일 수 있습니다. 지정하면 일치하는 도메인 또는 경로의 결과만 반환됩니다. 질의에
                `site:` 연산자를 추가하는 대신 이 매개변수를 사용하여 도메인 또는 경로를 필터링하세요."
              example:
                - arxiv.org
                - exa.ai/blog
            - type: "null"
        excludeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: "search 결과에서 제외할 도메인 또는 도메인 경로 목록입니다. 각 항목은 호스트 이름(예:
                `example.com`), 경로 접두사가 포함된 호스트 이름(예: `example.com/docs`) 또는
                와일드카드 하위 도메인(예: `*.example.com`)일 수 있습니다. 지정하면 일치하는 도메인 또는 경로의
                결과는 반환되지 않습니다. 질의에 `site:` 연산자를 추가하는 대신 이 매개변수를 사용하여 도메인 또는 경로를
                필터링하세요."
              example:
                - docs.python.org/3
            - type: "null"
        startCrawlDate:
          anyOf:
            - type: string
              description: 지원 중단되었으며 효과가 없습니다. API에서 무시됩니다. ISO 8601 형식으로 지정해야 합니다.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        endCrawlDate:
          anyOf:
            - type: string
              description: 지원 중단되었으며 효과가 없습니다. API에서 무시됩니다. ISO 8601 형식으로 지정해야 합니다.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
              deprecated: true
            - type: "null"
        startPublishedDate:
          anyOf:
            - type: string
              description: 이 날짜 이후에 게시된 링크만 반환됩니다. ISO 8601 형식으로 지정해야 합니다.
              example: 2023-01-01T00:00:00.000Z
              format: date-time
            - type: "null"
        endPublishedDate:
          anyOf:
            - type: string
              description: 이 날짜 이전에 게시된 링크만 반환됩니다. ISO 8601 형식으로 지정해야 합니다.
              example: 2023-12-31T00:00:00.000Z
              format: date-time
            - type: "null"
        numResults:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 100
              description: 반환할 결과 수입니다. limits는 search type에 따라 다릅니다. 공개 limit의 최댓값은 결과
                100개입니다. 더 높은 limits에 관해 논의하려면 영업팀(hello@exa.ai)에 문의하세요.
              example: 10
              default: 10
            - type: "null"
        context:
          anyOf:
            - description: "지원 중단: 대신 highlights 또는 text를 사용하세요. page contents를 하나의 컨텍스트 문자열로
                반환합니다."
              deprecated: true
              oneOf:
                - type: boolean
                  description: "지원 중단: 대신 highlights 또는 text를 사용하세요. page contents를 하나의 컨텍스트 문자열로
                    반환합니다."
                  example: true
                  deprecated: true
                - type: object
                  properties:
                    maxCharacters:
                      type: integer
                      minimum: 1
                      maximum: 10000
                      description: 지원 중단. 컨텍스트 문자열의 최대 문자 limit입니다. 지원되는 최댓값은 10000입니다.
                      example: 10000
                  description: "지원 중단: 대신 highlights 또는 text를 사용하세요. page contents를 하나의 컨텍스트 문자열로
                    반환합니다."
                  deprecated: true
            - type: "null"
        moderation:
          anyOf:
            - type: boolean
              description: 콘텐츠 검토를 활성화하여 search 결과에서 안전하지 않은 콘텐츠를 필터링합니다.
              example: true
              default: false
            - type: "null"
        contents:
          anyOf:
            - description: text, highlights, summary, extras 및 freshness 제어를 위한 content
                options입니다.
              $ref: "#/components/schemas/ContentsOptions"
            - type: "null"
        query:
          type: string
          minLength: 1
          description: search에 사용할 질의 문자열.
          example: Latest developments in LLM capabilities
        additionalQueries:
          anyOf:
            - minItems: 1
              maxItems: 10
              type: array
              items:
                type: string
              description: deep-search 변형을 위한 추가 질의입니다. deep-search type에서만 작동합니다. 제공되면 더 폭넓은
                결과를 위해 기본 질의와 함께 사용됩니다.
              example:
                - LLM advancements
                - large language model progress
            - type: "null"
        type:
          anyOf:
            - type: string
              enum:
                - instant
                - fast
                - auto
                - deep-lite
                - deep
                - deep-reasoning
              description: 사용할 search mode입니다. `auto`(기본값)는 품질과 속도의 균형을 맞춘 모드로, 대부분의 애플리케이션에
                권장됩니다. `fast`는 latency를 줄이면서 고품질 결과를 반환하므로 사용자 대상 search 및 대화형
                워크플로우에 적합합니다. `instant`는 응답 시간을 최소화하도록 최적화되어 채팅, voice agent, 자동
                완성과 같은 실시간 환경에서 일부 검색 깊이를 속도와 맞바꿉니다. `deep-lite`는 전체 deep
                search보다 낮고 일관된 4초의 latency로 가벼운 리서치와 synthesis된 결과를 제공합니다.
                `deep`는 synthesis를 포함한 포괄적인 다단계 리서치를 수행하며, `deep-reasoning`은 복잡한
                분석 및 의사 결정 작업을 위해 더 강력한 추론 기능을 추가합니다.
              example: auto
              default: auto
            - type: "null"
        category:
          anyOf:
            - type: string
              enum:
                - company
                - publication
                - news
                - personal site
                - financial report
                - people
              description: "중점적으로 다룰 데이터 카테고리입니다. 알려진 카테고리에는 `company`, `publication`, `news`,
                `personal site`, `financial report`, `people`가 있습니다. 다른 문자열도
                허용되며 search를 위한 카테고리 힌트로 사용됩니다. `people` 및 `company` 카테고리는 인물
                프로필과 회사 페이지를 찾는 데 더 나은 품질을 제공합니다. `publication` 카테고리는 연구 논문,
                프리프린트, 학술지 논문 등의 학술 출판물과 저자, 게재처, citations 등의 구조화된 metadata를
                제공합니다. 참고: `company` 및 `people` 카테고리는 제한된 필터 집합만 지원합니다. 이
                카테고리에서는 다음 parameters가 지원되지 않습니다: `startPublishedDate`,
                `endPublishedDate`, `excludeDomains`. 지원되지 않는 매개변수를 사용하면 400 오류가
                발생합니다."
              example: publication
            - type: "null"
        userLocation:
          anyOf:
            - type: string
              description: "사용자의 두 글자 ISO 국가 코드입니다(예: US)."
              example: US
            - type: "null"
        compliance:
          anyOf:
            - type: string
              enum:
                - hipaa
              description: Enterprise 전용 규정 준수 모드입니다. HIPAA 모드에는 `hipaa`로 설정합니다. 지원되는 매개변수와 함께
                캐시 전용 검색을 사용해야 합니다. 자세한 내용은 HIPAA 문서를 참조하세요.
              example: hipaa
            - type: "null"
        outputSchema:
          anyOf:
            - oneOf:
                - $ref: "#/components/schemas/OutputSchemaText"
                - $ref: "#/components/schemas/OutputSchemaObject"
              description: synthesis된 output을 위한 JSON schema입니다. 지원되는 루트 유형은 "text" 및
                "object"입니다. 제공하면 response에 이 schema와 일치하는 내용을 가진 output 객체가
                포함됩니다. 모든 search type에서 작동하며, 선택한 search type에 약 2초의 synthesis
                latency가 추가됩니다.
              type: object
              discriminator:
                propertyName: type
                mapping:
                  text: "#/components/schemas/OutputSchemaText"
                  object: "#/components/schemas/OutputSchemaObject"
            - type: "null"
        systemPrompt:
          anyOf:
            - type: string
              description: 생성된 output 또는 agent 동작을 안내하는 추가 지침입니다. 소스 선호도, 신규성 제약 조건, 중복 제약 조건
                또는 기타 동작 지침에 사용하세요.
              example: Prefer official sources and avoid duplicate results.
            - type: "null"
        stream:
          anyOf:
            - type: boolean
              description: synthesis된 output 스트리밍을 위한 server-sent events를 요청합니다. 현재 스트리밍은
                outputSchema가 제공된 경우에만 사용되며, 그렇지 않으면 엔드포인트는 일반 JSON search
                response를 반환합니다.
              default: false
            - type: "null"
      required:
        - query
    JsonValue:
      description: 모든 JSON 값입니다.
      oneOf:
        - type: "null"
        - type: boolean
        - type: number
        - type: string
        - type: array
          items:
            $ref: "#/components/schemas/JsonValue"
        - type: object
          propertyNames:
            type: string
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
    ContentsOptions:
      type: object
      properties:
        text:
          anyOf:
            - description: 각 result의 텍스트 extraction 옵션입니다.
              oneOf:
                - type: boolean
                  title: Simple text retrieval
                  description: true이면 기본 설정으로 전체 페이지 텍스트를 반환합니다. false이면 텍스트 반환을 비활성화합니다.
                  default: false
                - type: object
                  properties:
                    maxCharacters:
                      anyOf:
                        - type: integer
                          minimum: 1
                          maximum: 10000
                          description: 전체 페이지 텍스트의 최대 문자 limit입니다. response 크기와 API 비용을 제어하는 데 유용합니다. 지원되는
                            최댓값은 10000입니다.
                          example: 1000
                        - type: "null"
                    includeHtmlTags:
                      anyOf:
                        - type: boolean
