        tag:
          type: string
          description: 실패를 식별하는 기계 판독 가능 오류 tag입니다. tag 집합은 개방형이므로 새 tag가 언제든 추가될 수 있습니다.
            인식하지 못한 tag는 response의 HTTP 상태에 따른 일반 오류로 처리하세요. 알려진 tag는 예시로 나열됩니다.
          examples:
            - DEFAULT_ERROR
