openapi: 3.1.0
info:
  title: Exa Public API
  version: 2.0.0
servers:
  - url: https://api.exa.ai
security:
  - apiKey: []
  - bearer: []
paths:
  /search:
    post:
      operationId: search
      summary: Search
      description: Exa의 prompt 엔지니어링 질의로 search를 수행하고 관련 result 목록을 가져옵니다. 필요에 따라
        contents도 가져올 수 있습니다.
      x-payment-info:
        price:
          mode: dynamic
          currency: USD
          min: "0.007"
          max: "0.015"
        protocols:
          - x402: {}
          - mpp:
              method: tempo
              intent: charge
              currency: USDC.e
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: 확인
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
            x-exa-queued:
              $ref: "#/components/headers/XExaQueued"
            x-exa-queue-ms:
              $ref: "#/components/headers/XExaQueueMs"
          content:
            application/json:
              example:
                requestId: b5947044c4b78efa9552a7c89b306d95
                results:
                  - title: A Comprehensive Overview of Large Language Models
                    url: https://arxiv.org/pdf/2307.06435.pdf
                    publishedDate: 2023-11-16T01:36:32.547Z
                    author: Humza  Naveed, University of Engineering and Technology (UET), Lahore,
                      Pakistan
                    id: https://arxiv.org/abs/2307.06435
                    image: https://arxiv.org/pdf/2307.06435.pdf/page_1.png
                    favicon: https://arxiv.org/favicon.ico
                    text: Abstract Large Language Models (LLMs) have recently demonstrated
                      remarkable capabilities...
                    highlights:
                      - Such requirements have limited their adoption...
                    summary: 대규모 언어 모델(LLM)에 관한 이 개요 논문은 주요 발전 사항을 다룹니다...
                resolvedSearchType: neural
                costDollars:
                  total: 0.007
                  search:
                    neural: 0.007
              schema:
                $ref: "#/components/schemas/SearchResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SearchStreamChunk"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "402":
          description: 결제가 필요합니다. API 키 요청의 경우 이는 표준 오류 envelope입니다(credits 소진 또는 예산 초과).
            x402 가격이 적용되는 엔드포인트에서 API 키 없이 요청하면 태그 `X402_PAYMENT_REQUIRED`가 포함된
            x402 결제 challenge가 반환됩니다. 이 challenge는 요청 결제 방법을 설명하는 x402 결제
            metadata(`x402Version`, `resource`, `accepts`, 선택적 `extensions`)로
            확장된 envelope입니다.
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/X402PaymentChallenge"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailableResponse"
  /contents:
    post:
      operationId: getContents
      summary: Contents
      x-payment-info:
        price:
          mode: dynamic
          currency: USD
          min: "0.001"
          max: "0.010"
        protocols:
          - x402: {}
          - mpp:
              method: tempo
              intent: charge
              currency: USDC.e
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentsRequest"
      responses:
        "200":
          description: 확인
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
            x-exa-queued:
              $ref: "#/components/headers/XExaQueued"
            x-exa-queue-ms:
              $ref: "#/components/headers/XExaQueueMs"
          content:
            application/json:
              example:
                requestId: e492118ccdedcba5088bfc4357a8a125
                results:
                  - id: https://arxiv.org/abs/2307.06435
                    title: A Comprehensive Overview of Large Language Models
                    url: https://arxiv.org/pdf/2307.06435.pdf
                    publishedDate: 2023-11-16T01:36:32.547Z
                    author: Humza  Naveed, University of Engineering and Technology (UET), Lahore,
                      Pakistan
                    text: Abstract Large Language Models (LLMs) have recently demonstrated
                      remarkable capabilities...
                    highlights:
                      - Such requirements have limited their adoption...
                    summary: 대규모 언어 모델(LLM)에 관한 이 개요 논문은 주요 발전 사항을 다룹니다...
                statuses:
                  - id: https://arxiv.org/abs/2307.06435
                    status: success
                    source: cached
                costDollars:
                  total: 0.003
              schema:
                $ref: "#/components/schemas/ContentsResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "402":
          description: 결제가 필요합니다. API 키 요청의 경우 이는 표준 오류 envelope입니다(credits 소진 또는 예산 초과).
            x402 가격이 적용되는 엔드포인트에서 API 키 없이 요청하면 태그 `X402_PAYMENT_REQUIRED`가 포함된
            x402 결제 challenge가 반환됩니다. 이 challenge는 요청 결제 방법을 설명하는 x402 결제
            metadata(`x402Version`, `resource`, `accepts`, 선택적 `extensions`)로
            확장된 envelope입니다.
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/X402PaymentChallenge"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailableResponse"
  /answer:
    post:
      operationId: answer
      summary: Answer
      description: 질의를 기반으로 search를 수행하고, 질의 유형에 따라 직접적인 답변 또는 citations가 포함된 상세
        summary를 생성합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: 확인
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
            x-exa-queued:
              $ref: "#/components/headers/XExaQueued"
            x-exa-queue-ms:
              $ref: "#/components/headers/XExaQueueMs"
          content:
            application/json:
              example:
                requestId: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
                answer: $350 billion.
                citations:
                  - id: https://www.theguardian.com/science/2024/dec/11/spacex-valued-at-350bn-as-company-agrees-to-buy-shares-from-employees
                    url: https://www.theguardian.com/science/2024/dec/11/spacex-valued-at-350bn-as-company-agrees-to-buy-shares-from-employees
                    title: SpaceX valued at $350bn as company agrees to buy shares from ...
                    author: Dan Milmo
                    publishedDate: 2024-12-11T00:00:00.000Z
                    text: SpaceX valued at $350bn as company agrees to buy shares from ...
                costDollars:
                  total: 0.005
              schema:
                $ref: "#/components/schemas/AnswerResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/AnswerStreamChunk"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "402":
          $ref: "#/components/responses/PaymentRequiredResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailableResponse"
  /findSimilar:
    post:
      operationId: findSimilar
      summary: 유사한 링크 찾기
      description: "제공된 URL과 유사한 링크를 찾고 필요에 따라 해당 contents를 가져옵니다. 지원 중단: 소스를 설명하는 질의와
        함께 `/search`를 사용하는 것이 좋습니다."
      x-exa-lifecycle: deprecated
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindSimilarRequest"
      responses:
        "200":
          description: 확인
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
            Deprecation:
              description: 이 작업이 지원 중단되었음을 나타냅니다.
              schema:
                type: string
              example: "true"
            x-exa-queued:
              $ref: "#/components/headers/XExaQueued"
            x-exa-queue-ms:
              $ref: "#/components/headers/XExaQueueMs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindSimilarResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "402":
          $ref: "#/components/responses/PaymentRequiredResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailableResponse"
  /monitors:
    post:
      operationId: createMonitor
      summary: monitor 생성
      description: >-
        일정에 따라 반복 Exa search를 실행하는 새 Monitor를 생성합니다.


        Monitors는 반복 일정에 따라 search 질의를 자동으로 실행하고, 자동 중복 제거를 통해 결과를 웹훅 엔드포인트로
        전달합니다.


        - **날짜 기반 필터링**은 마지막 실행 이후의 content만 가져옵니다.


        - **시맨틱 중복 제거**는 이전 output을 추적하여 새로운 변경 사항만 표시합니다.


        response에는 생성 시 한 번만 반환되는 `webhookSecret`이 포함됩니다. 웹훅 서명 검증을 위해 안전하게
        저장하세요.
      tags:
        - Monitors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSearchMonitorParameters"
      responses:
        "201":
          description: 웹훅 secret이 포함된 생성된 monitor
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSearchMonitorResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    get:
      operationId: listMonitors
      summary: monitor 목록 조회
      description: 인증된 team의 모든 monitor를 나열합니다. 상태별 필터링과 cursor 기반 페이지네이션을 지원합니다.
      tags:
        - Monitors
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - paused
              - disabled
            description: 상태로 monitor 필터링
        - in: query
          name: cursor
          schema:
            type: string
            description: 이전 response의 페이지네이션 cursor
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            description: 페이지당 result 수
            default: 50
        - in: query
          name: name
          schema:
            type: string
            maxLength: 250
            description: 이름으로 monitor 필터링(대소문자를 구분하지 않는 부분 문자열 일치)
        - in: query
          name: metadata
          schema:
            description: "metadata 키-값 쌍으로 monitor를 필터링합니다(정확히 일치, AND 조건). 대괄호 표기법을 사용하세요:
              `metadata[key]=value`."
            type: object
            propertyNames:
              type: string
            additionalProperties:
              type: string
          style: deepObject
          explode: true
          description: "metadata 키-값 쌍으로 monitor를 필터링합니다(정확히 일치, AND 조건). 대괄호 표기법을 사용하세요:
            `metadata[key]=value`."
      responses:
        "200":
          description: 페이지네이션된 monitor 목록
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSearchMonitorsResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /monitors/batch:
    post:
      operationId: batchMonitors
      summary: monitor 일괄 작업 수행
      description: >-
        제공된 필터와 일치하는 monitor에 일괄 작업을 수행합니다.


        지원되는 작업:

        - **delete**: 일치하는 monitor를 영구적으로 제거합니다

        - **pause**: 일치하는 monitor를 일시 중지합니다

        - **unpause**: 일치하는 monitor의 일시 중지를 해제합니다


        작업을 수행하기 전에 영향을 받는 monitor를 미리 보려면 `dry_run: true`(기본값)를 사용하세요. 결과는
        `limit` 매개변수로 페이지네이션됩니다. 일치하는 모든 monitor를 처리하려면 `has_more`가 `false`가 될
        때까지 반복하세요.
      tags:
        - Monitors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchMonitorsRequest"
      responses:
        "200":
          description: batch 작업 결과
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchMonitorsResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /monitors/{id}:
    get:
      operationId: getMonitor
      summary: monitor 조회
      description: ID로 단일 monitor를 가져옵니다.
      tags:
        - Monitors
      parameters:
        - in: path
          name: id
          schema:
            type: string
            description: monitor ID
          required: true
          description: monitor ID
      responses:
        "200":
          description: monitor
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchMonitor"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    patch:
      operationId: updateMonitor
      summary: monitor 업데이트
      description: 기존 monitor를 업데이트합니다. 모든 field는 선택 사항입니다. `search`에는 변경하려는 field만
        포함한 부분 객체를 보낼 수 있습니다. 일정을 제거하려면 `trigger`를 `null`로 설정하세요.
      tags:
        - Monitors
      parameters:
        - in: path
          name: id
          schema:
            type: string
            description: monitor ID
          required: true
          description: monitor ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSearchMonitorParameters"
      responses:
        "200":
          description: 업데이트된 monitor
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchMonitor"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
    delete:
      operationId: deleteMonitor
      summary: monitor 삭제
      description: monitor를 삭제합니다. 이 작업은 되돌릴 수 없습니다.
      tags:
        - Monitors
      parameters:
        - in: path
          name: id
          schema:
            type: string
            description: monitor ID
          required: true
          description: monitor ID
      responses:
        "200":
          description: 삭제된 monitor
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchMonitor"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /monitors/{id}/trigger:
    post:
      operationId: triggerMonitor
      summary: monitor 실행 트리거
      description: 일정과 관계없이 즉시 실행을 트리거합니다. 상태가 `active` 또는 `paused`인 monitor에서 작동합니다.
      tags:
        - Monitors
      parameters:
        - in: path
          name: id
          schema:
            type: string
            description: monitor ID
          required: true
          description: monitor ID
      responses:
        "200":
          description: monitor가 트리거되었는지 여부
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerSearchMonitorResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /monitors/{id}/runs:
    get:
      operationId: listRuns
      summary: 실행 목록 조회
      description: cursor 기반 페이지네이션을 사용하여 monitor의 모든 실행을 나열합니다. 실행은 시간 역순으로 반환됩니다.
      tags:
        - Runs
      parameters:
        - in: path
          name: id
          schema:
            type: string
            description: monitor ID
          required: true
          description: monitor ID
        - in: query
          name: cursor
          schema:
            type: string
            description: 이전 response의 페이지네이션 cursor
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            description: 페이지당 result 수
            default: 50
      responses:
        "200":
          description: 페이지네이션된 실행 목록
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSearchMonitorRunsResponse"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /monitors/{id}/runs/{runId}:
    get:
      operationId: getRun
      summary: 실행 조회
      description: ID로 단일 실행을 가져오며, 실행이 완료된 경우 전체 output을 포함합니다.
      tags:
        - Runs
      parameters:
        - in: path
          name: id
          schema:
            type: string
            description: monitor ID
          required: true
          description: monitor ID
        - in: path
          name: runId
          schema:
            type: string
            description: 실행 ID
          required: true
          description: 실행 ID
      responses:
        "200":
          description: 실행
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchMonitorRun"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponse"
  /agent/runs:
    post:
      operationId: createAgentRun
      summary: 실행 생성
      description: "비동기 Agent 실행을 생성합니다. 기본적으로 API는 실행 객체를 즉시 반환합니다. 실행이 최종 상태에 도달할
        때까지 실행 수명 주기 이벤트를 스트리밍하려면 `Accept: text/event-stream`을 설정하세요."
      tags:
        - Agent
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
