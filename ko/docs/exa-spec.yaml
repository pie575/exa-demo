          const: search
          default: search
      required:
        - type
        - config
      type: object
    CreateImportParameters:
      discriminator:
        propertyName: format
      oneOf:
        - properties:
            size:
              maximum: 50000000
              description: file 크기(바이트)입니다. 최대 크기는 50MB입니다.
              type: number
            count:
              description: import할 레코드 수입니다.
              type: number
            title:
              description: import의 제목입니다.
              type: string
            format:
              enum:
                - csv
              description: import가 CSV 형식인 경우 엔터티의 키 식별자(현재는 URL)가 포함된 열이 필요합니다. 제공하지 않으면
                import 처리에 실패합니다.
              type: string
            metadata:
              description: 이 객체와 연결할 키-값 쌍의 집합입니다.
              propertyNames:
                type: string
              additionalProperties:
                maxLength: 1000
                type: string
              type: object
            entity:
              description: "import에 포함된 엔터티 유형(예: 사람, 회사 등)으로, 해당 유형으로 확인을 시도합니다."
