          description: 캐시된 콘텐츠의 최대 보관 시간(시간)입니다. 양수 값이면 캐시된 콘텐츠의 경과 시간이 이 시간보다 짧을 경우
            사용합니다. 0은 새 콘텐츠를 가져오며, 새로 가져온 페이지에 텍스트 렌더링 옵션을 적용하는 데 지원되는 방법입니다.
            -1은 항상 캐시를 사용합니다. 생략하면 캐시된 콘텐츠를 사용할 수 없는 경우 대체 가져오기를 사용합니다. 지원되는
            최대값은 720시간입니다.
          example: 24
        filterEmptyResults:
          type: boolean
          description: 콘텐츠가 없는 result를 필터링합니다.
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: 크롤링할 하위 페이지 수입니다. 실제 크롤링 수는 시스템 제약으로 제한될 수 있습니다.
          example: 1
          default: 0
        subpageTarget:
          description: 검색 결과에서 특정 하위 페이지를 찾기 위한 용어입니다. 단일 문자열 또는 문자열 array일 수 있습니다.
          example: sources
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
      additionalProperties: false
      description: 각 검색 결과에 적용되는 콘텐츠 extraction 옵션입니다. 모든 field는 선택 사항입니다.
    SummaryWithMaxTokensOptionsOutput:
      type: object
      properties:
        query:
          anyOf:
            - type: string
              description: LLM이 생성하는 summary를 위한 사용자 지정 질의입니다.
              example: Main developments
            - type: "null"
        maxTokens:
          type: integer
          minimum: 1
          description: 생성된 summary의 최대 토큰 수입니다.
      additionalProperties: false
    SearchMonitorTriggerOutput:
      type: object
      properties:
        type:
          type: string
          const: interval
          description: 트리거 유형입니다. 현재는 `interval`만 지원됩니다.
          default: interval
        period:
          type: string
          description: 'monitor가 실행되는 빈도를 지정하는 기간 문자열입니다(예: "1h", "6h", "1d", "7d"). 단일
            단위만 지원됩니다. 최소 실행 주기는 1시간입니다. 일정은 monitor 생성 시간을 기준으로 설정됩니다(예: 오후
            2:30에 생성된 일일 monitor는 매일 오후 2:30경에 실행됩니다).'
          example: 6h
      required:
        - type
        - period
      additionalProperties: false
    SearchMonitorOutputSchemaOutput:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaTextOutput"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: synthesis된 output의 JSON schema입니다. 지원되는 최상위 유형은 "text"와
            "object"입니다. 제공하면 response에 이 schema와 일치하는 content를 가진 output 객체가
            포함됩니다. 모든 search type에서 작동하며, 선택한 search type에 약 2초의 synthesis
            latency가 추가됩니다.
          type: object
          discriminator:
            propertyName: type
            mapping:
              text: "#/components/schemas/OutputSchemaTextOutput"
              object: "#/components/schemas/OutputSchemaObject"
        - type: "null"
      description: '실행 output의 형식을 제어합니다. 지정하지 않으면 기본값은 `{ "type": "text" }`입니다.
        `type`이 `"text"`이면 output은 일반 텍스트 summary입니다. `type`이 `"object"`이면
        output은 구조화된 JSON입니다. `"object"` 유형에서 `properties`를 지정하지 않으면 schema가
        자동으로 추론되며, 지정하면 output은 제공된 schema를 따릅니다.'
    OutputSchemaTextOutput:
      type: object
      properties:
        type:
          type: string
          const: text
        description:
          type: string
      required:
        - type
      additionalProperties: false
    SearchMonitorWebhookOutput:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: 웹훅 이벤트를 수신할 HTTPS URL입니다. localhost 또는 비공개 IP 범위를 가리켜서는 안 됩니다.
        events:
          type: array
          items:
            type: string
            enum:
              - monitor.created
              - monitor.updated
              - monitor.deleted
              - monitor.run.created
              - monitor.run.completed
          description: 구독할 이벤트입니다. 지정하지 않으면 모든 이벤트가 기본값으로 설정됩니다.
      required:
        - url
      additionalProperties: false
    AgentDataSourceOutput:
      type: object
      properties:
        provider:
          description: 실행에 사용할 Exa Connect 데이터 제공업체입니다. 기본적으로 모든 제공업체 도구를 사용할 수 있습니다.
          example: fiber
          $ref: "#/components/schemas/AgentDataSourceProvider"
      required:
        - provider
      additionalProperties: false
    AgentBudgetOutput:
      type: object
      properties:
        maxCostDollars:
          type: number
          description: 이 실행에서 미국 달러로 지출할 수 있는 최대 금액입니다. $1–$100을 허용하며 `auto` 및 `max`에만
            적용됩니다. 생략하면 기본 한도는 `auto`의 경우 $5, `max`의 경우 $20입니다.
          example: 10
      additionalProperties: false
      description: 계량형 `auto` 및 `max` effort에 적용되는 실행별 선택적 지출 limit입니다. 일찍 완료되는 실행은
        limit보다 비용이 적게 들 수 있습니다.
    CreateWebsetParameters:
      properties:
        title:
          minLength: 1
          type: string
          description: Webset이 표시되는 모든 위치에 나타나는 선택적 이름입니다. 비워 두면 Exa가 자동으로 생성합니다.
          examples:
            - Leading climate tech startups
          nullable: true
        search:
          properties:
            query:
              minLength: 1
              maxLength: 5000
              description: |-
                찾는 항목을 설명하는 자연어 search 질의입니다.

                요구사항, 특성, 결과 범위를 좁히는 데 도움이 되는 제약 조건을 구체적으로 설명하세요.

                제공된 모든 URL은 크롤링되어 search의 추가 컨텍스트로 사용됩니다.
              examples:
                - Marketing agencies based in the US, that focus on consumer
                  products.
                - AI startups in Europe that raised Series A funding in 2024
                - SaaS companies with 50-200 employees in the fintech space
              type: string
            count:
              default: 10
              description: |-
                Webset이 찾으려는 Item 수입니다.

                실제로 찾는 Item 수는 search의 복잡성에 따라 이보다 적을 수 있습니다.
              minimum: 1
              type: number
            entity:
              description: >-
                Webset이 결과를 반환할 엔터티입니다.


                제공하지 않아도 됩니다. 질의에 제공된 모든 정보를 바탕으로 엔터티를 자동 감지합니다. 더 세밀하게 제어해야 할
                때만 사용하세요.
              $ref: "#/components/schemas/Entity"
            criteria:
              description: >-
                각 item을 평가하는 criteria입니다.


                직접 criteria를 제공하지 않아도 됩니다. 질의에 제공된 모든 정보를 바탕으로 criteria를 자동
                감지합니다. 더 세밀하게 제어해야 할 때만 사용하세요.
              minItems: 1
              maxItems: 5
              items:
                title: CreateCriterionParameters
                $ref: "#/components/schemas/CreateCriterionParameters"
              type: array
            maxPeoplePerCompany:
              description: 인물 search에 적용되는 선택적 소프트 한도입니다. 설정하면 search는 동일한 현 고용주 회사에 속한 일치하는
                인물을 이 수 이하로 포함하려고 합니다.
              minimum: 1
              type: integer
            recall:
              description: |-
                이 search에 존재할 수 있는 관련 결과의 총수를 추정할지 여부입니다.
                분석 결과는 search 요청의 `recall` field에서 확인할 수 있습니다.
              type: boolean
            exclude:
              description: search 결과에서 제외할 소스(기존 import 또는 webset)입니다. 이러한 소스에서 찾은 결과는 search
                중 다시 발견되지 않도록 제외됩니다.
              items:
                properties:
                  source:
                    enum:
                      - import
                      - webset
                    type: string
                  id:
                    minLength: 1
                    description: 제외할 소스의 ID입니다.
                    type: string
                required:
                  - source
                  - id
                type: object
              type: array
            scope:
              description: search를 특정 소스(기존 import 또는 webset)로 제한합니다. 이러한 소스에서 search
                criteria와 일치하는 결과는 Webset에 포함됩니다.
              items:
                properties:
                  source:
                    enum:
                      - import
                      - webset
                    type: string
                  id:
                    minLength: 1
                    description: search할 소스의 ID입니다.
                    type: string
                  relationship:
                    properties:
                      definition:
                        description: 제공된 소스에 포함된 엔터티를 기준으로, 찾으려는 엔터티와의 관계입니다.
                        type: string
                      limit:
                        minimum: 1
                        maximum: 10
                        type: number
                    required:
                      - definition
                      - limit
                    type: object
                required:
                  - source
                  - id
                type: object
              type: array
          required:
            - query
          description: Webset의 초기 search를 생성합니다.
          type: object
        import:
          description: 기존 Websets 및 Imports의 데이터를 이 Webset으로 import합니다.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: import할 소스의 ID입니다.
                type: string
              evaluate:
                description: true이면 이 import의 item이 search criteria에 따라 평가됩니다. search를 제공해야 합니다.
                type: boolean
            required:
              - source
              - id
            type: object
          type: array
        enrichments:
          description: >-
            찾은 item에서 추가 데이터를 추출할 enrichment을 추가합니다.


            enrichment은 Webset에 추가된 각 item에서 특정 정보(연락처 정보, 투자 유치 데이터, 직원 수 등)를
            자동으로 검색하고 추출합니다.
          items:
            title: CreateEnrichmentParameters
            $ref: "#/components/schemas/CreateEnrichmentParameters"
          type: array
        exclude:
          description: 이 Webset 내 모든 작업에 적용되는 전역 제외 소스(기존 import 또는 webset)입니다. 이러한 소스에서
            찾은 결과는 모든 search 및 import 작업에서 제외됩니다.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: 제외할 소스의 ID입니다.
                type: string
            required:
              - source
              - id
            type: object
          type: array
        externalId:
          description: |-
            webset의 외부 식별자입니다.

            이를 사용해 자체 내부 식별자로 Webset을 참조할 수 있습니다.
          maxLength: 300
          type: string
        metadata:
          description: 이 객체에 연결할 키-값 쌍 집합입니다.
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
      examples:
        - search:
            query: Marketing agencies based in the US, that focus on consumer products.
            count: 10
      type: object
    Entity:
      oneOf:
        - $ref: "#/components/schemas/CompanyEntity"
        - $ref: "#/components/schemas/PersonEntity"
        - $ref: "#/components/schemas/ArticleEntity"
        - $ref: "#/components/schemas/ResearchPaperEntity"
        - $ref: "#/components/schemas/CustomEntity"
    CompanyEntity:
      properties:
        type:
          type: string
          const: company
          default: company
      required:
        - type
      title: Company
      type: object
    PersonEntity:
      properties:
        type:
          type: string
          const: person
          default: person
      required:
        - type
      title: Person
      type: object
    ArticleEntity:
      properties:
        type:
          type: string
          const: article
          default: article
      required:
        - type
      title: Article
      type: object
    ResearchPaperEntity:
      properties:
        type:
          type: string
          const: research_paper
          default: research_paper
      required:
        - type
      title: Research Paper
      type: object
    CustomEntity:
      properties:
        description:
          minLength: 2
          maxLength: 200
          type: string
        type:
          type: string
          const: custom
          default: custom
      required:
        - type
        - description
      title: Custom
      type: object
    CreateCriterionParameters:
      properties:
        description:
          minLength: 1
          maxLength: 1000
          description: criterion에 대한 설명입니다.
          type: string
      required:
        - description
      type: object
    CreateEnrichmentParameters:
      properties:
        description:
          minLength: 1
          maxLength: 5000
          description: 각 Webset Item에 수행할 enrichment 작업을 설명하세요.
          type: string
        format:
          description: |-
            enrichment response의 형식입니다.

            설명을 바탕으로 최적의 형식을 자동 선택합니다. 형식을 명시적으로 지정하려면 여기에서 설정할 수 있습니다.
          enum:
            - text
            - date
            - number
            - options
            - email
            - phone
            - url
          type: string
        options:
          description: 형식이 옵션인 경우 enrichment agent가 선택할 수 있는 옵션입니다.
          minItems: 1
          maxItems: 150
          items:
            properties:
              label:
                description: 옵션의 레이블입니다.
                type: string
            required:
              - label
            type: object
          type: array
        metadata:
          description: 이 객체에 연결할 키-값 쌍 집합입니다.
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
      required:
        - description
      type: object
    UpdateWebsetRequest:
      properties:
        metadata:
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
          description: 이 객체에 연결할 키-값 쌍 집합입니다.
          nullable: true
        title:
          description: Webset이 표시되는 모든 위치에 나타나는 선택적 이름입니다.
          examples:
            - Leading climate tech startups
          minLength: 1
          type: string
      type: object
    CreateWebsetSearchParameters:
      properties:
        count:
          minimum: 1
          description: |-
            Search가 찾으려는 Item 수입니다.

            실제로 찾는 Item 수는 질의의 복잡성에 따라 이보다 적을 수 있습니다.
          type: number
        query:
          minLength: 1
          maxLength: 5000
          description: |-
            찾는 항목을 설명하는 자연어 search 질의입니다.

            요구사항, 특성, 결과 범위를 좁히는 데 도움이 되는 제약 조건을 구체적으로 설명하세요.

            제공된 모든 URL은 크롤링되어 search의 추가 컨텍스트로 사용됩니다.
          examples:
            - Marketing agencies based in the US, that focus on consumer
              products. Get brands worked with and city
            - AI startups in Europe that raised Series A funding in 2024
            - SaaS companies with 50-200 employees in the fintech space
          type: string
        entity:
          description: >-
            search가 결과를 반환할 엔터티입니다.


            제공하지 않아도 됩니다. 질의에 제공된 모든 정보를 바탕으로 엔터티를 자동 감지합니다. 더 세밀하게 제어해야 할 때만
            사용하세요.
          $ref: "#/components/schemas/Entity"
        criteria:
          description: >-
            모든 항목을 평가하는 criteria입니다.


            직접 criteria를 제공할 필요는 없습니다. 질의에 제공된 모든 정보를 바탕으로 criteria를 자동으로 감지합니다.
            더 세밀한 제어가 필요한 경우에만 사용하세요.
          minItems: 1
          maxItems: 5
          items:
            title: CreateCriterionParameters
            $ref: "#/components/schemas/CreateCriterionParameters"
          type: array
        maxPeoplePerCompany:
          description: 사람 검색에 적용하는 선택적 소프트 상한입니다. 설정하면 검색은 동일한 현 고용주 회사에 속한 일치하는 사람을 최대 이
            수만큼 포함하려고 합니다.
          minimum: 1
          type: integer
        exclude:
          description: 검색 결과에서 제외할 소스(기존 import 또는 Webset)입니다. 이러한 소스에서 발견된 결과는 검색 결과에서
            제외됩니다.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: 제외할 소스의 ID입니다.
                type: string
            required:
              - source
              - id
            type: object
          type: array
        scope:
          description: 검색을 특정 소스(기존 import)로 제한합니다. 이러한 소스에서 검색 criteria와 일치하는 결과는 Webset에
            포함됩니다.
          items:
            properties:
              source:
                enum:
                  - import
                  - webset
                type: string
              id:
                minLength: 1
                description: 검색할 소스의 ID입니다.
                type: string
              relationship:
                properties:
                  definition:
                    description: 제공된 소스에 포함된 엔터티와 찾으려는 엔터티 간의 관계입니다.
                    type: string
                  limit:
                    minimum: 1
                    maximum: 10
                    type: number
                required:
                  - definition
                  - limit
                type: object
            required:
              - source
              - id
            type: object
          type: array
        recall:
          description: |-
            이 검색에 존재할 수 있는 관련 결과의 총수 추정치를 제공할지 여부입니다.
            분석 결과는 search 요청의 `recall` field에서 확인할 수 있습니다.
          type: boolean
        behavior:
          default: override
          description: |-
            이 search가 Webset의 기존 항목을 처리하는 방식입니다.

            - **override**: 기존 항목을 교체하고 모든 항목을 새 criteria에 따라 평가합니다.
            - **append**: 기존 항목에 새 항목을 추가하고, 새 criteria와 일치하는 항목은 유지합니다.
          $ref: "#/components/schemas/WebsetSearchBehavior"
        metadata:
          description: 이 객체와 연결할 키-값 쌍의 집합입니다.
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
      required:
        - count
        - query
      type: object
    WebsetSearchBehavior:
      enum:
        - override
        - append
      type: string
    UpdateEnrichmentParameters:
      properties:
        description:
          description: 각 Webset Item에 수행할 enrichment 작업을 설명합니다.
          minLength: 1
          maxLength: 5000
          type: string
        format:
          description: |-
            enrichment response의 형식입니다.

            설명을 바탕으로 가장 적합한 형식을 자동으로 선택합니다. 형식을 명시적으로 지정하려면 여기에서 설정할 수 있습니다.
          enum:
            - text
            - date
            - number
            - options
            - email
            - phone
            - url
          type: string
        options:
          description: 형식이 options인 경우 enrichment agent가 선택할 수 있는 옵션입니다.
          minItems: 1
          maxItems: 150
          items:
            properties:
              label:
                description: 옵션의 레이블입니다.
                type: string
            required:
              - label
            type: object
          type: array
        metadata:
          propertyNames:
            type: string
          additionalProperties:
            maxLength: 1000
            type: string
          type: object
          description: 이 객체와 연결할 키-값 쌍의 집합입니다.
          nullable: true
      type: object
    PreviewWebsetParameters:
      properties:
        search:
          properties:
            query:
              minLength: 1
              maxLength: 5000
              description: |-
                찾고 있는 내용을 설명하는 자연어 search 질의입니다.

                요구 사항, 특성, 그리고 결과 범위를 좁히는 데 도움이 되는 제약 조건을 구체적으로 설명하세요.
              examples:
                - Marketing agencies based in the US, that focus on consumer
                  products. Get brands worked with and city
                - AI startups in Europe that raised Series A funding in 2024
                - SaaS companies with 50-200 employees in the fintech space
              type: string
            entity:
              description: >-
                분해에 사용할 엔터티입니다.


                제공할 필요는 없습니다. 질의에 제공된 모든 정보를 바탕으로 엔터티를 자동으로 감지합니다. 더 세밀한 제어가 필요한
                경우에만 사용하세요.
              $ref: "#/components/schemas/Entity"
            count:
              default: 10
              description: 질의 매개변수 `search=true`일 때 반환할 미리 보기 항목 수입니다.
              minimum: 1
              maximum: 10
              type: number
          required:
            - query
          type: object
      required:
        - search
      type: object
    CreateMonitorParameters:
      properties:
