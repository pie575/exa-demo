                - $ref: "#/components/schemas/CompanyEntity"
                - $ref: "#/components/schemas/PersonEntity"
                - $ref: "#/components/schemas/ArticleEntity"
                - $ref: "#/components/schemas/ResearchPaperEntity"
                - $ref: "#/components/schemas/CustomEntity"
            csv:
              description: 형식이 `csv`인 경우의 import별 parameters입니다.
              properties:
                identifier:
                  description: "엔터티의 키 식별자(예: URL, 이름 등)가 포함된 열입니다. 제공하지 않으면 file에서 추론을 시도합니다."
                  minimum: 0
                  type: integer
              type: object
          required:
            - size
            - count
            - format
            - entity
          type: object
    UpdateImport:
      properties:
